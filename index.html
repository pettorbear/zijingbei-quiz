與工程學院：指南針——磁石與磁性","u":"https://mse.tju.edu.cn/info/1260/2397.htm","d":"2024-10-15"},{"t":"中國古代科技館：指南針的發明","u":"http://www.kepu.net.cn/vmuseum/technology/ancientech/ancientech_compass/200312300040.html","d":"2003-12-30"}]},"8-129":{"o":["山洪","火山","颱風"],"x":["山洪是水害現象，與地動儀的觀測對象無關","火山噴發主要發生在特定地區，非地動儀主要觀測目標","颱風是大氣現象，不屬於地動儀觀測範圍"],"w":"東漢科學家張衡於公元132年發明地動儀，是為了觀測地震這一自然現象。地動儀用青銅製造，周徑八尺，形如酒樽，外裝八個龍頭，下有八隻銅蛙承接。當發生地震時，內部的倒懸擺錘會傾斜，觸發機關使對應方向的龍嘴吐出銅球。它成功探測到了洛陽附近無感知的地震，是人類有記錄以來最早的地震儀。","m":"張衡地動儀——探測地震千年先驅。","n":"","v":1,"src":[{"t":"中央電視網：張衡地動儀真偽與現代考證","u":"http://news.cctv.com/2018/01/15/ARTIPzTXseneIp0oTLg88PbM180115.shtml","d":"2018-01-15"},{"t":"中國計量測試學會：張衡地動儀","u":"http://www.china-csm.org/kpxzs/320.html","d":"2024-10-15"}]},"8-130":{"o":["南京","北京","武漢"],"x":["南京是民國時期政治中心，但黃埔軍校設在廣州","北京是近代中國首都，但軍校創立於廣州","武漢雖為軍事要地，但軍校校址設在廣州黃埔島"],"w":"陸軍軍官學校（黃埔軍校）創建於1924年6月16日，位於廣州東南的黃埔島。由國父孫中山指示籌辦，蔣中正任首任校長，是中華民國與中共合作時期的重要軍事教育機構。2024年6月16日迎來建校100週年紀念，學校舊址經過修繕後重新開馬，成為重要的歷史文化遺產。","m":"黃埔軍校在廣州——民國軍事搖籃百年校。","n":"","v":1,"src":[{"t":"廣州市人民政府：黃埔軍校百年建校紀念","u":"https://www.gz.gov.cn/xw/gzyw/content/post_9682109.html","d":"2024-06-02"},{"t":"廣州市黃埔區人民政府：黃埔軍校建校100週年","u":"https://www.hp.gov.cn/xwzx/zwzt/hpjxjxybzn/","d":"2024-06-16"}]},"8-131":{"o":["《遊擊隊歌》","《義勇軍進行曲》","《救亡進行曲》"],"x":["《遊擊隊歌》為抗戰時期歌曲，但製作者及影響力不如《黃河大合唱》","《義勇軍進行曲》為國歌，但時間早於1939年，非由光未然與冼星海合作","《救亡進行曲》雖為抗戰歌曲，但不是光未然作詞、冼星海作曲"],"w":"《黃河大合唱》創作於1939年，由詩人光未然作詞，作曲家冼星海作曲。這部組曲由8個樂章組成，以黃河為背景，熱情歌頌中華民族悠久歷史和人民抗日精神，痛責日軍暴行，於1939年4月在延安魯迅藝術學院首次公演，毛澤東等中央領導觀看，成為中國抗日戰爭的精神象徵。","m":"光未然詞、冼星海曲——黃河大合唱，民族之聲。","n":"","v":1,"src":[{"t":"中國政協網：《黃河大合唱》——黃河在咆哮","u":"http://www.cppcc.gov.cn/zxww/2021/07/14/ARTI1626232525939281.shtml","d":"2021-07-14"},{"t":"中國作家網：《黃河大合唱》誕生記","u":"http://www.chinawriter.com.cn/n1/2020/0729/c404063-31802250.html","d":"2020-07-29"}]},"8-132":{"o":["8月15日","9月2日","9月1日"],"x":["8月15日為日本投降日期，但中國官方紀念日另定","9月2日為日本簽署無條件投降書之日，但現定紀念日為9月3日","9月1日無歷史根據"],"w":"中國人民抗日戰爭勝利紀念日定為每年9月3日。1945年8月15日日本無條件投降，9月2日日本正式簽署無條件投降書。1951年8月13日，政務院將原定的8月15日改為9月3日為抗戰勝利紀念日，海峽兩岸隨後統一採用此日。2014年2月27日，全國人大常委會以立法形式確定9月3日為中國人民抗日戰爭勝利紀念日。","m":"九月三日——中國抗戰勝利紀念日。","n":"","v":1,"src":[{"t":"中華人民共和國政府網：中國人民抗日戰爭勝利紀念日","u":"https://www.gov.cn/lssdjt/content_734855.htm","d":"2024-09-03"},{"t":"廣東英烈網：抗戰勝利紀念日介紹","u":"https://service.dva.gd.gov.cn/gdylw/hjy/202409/5f512d56535a487abd044875edd87280.shtml","d":"2024-09-03"}]},"8-133":{"o":["1935年","1938年","1939年"],"x":["1935年為華北事變發生年份，時間過早","1938年為武漢會戰時期，非南京大屠殺年份","1939年為對華戰爭繼續時期，遠晚於南京大屠殺"],"w":"南京大屠殺慘案發生於1937年12月13日。日軍攻佔南京後，於該日開始進行長達6週的大屠殺，對手無寸鐵的南京市民和被俘中國軍人進行殘暴殺害。遠東國際軍事法庭判定有20至30萬人喪生。2014年2月27日，全國人大常委會決定以立法形式將12月13日確定為南京大屠殺死難者國家公祭日。","m":"南京大屠殺一九三七年十二月十三日——永遠的傷痛。","n":"","v":1,"src":[{"t":"南京市檔案局：南京大屠殺簡介","u":"https://dsb.nanjing.gov.cn/xxcb/201311/t20131105_2084215.html","d":"2013-11-05"},{"t":"抗日戰爭紀念網：南京大屠殺簡介","u":"https://www.krzzjn.com/show-1241-63018.html","d":"2024-10-15"}]},"8-134":{"o":["大嶺皮","將軍澳","荃灣"],"x":["大嶺皮為新界邊境地區，非東江縱隊港九獨立大隊成立地","將軍澳為南區地點，成立地為西貢","荃灣位於新界西部，距西貢較遠"],"w":"東江縱隊港九獨立大隊於1942年2月3日在西貢成立，由曾國瑄任司令員，陳達明任政委，黃高陽任政訓主任。這支隊伍由原駐香港的多支抗日武裝力量統一編組而成，力量發展到數千人，包括工人、農民和愛國知識份子。港九獨立大隊在日佔香港期間從事敵後活動，成功救援多名外國人員，對抗日戰爭勝利作出重大貢獻。","m":"東江縱隊港九獨立大隊——西貢成立，香港抗日英雄。","n":"","v":1,"src":[{"t":"維基百科：東江縱隊港九大隊","u":"https://zh.wikipedia.org/zh-hans/%E6%9D%B1%E6%B1%9F%E7%BA%B5%E9%98%9F%E6%B8%AF%E4%B9%9D%E5%A4%A7%E9%9A%8A","d":"2024-10-15"},{"t":"抗日戰爭紀念網：東江縱隊港九獨立大隊","u":"https://www.krzzjn.com/show-923-133635.html","d":"2024-10-15"}]},"8-135":{"o":["九一八事變","一二八事變","五卅慘案"],"x":["九一八事變（1931年）為日本局部侵華開始，未觸發全面抗戰","一二八事變（1932年）為淞滬戰爭，規模有限，非全面抗戰標誌","五卅慘案（1925年）為反帝愛國運動，時間過早且非抗日戰爭"],"w":"七七事變（1937年7月7日）是中國人民抗日戰爭全面爆發和全民族抗戰開始的標誌。該日夜間，日軍在盧溝橋附近進行軍事演習，誣稱一名士兵失蹤，要求進入宛平縣城搜查被拒後，發動全面進攻。中國守軍奮力抵抗，各地相應聲援，由此開闢了世界反法西斯戰爭的東方主戰場。","m":"七七盧溝橋一聲槍——中華全民族抗戰始。","n":"","v":1,"src":[{"t":"中華人民共和國國防部：七七事變——中國全民族抗戰的開端","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4879300.html","d":"2024-09-03"},{"t":"上海楊浦區政府：歷史上的今天——1937年7月7日","u":"https://www.shyp.gov.cn/shypq/dsxxjy-lssdjt/20210708/386486.html","d":"2021-07-08"}]},"8-136":{"o":["嫦娥五號","嫦娥四號","天問一號"],"x":["嫦娥五號（2020年）成功採樣但未涉及月球背面","嫦娥四號（2018年）登陸月球背面但未採樣返回","天問一號為火星探測任務，與月球探測無關"],"w":"嫦娥六號於2024年完成世界首次月球背面採樣並返回。探測器於5月3日在中國文昌航天發射場發射，6月2日精準著陸於月球背面南極-艾特肯盆地預選區域進行採樣，6月25日返回器安全著陸於內蒙古四子王旗。本次任務攜帶回1935.3克珍貴月球樣品，突破了月球逆行軌道設計、月背智能採樣等關鍵技術。","m":"嫦娥六號——月球背面採樣返回，世界第一。","n":"","v":1,"src":[{"t":"中國國家航天局：嫦娥六號任務圓滿成功","u":"https://www.cnsa.gov.cn/n6758823/n6758838/c10565180/content.html","d":"2024-06-25"},{"t":"中國航天科技集團：嫦娥六號返回器安全著陸","u":"https://www.spacechina.com/n25/n2014789/n2014804/c4150531/content.html","d":"2024-06-25"}]},"8-138":{"o":["黃河","長江","淮河"],"x":["黃河雖為重要河流，但開鑿的運河不是黃河本身","長江為南北水運幹道，但公元605年開鑿的特指大運河","淮河為地域性河流，不是所開鑿運河的主要河道"],"w":"大業元年（公元605年），隋煬帝楊廣下令開鑿大運河，以貫通南北、運輸糧食財富。工程由工程專家宇文愷主持，用200多萬民工挖通濟渠，又疏通古邗溝，再挖永濟渠，重開江南運河，經六年耗資，共用500多萬民工完成。大運河全長2700公里，連接五大河流（海河、黃河、淮河、長江、錢塘江），成為中國南北交通的大動脈。","m":"公元605年——隋煬帝開大運河，南北大貫通。","n":"","v":1,"src":[{"t":"全歷史：修建大運河——打造南北大動脈","u":"https://m.allhistory.com/ah/article/5f3253ad851391000133d985","d":"2024-10-15"},{"t":"中國江蘇網：隋煬帝開創南北大運河","u":"https://jsnews.jschina.com.cn/zt2023/bsrs/sqjy/202502/t20250212_3556453.shtml","d":"2025-02-12"}]},"8-139":{"o":["九品中正制","分封制","郡縣制"],"x":["九品中正制為魏晉南北朝官吏選拔制度，時代早於隋唐","分封制為先秦貴族制度，非官吏選拔現代制度","郡縣制為行政區劃制度，不是選官制度"],"w":"科舉制是中國古代創立的通過考試選拔官吏的制度，從隋代開始實行，經唐宋元明清諸朝，推行達1300年之久。隋文帝廢九品中正制，於開皇七年（587年）開始採用分科考試辦法選拔官吏，到隋煬帝時正式設進士科，從此分科取士的制度稱為'科舉'。科舉制不論出身貧富皆可參加，大大擴展了官吏選拔範圍，被譽為中國的'第五大發明'。","m":"科舉制隋唐至明清——千年選官制，人才薈萃。","n":"","v":1,"src":[{"t":"中國政府部門：中國古代治理智慧③科舉制","u":"http://m.ahjjjc.gov.cn/p/79667.html","d":"2024-10-15"},{"t":"中國科學院：從制度建設看科舉制度的歷史意義","u":"http://www.cass.cn/xueshuchengguo/xscg_lsyjy/202208/t20220805_5469775.shtml","d":"2022-08-05"}]},"8-140":{"o":["秦始皇","蘇頌","杜甫"],"x":["秦始皇為暴君，未參與都江堰設計","蘇頌為宋代科學家，時代遠晚於都江堰","杜甫為詩人，非水利工程設計者"],"w":"都江堰是中國古代著名的水利工程，由戰國時期秦國蜀郡太守李冰及其子共同設計完成。工程於公元前256年開始修建，巧妙利用岷江出山口的地形地勢，採用魚嘴分水堤、飛沙堰溢洪道、寶瓶口進水口等設計，實現自動分流、自動排沙、控制進水等功能，至今仍灌溉四川盆地，造福近3100萬人口，堪稱中國古代水利工程的典範。","m":"李冰父子設都江堰——戰國水利奇蹟，千年灌溉。","n":"","v":1,"src":[{"t":"全歷史：李冰修建都江堰","u":"https://zhonghua.5000yan.com/dongzhou/750.html","d":"2024-10-15"},{"t":"新華網：這項戰國始建的水利工程","u":"https://www.neac.gov.cn/seac/c103391/202308/1166522.shtml","d":"2023-08-03"}]},"8-141":{"o":["乾隆時期設置駐藏大臣","康熙時期設置駐藏大臣","乾隆中期設置駐藏大臣"],"x":["乾隆非雍正時期","康熙時期晚於雍正","雍正五年（1727）已設置，非乾隆中期"],"w":"清朝為加強對西藏的中央集權管轄，於雍正五年（1727）開始設置駐藏大臣。首任駐藏大臣為僧格和馬喇，代表中央政府監理西藏地方事務，包括官員任免、財政稽核、軍隊指揮等，標誌著清廷對西藏統治的進一步加強。","m":"雍正五年派大臣，西藏管轄顯在地。","n":"","v":1,"src":[{"t":"西藏學資訊網：【西藏歷史55講】張雲主編第25講：駐藏大臣制度","u":"http://www.tibetology.ac.cn/2023-08/06/content_42473516.htm","d":"2023-08-06"},{"t":"維基百科：駐藏大臣","u":"https://zh.wikipedia.org/zh-hans/%E9%A7%90%E8%97%8F%E5%A4%A7%E8%87%A3","d":"2024-01-01"}]},"8-142":{"o":["道制","州縣制","郡國制"],"x":["道制為唐代產物","州縣制為秦朝制度","郡國制為漢朝制度"],"w":"元朝統一全國後，在地方行政上設置行中書省（簡稱行省），成為直屬中央政府的第一級行政區。行省制度由元朝創立，後來被明清兩代沿用至今，成為中國歷代地方行政區劃的基礎制度。","m":"元創行省制，地方分權明確地。","n":"","v":1,"src":[{"t":"中國法學網：元朝行省的兩個基本特徵","u":"http://iolaw.cssn.cn/gdfls/200412/t20041214_4594481.shtml","d":"2004-12-14"},{"t":"參考網：知識拓展：元朝的行省制度","u":"https://m.fx361.com/news/2023/0710/22379463.html","d":"2023-07-10"},{"t":"維基百科：行省制","u":"https://zh.wikipedia.org/zh-hans/%E8%A1%8C%E7%9C%81%E5%88%B6","d":"2024-01-01"}]},"8-143":{"o":["軍事工業","重工業","手工業"],"x":["軍事工業為自強運動首批項目","重工業建設於洋務末期","手工業非洋務派主張產業"],"w":"清末洋務派官僚認識到國家自強需要新的財源，因此主張興辦民用工業。著名例子有李鴻章創辦的輪船招商局（1872年）和開平礦務局（1876年），以及張之洞創辦的湖北織布官局（1892年）。這些民用工業為軍用工業提供所需的原料和燃料。","m":"民用工業解困境，財源充足國自強。","n":"","v":1,"src":[{"t":"故宮博物院：同治中興","u":"https://www.dpm.org.cn/court/system/161110.html","d":"2024-01-01"},{"t":"中國經濟史論壇：洋務派經營的近代民用工業和交通運輸業（一）","u":"http://economy.guoxue.com/?p=7232","d":"2024-01-01"},{"t":"維基百科：洋務運動","u":"https://zh.wikipedia.org/zh-hans/%E6%B4%8B%E5%8A%A1%E8%BF%90%E5%8A%A8","d":"2024-01-01"}]},"8-144":{"o":["朱德","劉少奇","周恩來"],"x":["朱德任副主席，非主席","劉少奇任人大常委會主任，非國家主席","周恩來任國務院總理，非主席"],"w":"1954年9月15日至28日，第一屆全國人民代表大會第一次會議在北京召開。大會選舉毛澤東為中華人民共和國主席、朱德為副主席，劉少奇為全國人大常委會委員長，周恩來為國務院總理。這次會議通過了《中華人民共和國憲法》。","m":"五四會議毛當選主席，新中國政體正式立。","n":"","v":1,"src":[{"t":"中共中央政治局機關刊物 - 紅網：黨史上的今天：1954年9月15日","u":"https://hn.rednet.cn/content/2021/09/15/10144692.html","d":"2021-09-15"},{"t":"廣東人大網：【黨史中的人大歷程】第一屆全國人民代表大會的召開","u":"https://www.gdpc.gov.cn/gdrdw/xwdt/content/post_163479.html","d":"2024-01-01"},{"t":"維基百科：第一屆全國人民代表大會","u":"https://zh.wikipedia.org/zh-cn/%E7%AC%AC%E4%B8%80%E5%B1%8A%E5%85%A8%E5%9B%BD%E4%BA%BA%E6%B0%91%E4%BB%A3%E8%A1%A8%E5%A4%A7%E4%BC%9A","d":"2024-01-01"}]},"8-145":{"o":["勝利油田","中原油田","遼河油田"],"x":["勝利油田為黃河三角洲，位山東","中原油田位河南，非黑龍江","遼河油田位遼寧，非黑龍江大慶"],"w":"1960年，中國在黑龍江省大慶地區進行石油勘探開發大會戰，於2月決策開發。該年大慶油田生產原油97萬噸，標誌著中國石油生產取得重大成果。1963年12月，周恩來總理宣佈中國人民使用「洋油」的時代一去不復返。","m":"大慶油田1960建，甩掉貧油帽。","n":"","v":1,"src":[{"t":"人民日報：大慶油田60年：世界石油史上的奇蹟","u":"https://paper.people.com.cn/zgjjzk/html/2019-10/30/content_1956765.htm","d":"2019-10-30"},{"t":"新華網：【75個地標見證共和國成長的腳步】大慶油田（1960）","u":"http://www.xinhuanet.com/politics/2021-05/15/c_1211148339.htm","d":"2021-05-15"},{"t":"維基百科：大慶油田","u":"https://zh.wikipedia.org/zh-hans/%E5%A4%A7%E5%BA%86%E6%B2%B9%E7%94%B0","d":"2024-01-01"}]},"8-146":{"o":["1978年","1977年","1980年"],"x":["1978年為建交談判年，非正式建交","1977年中美未正式建交","1980年晚於正式建交日期"],"w":"1978年12月16日，中美兩國公佈關於建立外交關係的聯合公報。美國正式承認中華人民共和國政府為中國唯一合法政府，接受中國關於台灣問題的立場。1979年1月1日，中美正式建立大使級外交關係。","m":"七八年談判成，七九年正式建交。","n":"","v":1,"src":[{"t":"中華人民共和國外交部：雙邊關係","u":"https://www.fmprc.gov.cn/web/gjhdq_676201/gj_676203/bmz_679954/1206_680528/sbgx_680532/","d":"2024-01-01"},{"t":"維基百科：中美關係","u":"https://zh.wikipedia.org/zh-hans/%E4%B8%AD%E7%BE%8E%E5%85%B3%E7%B3%BB","d":"2024-01-01"},{"t":"維基百科：中美建交談判","u":"https://zh.wikipedia.org/zh-hans/%E4%B8%AD%E7%BE%8E%E5%BB%BA%E4%BA%A4%E8%B0%88%E5%88%A4","d":"2024-01-01"}]},"8-147":{"o":["1983年，倫敦","1985年，香港","1986年，北京"],"x":["1983年非簽署時間","1985年倫敦非簽署地點","1986年非簽署時間"],"w":"1984年12月19日，中英兩國在北京簽署《關於香港問題的聯合聲明》。聲明宣佈中華人民共和國政府決定於1997年7月1日對香港恢復行使主權，英國政府將香港交還中國。該聲明於1985年5月27日生效。","m":"八四年十二月簽聲明，香港回歸九七年。","n":"","v":1,"src":[{"t":"中央電視臺：1984年：《中英關於香港問題的聯合聲明》簽署","u":"http://news.cctv.com/science/20081007/105672.shtml","d":"2008-10-07"},{"t":"中國軍網：1984年12月19日，中英《關於香港問題的聯合聲明》簽署","u":"http://photo.81.cn/tsjs/2016-12/19/content_7413611 ans/%E6%9B%BE%E4%BE%AF%E4%B9%99%E7%BC%96%E9%92%9F","d":"2024-01-01"}]},"8-155":{"o":["雜技","書法","繪畫"],"x":["雜技非醒獅三大要素之一","書法與舞獅無關","繪畫非醒獅的重要組成"],"w":"醒獅屬於中國狩舞中的南獅，明代時在廣東出現。醒獅是集舞蹈、音樂和武術為一體的文化活動。表演時伴以鑼鼓，舞獅人先打南拳稱為「開樁」，然後兩人操縱獅頭進行舞蹈。主要套路有「採青」、「高台飲水」等。","m":"舞蹈音樂加武術，醒獅文化三位一。","n":"","v":1,"src":[{"t":"中國非物質文化遺產網：狻舞（廣東醒獅）","u":"https://www.ihchina.cn/project_details/12870","d":"2024-01-01"},{"t":"澎湃新聞：醒獅醒國魂，擊鼓振精神","u":"https://www.thepaper.cn/newsDetail_forward_16195421","d":"2024-01-01"},{"t":"維基百科：狻舞（廣東醒獅）","u":"https://zh.wikipedia.org/zh-hans/%E7%8B%AE%E8%88%9E%EF%BC%88%E5%B9%BF%E4%B8%9C%E9%86%82%E7%8B%AE%EF%BC%89","d":"2024-01-01"}]},"8-156":{"o":["琵琶","二胡","笛子"],"x":["嵇康以善彈琴著稱","二胡為元後樂器","笛子非琴曲演奏樂器"],"w":"琴曲《廣陵散》流行於廣陵地區（今揚州），是魏晉時期的著名古琴曲。魏晉琴家嵇康以善彈此曲著稱。根據傳説，嵇康在被判處死刑前，曾借古琴彈奏此曲，臨終時嘆息：「《廣陵散》將從此失傳了！」","m":"廣陵散古琴曲，嵇康彈出絕世音。","n":"","v":1,"src":[{"t":"百度百科：廣陵散","u":"https://baike.baidu.com/item/%E5%B9%BF%E9%99%B5%E6%95%A3/234828","d":"2024-01-01"},{"t":"光明網：被嵇康稱「絕」的《廣陵散》是如何流傳下來的？","u":"https://wenyi.gmw.cn/2022-05/11/content_35725608.htm","d":"2022-05-11"},{"t":"維基百科：廣陵散","u":"https://zh.wikipedia.org/zh-hans/%E5%B9%BF%E9%99%B5%E6%95%A3","d":"2024-01-01"}]},"8-157":{"o":["漢武帝用兵匈奴","文景之治","秦滅六國"],"x":["漢武帝遠晚於楚漢相爭","文景之治在楚漢之後百年","秦滅六國非楚漢相爭"],"w":"《十面埋伏》，又名《淮陰平楚》，是以公元前202年劉邦與項羽垓下之戰為歷史題材而創作的琵琶獨奏曲。樂曲分為十三段，包括「列營」、「點將」、「埋伏」、「九里山大戰」、「項王敗陣」等段落，充分展現了楚漢相爭的激烈戰況。","m":"十面埋伏楚漢題，琵琶獨奏奏戰事。","n":"","v":1,"src":[{"t":"百度百科：十面埋伏","u":"https://baike.baidu.com/item/%E5%8D%81%E9%9D%A2%E5%9F%8B%E4%BC%8F/2280381","d":"2024-01-01"},{"t":"維基百科：十面埋伏（樂曲）","u":"https://zh.wikipedia.org/zh-hans/%E5%8D%81%E9%9D%A2%E5%9F%8B%E4%BC%8F_(%E6%A8%82%E6%9B%B2)","d":"2024-01-01"},{"t":"郎朗音樂時間：歷史之戰 楚漢相爭——琵琶獨奏曲《十面埋伏》","u":"https://www.gzstv.com/a/974207b634594cc69a1ff49140f56593","d":"2024-01-01"}]},"8-158":{"o":["尚小雲","程硯秋","荀慧生"],"x":["1922年梅蘭芳與楊小樓合作，非尚小雲","程硯秋為四大名旦之一，非此版合作者","荀慧生亦為四大名旦，非此版合作者"],"w":"京劇《霸王別姬》於1918年首演，1922年2月15日，京劇大師楊小樓與梅蘭芳合作，推出改編版本《霸王別姬》。楊小樓飾項羽，梅蘭芳飾虞姬。這一版本成為經典，梅蘭芳從1922年至1959年共演了37年，演出達千場以上。","m":"九一八 -20"}]},"8-162":{"o":["吐火","翻滾","易容"],"x":["川劇有吐火絕技但變臉最為人所知","翻滾是舞蹈動作，非川劇特有絕技","易容是化妝技巧，非川劇獨特技藝"],"w":"川劇變臉是川劇最著名的絕技，演員通過抹臉、吹臉、扯臉等四種技法，在瞬間變換不同的臉譜，展現人物的喜怒哀樂。變臉已被列入國家級非物質文化遺產。","m":"川劇一揮手，臉譜變萬千。","n":"變臉有四種方法：抹臉、吹臉、扯臉、運氣變臉。","v":1,"src":[{"t":"變臉 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%8F%98%E8%84%B8","d":"2024-12-20"},{"t":"川剧变脸（川剧绝活） - 百度百科","u":"https://baike.baidu.com/item/%E5%B7%9D%E5%89%A7%E5%8F%98%E8%84%B8/63484","d":"2024-12-20"}]},"8-163":{"o":["《中華贊歌》","《銀河之歌》","《紅色娘子軍》"],"x":["《中華贊歌》是其他歌舞作品，非周恩來領導創作的音樂舞蹈史詩","《銀河之歌》非周恩來時期的作品","《紅色娘子軍》是芭蕾舞劇，非大型音樂舞蹈史詩"],"w":"1964年為慶祝中華人民共和國成立十五週年，周恩來總理親自領導創作了大型音樂舞蹈史詩《東方紅》。全國三千多名演員參與，於十月二日在人民大會堂首演，場場爆滿。","m":"周總理導演《東方紅》，千人齊聲唱偉業。","n":"周恩來親自確定主題、重要情節，並審改朗誦詞。","v":1,"src":[{"t":"周恩來與音樂舞蹈史詩《東方紅》 - 新華澳報","u":"https://www.waou.com.mo/2021/09/28/%E5%91%A8%E6%81%A9%E4%BE%86%E8%88%87%E9%9F%B3%E6%A8%82%E8%88%9E%E8%B9%88%E5%8F%B2%E8%A9%A9%E3%80%8A%E6%9D%B1%E6%96%B9%E7%B4%85%E3%80%8B/","d":"2024-12-20"},{"t":"大型音樂舞蹈史詩《東方紅》誕生前后 - 中國特色社會主義理論","u":"https://www.dswxyjy.org.cn/BIG5/n1/2022/0512/c244516-32420217.html","d":"2024-12-20"}]},"8-164":{"o":["印度音樂","阿拉伯音樂","歐洲音樂"],"x":["印度音樂對唐代影響有限，非主要融合對象","阿拉伯音樂融合較少，主要是西域音樂","歐洲音樂在唐代對中國音樂無影響"],"w":"唐代是中國音樂發展的高峯期，當時的音樂結合了漢族傳統音樂、少數民族音樂和西域音樂，形成了開放包容的音樂文化。西域音樂包括波斯、中亞等地的樂曲和樂器。","m":"唐樂融合三源：漢族、民族、西域音。","n":"西域音樂主要指中亞波斯等地傳入的音樂。","v":1,"src":[{"t":"中國音樂 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%AD%E5%9B%BD%E9%9F%B3%E4%B9%90","d":"2024-12-20"},{"t":"中國傳統音樂 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E4%B8%AD%E5%9C%8B%E5%82%B3%E7%B5%B2%E9%9F%B3%E6%A8%82","d":"2024-12-20"}]},"8-165":{"o":["樂器材料","樂器音色","樂器起源"],"x":["樂器材料分為八音，非四大類","音色分類也非「吹拉彈打」","樂器起源不是分類標準"],"w":"中國樂器分類「吹、拉、彈、打」指的是演奏方法，是按照演奏時的動作方式來分類。吹是用氣息，拉是用弓摩擦，彈是用手指撥動，打是用手或棒敲擊。","m":"四種演奏法，樂器分四類。","n":"古代「八音」是按材料分類（金、石、土、革、絲、木、匏、竹），不同於現代演奏法分類。","v":1,"src":[{"t":"吹、拉、弹、打：中国民族乐器的基本分类 - 中国传统文化促进会","u":"https://www.tcpc.org.cn/15275.html","d":"2024-12-20"},{"t":"中樂小百科I：中樂團器樂簡介 - 香港文聯","u":"https://www.hkwl.org/article/2693-%E4%B8%AD%E6%A8%82% ,"u":"https://www.icho.hk/tc/web/icho/ich_inventory_of_hong_kong.html","d":"2024-12-20"}]},"8-170":{"w":"截至2024年12月，中國共有44個項目列入聯合國教科文組織非物質文化遺產名錄、名冊，位居世界第一。2024年12月，農曆春節被新列入代表作名錄，使中國的非物質文化遺產保護成就得到國際認可。","m":"中國非遺四十四項居世界首，文明瑰寶代代傳。","n":"春節於2024年12月4日被聯合國教科文組織新列為非遺代表作。","v":1,"src":[{"t":"中國「春節」申遺成功…44項非物質文化遺產 全球最多 - 世界新聞網","u":"https://www.worldjournal.com/wj/story/121474/8404872","d":"2024-12-20"},{"t":"「春節」申遺成功 中國共擁44項非遺居世界第一 - 當代中國","u":"https://www.ourchinastory.com/zh/13590","d":"2024-12-20"}]},"8-171":{"o":["宮、商、徵、羽、角","角、商、宮、羽、徵","宮、角、商、羽、徵"],"x":["五音順序為宮商角徵羽，此序列錯誤","五音順序不對，角應排第三位","五音順序不對，各音位置錯誤"],"w":"中國傳統音樂的五個基本音階分別為宮、商、角、徵、羽。大致相當於西洋音樂簡譜的do、re、mi、sol、la。宮音代表天子統帥，為五音之首；商音代表百姓；角音代表木；徵音代表火和政事；羽音代表水和萬物。","m":"宮商角徵羽，五音成樂序。","n":"古代五音與五行相配合，體現了哲學思想。","v":1,"src":[{"t":"中國五聲音階 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E4%B8%AD%E5%9C%8B%E4%BA%94%E8%81%B2%E9%9F%B3%E9%9A%8E","d":"2024-12-20"},{"t":"五音 (中樂) - 維基百科","u":"https://zh-yue.wikipedia.org/wiki/%E4%BA%94%E9%9F%B3_(%E4%B8%AD%E6%A8%82)","d":"2024-12-20"}]},"8-172":{"o":["戲曲中的一種面具","古代皇帝的聖旨","音樂樂器名稱"],"x":["正宮不是面具，是音樂術語","正宮不是聖旨，是戲曲音樂用語","正宮不是樂器本身，而是音樂調式"],"w":"正宮是古代戲曲音樂名詞，是宮調之一。宮調起源於宋代，是元曲中音樂部分的曲調模式。正宮為六宮之一，在元曲系統中是常用的宮調，具有特定的音樂特色和聲情。","m":"正宮是調式，戲曲音樂的門面。","n":"宮調包括正宮、中呂宮、南呂宮、仙呂宮、黃鐘宮等六宮。","v":1,"src":[{"t":"宮調 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%AE%AE%E8%AA%BF","d":"2024-12-20"},{"t":"正宮的意思 - 漢典","u":"https://zdic.net/hant/%E6%AD%A3%E5%AE%AE","d":"2024-12-20"}]},"8-173":{"o":["少女","婦女","侍女"],"x":["卜兒在元曲中特指老年婦女，非少女","婦女泛指女性，卜兒特指老年婦女","侍女指侍奉他人的女性，卜兒指年長婦女"],"w":"《竇娥冤》是元朝關漢卿的雜劇代表作。劇中卜兒指的是老年婦女，在此劇中特指竇娥的婆婆蔡婆。卜兒是元雜劇中對老年婦女角色的俗稱和舞台術語。","m":"卜兒老婦人，竇娥冤屈千古哀。","n":"《竇娥冤》被譽為元曲四大悲劇之一，王國維認為其可列入世界大悲劇。","v":1,"src":[{"t":"竇娥冤 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E7%AA%A6%E5%A8%A5%E5%86%A4","d":"2024-12-20"},{"t":"《竇娥冤》究竟有何冤情？ - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2619","d":"2024-12-20"}]},"8-178":{"o":["《楚辭》","《古詩十九首》","《昭明文選》"],"x":["《楚辭》是戰國詩歌總集，非最早","《古詩十九首》成書較晚，非最早詩歌總集","《昭明文選》是文學總集，非詩歌專集"],"w":"《詩經》是中國最早的詩歌總集，收錄自西周初年至春秋中葉（約前11世紀至前6世紀）的詩歌305篇。原稱《詩》或《詩三百》，後被儒家尊為經典，改稱《詩經》。","m":"詩經三百篇，中華文化源頭傳。","n":"《詩經》確立了中國詩的修辭和押韻原則，被譽為「韻文之祖」。","v":1,"src":[{"t":"詩經 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E8%AF%97%E7%BB%8F","d":"2024-12-20"},{"t":"《詩經》 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1799","d":"2024-12-20"}]},"8-179":{"o":["《天問》屈原","《九歌》屈原","《國風》孔子"],"x":["《天問》是屈原作品但篇幅不及《離騷》","《九歌》是屈原詩歌集合，非最長抒情詩","《國風》是《詩經》篇章，非最長抒情詩"],"w":"《離騷》是戰國時期楚國詩人屈原的傑作，全詩共373句、2490字，是中國文學史上最長的抒情詩。詩歌運用比喻、神話等手法，表現屈原被君王疏遠但志節不移的悲怨和理想。","m":"屈原《離騷》最悠長，遺恨千古悲天地。","n":"《離騷》開創了騷體詩歌形式，為後世浪漫主義文學奠定基礎。","v":1,"src":[{"t":"離騷 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E9%9B%A2%E9%A8%B7","d":"2024-12-20"},{"t":"離騷原文及翻譯 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_proses/70559","d":"2024-12-20"}]},"8-180":{"o":["《竹書紀年》","《尚書》","《漢書》"],"x":["《竹書紀年》是古代編年體史書，非紀傳體首部","《尚書》是古代典籍集，非紀傳體史書","《漢書》雖是紀傳體，但《史記》更早"],"w":"《史記》是西漢司馬遷編寫的紀傳體史書，記載自傳説中的黃帝至漢武帝太初年間共二千五百年的中國歷史。《史記》首創紀傳體史書編纂方法，後世「正史」皆遵循此體例。","m":"司馬遷《史記》開先河，紀傳體史書始於此。","n":"《史記》共130卷，52萬6500餘字。魯迅稱其為「史家之絕唱，無韻之離騷」。","v":1,"src":[{"t":"史記 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%8F%B2%E8%AE%B0","d":"2024-12-20"},{"t":"《史記》、《漢書》為甚麼是「正史」？ - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/4352","d":"2024-12-20"}]},"8-181":{"o":["《詩經》","《楚辭》","《孟子》"],"x":["《詩經》是詩歌總集，非語錄體散文","《楚辭》是詩歌作品集，非語錄體散文","《孟子》是論述文獻，非首部語錄體散文"],"w":"《論語》是中國春秋時期孔子弟子及再傳弟子編纂的語錄體散文集，記錄孔子及其弟子的言行，首創「語錄體」文體。全書共20篇、492章，是儒家學派的經典著作。","m":"《論語》語錄開先河，孔子言行傳後世。","n":"《論語》文字簡練、言簡意賅，是文言古文的典範。","v":1,"src":[{"t":"論語 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E8%AE%BA%E8%AF%AD","d":"2024-12-20"},{"t":"論語 - 中國哲學書電子化計劃","u":"https://ctext.org/analects/zh","d":"2024-12-20"}]},"8-185":{"o":["《大唐西域記》","《地理誌》","《水經注》"],"x":["《大唐西域記》是唐僧玄奘著作，非柳宗元著作","《地理誌》是地理著作，非山水遊記","《水經注》是水道地理書，成書早於柳宗元時代"],"w":"柳宗元的《永州八記》堪稱山水遊記的典範，為中國遊記文體確立了標準。全集包括《始得西山宴遊記》等八篇作品，融景物描寫與抒情於一體，開創了「有我之境」的山水遊記寫法。","m":"柳宗元永州山水遊記精，開創文體新風尚。","n":"《永州八記》作於唐憲宗時期（809-812年），是柳宗元被貶期間的創作。","v":1,"src":[{"t":"永州八记 - 维基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%B0%B8%E5%B7%9E%E5%85%AB%E8%AE%B0","d":"2024-12-20"},{"t":"永州八記 - 維基文庫","u":"https://zh.wikisource.org/zh-hant/%E6%B0%B8%E5%B7%9E%E5%85%AB%E8%AE%B0","d":"2024-12-20"}]},"8-190":{"o":["謝靈運","王維","李白"],"x":["謝靈運是山水詩先驅但不是田園詩人","王維雖有田園詩作但不是首創者","李白是浪漫詩人，非以田園詩著稱"],"w":"陶淵明是中國第一位田園詩人，被譽為「古今隱逸詩人之宗」、「田園詩派之鼻祖」。他因不滿官場腐敗而決心歸隱，躬耕維生，創作大量以田園景色和生活為題材的詩歌，建立了中國古典詩歌的新流派。","m":"陶淵明歸隱種田園，開創田園詩派先河。","n":"陶淵明代表作《歸園田居》中「採菊東籬下，悠然見南山」為千古名句。","v":1,"src":[{"t":"陶淵明 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E9%99%B6%E6%B8%8A%E6%98%8E","d":"2024-12-20"},{"t":"田園詩中的陶淵明 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1428","d":"2024-12-20"}]},"8-196":{"o":["舞蹈","詩歌","繪畫"],"x":["絲竹是音樂術語，與舞蹈無關","絲竹雖涉及詩詞創作但本質指音樂","絲竹是音樂術語，非視覺藝術"],"w":"絲竹是中國古代詩詞中對音樂的雅稱。絲指弦樂器（如琵琶、古琴），竹指竹製吹管樂器（如笛、簫）。合稱絲竹代指音樂，如白居易《琵琶行》中「終歲不聞絲竹聲」。","m":"絲竹一詞指音樂，弦樂吹管相輝映。","n":"江南絲竹是著名民間音樂形式，起源於蘇州，包括《梅花三弄》等經典曲目。","v":1,"src":[{"t":"絲竹的意思 - 漢典","u":"https://zdic.net/hant/%E7%B5%B2%E7%AB%B9","d":"2024-12-20"},{"t":"江南絲竹 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%B1%9F%E5%8D%97%E4%B8%9D%E7%AB%B9","d":"2024-12-20"}]},"8-197":{"o":["30歲","70歲","50歲"],"x":["根據干支紀年制，30年為一個甲子的一半","70歲稱為古稀之年，與花甲無關","50歲為知天命之年，非花甲"],"w":"花甲源自中國古代干支紀年法。天干十個，地支十二個，兩者配合成六十個單位，稱為『六十花甲子』，故60歲稱為花甲之年。孔子曾言『吾六十而耳順』，將耳順與60歲對應。","m":"花甲六十年，干支輪一圈。","n":"","v":1,"src":[{"t":"年齡之稱 - udn部落格","u":"https://blog.udn.com/Luyenni/176838989","d":"2026-09-20"},{"t":"60岁叫花甲，那30、40、50、70、80以上叫什么？ - 喜馬拉雅","u":"https://m.ximalaya.com/ask/q295529","d":"2026-09-20"}]},"8-198":{"o":["柳永、李清照","晏殊、歐陽修","周邦彥、秦觀"],"x":["柳永、李清照是婉約派代表，符合題目要求不屬於婉約派","晏殊、歐陽修是婉約派代表","周邦彥、秦觀也屬於婉約派"],"w":"蘇軾和辛棄疾是宋詞豪放派的代表詞人，並非婉約派。豪放派打破了傳統的柔情婉約風格，氣勢宏大、意境深遠。婉約派的代表人物則是柳永、李清照等。","m":"蘇辛豪放派，不屬婉約心。","n":"","v":1,"src":[{"t":"豪放派 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E8%B1%AA%E6%94%BE%E6%B4%BE","d":"2026-09-20"},{"t":"【詩歌史之歌5-2】豪放派詞的誕生，及婉約之宗李清照 - Vocus","u":"https://vocus.cc/article/683e2738fd89780001e3273d","d":"2026-09-20"}]},"8-199":{"o":["唐朝","北宋","五代十國"],"x":["李清照生於1084年，唐朝已結束近200年","北宋結束於1127年，李清照已過中年","五代十國在宋朝之前，年代相差太遠"],"w":"李清照生於1084年，卒於約1156年，生活於北宋末年至南宋年間。她是宋代最偉大的女詞人，婉約派代表人物，著名作品有《醉花陰》、《聲聲慢》等。","m":"李清照宋代人，詞壇第一才。","n":"","v":1,"src":[{"t":"李清照 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/%E6%9D%8E%E6%B8%85%E7%85%A7","d":"2026-09-20"},{"t":"李清照簡介 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_authors/536","d":"2026-09-20"}]},"8-200":{"w":"茶藝中影響茶香和口感的因素極多。水質直接決定茶湯滋味，不同水質泡出不同風味；茶葉種類決定基礎香氣和滋味成分；泡茶時間控制浸出程度，時間過長易苦澀；茶具材料會傳導温度和吸附香氣。四者相互配合方能泡出好茶。","m":"水質茶葉時間具，四者配合出好茶。","n":"","v":1,"src":[{"t":"如何沖泡出香氣十足、不苦澀的好茶？掌握茶飲店成功的四大關鍵","u":"https://www.highteaworld.com/blog/posts/tea-brewing-tips-for-business","d":"2026-09-20"},{"t":"茶為什麼會香？茶風味輪中的花香果香焙香…從哪來？茶怎麼泡才香？","u":"https://www.jjtea.com.tw/blog/%E8%8C%B6%E9%A2%A8%E5%91%B3%E8%BC%AA%E4%B8%AD%E7%9A%84%E8%8A%B1%E9%A6%99%E6%9E%9C%E9%A6%99%E7%84%99%E9%A6%99%E5%BE%9E%E5%93%AA%E4%BE%86","d":"2026-09-20"}]},"8-201":{"o":["嚴苛","白居易","李時珍"],"x":["嚴苛是酒類著作人物，非茶經作者","白居易是詩人，與茶經無直接關係","李時珍著《本草綱目》，非《茶經》作者"],"w":"《茶經》由唐代陸羽所著，約成書於760-780年間，全書分3卷10篇，是世界上最早的關於茶的專著。陸羽被尊為『茶聖』，《茶經》總結茶的栽培、採摘、製作、鑑別、煮飲等全面知識，影響深遠。","m":"陸羽茶經唐代著，茶聖盛譽傳千年。","n":"","v":1,"src":[{"t":"茶經 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E8%8C%B6%E7%BB%8F","d":"2026-09-20"},{"t":"宋时磊：陆羽《茶经》与唐代茶文化 - 中國非物質文化遺産網","u":"https://www.ihchina.cn/Article/Index/detail?id=27236","d":"2026-09-20"}]},"8-202":{"o":["冬季","春季","夏季"],"x":["冬季應為冬至之後，白露在秋分前，季節不符","春季開始於立春，白露在秋季","夏季結束於夏至之後，白露在秋季"],"w":"白露是二十四節氣中的第十五個節氣，每年約在9月7-9日。白露標誌秋季的第三個節氣，此時氣温下降，早晨草木會凝結露水，是孟秋向仲秋的轉變時期。","m":"白露秋季來，晨露草葉開。","n":"","v":1,"src":[{"t":"二十四节气·白露 - 中國氣象網","u":"https://www.cma.gov.cn/ztbd/2023zt/24jq/bl/index.html","d":"2026-09-20"},{"t":"白露 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E7%99%BD%E9%9C%B2","d":"2026-09-20"}]},"8-203":{"o":["孟子","墨子","莊子"],"x":["孟子的生平事蹟記載於《孟子》，非《論語》","墨子的事蹟與《論語》無關","莊子的故事記於《莊子》，非《論語》"],"w":"《論語》是儒家經典，由孔子弟子及其孫弟子根據孔子的言詞、行為和與弟子的問答編纂而成。書中詳細記載了孔子的生平事蹟、教學思想和道德言論，是瞭解孔子及儒家思想的重要文獻。","m":"論語載孔子跡，二十篇裡皆言行。","n":"","v":1,"src":[{"t":"論語 - 維基百科","u":"https://ja.wikipedia.org/wiki/%E8%AB%96%E8%AA%9E","d":"2026-09-20"},{"t":"孔子 - 維基百科","u":"https://ja.wikipedia.org/wiki/%E5%AD%94%E5%AD%90","d":"2026-09-20"}]},"8-204":{"o":["屬於五經","是五經之一","古籍中稱為五經"],"x":["大學原是《禮記》篇章，後朱熹列為四書之首","四書五經中，大學屬四書，非五經","五經指詩書禮周易春秋，不包括大學"],"w":"《大學》原為《禮記》第四十二篇，後來朱熹把它與《論語》《孟子》《中庸》合編為『四書』。五經是指《詩》《尚書》《禮記》《周易》《春秋》，大學不在五經之列。","m":"大學四書首，五經不包括。","n":"","v":1,"src":[{"t":"四書五經 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%9B%9B%E4%B9%A6%E4%BA%94%E7%BB%8F","d":"2026-09-20"},{"t":"大学 | 儒学经典｜四书之首","u":"https://www.quanxue.cn/ct_rujia/daxueindex.html","d":"2026-09-20"}]},"8-205":{"o":["敦煌","洛陽","長安以東"],"x":["敦煌是西端樞紐，非東方起點","洛陽是內陸都城，非絲路起點","西安（古長安）才是確實的東端起點"],"w":"絲綢之路的東方起點在西安（古稱長安）。這條著名商路從西安出發，經甘肅的蘭州、嘉峪關、敦煌等地，再至新疆烏魯木齊，最後通向中亞、西亞乃至羅馬帝國，是中國與西方貿易往來的重要通道。","m":"絲路東起西安城，古稱長安天下宗。","n":"","v":1,"src":[{"t":"丝绸之路由长安开始？ - 中國文化研究院","u":"https://chiculture.org.hk/sc/china-five-thousand-years/545","d":"2026-09-20"},{"t":"西安－前世今生 都離不開絲路 - 天下雜誌","u":"https://www.cw.com.tw/article/5067343","d":"2026-09-20"}]},"8-206":{"o":["漢武帝","康熙帝","唐太宗"],"x":["漢武帝陵在茂陵，非西安兵馬俑","康熙帝是清代帝王，年代相差太遠","唐太宗陵不在西安市中心"],"w":"兵馬俑位於陝西西安市臨潼區，是秦始皇的陵墓羣之一。1974年發現，現已出土約8000多件陶土軍人、戰車和馬匹，是世界文化遺產，被譽為『世界第八奇蹟』，展現秦代軍隊編制和製陶藝術。","m":"秦始皇陵兵馬俑，西安臨潼古奇觀。","n":"","v":1,"src":[{"t":"秦始皇兵馬俑 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%A7%A6%E5%A7%8B%E7%9A%87%E5%85%B5%E9%A6%AC%E4%BF%91","d":"2026-09-20"},{"t":"【秦始皇兵馬俑攻略】票價、交通、必看展區整理 - Trip.com","u":"https://tw.trip.com/guide/attraction/%E5%85%B5%E9%A6%AC%E4%BF%91%E9%96%80%E7%A5%A8.html","d":"2026-09-20"}]},"8-207":{"o":["伍子胥","孫武","蘇武"],"x":["伍子胥與吳國相關，非端午主人公","孫武是兵法家，與端午無關","蘇武是漢代使者，與粽子習俗無關"],"w":"端午節吃粽子是為了紀念屈原。屈原是戰國時代楚國的愛國詩人，因忠言被貶，最終投汨羅江殉難。百姓為防止魚蝦啃食遺體，用竹葉包裹米食投入江中，演變成後世吃粽子的習俗。","m":"端午粽子屈原故，汨羅江邊投飯粽。","n":"","v":1,"src":[{"t":"端午節為何要吃粽子？端午節的由來、習俗、日期一次看","u":"https://www.parenting.com.tw/article/5092786","d":"2026-09-20"},{"t":"【端午節由來】3大起源說法解析｜原來不只紀念屈原？","u":"https://www.hangheung.com.hk/blogs/%E7%AB%AF%E5%8D%88%E7%AF%80/dragon-boat-festival-origin","d":"2026-09-20"}]},"8-208":{"w":"陸羽《茶經》開篇記載『茶之為飲，發乎神農氏，聞於魯周公』。這句話表明陸羽將茶飲的起源追溯至遠古傳説中的神農，將其推廣歸功於魯國的周公旦。此段引言為茶文化溯源，體現了儒家尊古崇賢的思想。","m":"茶經開篇説源頭，神農發現周公傳。","n":"","v":1,"src":[{"t":"士人的品茗之道 - 中國文化研究院","u":"https://chiculture.org.hk/index.php/en/node/3174","d":"2026-09-20"},{"t":"陸羽泡茶師檢定考試指南：茶經原典選讀","u":"http://teamaker101.blogspot.com/2011/03/blog-post_9184.html","d":"2026-09-20"}]},"8-209":{"w":"陸羽《茶經》記載品茶環境應『茶宜淨室，宜古曲』，強調茶宜在潔淨幽雅的室內環境中品飲，並搭配古樂演奏。古曲的美妙旋律能提升品茶的意趣，使人在視覺潔淨、聽覺雅緻的環境中，更好地體驗茶的香氣與滋味。","m":"茶室須潔淨，古曲伴茶心。","n":"","v":1,"src":[{"t":"茶經 - 維基文庫","u":"https://zh.wikisource.org/zh-hant/%E8%8C%B6%E7%B6%93","d":"2026-09-20"},{"t":"陆羽茶经全文翻译","u":"https://chajing.5000yan.com/","d":"2026-09-20"}]},"8-210":{"w":"陸羽《茶經》『三之造』篇詳述採茶時間，『凡採茶，在二月三月四月之間』。因唐代採用農曆，此時節約為陽曆3月至5月，正是春茶收穫季節。此期採收的茶葉肥壯飽滿，茶葉質量最佳，是製作優質茶葉的關鍵時期。","m":"採茶春季三個月，二三四月最上品。","n":"","v":1,"src":[{"t":"陆羽茶经 三之造 全文逐句翻译","u":"https://chajing.5000yan.com/zao/","d":"2026-09-20"},{"t":"陆羽《茶经》之造 - 百科TA說","u":"https://wapbaike.baidu.com/tashuo/browse/content?id=2767bec075316bac7167361b","d":"2026-09-20"}]},"8-211":{"w":"中國茶道包括茶藝和茶道精神兩部分。茶藝指製茶、煮茶、品茶三個方面的藝術。製茶涵蓋殺青、悶黃、發酵等多種工序，發展出六大茶類；煮茶是運用茶具和火候煮製茶湯的技藝；品茶則通過觀色、嗅香、品味，體會茶的韻味。三者相輔相成，構成完整的茶文化體系。","m":"茶藝三藝成一體，製煮品茶講究極。","n":"","v":1,"src":[{"t":"茶與茶文化 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2761","d":"2026-09-20"},{"t":"甚麼是茶道？ - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/656","d":"2026-09-20"}]},"8-212":{"w":"2006年中國首次公佈國家級非物質文化遺產名錄時，江南絲竹（江蘇蘇州、上海）和土家族打溜子（湖南湘西）均列入民間音樂項目。江南絲竹是以吳地方言區流行的器樂合奏傳統，土家族打溜子是少數民族打擊樂文化代表。兩項都體現中國民間音樂的多樣性與區域特色。","m":"絲竹打溜子，非遺民樂瑰。","n":"","v":1,"src":[{"t":"第一批國家級非物質文化遺產名錄 - 維基文庫","u":"https://zh.wikisource.org/zh-hant/%E7%AC%AC%E4%B8%80%E6%89%B9%E5%9B%BD%E5%AE%B6%E7%BA%A7%E9%9D%9E%E7%89%A9%E8%B4%A8%E6%96%87%E5%8C%96%E9%81%97%E4%BA%A7%E5%90%8D%E5%BD%95","d":"2026-09-20"},{"t":"國家級非物質文化遺產代表性項目名錄 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E5%9B%BD%E5%AE%B6%E7%BA%A7%E9%9D%9E%E7%89%A9%E8%B4%A8%E6%96%87%E5%8C%96%E9%81%97%E4%BA%A7%E4%BB%A3%E8%A1%A8%E6%80%A7%E9%A1%B9%E7%9B%AE%E5%90%8D%E5%BD%95","d":"2026-09-20"}]},"8-213":{"o":["屬於敦煌琵琶譜","是琵琶傳統曲目","記載於古代琵琶譜"],"x":["塞上曲和海青拿天鵝實際上不屬於敦煌琵琶譜","這兩首曲雖為琵琶名曲，但不在敦煌琵琶譜記載範圍","敦煌琵琶譜是特定文獻，不包括所有琵琶曲"],"w":"敦煌琵琶譜是存世稀少的古代琵琶記譜文獻，約成書於933年。塞上曲和海青拿天鵝雖然都是著名的琵琶傳統曲目，但它們在敦煌琵琶譜中並無記載，屬於後世傳承的琵琶曲。","m":"敦煌琵琶譜古老，塞上海青非其載。","n":"","v":1,"src":[{"t":"海青拿天鹅 - 維基百科","u":"https://zh.wikipedia.org/zh-cn/%E6%B5%B7%E9%9D%92%E6%8B%BF%E5%A4%A9%E9%B5%9D","d":"2026-09-20"},{"t":"琵琶文化散论 - 華音網","u":"https://www.huain.com/article/pipa/2024/0301/2556.html","d":"2026-09-20"}]},"8-214":{"o":["裝飾","模進","減音"],"x":["裝飾是泛稱，不是江南絲竹特用術語","模進是音樂學術語，江南絲竹不用此詞","減音是減少音符，與『加花』含義相反"],"w":"江南絲竹是長江下游地區流行的器樂合奏形式。『加花』是江南絲竹的重要演奏技巧，指在基本旋律基礎上添加裝飾音符，增加音樂的華彩和變化。演奏者根據『你繁我簡、你高我低』的原則，靈活運用加花、減字、搶擋等變奏手法。","m":"江南絲竹加花技，變奏華彩一絕藝。","n":"","v":1,"src":[{"t":"江南絲竹 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E6%B1%9F%E5%8D%97%E4%B8%9D%E7%AB%B9","d":"2026-09-20"},{"t":"从《中花六板》陈永禄演奏谱看江南丝竹中二胡演奏的加花与装饰 - 華音網","u":"https://www.huain.com/article/erhu/2025/0711/3276.html","d":"2026-09-20"}]},"8-215":{"w":"中國古代樂器分類按製作材料分為八類，合稱『八音』。分別為：金（銅鐘、鍰等）、石（磬、石制樂器）、絲（琴、瑟、琵琶等弦樂）、竹（笛、簫等竹製吹樂）、鞄（葫蘆笙等）、土（壎等陶製樂器）、革（鼓等皮製打樂）和木（柷、椌等木製樂器）。此分類體現了古人對樂器的系統認識。","m":"八音金石絲竹鞄土革木，古代樂器都包括。","n":"","v":1,"src":[{"t":"中國文化通識｜甚麼是八音？ - 當代中國","u":"https://www.ourchinastory.com/zh/12043","d":"2026-09-20"},{"t":"古代八音—金石丝竹匏土革木","u":"http://www.bianzhong.net/news/show-112.html","d":"2026-09-20"}]},"8-216":{"w":"唐代燕樂音樂記譜使用『半字譜』，以簡化的漢字形式記錄琴絃各聲部的音高。『半字譜』最初的10個字為『五、凡、工、尺、上、一、四、六、勾、合』，以簡體字形表示各弦的音位。由於記譜方式不完全，後來在宋代逐漸演變為更規範的『工尺譜』，並沿用至今。","m":"唐燕樂半字譜，十字記音位。","n":"","v":1,"src":[{"t":"中國古譜 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%AD%E5%9B%BD%E5%8F%A4%E8%B0%B1","d":"2026-09-20"},{"t":"知識點｜唐代燕樂的音樂理論 - AllHistory","u":"https://m.allhistory.com/ah/article/5f7fdd49550c6f0001d32ef7","d":"2026-09-20"}]},"8-217":{"o":["茶葉的產地","茶葉的年份","茶葉的重量"],"x":["產地不屬於鬥茶評比準則","年份不屬於鬥茶評比準則","重量不屬於鬥茶評比準則"],"w":"宋代鬥茶以點茶法進行，評判標準主要有三：一是杯麪的湯花顏色，以鮮白為上；二是茶色，以純白為上；三是水痕出現的早晚，晚者為勝，反映茶葉品質越好，湯花就能持久附著在茶盞上。","m":"鬥茶三寶：湯花白、茶色清、水痕遲。","n":"","v":1,"src":[{"t":"中新網：斗茶――中新网","u":"https://www.chinanews.com.cn/hb/news/2010/06-01/2317085.shtml","d":"2010-06-01"},{"t":"維基百科（繁體）：鬥茶 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E9%AC%A5%E8%8C%B6","d":"2026-09-20"}]},"8-218":{"o":["只有儒家思想","只有佛教思想","只有道教思想"],"x":["儒家、佛教、道教都對茶文化有影響","儒家、佛教、道教都對茶文化有影響","儒家、佛教、道教都對茶文化有影響"],"w":"中國茶文化深受儒、釋、道三教影響。道教強調「自然」淡泊，與茶的自然屬性相合；儒家將「中庸」和「仁禮」思想融入茶文化，提倡通過飲茶溝通思想；佛教禪宗則在茶的種植、飲茶習俗推廣和美學境界提升上貢獻巨大。","m":"儒釋道三教齊修，茶文化百花齊放。","n":"","v":1,"src":[{"t":"愛思想：丁文：茶文化与儒佛道的关系_爱思想","u":"https://www.aisixiang.com/data/59975.html?page=2","d":"2026-09-20"},{"t":"佛教導航：茶文化与宗教发展的内在关系-佛教导航","u":"https://www.fjdh.cn/wumin/2009/04/21365164345.html","d":"2026-09-20"}]},"8-219":{"w":"《三字經》開篇揭示人性本善的思想，源自孟子「人性本善」之學説。「性相近，習相遠」進一步説明人性相近，但因後天教育環境不同，性情就會有好壞差別。此句強調教育對人格塑造的重要性。","m":"性本善，習相遠，教育改變人一生。","n":"","v":1,"src":[{"t":"三字經網：\"人之初，性本善。性相近，習相遠。\"解释-三字经网","u":"https://www.sanzijing.org/1.html","d":"2026-09-20"},{"t":"光明網：《三字經》的核心思想為何來自孟子？","u":"https://www.gmw.cn/01ds/2008-06/25/content_796689.htm","d":"2008-06-25"}]},"8-220":{"w":"張愛玲（1920-1995），著名現代作家，原名張煐。1930年上中學時因報名方便改名為張愛玲，其中「愛玲」為英文名「Eileen」的中文音譯。張煐後來成為其最著名的筆名，代表作有《傾城之戀》《半生緣》等。","m":"張煐改名愛玲，音譯英文名成傳奇。","n":"","v":1,"src":[{"t":"維基百科（繁體）：張愛玲 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E6%84%9B%E7%8E%B2","d":"2026-09-20"},{"t":"百度百科：张爱玲（中国现代女作家）","u":"https://baike.baidu.com/item/%E5%BC%A0%E7%88%B1%E7%8E%B2/44982","d":"2026-09-20"}]},"8-221":{"w":"莫言於2012年10月11日獲得諾貝爾文學獎，成為首位中國國籍的諾貝爾文學獎得主。獲獎理由是「通過幻覺現實主義融合民間故事、歷史與當代」，作品富有想象力和魔幻現實主義風格。","m":"莫言二〇一二年，中國文學奪諾獎。","n":"","v":1,"src":[{"t":"當代中國：莫言獲諾貝爾文學獎 | 當年今日","u":"https://www.ourchinastory.com/zh/2602/%E8%8E%AB%E8%A8%80%E7%8D%B2%E8%AB%BE%E8%B2%9D%E7%88%BE%E6%96%87%E5%AD%B8%E7%8D%8E","d":"2026-09-20"},{"t":"維基百科（繁體）：2012年諾貝爾文學獎 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-hant/2012%E5%B9%B4%E8%AF%BA%E8%B4%9D%E5%B0%94%E6%96%87%E5%AD%A5%E5%A5%96","d":"2026-09-20"}]},"8-222":{"w":"長洲太平清醮是香港長洲的傳統民俗活動，搶包山是其中最著名的環節。所搶的包子古稱「幽包」，是供奉北帝的祭品，印有紅色「壽」字，後改稱「平安包」。現代搶包山已改為比賽形式進行。","m":"幽包平安包，長洲風俗傳千年。","n":"","v":1,"src":[{"t":"當代中國：數說非遺｜6個數字看長洲太平清醮","u":"https://www.ourchinastory.com/zh/16397/%E6%95%B8%E8%AA%AA%E9%9D%9E%E9%81%BA%EF%BD%9C6%E5%80%8B%E6%95%B8%E5%AD%97%E7%9C%8B%E9%95%B7%E6%B4%B2%E5%A4%AA%E5%B9%B3%E6%B8%85%E9%86%AE-%E5%B9%B3%E5%AE%89%E5%8C%85%E5%8E%9F%E6%98%AF%E5%B9%BD%E5%8C%85%EF%BC%9F%E9%A3%84%E8%89%B2%E4%B8%80%E5%90%8D%E6%80%8E%E6%A8%A3%E4%BE%86%EF%BC%9F","d":"2026-09-20"},{"t":"維基百科（繁體）：長洲太平清醮 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-hk/%E9%95%B7%E6%B4%B2%E5%A4%AA%E5%B9%B3%E6%B8%85%E9%86%AE","d":"2026-09-20"}]},"8-223":{"w":"秦始皇兵馬俑位於西安市臨潼區，是秦始皇帝陵博物院的重要組成部分，被譽為「世界第八大奇蹟」。兵馬俑於1974年3月發現，形態逼真的陶俑和威武嚴整的軍陣展現了古代東方文化的燦爛輝煌。1987年被列入世界遺產。","m":"兵馬俑在西安，秦朝軍威永不滅。","n":"","v":1,"src":[{"t":"新華網：打卡古都西安的文化地标——秦兵马俑","u":"https://www.news.cn/culture/20230511/82236a8d9e54439097703444eec2d17c/c.html","d":"2023-05-11"},{"t":"維基百科（繁體）：秦始皇兵馬俑 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-hant/%E7%A7%A6%E5%A7%8B%E7%9A%87%E5%85%B5%E9%A9%AC%E4%BF%91","d":"2026-09-20"}]},"8-224":{"w":"提線木偶戲是中國古代一種重要的漢族戲劇形式，古稱「懸絲傀儡」，源於秦漢時期。現已成為國家非物質文化遺產代表性項目。提線木偶又稱牽線木偶、懸絲木偶、扯線木偶，以繩或線操作木製偶人進行表演。","m":"懸絲傀儡古稱傳，提線木偶今猶現。","n":"","v":1,"src":[{"t":"維基百科（繁體）：懸絲傀儡 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E6%87%B8%E7%B5%B2%E5%82%80%E5%84%A1","d":"2026-09-20"},{"t":"中文百科全書：提線木偶(線牽木偶)","u":"https://www.newton.com.tw/wiki/%E6%8F%90%E7%B7%9A%E6%9C%A8%E5%81%B6/63754","d":"2026-09-20"}]},"8-225":{"w":"活字印刷術是中國四大發明之一，最早出現於宋朝。根據宋代沈括《夢溪筆談》記載，北宋普通人畢昇在仁宗年間（約1041-1048年）發明瞭泥活字，後來又有木活字、銅活字等改進。這項發明對世界文明產生了深遠影響。","m":"活字印刷宋朝創，畢昇智慧傳千年。","n":"","v":1,"src":[{"t":"上海中華印刷博物館：木活字印刷術的前世今生","u":"http://shzhysmuseum.com/h-nd-375.html","d":"2026-09-20"},{"t":"百度百科：活字印刷术（中国古代的四大发明之一）","u":"https://baike.baidu.com/item/%E6%B4%BB%E5%AD%97%E5%8D%B0%E5%88%B7%E6%9C%AF/7258232","d":"2026-09-20"}]},"8-226":{"w":"琴棋書畫並稱為傳統文人四藝，其中「棋」主要指圍棋。圍棋起源於中國古代，約在公元前6世紀，是一種策略性二人棋類遊戲。最早可靠記載見於春秋時期的《左傳》。唐朝張彥遠《法書要錄》就將琴棋書畫並稱，到明末清初李漁才正式合稱為「四藝」。","m":"琴棋書畫圍棋，文人修養四件事。","n":"","v":1,"src":[{"t":"維基百科（繁體）：琴棋書畫 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E7%90%B4%E6%A3%8B%E4%B9%A6%E7%94%BB","d":"2026-09-20"},{"t":"維基百科：圍棋 - 維基百科，自由的百科全书","u":"https://zh.wikipedia.org/wiki/%E5%9B%B4%E6%A3%8B","d":"2026-09-20"}]},"8-227":{"w":"黃鶴樓位於中華人民共和國湖北省武漢市武昌蛇山上，與湖南岳陽樓、江西滕王閣並稱江南三大名樓。黃鶴樓始建於三國時代吳黃武二年（公元223年），已有1800年歷史。現在的黃鶴樓是於1985年異址重建，為5層建築，高51.4米。","m":"黃鶴樓在武漢，江南名樓數第一。","n":"","v":1,"src":[{"t":"維基百科（繁體）：黃鶴樓 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-hant/%E9%BB%84%E9%B9%A4%E6%A5%BC","d":"2026-09-20"},{"t":"當代中國：中國文化通識｜四大名樓是哪四座？","u":"https://www.ourchinastory.com/zh/6232/%E4%B8%AD%E5%9C%8B%E6%96%87%E5%8C%96%E9%80%9A%E8%AD%98%EF%BD%9C%E5%9B%9B%E5%A4%A7%E5%90%8D%E6%A8%93%E6%98%AF%E5%93%AA%E5%9B%9B%E5%BA%A7%EF%BC%9F","d":"2026-09-20"}]},"8-228":{"w":"頤和園長廊位於北京，是世界上最長的木質走廊，全長728米，共273個廊間。長廊內裝飾有超過14,000幅精美彩繪，描繪《西遊記》《紅樓夢》《三國演義》等古典文學故事、西湖風景和《二十四孝》等題材，是中國古典建築藝術的傑作。","m":"頤和園長廊七百多米，彩繪千幅藝術珍。","n":"","v":1,"src":[{"t":"維基百科（繁體）：頤和園 - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E9%A2%90%E5%92%8C%E5%9B%AD","d":"2026-09-20"},{"t":"維基百科（繁體）：長廊 (北京) - 維基百科，自由的百科全書","u":"https://zh.wikipedia.org/zh-tw/%E9%95%B7%E5%BB%8A_(%E5%8C%97%E4%BA%AC)","d":"2026-09-20"}]},"8-233":{"o":["周朝","商朝","漢朝"],"x":["周朝實行分封制，非大一統","商朝未統一中原","漢朝才是大一統，秦朝先開創"],"w":"秦朝由秦始皇於公元前221年統一中原，建立了中國歷史上首個高度中央集權的「大一統」政治局面。秦朝廢除分封制，實行郡縣制，統一度量衡、貨幣、文字等，開創了2000多年封建王朝的統治模式。","m":"秦朝開創大一統，中華帝制始於茲。","n":"","v":1,"src":[{"t":"維基百科：秦朝 - 维基百科，自由的百科全书","u":"https://zh.wikipedia.org/wiki/%E7%A7%A6%E6%9C%9D","d":"2026-09-20"},{"t":"新浪新聞：秦朝建立：中国历史上的首次统一","u":"https://m.allhistory.com/ah/article/5ec650ebfcd3560001b7b0d5","d":"2026-09-20"}]},"8-234":{"o":["地方貴族世襲任免","下層百姓投票選舉","郡守推薦地方人選"],"x":["秦朝廢除了地方貴族世襲權力的制度","秦朝沒有民主選舉制度","郡守只能推薦，最終任免權在皇帝"],"w":"秦朝郡守和縣令由皇帝直接任命，這體現了秦朝高度的中央集權特點。所有官員需經中央審核，由皇帝簽字後才能正式任命，且可定期更換，確保了皇帝對全國的有效控制。","m":"秦朝官員皇帝任，中央集權牢牢定。","n":"","v":1,"src":[{"t":"維基百科：秦朝官制 - 维基百科，自由的百科全书","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E6%9C%9D%E5%AE%98%E5%88%B6","d":"2026-09-20"},{"t":"當代中國：【中国之治】先秦时期：郡县制-西安交通大学公共政策与管理学院","u":"https://sppa.xjtu.edu.cn/info/1171/6932.htm","d":"2026-09-20"}]},"8-235":{"o":["洛陽","長安","開封"],"x":["洛陽是東周首都，秦未定都於此","長安是漢朝首都，秦定都在鹹陽","開封是後世城市，非秦都"],"w":"秦始皇統一六國後，定都鹹陽。鹹陽位於涇渭交匯之地，平原廣闊，具備「據山河之固，東向以制諸侯」的戰略優勢。秦始皇在鹹陽北部高坡建造眾多宮殿園苑，並遷移全國12萬户豪富至此，使鹹陽成為當時全國最大的城市。","m":"鹹陽秦都數千年，三秦大地永相傳。","n":"","v":1,"src":[{"t":"中國文化研究院：秦都咸陽規模大得驚人","u":"https://chiculture.org.hk/tc/china-five-thousand-years/537","d":"2026-09-20"},{"t":"維基百科：秦咸阳城遗址 - 维基百科，自由的百科全书","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E5%92%B8%E9%98%B3%E5%9F%8E%E9%81%97%E5%9D%80","d":"2026-09-20"}]},"8-236":{"o":["郡縣制","分封制","察舉制"],"x":["郡縣制由秦朝確立，但非由秦確立後沿用至漢才完善","分封制是被廢除的舊制度","察舉制是人才選拔制度，非行政區劃制"],"w":"三公九卿制是秦朝建立的中央官員體系。秦朝由丞相、國尉（太尉）、御史大夫組成「三公」，統領九卿執掌各項政務。漢朝建立後基本繼承了秦朝的官制體系，到漢武帝時正式將國尉改稱太尉，並因受經學影響而將三公進一步完善。","m":"三公九卿秦朝創，漢代繼承更完善。","n":"","v":1,"src":[{"t":"維基大典：三公九卿制 - 維基大典","u":"https://zh-classical.wikipedia.org/wiki/%E4%B8%89%E5%85%AC%E4%B9%9D%E5%8D%BF%E5%88%B6","d":"2026-09-20"}]},"8-237":{"w":"秦朝三公指太尉、丞相、御史大夫三個最高官職。丞相是百官之首，地位僅次於皇帝，主管全國行政事務；太尉（原名國尉）是全國最高軍事長官，掌管軍事；御史大夫負責監察百官，並輔助丞相處理政務。三公互不統屬，直接隸屬皇帝，形成三權分立之勢。","m":"太尉丞相御史大夫，秦朝三公各有職。","n":"","v":1,"src":[{"t":"百度百科：三公九卿（中国的古代官员制度）","u":"https://baike.baidu.com/item/%E4%B8%89%E5%85%AC%E4%B9%9D%E5%8D%BF/905905","d":"2026-09-20"},{"t":"維基百科：秦朝官制 - 维基百科，自由的百科全书","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E6%9C%9D%E5%AE%98%E5%88%B6","d":"2026-09-20"}]},"8-238":{"o":["分封制","察舉制","科舉制"],"x":["分封制是秦朝廢除的舊制度，不是新制度","察舉制是人才選拔制度，與廢除分封無關","科舉制是後世制度，秦朝未有"],"w":"秦朝廢除分封制，改行郡縣制。郡縣制是以郡統縣的兩級地方行政制度，郡縣官員由皇帝直接任免，不能世襲，不易形成地方割據。相比分封制，郡縣制使所有土地和人民都屬於國家，有效加強了中央對地方的控制，防止了地方割據分裂。","m":"廢分封行郡縣，秦皇集權創新局。","n":"","v":1,"src":[{"t":"西安交通大學：【中国之治】先秦时期：郡县制","u":"https://sppa.xjtu.edu.cn/info/1171/6932.htm","d":"2026-09-20"},{"t":"維基百科：郡县制_百度百科","u":"https://baike.baidu.com/item/%E9%83%A1%E5%8E%BF%E5%88%B6/1859555","d":"2026-09-20"}]},"8-249":{"w":"「項莊舞劍，意在沛公」是中國歷史上著名的成語典故，出自鴻門宴事件。沛公即劉邦，後來的漢高祖。秦末時，劉邦和項羽分別佔據不同地域，項羽設鴻門宴企圖誘殺劉邦，張良識破項莊舞劍之計，於是項伯拔劍與項莊共舞護衞劉邦，最終劉邦逃脱。","m":"鴻門宴上項莊舞，沛公劉邦險些殞。","n":"","v":1,"src":[{"t":"漢典：\"項莊舞劍，意在沛公\"的解釋","u":"https://www.zdic.net/hant/%E9%A0%85%E8%8E%8A%E8%88%9E%E5%8A%8D%EF%BC%8C%E6%84%8F%E5%9C%A8%E6%B2%9B%E5%85%AC","d":"2026-09-20"},{"t":"頻果日報：「項莊舞劍，意在沛公」，其實下一句更重要，改變了鴻門宴的局勢","u":"https://kknews.cc/history/xqebla8.html","d":"2026-09-20"}]},"8-250":{"w":"漢代時期，佛教自天竺（古代對印度的稱呼）透過絲綢之路傳入中國。漢武帝時張騫出使西域，打通了漢朝至中亞的通路。到漢明帝時期，派人至西域求取佛法，在大月氏國遇到天竺僧人迦葉摩騰和竺法蘭。佛教沿絲路逐漸傳入中國內地，敦煌莫高窟、克孜爾千佛洞等成為見證。","m":"絲路傳來天竺法，中華文明百花盛。","n":"","v":1,"src":[{"t":"人民政協網：\"一带一路\"历史上的佛教传播发布","u":"https://www.rmzxw.com.cn/c/2017-05-04/1517748.shtml?n2m=1","d":"2017-05-04"},{"t":"維基百科：汉传佛教 - 维基百科，自由的百科全书","u":"https://zh.wikipedia.org/wiki/%E6%B1%89%E4%BC%A0%E4%BD%9B%E6%95%99","d":"2026-09-20"}]},"8-251":{"o":["記錄官方文件","盛裝食物","儲存水源"],"x":["用作檔案記錄工具，非盥洗用器","作為食器盛載食物","作為大型儲水容器"],"w":"銅匜是西周時期的青銅盥洗器具，形似一把勺子，前有流嘴，後有鋬柄。配合銅盤使用，用於貴族進行沃盥之禮——盥洗雙手，體現了古代社會對禮儀的重視。","m":"銅匜配銅盤，沃盥講禮儀。","n":"","v":1,"src":[{"t":"人民網：青銅盤匜 沃盥之禮(文物有話說·青銅水器)","u":"http://hb.people.com.cn/BIG5/n2/2020/1003/c194063-34332184.html","d":"2020-10-03"}]},"8-252":{"o":["開元通寶","五銖錢","白鹿皮幣"],"x":["唐代才出現的貨幣","西漢官方統一發行的貨幣","漢武帝時期用作交易的特殊貨幣"],"w":"秦始皇統一六國後，廢除各地不同形制的貨幣，規定採用圓形有方孔的半兩錢作為全國唯一流通貨幣，確立了中國古代貨幣的基本形態，標誌著秦朝經濟的統一。","m":"秦統一度量衡，圓孔半兩是規範。","n":"","v":1,"src":[{"t":"中國文化研究院：為何秦朝半兩錢影響中國兩千年？","u":"https://chiculture.org.hk/tc/china-five-thousand-years/871","d":"2023-02-01"}]},"8-253":{"o":["半兩錢","開元通寶","白鹿皮幣"],"x":["秦代統一流通的貨幣","唐朝才開始使用的貨幣","漢武帝時期貴族使用的特殊幣種"],"w":"西漢漢武帝元狩五年（前118年）頒布五銖錢為官方統一發行的貨幣，由中央的上林三官負責鑄造。五銖錢大小輕重適中，易於流通，使用時間長達700多年，成為中國貨幣史上使用時間最長的鑄幣。","m":"五銖錢輕重剛好，漢代最重要。","n":"","v":1,"src":[{"t":"星島教室：兩漢貨幣——五銖錢的確立","u":"https://www.stheadline.com/knowledge/3329062/%E5%85%A9%E6%BC%A2%E8%B2%A8%E5%B9%A3%E4%BA%94%E9%8A%96%E9%8C%A2%E7%9A%84%E7%A2%BA%E7%AB%8B%E6%98%9F%E5%B3%B0%E6%95%99%E5%AE%A4","d":"2024-07-01"}]},"8-254":{"o":["分封制","郡國併行制","民主共和制"],"x":["春秋戰國分諸侯統治各地","漢初採用郡國並行的制度","人民參與決策的制度"],"w":"秦朝以中央集權制管治國家，秦始皇創建皇帝制度，設置丞相、御史大夫等中央官位，取消分封制，改為郡縣制。這套制度集軍政大權於皇帝一身，實現了前所未有的高度中央集權，奠定了中國古代政治制度的基礎。","m":"秦朝不分封，中央權力集中全。","n":"","v":1,"src":[{"t":"維基百科：秦朝","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E6%9C%9D","d":"2025-01-15"}]},"8-255":{"o":["孤","寡人","本人"],"x":["先秦諸侯對自己的通稱","先秦貴族謙稱自己的詞語","平民百姓的自稱"],"w":"秦始皇統一天下後，定立皇帝專用稱號，其中「朕」被規定為皇帝自稱的專用詞彙。在秦朝之前，先秦時期的君主和平民都可以自稱「朕」，但秦始皇之後，「朕」成為了皇帝的專用代稱，平民若敢自稱「朕」則會被判死罪。","m":"秦始皇獨佔朕，皇帝專用稱號。","n":"","v":1,"src":[{"t":"中國新聞網：先秦以前平民百姓曾自稱「朕」 秦朝成皇帝專用","u":"https://www.chinanews.com.cn/m/cul/2015/11-18/7629783.shtml","d":"2015-11-18"}]},"8-256":{"o":["陝西省","河南省","山西省"],"x":["位置是陝西省，不是河南","位置是陝西省，不是山西","確實在陝西省，無誤"],"w":"秦始皇陵及兵馬俑坑位於中國陝西省西安市臨潼區，東距西安30公里。秦始皇陵及兵馬俑於1987年被聯合國教科文組織列入世界文化遺產名錄。兵馬俑是秦始皇陪葬坑，共8,000多尊陶俑，規模浩大，是中國古代藝術和工程技術的傑出代表。","m":"秦始皇陵在陝西，兵馬俑護衞千古帝王。","n":"","v":1,"src":[{"t":"世界遺產網：秦の始皇陵（秦始皇帝陵及び兵馬俑坑）","u":"https://world-heritage.net/first-qin-emperor/","d":"2024-09-01"}]},"8-257":{"o":["李斯","張儀","蘇秦"],"x":["秦的右相，但未推行變法","戰國時期的説客，非秦相","戰國時期的説客，非秦相"],"w":"秦孝公於前361年任命商鞅進行變法。商鞅推行一系列改革，包括廢除貴族世襲特權、建立軍功爵制、私有土地所有制、重農抑商等政策。這些變法使秦國國力大幅增強，人民安居樂業，軍隊威力大增，為秦國日後統一六國奠定了堅實基礎。","m":"商鞅變法強秦國，奠定統一基石。","n":"","v":1,"src":[{"t":"明網：秦孝公任用年輕商鞅變法","u":"https://topics.gmw.cn/2011-03/16/content_1724710.htm","d":"2011-03-16"}]},"8-258":{"o":["禪讓制","民選制","選舉制"],"x":["古代聖賢相傳的制度，秦朝未採用","民主制度，秦代不存在","競選制度，古代中國不存在"],"w":"秦朝奉行世襲制度，即皇帝之位由皇帝的兒子或指定的後代繼承。秦始皇作為開國皇帝，其子秦二世胡亥繼承皇位，雖然秦朝僅存15年便滅亡，但世襲制確立了中國古代王朝的基本君主傳承方式。","m":"世襲制傳帝位，父死子繼天下。","n":"","v":1,"src":[{"t":"維基百科：秦朝","u":"https://zh.wikipedia.org/zh-tw/%E7%A7%A6%E6%9C%9D","d":"2025-01-15"}]},"8-259":{"o":["漢文帝","漢景帝","漢昭帝"],"x":["文帝時期郡國仍有鑄幣權","景帝時期未完成中央統一鑄幣","昭帝登基時仍未有此措施"],"w":"漢武帝為加強中央集權，於元狩五年（前118年）下令收回鑄幣權，禁止郡國和民間私自鑄錢。違者以死罪論處。此舉確保了官方貨幣的統一，防止了私鑄亂幣對經濟的破壞，加強了皇帝對經濟命脈的掌控。","m":"漢武帝收鑄幣權，民間不敢私鑄錢。","n":"","v":1,"src":[{"t":"維基百科：漢武帝幣制改革","u":"https://zh.wikipedia.org/zh-hant/%E6%B1%82%E6%AD%A6%E5%B8%9D%E5%B8%81%E5%88%B6%E6%94%B9%E9%9D%A9","d":"2024-06-01"}]},"8-260":{"o":["洛陽","長安","鹹陽"],"x":["漢高祖初定都在長安，非洛陽","漢高祖初定都在洛陽，後遷長安","秦代首都，漢代未定都於此"],"w":"漢高祖劉邦建立漢朝初期定都洛陽，因為洛陽原為東周首都，經過戰亂後基本完整。但謀臣張良勸阻，認為洛陽四通八達，易被敵軍從四方進攻，地勢不利。劉邦最終採納建議，遷都關中的長安，充分利用其險要地勢和充足資源，鞏固了西漢政權。","m":"高祖初洛陽，張良勸遷長安。","n":"","v":1,"src":[{"t":"中時新聞網：劉邦想定都洛陽 小兵直諫「漢朝必亡」","u":"https://www.chinatimes.com/hottopic/20260725001767-260812","d":"2026-07-25"}]},"8-261":{"o":["14年","20年","25年"],"x":["秦朝存在15年，不是14年","秦朝存在15年，不是20年","秦朝存在15年，不是25年"],"w":"秦朝自公元前221年秦始皇統一六國建立至公元前207年滅亡，國祚共15年。雖然時間短暫，但秦朝結束了春秋戰國五百年來的分裂局面，建立了中國第一個大一統的中央集權國家，對後世中國的政治制度產生了深遠影響。","m":"秦朝只有十五年，短暫但影響深遠。","n":"。","v":1,"src":[{"t":"中國文化研究院：秦朝的經濟措施","u":"https://chiculture.org.hk/tc/china-five-thousand-years/460","d":"2026-09-20"}]},"8-262":{"o":["鮮卑","羌族","吐蕃"],"x":["王昭君和親是匈奴，不是鮮卑","王昭君和親是匈奴，不是羌族","王昭君和親是匈奴，不是吐蕃"],"w":"漢元帝竟寧元年（前33年），匈奴呼韓邪單於入朝請求漢與匈奴和親。漢元帝以後宮良家子王昭君賜予匈奴，王昭君出塞和親，嫁給呼韓邪單於。此舉幫助匈奴統一內部，邊疆因此安寧，漢匈民族交流增進，避免了戰亂。","m":"王昭君出塞和匈奴，邊疆從此得安寧。","n":"","v":1,"src":[{"t":"維基百科：王昭君","u":"https://zh.wikipedia.org/zh-tw/%E7%8E%8B%E6%98%AD%E5%90%9B","d":"2024-09-01"}]},"8-263":{"o":["道教","法家","墨家"],"x":["漢武帝推崇儒學，非道教","秦朝才推行法家獨尊","儒學與墨家目標不同"],"w":"漢武帝為加強中央集權，推崇儒學為統治思想。元朔五年（前124年），漢武帝建立太學，培養儒家人才，設立五經博士（易、書、詩、禮、春秋）等職位。儒家思想強調忠君愛國、禮儀綱常，符合皇帝加強統治的需要，因此成為漢代官方意識形態的基礎。","m":"漢武帝尊儒術，立太學育人才。","n":"","v":1,"src":[{"t":"維基百科：獨尊儒術","u":"https://zh.wikipedia.org/zh-tw/%E7%8B%AC%E5%B0%8A%E5%84%92%E6%9C%AF","d":"2024-09-01"}]},"8-264":{"o":["秦二世","秦始皇","秦莊襄王"],"x":["焚書坑儒是秦二世時發生","焚書坑儒確實是秦始皇時發生","秦莊襄王已死去無法下令"],"w":"焚書坑儒事件發生在秦始皇統治時期，約在公元前213年至前212年間。秦始皇為加強思想統制，下令焚毀秦國以外各地的史書和諸子百家的典籍，特別是儒家經典。其後因術士侯生、盧生散佈誹謗言論，秦始皇憤怒，下令坑殺四百多名涉案人員。這一事件反映了秦朝的專制統治。","m":"秦始皇焚書坑儒，思想要統制。","n":"","v":1,"src":[{"t":"維基百科（繁體）：焚書坑儒","u":"https://zh.wikipedia.org/zh-tw/%E7%84%9A%E4%B9%A6%E5%9D%91%E5%84%92","d":"2024-09-01"}]},"8-265":{"o":["軍事","政治","宗教"],"x":["太學是學術教育機構，不是軍事訓練所","太學是學術教育機構，不是政治權力中心","太學是官方教育機構，不是宗教場所"],"w":"漢武帝設立的太學是中國第一所官方最高學府，屬於學術教育機構。太學設有五經博士，教授儒家經典，培養國家所需的文官人才。學生達到最高時超過30,000人，太學的建立標誌著中國古代官辦高等教育的開始，對後世教育制度的發展產生深遠影響。","m":"太學是高等學府，儒家人才培養地。","n":"","v":1,"src":[{"t":"北京日報：漢武帝在長安建立太學，太學生們的學習生活是啥樣的？","u":"https://news.bjd.com.cn/2023/08/30/10547000.shtml","d":"2023-08-30"}]},"8-266":{"o":["蔡倫","王充","許衡"],"x":["蔡倫改良了造紙術，非地動儀","王充是哲學家，非發明家","許衡是元朝人，年代不符"],"w":"候風地動儀由東漢科學家張衡於公元132年發明製造，是世界上第一台地震監測儀器。儀器形如酒甕，內部有鞏柱可向八個方向傾側，外設八條龍各口含銅丸。地震發生時，龍口打開釋放銅丸，據此可判斷地震方向。公元134年，隴西地震時儀器成功檢測到，證實了其有效性。","m":"張衡地動儀，八龍測地震。","n":"","v":1,"src":[{"t":"維基百科：候風地動儀","u":"https://zh.wikipedia.org/wiki/%E5%80%99%E9%A2%A8%E5%9C%B0%E5%8B%95%E5%84%80","d":"2024-09-01"}]},"8-267":{"o":["西漢","新莽","東漢"],"x":["蔡倫是西漢宦官，但改良造紙在東漢","新莽是過渡朝代，無此人才","蔡倫確實是東漢時期的宦官"],"w":"蔡倫（63年-121年）是東漢時期的宦官，擔任尚方令一職，監督宮廷物品製作。他利用樹皮、破布、麻頭、魚網等廢棄物為原料，改良了造紙技術，於公元105年向皇帝奏報，大量生產「蔡侯紙」。該紙平滑光潔、適宜書寫、成本低廉，推動了紙張的廣泛應用，對人類文明傳播產生深遠影響。","m":"蔡倫東漢改造紙，廢料變紙張。","n":"","v":1,"src":[{"t":"中國文化研究院：蔡倫造紙名載史冊","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1323","d":"2023-06-01"}]},"8-268":{"o":["三次","一次","兩次"],"x":["張騫出使西域共兩次，不是三次","張騫出使西域共兩次，不是一次","張騫確實出使西域兩次"],"w":"漢武帝派遣張騫出使西域共兩次。第一次從公元前139年至前126年，歷時13年，目的是與大月氏聯合對抗匈奴。第二次從公元前119年至前115年，張騫率領規模更大的使團，分遣副使訪問多國。這兩次出使開拓了漢代與西域的聯繫，是開闢絲綢之路的關鍵。","m":"張騫出使西域兩度，開啟絲綢路。","n":"","v":1,"src":[{"t":"教育局教育多媒體：張騫第二次出使西域","u":"https://emm.edcity.hk/media/1_fwvkzuvh","d":"2024-09-01"}]},"8-269":{"o":["璧","璽","玦"],"x":["璧是圓形玉器，非印章","璽確實是天子印章","玦是佩帶飾物，非印章"],"w":"天子專用的印章稱為「璽」，製作精美的玉璽稱為「玉璽」。秦漢以後，皇帝一般擁有多枚璽，如「皇帝行璽」用於賞賜、「皇帝信璽」用於調兵遣將等。最著名的是「傳國玉璽」，由秦始皇命人從和氏璧雕刻而成，刻有「受命於天，既壽永昌」八字，象徵皇權至高無上。","m":"璽是天子印，皇權象徵牢。","n":"","v":1,"src":[{"t":"維基百科：傳國璽","u":"https://zh.wikipedia.org/wiki/%E4%BC%A0%E5%9B%BD%E7%8E%BA","d":"2024-09-01"}]},"8-270":{"o":["李廣","衞青","霍去病"],"x":["李廣是善於防守的邊將，無重大勝利","衞青是漢武帝時期名將，但霍去病更年輕且更著名","霍去病確實由漢武帝任命並取得大勝"],"w":"霍去病是漢武帝時期的著名將軍，年少時即展露軍事才華。元狩二年（前121年），漢武帝任命他為驃騎將軍，發動河西戰役，霍去病率軍深入敵境千里以上，在皋藍山殲滅敵軍近9,000人；夏季又攻佔祁連山，殲敵3萬多人。22歲時率軍漠北作戰，直至瀚海，徹底打敗匈奴主力。","m":"霍去病少年戰神，匈奴聞風喪膽。","n":"","v":1,"src":[{"t":"維基百科：霍去病","u":"https://zh.wikipedia.org/zh-tw/%E9%9C%8D%E5%8E%BB%E7%97%85","d":"2024-09-01"}]},"8-271":{"o":["玻璃製品","陶瓷器皿","絲綢布料"],"x":["玻璃製品主要由羅馬帝國出口","陶瓷器皿是漢代中國主要出口品","絲綢才是秦漢時期的主要出口品，非進口品"],"w":"秦漢時期，隨著陸上絲綢之路的開闢，西域及中亞地區的香料大量傳入中國，其中乳香是最重要的進口貨品。乳香產自紅海沿岸（今葉門地區），不僅用於祭祀和日常生活，更被納入中原醫藥體系，梁代醫家陶弘景曾記載乳香的藥用功效。","m":"進口乳香香氣濃，西域古道漢皇城。","n":"乳香除外，秦漢進口品還包括龍腦香、沉香、安息香等各類香料及琉璃、寶石等奢侈品。","v":1,"src":[{"t":"中國文化研究院：絲綢之路的由來","u":"https://chiculture.org.hk/tc/china-five-thousand-years/268","d":"2024-09-20"},{"t":"人民網：海上絲綢之路上的貿易品往來","u":"http://culture.people.com.cn/BIG5/n/2014/0818/c87423-25487057.html","d":"2014-08-18"}]},"8-272":{"o":["陶瓷器","香料","玻璃製品"],"x":["陶瓷器是唐宋時期的主要出口品","香料是進口品而非出口品","玻璃製品來自西方而非中國出口"],"w":"秦漢時期，絲綢是經絲綢之路西運的最具代表性貨物，因此這條貿易道路被稱為「絲綢之路」。中國的絲綢製品以其精湛的工藝在西方備受推崇，成為中原文明向西方傳播的重要載體，也是中國對外貿易中最重要的商品。","m":"絲路名稱由絲綢起，漢代華貿天下知。","n":"除絲綢外，秦漢時期還出口瓷器、茶葉等產品，但絲綢最具代表性。","v":1,"src":[{"t":"中國文化研究院：絲綢之路的由來","u":"https://chiculture.org.hk/tc/china-five-thousand-years/268","d":"2024-09-20"},{"t":"維基百科：絲綢之路","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%9D%E7%BB%B8%E4%B9%8B%E8%B7%AF","d":"2024-09-20"}]},"8-273":{"o":["東甌國","閩越國","西南國"],"x":["東甌國位於今福建沿海，非嶺南地區","閩越國亦在福建，與嶺南無關","西南國並非秦末嶺南的重要政權"],"w":"秦亡後，秦將趙佗於約前203年兼併嶺南三郡（南海、桂林、象郡），建立南越國。趙佗先後與漢初政權和談，最終於漢武帝時期歸順西漢。南越國成為中原文化與南方文化融合的重要政體，其故都番禺（今廣州）成為當時的嶺南政治中心。","m":"趙佗兼三郡，南越國建立是秦亡後。","n":"趙佗原為秦朝南海郡的郡尉，秦末大亂時趁機建立獨立政權。","v":1,"src":[{"t":"史記電子化計劃：南越列傳","u":"https://ctext.org/shiji/nan-yue-lie-zhuan/zh","d":"2024-09-20"},{"t":"中新網：秦將趙佗傳","u":"https://www.chinanews.com.cn/cul/2013/12-17/5628400.shtml","d":"2013-12-17"}]},"8-274":{"o":["西漢","秦代","三國"],"x":["西漢時期香港屬番禺，但李鄭屋漢墓建於東漢","秦代尚未有成規模的漢墓","三國已是東漢之後，時代過晚"],"w":"李鄭屋漢墓於1955年香港興建李鄭屋邨期間發現，考古證據表明其建造年代為東漢時期（公元25-220年）。該墓為磚砌結構，由前、後、左、右四個墓室及羨道組成，出土陶器五十件及青銅器八件，是香港現存最古老的法定古蹟。","m":"李鄭屋墓東漢建，五五年間深水埗現。","n":"墓磚上刻有「大吉番禺」等字樣，證明當時香港屬番禺縣管轄。","v":1,"src":[{"t":"香港歷史博物館：李鄭屋漢墓","u":"https://hk.history.museum/tc/web/mh/about-us/lei-cheng-uk-han-tomb.html","d":"2024-09-20"},{"t":"古物古蹟辦事處：香港法定古蹟","u":"https://www.amo.gov.hk/tc/historic-buildings/monuments/kowloon/monuments_35/index.html","d":"2024-09-20"}]},"8-275":{"o":["韓信","劉邦","李廣"],"x":["韓信雖英勇善戰但未有破釜沉舟的故事","劉邦為項羽對手而非破釜沉舟的主角","李廣是漢代名將但無此典故"],"w":"項羽於前207年為救困於鉅鹿的趙王，率軍渡漳河後下令砸碎釜鍋、鑿沉舟船，全軍只攜三日乾糧，表示自絕後路、必死無退，以激勵士卒拼死作戰。最終項羽軍隊以少勝多，擊敗秦軍主力，此舉成為後世鼓勵在絕境中奮力前進的經典範例。","m":"項羽破釜沉舟，必死心決戰秦軍。","n":"此戰稱為鉅鹿之戰，項羽因此聲名遠揚，諸侯都歸其統率。","v":1,"src":[{"t":"教育部《成語典》：破釜沉舟","u":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=10395&webMd=2&la=0","d":"2024-09-20"},{"t":"維基百科：鉅鹿之戰","u":"https://zh.wikipedia.org/zh-hk/%E5%B7%A8%E9%B9%BF%E4%B9%8B%E6%88%98","d":"2024-09-20"}]},"8-276":{"o":["普通民眾","軍人","奴隸"],"x":["普通民眾難以擁有如此規模的精美墓穴","軍人身份無法解釋墓中的官方標誌","奴隸不可能有如此高規格的埋葬"],"w":"李鄭屋漢墓出土文物精美，墓室規模宏大，墓磚上刻有「大吉番禺」等文字，表明墓主身份應該是當時的貴族、官員或富裕商人。根據墓中出土的器物種類和工藝水平，推測墓主可能是掌管鹽業或其他重要商業的商人，亦或是南海郡的地方官員。","m":"番禺大治刻墓磚，官商身份顯尊貴。","n":"墓中未發現骸骨，墓主具體身份至今仍未確定，是香港考古的謎團。","v":1,"src":[{"t":"香港歷史博物館：李鄭屋漢墓博物館","u":"https://hk.history.museum/tc/web/mh/about-us/lei-cheng-uk-han-tomb-museum.html","d":"2024-09-20"},{"t":"中國政府網：李鄭屋漢墓揭示香港兩千年前的身份","u":"http://big5.locpg.gov.cn/jsdt/2023-09/28/c_1212278022.htm","d":"2023-09-28"}]},"8-277":{"o":["南海郡的廣州縣","桂林郡的嶺山縣","象郡的貴林縣"],"x":["廣州縣是後代地名，漢代不存在","嶺山縣屬於桂林郡而非南海郡","貴林縣在象郡西部，非漢代香港所屬"],"w":"漢代香港地區屬南海郡管轄，其具體歸屬為番禺縣。番禺是南海郡的首縣，也是郡治所在地（今廣州市），其管轄範圍包括今廣州、佛山、東莞、中山、珠海、深圳、香港、澳門等地區。李鄭屋漢墓出土的墓磚上刻有「番禺」字樣，直接證明瞭香港自漢代起即屬番禺縣。","m":"番禺縣管香港地，海郡首治在南疆。","n":"秦代秦始皇平定百越後建立南海郡，香港從此納入中原行政體系。","v":1,"src":[{"t":"維基百科：番禺縣","u":"https://zh.wikipedia.org/zh-hk/%E7%95%AA%E7%A6%BA%E7%B8%A3","d":"2024-09-20"},{"t":"中國文化研究院：秦朝南海郡香港納入","u":"https://chiculture.org.hk/sites/mainsite/files/2020-09/History%20scripts_01.pdf","d":"2020-09-20"}]},"8-278":{"o":["8月15日","9月2日","8月30日"],"x":["8月15日是日本宣布投降日，非中國官方紀念日期","9月2日是正式簽署投降書日期，但中國紀念日定為9月3日","8月30日無重要歷史意義"],"w":"2014年，中國全國人大常委會以立法形式確定每年9月3日為中國人民抗日戰爭勝利紀念日。選定9月3日的原因是1945年9月2日日本政府正式簽署無條件投降書，9月3日被定為中國官方紀念日期，以銘記十四年抗日戰爭的最終勝利。","m":"九三勝利日，日本投降翌日定。","n":"日本於8月15日宣布無條件投降，但正式簽署投降書在9月2日。","v":1,"src":[{"t":"當代中國：中國人民抗日戰爭勝利紀念日","u":"https://www.ourchinastory.com/zh/6714/%E4%B8%AD%E5%9C%8B%E4%BA%BA%E6%B0%91%E6%8A%97%E6%97%A5%E6%88%B0%E7%88%AD%E5%8B%9D%E5%88%A9%E7%B4%80%E5%BF%B5%E6%97%A5","d":"2024-09-20"},{"t":"維基百科：中國人民抗日戰爭勝利紀念日","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%AD%E5%9C%8B%E4%BA%BA%E6%B0%91%E6%8A%97%E6%97%A5%E6%88%B0%E7%88%AD%E5%8B%9D%E5%88%A9%E7%B4%80%E5%BF%B5%E6%97%A5","d":"2024-09-20"}]},"8-279":{"o":["盧溝橋事變","淞滬會戰","徐州會戰"],"x":["盧溝橋事變是抗戰開始而非勝利象徵","淞滬會戰規模大但未打破日軍神話","徐州會戰是戰術性戰役，打破神話應歸平型關"],"w":"1937年9月25日，八路軍115師在山西平型關伏擊日本第5師團的運輸隊，殲敵1000餘人。這是全面抗戰開始後中國軍隊首次大規模戰鬥勝利，打破了侵華日軍「不可戰勝」的神話，鼓舞了全國軍民抗戰信心，也提升了共產黨領導的八路軍在全國的威望。","m":"平型關首勝破神話，八路軍名揚天下。","n":"此戰役後，抗戰進入全面對抗階段，國民黨與共產黨更加緊密合作。","v":1,"src":[{"t":"中新網：平型關大捷打破日軍不可戰勝的神話","u":"https://www.chinanews.com.cn/m/ll/2015/08-24/7484901.shtml","d":"2015-08-24"},{"t":"人民日報：平型關大捷的歷史真相","u":"https://paper.people.com.cn/rmwz/html/2012-10/01/content_1137112.htm","d":"2012-10-01"}]},"8-280":{"o":["平型關大捷","淞滬會戰","徐州會戰"],"x":["平型關大捷雖為首勝但規模遠小於百團大戰","淞滬會戰是國民黨主力戰役而非八路軍主動出擊","徐州會戰規模不如百團大戰"],"w":"百團大戰是1940年8月至1941年1月間，八路軍在彭德懷指揮下對日軍發動的最大規模戰役。參戰兵力達105個團20餘萬人，在華北地區對日軍進行全面攻勢，共進行1800餘次戰鬥，攻克2900多據點，殲敵45000餘人，是中國軍隊主動出擊日軍的最大規模戰役。","m":"百團大戰最大規，彭德懷指揮一百五。","n":"百團大戰包括正太鐵路、同蒲鐵路等多條重點突擊線路，持續時間長達5個月。","v":1,"src":[{"t":"維基百科：百團大戰","u":"https://zh.wikipedia.org/zh-tw/%E7%99%BE%E5%9B%A2%E5%A4%A7%E6%88%98","d":"2024-09-20"},{"t":"中國文化研究院：百團大戰","u":"https://chiculture.org.hk/tc/photo-story/3240","d":"2024-09-20"}]},"8-281":{"o":["1936年","1938年","1939年"],"x":["1936年尚在全面抗戰前","1938年已是大屠殺之後","1939年時間更晚"],"w":"南京大屠殺發生於1937年12月13日。日軍佔領南京後，對中國平民和戰俘進行了長達6周以上的大規模屠殺，持續至1938年2月。據遠東國際軍事法庭和南京軍事法庭認定，此次屠殺造成20萬以上至30萬中國人遇難，是世界歷史上最為慘烈的暴行之一。","m":"南京淪陷三七年，十二月十三屠殺開。","n":"日軍在佔領南京期間還實施了大規模的強姦、縱火和搶劫，三分之一的建築被焚毀。","v":1,"src":[{"t":"維基百科：南京大屠殺","u":"https://zh.wikipedia.org/zh-tw/%E5%8D%97%E4%BA%AC%E5%A4%A7%E5%B1%A0%E6%AE%BA","d":"2024-09-20"},{"t":"中國文化研究院：南京大屠殺","u":"https://chiculture.org.hk/tc/photo-story/3236","d":"2024-09-20"}]},"8-282":{"o":["朱德","劉伯承","林彪"],"x":["朱德為八路軍總司令而非百團大戰直接指揮者","劉伯承為129師師長但指揮權屬於彭德懷","林彪在華北戰場角色有限"],"w":"彭德懷是百團大戰的主要指揮官，時任八路軍副總司令。他聯合晉察冀軍區、第120師和第129師等部隊，於1940年8月20日至1941年1月24日期間，對日軍發動了這場歷史上規模最大的敵後抗日戰役，成為中國軍隊主動出擊日軍的光輝範例。","m":"彭德懷指揮百團戰，五個月內殲敵四萬五。","n":"彭德懷因領導百團大戰而獲得國務院頒發的八一勳章。","v":1,"src":[{"t":"共產黨員網：百年瞬間百團大戰","u":"https://www.12371.cn/2021/04/14/VIDE1618356240545429.shtml","d":"2021-04-14"},{"t":"維基百科：百團大戰","u":"https://zh.wikipedia.org/zh-tw/%E7%99%BE%E5%9B%A2%E5%A4%A7%E6%88%98","d":"2024-09-20"}]},"8-283":{"o":["8月14日","9月1日","8月20日"],"x":["8月14日是投降前夜而非正式宣布","9月1日無重要歷史意義","8月20日超出投降日期"],"w":"1945年8月15日正午，日本天皇裕仁親自宣讀《終戰詔書》，向全國宣布無條件投降。此後，9月2日日本政府首腦在停泊東京灣的密蘇里號上正式簽署投降文書，標誌著第二次世界大戰的全面終結和中國抗日戰爭的最終勝利。","m":"八月十五天皇詔，日本投降成定局。","n":"美國於8月6日和9日分別向廣島、長崎投下原子彈，加速了日本的投降決定。","v":1,"src":[{"t":"維基百科：日本投降","u":"https://zh.wikipedia.org/zh-cn/%E6%97%A5%E6%9C%AC%E6%8A%95%E9%99%8D","d":"2024-09-20"},{"t":"新華網：日本宣布無條件投降","u":"https://www.news.cn/20250815/820b7ebdcbbd4ebd857f883e7ddcdfc3/c.html","d":"2025-08-15"}]},"8-284":{"o":["13年","15年","12年"],"x":["13年計算錯誤","15年超過實際抗戰年限","12年計算不足"],"w":"1931年9月18日的九一八事變標誌著日本全面侵華的開始。從1931年9月至1945年9月，中國人民進行了長達14年的抗日戰爭。其中1931至1937年為局部抗戰時期，1937年7月盧溝橋事變後進入全面抗戰時期，直至1945年日本無條件投降。","m":"九一八到四五年，十四年抗戰淚和血。","n":"中國官方將抗戰分為兩個階段：局部抗戰（1931-1937）和全面抗戰（1937-1945），合計14年。","v":1,"src":[{"t":"共產黨員網：九一八事變","u":"https://www.12371.cn/2021/09/18/VIDE1631920082122390.shtml","d":"2021-09-18"},{"t":"當代中國：抗日戰爭是8年還是14年","u":"https://www.ourchinastory.com/zh/14855/%E6%8A%97%E6%88%B0%E5%8B%9D%E5%88%A980%E5%91%A8%E5%B9%B4%EF%BD%9C%E6%8A%97%E6%97%A5%E6%88%B0%E7%88%AD%E6%98%AF8%E5%B9%B4%E9%82%84%E6%98%AF14%E5%B9%B4%EF%BC%9F","d":"2024-09-20"}]},"8-285":{"o":["12月10日","12月15日","1月13日"],"x":["12月10日提前三天","12月15日遲後兩天","1月13日相隔一個月"],"w":"2014年2月27日，第十二屆全國人大常委會第七次會議以國家立法的形式通過決議，確定每年12月13日為南京大屠殺死難者國家公祭日。此日期是為紀念1937年12月13日南京遭日軍佔領後發生的大屠殺，公祭對象擴展到日本帝國主義侵華期間的所有死難者。","m":"十二月十三祭難者，國家公祭憶歷史。","n":"公祭日包括七類遇難對象：南京大屠殺死難者、化學武器死難者、細菌戰死難者、勞工死難者、慰安婦死難者、三光作戰死難者、無差別轟炸死難者。","v":1,"src":[{"t":"百度百科：南京大屠殺死難者國家公祭日","u":"https://baike.baidu.com/item/%E5%8D%97%E4%BA%AC%E5%A4%A7%E5%B1%A0%E6%9D%80%E6%AD%BB%E9%9A%BE%E8%80%85%E5%9B%BD%E5%AE%B6%E5%85%AC%E7%A5%AD%E6%97%A5/13131127","d":"2024-09-20"},{"t":"維基百科：南京大屠殺死難者國家公祭日","u":"https://zh.wikipedia.org/zh-hans/%E5%8D%97%E4%BA%AC%E5%A4%A7%E5%B1%A0%E6%9D%80%E6%AD%BB%E9%9A%BE%E8%80%85%E5%9B%BD%E5%AE%B6%E5%85%AC%E7%A5%AD%E6%97%A5","d":"2024-09-20"}]},"8-286":{"o":["波茨坦宣言","雅爾達會議決議","聯合國家宣言"],"x":["波茨坦宣言確實涉及日本領土但未明確提及台灣返還","雅爾達會議主要涉及歐洲和蘇聯參戰，未涉及日本領土","聯合國家宣言是反法西斯同盟宣言，未涉及領土分配"],"w":"1943年11月22日至26日，中美英三國領袖在埃及開羅舉行會議，於12月1日公布《開羅宣言》。宣言明確規定：日本竊取於中國的領土，例如滿洲（東北四省）、台灣、澎湖列島等地必須無條件歸還給中華民國，日本通過武力攫取的土地亦應被驅逐出境。","m":"開羅宣言四三年，東北台灣必歸還。","n":"《開羅宣言》後來得到1945年雅爾達會議和波茨坦宣言的重申和確認。","v":1,"src":[{"t":"中國外交部：開羅宣言","u":"https://www.mfa.gov.cn/web/ziliao_674904/zt_674979/dnzt_674981/qtzt/twwt/zylswj/202206/t20220606_10699034.html","d":"2022-06-06"},{"t":"維基百科：開羅宣言","u":"https://zh.wikipedia.org/wiki/%E5%BC%80%E7%BD%97%E5%AE%A3%E8%A8%80","d":"2024-09-20"}]},"8-287":{"o":["西方主戰場","北非主戰場","太平洋主戰場"],"x":["西方主戰場主要指歐洲戰場，由蘇聯和西方盟國負責","北非主戰場規模遠小於中國戰場","太平洋主戰場主要是美國與日本海軍作戰"],"w":"1942年1月，中、美、英、蘇等26國在華盛頓簽署《聯合國家宣言》，正式形成國際反法西斯統一戰線。在世界反法西斯戰爭中，中國戰場承擔著抗擊日本陸軍主力的重任，是世界反法西斯戰爭的東方主戰場。中國的抗日戰爭吸引和牽制了日本陸軍的主力部隊，對世界反法西斯戰爭的勝利作出了重大貢獻。","m":"東方主戰場在中國，抗擊日軍牽制其力。","n":"中國戰場從1937年至1945年共消耗日軍大量人力物資，是世界反法西斯戰爭中最重要的東方戰場。","v":1,"src":[{"t":"新華網：世界反法西斯戰爭東方主戰場的偉大貢獻","u":"https://www.news.cn/politics/20250905/4490cdac7d4f437e80e29c9ca470b6b7/c.html","d":"2025-09-05"},{"t":"維基百科：聯合國家宣言","u":"https://zh.wikipedia.org/zh-hans/%E8%81%94%E5%90%88%E5%9B%BD%E5%AE%B6%E5%AE%A3%E8%A8%80","d":"2024-09-20"}]},"8-288":{"o":["孫立人","薛岳","馮玉祥"],"x":["孫立人在印度戰場而非棗宜會戰","薛岳主要活動於南方戰場","馮玉祥在豫北地區，未參與棗宜會戰"],"w":"1940年5月，中日雙方在棗陽、襄陽、宜昌地區進行棗宜會戰。第33集團軍總司令張自忠率部東渡襄河阻擊日軍，於5月16日下午壯烈殉國。周恩來高度評價他，稱其「忠義之志，壯烈之氣，直可以為中國抗戰軍人之魂」。張自忠是民族英雄，其犧牲激勵了全國軍民繼續抗戰。","m":"張自忠五月棗宜戰，壯烈殉國名永傳。","n":"張自忠身中七彈而犧牲，其遺體由十萬民眾護送回重慶，被尊為民族英雄。","v":1,"src":[{"t":"共產黨員網：張自忠力戰而死無愧民族","u":"https://www.12371.cn/2018/12/07/ARTI1544139070347320.shtml","d":"2018-12-07"},{"t":"當代中國：400將領殉國力戰而死無愧國家民族","u":"https://www.ourchinastory.com/zh/15062/%E6%8A%97%E6%88%B0%E5%8B%9D%E5%88%A980%E5%91%A8%E5%B9%B4%EF%BD%9C400%E5%B0%87%E9%A0%86%E6%AE%89%E5%9C%8B-%E5%8A%9B%E6%88%B0%E8%80%8C%E6%AD%BB-%E7%84%A1%E6%84%A7%E5%9C%8B%E5%AE%B6%E6%B0%91%E6%97%8F","d":"2024-09-20"}]},"8-289":{"o":["20萬以上","15萬以上","25萬以上"],"x":["20萬是國際法庭最低估計，題目答案為30萬以上","15萬數字過低","25萬數字介於兩者之間"],"w":"南京大屠殺是日本軍隊於1937年12月13日至1938年2月間對南京平民和戰俘進行的大規模屠殺。根據遠東國際軍事法庭和南京軍事法庭的調查與判決，日軍共殺害約30萬以上中國人，包括軍人和平民。其中第一個月內約有2萬中國婦女遭日軍姦殺，南京城三分之一的建築被焚毀。","m":"南京大屠三十萬，血淚史冊永不忘。","n":"遠東國際軍事法庭認定20萬以上，但中國官方認定30萬以上，體現國仇家恨的沉痛記憶。","v":1,"src":[{"t":"維基百科：南京大屠殺的死亡人數","u":"https://zh.wikipedia.org/zh-tw/%E5%8D%97%E4%BA%AC%E5%A4%A7%E5%B1%A0%E6%AE%BA%E7%9A%84%E6%AD%BB%E4%BA%A1%E4%BA%BA%E6%95%B0","d":"2024-09-20"},{"t":"當代中國：南京大屠殺人類歷史最黑暗的一頁","u":"https://www.ourchinastory.com/zh/14999/%E6%8A%97%E6%88%B0%E5%8B%9D%E5%88%A980%E5%91%A8%E5%B9%B4%EF%BD%9C%E5%8D%97%E4%BA%AC%E5%A4%A7%E5%B1%A0%E6%AE%BA-%E4%BA%BA%E9%A1%9E%E6%AD%B7%E5%8F%B2%E6%9C%80%E9%BB%91%E6%9A%97%E7%9A%84%E4%B8%80%E9%A0%81","d":"2024-09-20"}]},"8-290":{"o":["趙一曼","周保中","李兆麟"],"x":["趙一曼是女性遊擊隊指揮官，非東北抗聯主要將領","周保中雖在東北抗聯但無相同故事記載","李兆麟在東北抗聯但無此記載"],"w":"楊靖宇是東北抗日聯軍的主要領導人和創建者，1940年1月在吉林濛江三道崴子與日軍周旋時，陷入重圍。在彈盡糧絕、孤身作戰五天五夜後，楊靖宇23日壯烈犧牲。日軍割開他的腹部進行驗屍時，發現胃裡盡是枯草、樹皮和棉絮，竟無一粒糧食，對其頑強精神為之震撼。","m":"楊靖宇胃中枯草樹，東北密林戰日寇。","n":"楊靖宇犧牲後，為紀念他，蒙江縣改名為靖宇縣，東北民主聯軍通化支隊改為楊靖宇支隊。","v":1,"src":[{"t":"中新網：抗日名將楊靖宇牺牲時胃裡只有棉花和樹皮","u":"https://www.chinanews.com.cn/cul/2010/09-02/2507317.shtml","d":"2010-09-02"},{"t":"教育部網站：永遠的豐碑抗日民族英雄楊靖宇","u":"http://www.moe.gov.cn/jyb_xwfb/xw_zt/moe_357/s3579/moe_433/moe_494/tnull_6055.html","d":"2024-09-20"}]},"8-291":{"o":["周恩來、葉挺","林彪、葉劍英","毛澤東、彭德懷"],"x":["周恩來是政治人物非軍人","林彪未任過八路軍正副總指揮","毛澤東任中共中央主席非軍隊指揮官"],"w":"1937年8月25日中共中央軍委發布命令，紅軍主力改編為國民革命軍第八路軍。朱德任總指揮，彭德懷任副總指揮，下轄三個師，約4.6萬人，成為全民族抗戰時期中共領導的重要武裝力量。","m":"朱德總指揮，彭德懷副總指揮，八路軍抗日先鋒隊。","v":1,"src":[{"t":"中共中央軍委發布中國工農紅軍改編為國民革命軍第八路軍的命令","u":"https://www.shsmu.edu.cn/cbms/wzrlcontent.jsp?urltype=news.NewsContentUrl&wbtreeid=1155&wbnewsid=4869","d":"2016-08-25"},{"t":"從紅軍到八路軍，揭秘八路軍組建歷程和番號由來","u":"https://xinwen.bjd.com.cn/content/s680db9ece4b0ec1c3d9657f1.html","d":"2021-08-25"},{"t":"大義扛肩上紅星耀心間—紅軍改編為八路軍、新四軍","u":"http://www.mod.gov.cn/gfbw/gfjy_index/16390944.html","d":"2025-06-12"}]},"8-292":{"o":["日本侵佔香港期間","日本華中地區軍事行動","日本進攻上海"],"x":["時間與地點不符","大屠殺主要發生在南京非其他地方","上海事變與南京大屠殺時間地點有異"],"w":"1937年12月13日，日本侵華日軍佔領南京後，對中國軍民進行了長達六週以上的大屠殺。據遠東國際軍事法庭調查，被殺害的中國平民和戰俘達20萬至30萬人。日軍採取槍殺、活埋、火燒等手段，犯下反人類罪行。","m":"南京大屠殺1937年12月，日本暴行不可忘。","v":1,"src":[{"t":"南京大屠殺：人類歷史黑暗一頁","u":"http://politics.people.com.cn/n1/2018/1206/c422645-30447448.html","d":"2018-12-06"},{"t":"銘記歷史！關於南京大屠殺你必須知道的一組數字","u":"http://politics.people.com.cn/BIG5/n1/2021/1213/c1001-32306702.html","d":"2021-12-13"},{"t":"西方媒體報道中的南京大屠殺","u":"https://www.19371213.com.cn/information/news/202310/t20231030_4043315.html","d":"2023-10-30"}]},"8-293":{"o":["西安","廣州","南昌"],"x":["西安為民族抗日統一戰線發源地非陪都","廣州為大革命時期根據地非戰時陪都","南昌為重要戰鬥城市但未成為陪都"],"w":"1937年11月20日國民政府決定遷都重慶。1940年9月6日，國民政府正式發佈《國民政府令》，確認重慶為「陪都」，且宣佈「還都以後，重慶將永久成為中國之陪都」，標誌著重慶成為戰時政治經濟軍事文化中心。","m":"四面山城作陪都，1940年九月正式定。","v":1,"src":[{"t":"回望1937：國民政府遷都重慶","u":"http://dangshi.people.com.cn/n/2015/0429/c85037-26922638.html","d":"2015-04-29"},{"t":"重慶陪都時期","u":"https://zh.wikipedia.org/wiki/%E9%87%8D%E5%BA%86%E9%99%AA%E9%83%BD%E6%97%B6%E6%9C%9F","d":"2024-01-01"},{"t":"中國抗戰時的首都為何選定在重慶","u":"https://m.krzzjn.com/show-927-73674.html","d":"2024-01-01"}]},"8-294":{"x":["官方答案為列舉型，無單一干擾項"],"w":"1937年全民族抗戰爆發後，國共兩黨進行談判和合作。紅軍改編為八路軍（八月）和新四軍（十月）。八路軍由朱德、彭德懷領導，新四軍由葉挺、項英領導。兩軍成為國民政府序列內的抗日力量。","m":"國共合作共抗日，八路新四軍成立時。","v":1,"src":[{"t":"大義扛肩上紅星耀心間—紅軍改編為八路軍、新四軍","u":"https://military.cctv.cn/2025/06/12/ARTIqdn1kgsShMOvzpAJX0T6250612.shtml","d":"2025-06-12"},{"t":"百年瞬間丨新四軍成立","u":"https://www.12371.cn/2021/10/12/VIDE1634008921409625.shtml","d":"2021-10-12"},{"t":"國防部官網介紹","u":"http://www.mod.gov.cn/gfbw/gfjy_index/16390944.html","d":"2025-06-12"}]},"8-295":{"o":["中國軍隊襲擊日本駐軍","蘇聯軍隊侵入滿洲","中國拒絕日本經濟要求"],"x":["日本自導自演炸毀鐵路，非中國軍隊所為","蘇聯與九一八事變無直接關係","經濟糾紛非炸鐵路藉口"],"w":"1931年9月18日夜，日本關東軍在策劃下，自己炸毀沈陽柳條湖附近的南滿鐵路，隨即栽贓於中國軍隊。日軍藉此藉口炮轟沈陽北大營，發動了侵華戰爭。這是日本軍國主義蓄謀已久的侵略陰謀。","m":"柳條湖事件是假，日本自爆造藉口。","v":1,"src":[{"t":"九一八事變中，日軍為何選擇在南滿鐵路柳條湖段定點爆破","u":"https://www.12371.cn/2021/09/18/ARTI1631921373173307.shtml","d":"2021-09-18"},{"t":"百年瞬間｜「九一八」事變","u":"https://www.12371.cn/2021/09/18/VIDE1631920082122390.shtml","d":"2021-09-18"},{"t":"九一八背後—日本險惡的「侵華共識」","u":"https://www.piyao.org.cn/2020-09/18/c_1210805896.htm","d":"2020-09-18"}]},"8-296":{"x":["官方答案為單一具體地點，無干擾項"],"w":"東江是珠江流域三大水系之一。東江發源於江西省贛州市轄區內，具體源頭在贛州市寧都縣及尋烏縣一帶。東江全長523公里，是香港和粵港澳地區最重要的飲用水水源，具有極其重要的戰略地位。","m":"千里東江源贛州，江西水往南方流。","v":1,"src":[{"t":"廣東省水利廳—東江流域","u":"http://slt.gd.gov.cn/ysgk_new/lygk/djly/content/post_3349285.html","d":"2024-01-01"},{"t":"東江源頭護林員守護供港東江水","u":"http://www.news.cn/photo/20250227/63d20aec3f9b49f9bde143e0cb5bc54d/c.html","d":"2025-02-27"},{"t":"尋烏尋源：東江急水自桠髻鵲山涓流來","u":"http://www.xunwu.gov.cn/xwxxxgk/xw10973/202407/ceb9fb4afeb2499ba1753e562ad81ad8.shtml","d":"2024-07-01"}]},"8-297":{"o":["50週年","55週年","65週年"],"x":["2025年距1975年供水開始為50週年，時間不符","若為55週年則應為1970年，與實際供水時間不符","若為65週年則應為1960年，供水未開始"],"w":"東江—深圳供水工程於1965年3月1日正式投入運行，向香港供水。2025年3月1日是東江水供港六十週年紀念日。工程歷經四次擴建改造，年供水量從最初0.68億立方米增至24.23億立方米。","m":"東江供港從1965年起，2025年整整六十年。","v":1,"src":[{"t":"東江水供港60週年源頭縣安遠如何讓水常清山常綠","u":"https://www.jx.chinanews.com.cn/news/2025/0302/110471.html","d":"2025-03-02"},{"t":"六十載碧波南流一江水血脈情深—寫在東深供水工程對港供水六十週年","u":"http://www.news.cn/politics/20250401/107517230e124b56874039e6f101819f/c.html","d":"2025-04-01"},{"t":"60年，300億方，從東江到香江","u":"http://www.szlhq.gov.cn/lhswj/gkmlpt/content/12/12055/post_12055093.html","d":"2025-03-01"}]},"8-298":{"x":["官方答案為具體數字，無干擾項"],"w":"東江—深圳供水工程自1965年投入運行以來，已向香港累計供水超過300億立方米。截至2024年底，工程累計對港供水達300億立方米，佔香港淡水供應的絕大部分，是支撐香港經濟社會發展的生命線工程。","m":"三百億立方米東江水，六十年護航香港繁華。","v":1,"src":[{"t":"東深供水工程60年對港供水300億立方米","u":"https://xinwen.bjd.com.cn/content/s67c51e1ce4b068c68f107c01.html","d":"2025-03-01"},{"t":"東江清流潤紫荊！東深供水工程60年對港供水300億立方米","u":"https://www.dutenews.com/n/article/8718904","d":"2025-03-01"},{"t":"穿越一甲子的生命線—東深供水滿足香港八成淡水用量","u":"http://www.news.cn/20250325/e1c53e36f4be4564a862400a943f073b/c.html","d":"2025-03-25"}]},"8-299":{"x":["官方答案為百分比範圍，無干擾項"],"w":"東江—深圳供水工程向香港的年供水規模逐年增長，年供水量已達9億多立方米，佔香港總用水量的70%至80%。香港現代用水主要依靠此工程提供的東江水，另有22%為海水沖廁，本地雨水僅佔26%左右。","m":"東江水七八成，香港飲水靠供港工程。","v":1,"src":[{"t" 化17":{"o":["每天都要升掛","星期一至五升掛","除星期六、日都要升掛"],"x":["並非每天都要升掛，假期和星期日除外","星期六也不升掛，只限星期一至五","星期六應該升掛，但星期日不升掛"],"w":"根據《中華人民共和國國旗法》第六條規定，全日制學校除寒假、暑假和星期日外，應當每日升掛國旗，這旨在培養學生對國旗的尊重和愛國意識。","m":"學校升旗規則＝除寒暑假和星期日外每日升掛","v":1,"src":[{"t":"中華人民共和國最高人民法院公報 - 國旗法","u":"http://gongbao.court.gov.cn/Details/f085e413d46cb49a0011a48769e643.html","d":"2026-09-20"}]},"7-文化18":{"o":["每週兩次","每月一次","每學期一次"],"x":["每週兩次過於頻繁，規定是每週最少一次","每月一次不符合學校升旗儀式規定的頻率","每學期一次遠不符合規定的最少次數"],"w":"中華人民共和國國旗法規定，全日制中學小學除假期外，每週最少舉行一次升旗儀式，一般為星期一早晨升旗，藉此培養學生的愛國情感。","m":"升旗儀式＝每週至少一次","v":1,"src":[{"t":"中華人民共和國最高人民法院公報 - 國旗法","u":"http://gongbao.court.gov.cn/Details/f085e413d46cb49a0011a48769e643.html","d":"2026-09-20"}]},"7-文化19":{"w":"升國旗時，參與者應當面向國旗站立，行注目禮（即目光注視國旗，身體立正，在升旗過程中保持莊嚴肅穆的態度），以表示對國旗和國家的尊重，這是升旗儀式的基本禮儀要求。","m":"升旗禮儀＝行注目禮、立正站好","v":1,"src":[{"t":"公民.好學 - 國旗護衛隊與升旗儀式","u":"https://ls.chiculture.org.hk/tc/concept/0223","d":"2026-09-20"}]},"7-文化20":{"o":["邊緣位置","較低位置","左邊位置"],"x":["邊緣位置無法凸顯國旗的尊貴地位","較低位置不符合尊重國旗的原則","左邊位置未必是中心突出的位置"],"w":"國旗法明確規定，國旗與其他旗幟同時升掛時，應當將國旗置於中心、較高、突出的位置，以體現國旗的尊崇地位和民族象徵意義。","m":"國旗位置＝中心、較高、突出","v":1,"src":[{"t":"政府總部禮賓處 - 國旗與其他旗幟同時升掛時的規定","u":"https://www.protocol.gov.hk/tc/show/show.html","d":"2026-09-20"}]},"7-文化21":{"o":["《人民共和國進行曲》","《勝利進行曲》","《中國進行曲》"],"x":["《人民共和國進行曲》為其他作品名稱，非中華人民共和國國歌","《勝利進行曲》為蘇聯作品，非中國國歌","《中國進行曲》不是官定的中華人民共和國國歌"],"w":"中華人民共和國的國歌為《義勇軍進行曲》，1949年9月27日被確定為暫時國歌，後於1982年被正式確認為中華人民共和國的國歌，歌詞由田漢作詞、聶耳作曲。","m":"中國國歌＝《義勇軍進行曲》","v":1,"src":[{"t":"當代中國 - 《義勇軍進行曲》重新確定為國歌","u":"https://www.ourchinastory.com/zh/381/%E3%80%8A%E7%BE%A9%E5%8B%87%E8%BB%8D%E9%80%B2%E8%A1%8C%E6%9B%B2%E3%80%8B%E9%87%8D%E6%96%B0%E7%A2%BA%E5%AE%9A%E7%82%BA%E5%9C%8B%E6%AD%8C","d":"2026-09-20"}]},"7-文化22":{"o":["聶耳","冼星海","馬思聰"],"x":["聶耳是《義勇軍進行曲》的作曲者，而非國歌詞作者","冼星海是《黃河大合唱》的作曲家，未參與國歌作詞","馬思聰為小提琴家和作曲家，與國歌作詞無關"],"w":"《中華人民共和國國歌》《義勇軍進行曲》的歌詞由田漢創作於1935年，原為電影《風雲兒女》的主題歌，後在抗戰時期傳唱，最終成為國歌，充分體現了中華民族不屈不撓的精神。","m":"國歌詞作者＝田漢","v":1,"src":[{"t":"中國共產黨新聞網 - 《義勇軍進行曲》的詞作者田漢","u":"http://cpc.people.com.cn/BIG5/n1/2024/0301/c443712-40186579.html","d":"2026-09-20"}]},"7-文化23":{"o":["郎平","馬思聰","周傳芳"],"x":["郎平是中國排球運動員和教練，與音樂作曲無關","馬思聰為小提琴家，不是《黃河大合唱》的作曲者","周傳芳為不知名人物，《黃河大合唱》作曲者為冼星海"],"w":"《黃河大合唱》是由張光年（光未然）作詞、冼星海作曲的大型聲樂套曲，成於1939年延安，為中國抗戰時期最著名的音樂作品，被譽為20世紀華人音樂經典。","m":"黃河大合唱作曲＝冼星海","v":1,"src":[{"t":"搜狐 - 冼星海與《黃河大合唱》的故事","u":"https://news.southcn.com/node_54a44f01a2/987ea49170.shtml","d":"2026-09-20"}]},"7-文化24":{"o":["齒輪圖案","穀穗圖案","天安門圖案"],"x":["齒輪象徵工人階級，不能象徵中國共產黨領導下的人民大團結","穀穗象徵農民階級，不能象徵全國人民大團結","天安門象徵中國人民的鬥爭精神，不是象徵人民大團結的圖案"],"w":"中華人民共和國國徽中心為天安門，周圍環繞五顆五角星和齒輪、穀穗。其中五星圖案象徵中國共產黨領導下的中國人民大團結，大星代表中共，四顆小星分別代表工人、農民、城市小資產階級和民族資產階級。","m":"國徽五星象徵＝人民大團結","v":1,"src":[{"t":"公民.好學 - 國旗和國徽","u":"https://ls.chiculture.org.hk/tc/idea-aspect/695","d":"2026-09-20"}]},"7-文化25":{"o":["工人階級","知識份子","商人階級"],"x":["齒輪象徵工人階級，而非穀穗","知識份子不是中國傳統社會主要階級","商人階級在建國初期不被視為工農聯盟基礎"],"w":"國徽設計體現新中國的階級基礎。五星照耀下的天安門代表人民民主專政，周圍的齒輪象徵工人階級，穀穗象徵農民階級，兩者組成工農聯盟，是新中國政權的社會基礎。","m":"齒輪工人、穀穗農民，工農聯盟最堅硬。","n":"","v":1,"src":[{"t":"中華人民共和國國徽圖案說明 - 維基文庫","u":"https://zh.wikisource.org/zh-hant/%E4%B8%AD%E8%8F%AF%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9C%8B%E5%9C%8B%E5%BE%BD%E5%9C%96%E6%A1%88%E8%AA%AA%E6%98%8E","d":"2024-04-16"},{"t":"認識國旗、國徽、國歌、區旗及區徽 - 香港教育局","u":"https://www.edb.gov.hk/tc/curriculum-development/4-key-tasks/moral-civic/Newwebsite/flagraising.html","d":"2026-09-20"}]},"7-文化26":{"o":["端午節","重陽節","元宵節"],"x":["端午節的傳統習俗是劃龍舟和食粽子，非舞火龍","重陽節主要活動是登山和敬老，無舞火龍","元宵節傳統習俗是賞花燈和猜燈謎，舞火龍是中秋特色"],"w":"大坑舞火龍是香港獨有的中秋傳統習俗，已有百多年歷史。起源於1880年光緒六年中秋，村民因瘟疫流行而按菩薩指示舞火龍祈福，後發展成中秋慶典的特色活動，已列入國家級非物質文化遺產名錄。","m":"中秋舞火龍，大坑一景傳百年。","n":"","v":1,"src":[{"t":"中秋節—大坑舞火龍 - 中國文化研究院","u":"https://www.icho.hk/tc/web/icho/representative_list_taihang.html","d":"2026-09-20"},{"t":"大坑舞火龍 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%A4%A7%E5%9D%91%E8%88%9E%E7%81%AB%E9%BE%8D","d":"2026-09-20"}]},"7-文化27":{"w":"香港各界文化促進會於2001年3月29日正式成立，由前全國政協常委莊世平擔任會長，著名作家查良鏞（金庸）任榮譽會長。該會旨在促進香港與中國內地及世界各國在科技、文明、文化方面的交流與合作，是連接香港與內地文化的重要橋樑。","m":"莊世平會長、查良鏞榮譽，香港各界文化促進會。","n":"","v":1,"src":[{"t":"香港各界文化促進會 - 紫荊雜誌","u":"https://bau.com.hk/column/col10609353.html","d":"2026-09-20"},{"t":"香港各界文化促進會 - 官方網站","u":"http://hkca.org.hk/","d":"2026-09-20"}]},"7-外交1":{"o":["天安門廣場","人民大會堂內部","釣魚台國賓館"],"x":["天安門廣場位置不同，正式歡迎儀式在人民大會堂東門外廣場","歡迎儀式應在室外廣場舉行，非在大會堂內部","釣魚台國賓館是國務活動場所，非歡迎儀式地點"],"w":"中國通常在人民大會堂東門外廣場舉行接待外國國家元首和政府首腦的正式歡迎儀式。此廣場經過改造，貴賓車隊經過天安門廣場進入，展示北京作為古都和現代國際大都市的風采，儀式莊嚴隆重，體現國家禮儀規格。","m":"人民大會堂東門廣場，外交禮儀第一場。","n":"","v":1,"src":[{"t":"大国外交最前线｜久违了！人民大会堂东门外广场再次举行欢迎仪式 - 中國青年網","u":"http://news.youth.cn/sz/202304/t20230406_14436931.htm","d":"2023-04-06"}]},"7-外交2":{"o":["廣東","浙江","江蘇"],"x":["廣東是經濟大省但博鰲亞洲論壇不在該省舉辦","浙江不是博鰲亞洲論壇的舉辦地","江蘇不是論壇選址，海南才是官方固定舉辦地"],"w":"博鰲亞洲論壇是中國在亞洲地區影響力最大的國際經濟論壇，固定每年春季在海南省博鰲舉辦。海南作為中國開放的重要窗口，是舉辦此論壇的理想地點，有利於推動亞洲發展和促進區域經濟一體化。","m":"博鰲論壇年年春，海南舞台聚天下。","n":"","v":1,"src":[{"t":"博鰲亞洲論壇 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%8D%9A%E9%B3%8C%E4%BA%9A%E6%B4%B2%E8%AE%BA%E5%9D%9B","d":"2026-09-20"},{"t":"博鳌亚洲论坛官方網站","u":"https://www.boaoforum.org/zh/index.html","d":"2026-09-20"}]},"7-外交3":{"o":["GATT","OPEC","IMF"],"x":["GATT是關税及貿易總協定，已被WTO取代但本身不是世界貿易組織","OPEC是石油輸出國組織，與貿易組織無關","IMF是國際貨幣基金組織，職能與WTO不同"],"w":"2001年12月11日，中國正式成為世界貿易組織（WTO）的第143個成員國。經過長達15年的談判，中國終於實現入世目標。世界貿易組織的英文縮寫是WTO，它是管理全球貿易的最重要國際組織。","m":"WTO三個字母記得牢，世界貿易組織話你知。","n":"","v":1,"src":[{"t":"2001年中国加入WTO - 人民日報","u":"http://paper.people.com.cn/zgjjzk/html/2009-09/28/content_355740.htm","d":"2009-09-28"},{"t":"2001年12月11日我國正式加入世界貿易組織 - 北京大興法院","u":"https://www.bj148.org/wh/lssdjt/202012/t20201211_1592248.html","d":"2020-12-11"}]},"7-外交4":{"o":["上海","莫斯科","烏蘭巴託"],"x":["上海是上合組織創立地而非秘書處所在地","莫斯科是俄羅斯首都但非上合組織秘書處","烏蘭巴託與上合組織地緣位置不符"],"w":"上海合作組織於2001年6月15日在上海正式成立，是永久性政府間國際組織。雖然組織名稱以「上海」冠名，但其常設執行機構秘書處設在北京，自2004年1月正式啟動。北京作為中國首都，便於協調各成員國事務。","m":"上海成立地，北京設秘書；上合組織需知曉。","n":"秘書處於2004年1月正式啟動北京，而非2001年6月15日時即設立。","v":1,"src":[{"t":"上海合作組織 - 中華人民共和國外交部","u":"https://www.mfa.gov.cn/web/gjhdq_676201/gjhdqzz_681964/lhg_683094/jbqk_683096/200812/t20081224_9388211.shtml","d":"2008-12-24"},{"t":"上海合作组织秘书处 - 百度百科","u":"https://baike.baidu.com/item/%E4%B8%8A%E6%B5%B7%E5%90%88%E4%BD%9C%E7%BB%84%E7%BB%87%E7%A7%98%E4%B9%A6%E5%A4%84/2625998","d":"2026-09-20"}]},"7-外交5":{"o":["烏茲別克斯坦","吉爾吉斯斯坦","土庫曼斯坦"],"x":["烏茲別克斯坦是中亞國家但不是習近平首次提出絲綢之路經濟帶的地點","吉爾吉斯斯坦在中亞但不是該倡議提出地","土庫曼斯坦與該事件無直接關係"],"w":"2013年9月7日，國家主席習近平在出訪哈薩克斯坦期間，在納扎爾巴耶夫大學發表重要演講，首次提出「絲綢之路經濟帶」倡議。這標誌著「一帶一路」宏大戰略構想的正式開始，後來成為中國最重要的外交政策之一。","m":"哈薩克演講九月秋，絲綢之路經濟帶起頭。","n":"","v":1,"src":[{"t":"習近平發表重要演講呼籲共建絲綢之路經濟帶 - 中華人民共和國外交部","u":"https://www.fmprc.gov.cn/web/ziliao_674904/zt_674979/dnzt_674981/qtzt/ydyl_675049/zyxw_675051/201309/t20130907_7951524.shtml","d":"2013-09-07"},{"t":"習近平談「一帶一路」- 中國一帶一路網","u":"https://www.yidaiyilu.gov.cn/p/10908.html","d":"2026-09-20"}]},"7-外交6":{"o":["絲綢之路經濟帶","陸地絲綢之路","中國-東盟經濟走廊"],"x":["絲綢之路經濟帶是「一帶」而非「一路」","陸地絲綢之路是陸上路線，「一路」指海上路線","中國-東盟經濟走廊不是官方的「一路」定義"],"w":"「一帶一路」倡議包括陸地和海上兩條路線。「一路」特指「21世紀海上絲綢之路」，是通過海上連接，從中國沿海港口經南海、馬六甲海峽、印度洋，延伸至歐洲和東非的海上貿易通道，與陸上絲綢之路經濟帶互為補充。","m":"一帶是陸，一路是海；21世紀海上絲綢路。","n":"","v":1,"src":[{"t":"「一帶一路」連接歐亞共同發展 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-today/195","d":"2026-09-20"},{"t":"一帶一路入門篇｜「一路」機遇 - 當代中國","u":"https://www.ourchinastory.com/zh/6211/%E4%B8%80%E5%B8%B6%E4%B8%80%E8%B7%AF%E5%85%A5%E9%96%80%E7%AF%87%EF%BD%9C%E3%80%8C%E4%B8%80%E8%B7%AF%E3%80%8D%E6%A9%9F%E9%81%87","d":"2026-09-20"}]},"7-外交7":{"o":["上海","西安","南京"],"x":["上海是一帶一路倡議地但不是首屆高峯論壇舉辦地","西安是古代絲綢之路起點但未舉辦首屆高峯論壇","南京不是該論壇的舉辦城市"],"w":"2017年5月14日至15日，首屆「一帶一路」國際合作高峯論壇在北京舉行。論壇開幕式在國家會議中心，習近平出席並發表演講；15日在雁棲湖舉行領導人圓桌峯會。130多個國家和70多個國際組織派代表參加，29個國家元首或政府首腦出席，規格創造新高。","m":"五月北京高峯論壇，一帶一路大舞台。","n":"","v":1,"src":[{"t":"第一屆一帶一路國際合作高峰論壇 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E7%AC%AC%E4%B8%80%E5%B1%8A%E4%B8%80%E5%B8%A6%E4%B8%80%E8%B7%AF%E5%9B%BD%E9%99%85%E5%90%88%E4%BD%9C%E9%AB%98%E5%B3%B0%E8%AE%BA%E5%A3%87","d":"2026-09-20"},{"t":"一帶一路國際合作高峰論壇 - 維基百科（粵文）","u":"https://zh-yue.wikipedia.org/wiki/%E4%B8%80%E5%B8%B6%E4%B8%80%E8%B7%AF%E5%9C%8B%E9%9A%9B%E5%90%88%E4%BD%9C%E9%AB%98%E5%B3%B0%E8%AB%96%E5%A3%87","d":"2026-09-20"}]},"7-外交8":{"o":["迪拜國際機場","上海浦 :"2017-01-17"}]},"7-外交23":{"o":["聯合國大會會議","亞非國際會議","歐洲安全會議"],"x":["首次以五大國身份出席係在1954年日內瓦會議","1955年萬隆會議非五大國會議","無此類會議"],"w":"新中國首次以五大國之一的地位參加的國際會議係1954年的日內瓦國際會議。中國與蘇、美、英、法並列為五大國，周恩來率領代表團參加，共同討論朝鮮問題和印度支那問題，會議於4月26日至7月21日舉行，這標誌著新中國在多邊外交舞台上的首次亮相。","m":"日內瓦54年會議，中國五大國首亮相。","v":1,"src":[{"t":"中華人民共和國外交部：新中國外交歷史回顧","u":"https://www.mfa.gov.cn/web/ziliao_674904/wjs_674919/2159_674923/200011/t20001107_10251024.shtml","d":"2000-11-07"}]},"7-外交24":{"o":["蘇聯關係的改善","歐洲國家支持","聯合國改革"],"x":["70年代建交熱潮關鍵因素係中美關係改善","蘇聯並無直接促進","歐洲支持非主要因素"],"w":"20世紀70年代初，中美關係的改善成為國際格局變化的關鍵。1972年美國總統尼克松訪華並簽署《上海公報》後，各國紛紛與中國建交。到1973年底，中國已基本完成與資本主義發達國家（除美國外）的建交；到1976年，全球110多個國家與中國建立外交關係。中美關係正常化直接帶動了國際建交熱潮。","m":"美中建交破冰，各國跟進建交潮。","v":1,"src":[{"t":"人民論壇網：新中國外交70年——回顧與思考","u":"https://www.rmlt.com.cn/2019/1008/558429.shtml","d":"2019-10-08"}]},"7-外交25":{"o":["亞洲國家會議","非洲國家會議","發展中國家會議"],"x":["會議名稱為「萬隆會議」係約定俗稱","亞非會議與萬隆會議為同一會議","發展中國家會議或「亞非會議」都能接受"],"w":"1955年4月18日至24日，29個亞非國家和地區的政府代表團在印度尼西亞萬隆召開的亞非會議。這是亞非國家首次在沒有殖民國家參加下舉辦的國際會議。周恩來總理率隊出席，提出「求同存異」方針。會議通過的《亞非會議最後公報》載有十項原則，成為世界歷史進程中的里程碑。","m":"1955年萬隆亞非會，求同存異促合作。","v":1,"src":[{"t":"共產黨員網：萬隆會議與求同存異方針","u":"https://www.12371.cn/2021/04/18/VIDE1618711680895799.shtml","d":"2021-04-18"}]},"7-外交26":{"w":"改革開放以來中國外交成就包括：①2001年加入世界貿易組織，成為第143個成員；②1991年加入亞太經合組織，2001年上海舉辦APEC領導人會議；③2010年中國—東盟自由貿易區全面啟動；④2001年創立上海合作組織，與俄羅斯及中亞五國共同致力維護地區和平穩定。四項成就均體現了中國在經濟合作、區域安全、多邊主義方面的重要角色。","m":"WTO、APEC、中東盟自貿區、上合組織，四項改革開放成就。","v":1,"src":[{"t":"中華人民共和國外交部：中國與世界貿易組織","u":"https://www.mfa.gov.cn/web/gjhdq_676201/gjhdqzz_681964/lhg_681966/jbqk_681968/200802/t20080229_9380022.shtml","d":"2008-02-29"}]},"7-外交27":{"o":["有利於推進中亞工業發展","有利於擴大中國貿易優勢","有利於加強俄羅斯地位"],"x":["上合組織焦點在安全合作而非工業","經貿只是方面，核心係維護地區穩定","俄羅斯係成員但非主要目標"],"w":"上海合作組織以「互信、互利、平等、協商、尊重多種文明、謀求共同發展」的「上海精神」為準則。其宗旨係加強成員國相互信任與睦鄰友好，透過反恐、安全合作等維護中亞地區和平與穩定。成員國努力通過上海合作組織地區反恐怖機構等途徑促進反恐合作，確保北部和西北邊境安全。","m":"上合組織維護中亞和平，反恐安全是重點。","v":1,"src":[{"t":"中國文化研究院《通識．現代中國》：上海合作組織","u":"https://ls.chiculture.org.hk/tc/idea-aspect/110","d":"查詢日期 2026-09-20"}]}," ],"x":["中國加入WTO係2001年12月11日，成為第143個成員","141個數字不符","145個數字過高"],"w":"2001年12月11日，《中國加入世界貿易組織議定書》正式生效，中國成為世界貿易組織第143個成員。這是中國經過15年談判後的重大突破，經濟日報紛紛刊登慶祝消息。加入WTO推動了中國改革開放進程，貿易總額由2001年的5096億美元增至2023年的5.94萬億美元，位居世界第一。","m":"加入WTO 2001年，143個成員號。","v":1,"src":[{"t":"共產黨員網：中國正式成為世界貿易組織第143個成員","u":"https://www.12371.cn/2021/12/13/VIDE1639361893219663.shtml","d":"2021-12-13"}]},"7-外交34":{"w":"新中國外交史上這五大事件的正確順序為：①提出和平共處五項原則（1953年底—1954年初），②參加日內瓦國際會議（1954年4月—7月），③參加萬隆亞非會議（1955年4月），④中國在聯合國合法席位得到恢復（1971年10月），⑤中美簽訂上海公報（1972年2月）。此序列反映了新中國從建交初期外交突破、多邊外交亮相、到國際地位確立的逐步發展過程。","m":"五項原則—日內瓦—萬隆—聯合國—上海公報，順序遞進。","v":1,"src":[{"t":"中華人民共和國外交部：新中國外交歷史回顧","u":"https://www.mfa.gov.cn/web/ziliao_674904/wjs_674919/2159_674923/200011/t20001107_7950050.shtml","d":"2000-11-07"}]},"7-外交35":{"o":["中英協議書","中英條約","中英宣言書"],"x":["指出中國於1997年7月1日恢復香港主權的文件係「中英聯合聲明」","協議書係涉及具體實施細節的不同文件","宣言書通常指其他類型的外交文件"],"w":"1984年12月19日，中華人民共和國政府和大不列顛及北愛爾蘭聯合王國政府在北京正式簽署《中英聯合聲明》。聲明明確指出，中華人民共和國政府決定於1997年7月1日對香港恢復行使主權。聲明確保香港在「一國兩制」原則下，資本主義制度和生活方式五十年不變。","m":"中英聯合聲明指定香港1997年回歸。","v":1,"src":[{"t":"中華人民共和國外交部：中英聯合聲明全文","u":"https://www.cmab.gov.hk/tc/issues/jd2.htm","d":"查詢日期 2026-09-20"}]},"7-外交36":{"o":["上海","倫敦","香港"],"x":["中英聯合聲明簽字地點係北京","倫敦並非簽署地點","香港簽署不符歷史事實"],"w":"1984年12月19日，中華人民共和國政府和大不列顛及北愛爾蘭聯合王國政府在北京人民大會堂正式簽署《中英聯合聲明》。國務院總理趙紫陽和英國首相瑪格麗特·撒切爾夫人代表兩國政府在北京簽署此歷史性文件。1997年7月1日午夜至7月1日凌晨，中英兩國政府在香港會展中心舉行香港權力交接儀式。","m":"聲明簽署在北京，權力交接在香港。","v":1,"src":[{"t":"中華人民共和國外交部：中英聯合聲明","u":"https://www.fmprc.gov.cn/web/zyxw/200011/t20001107_271907.shtml","d":"2026-09-20"},{"t":"中國政府網：一九八四年第二十八號公報","u":"https://www.gov.cn/gongbao/shuju/1984/gwyb198428.pdf","d":"2026-09-20"}],"n":"。"},"7-外交37":{"o":["陳毅","葉劍英","鄧小平"],"x":["新中國第一任外交部長係周恩來","陳毅係第二任外交部長","葉劍英和鄧小平未任外交部長"],"w":"周恩來在1949年10月1日新中國成立當日被任命為中央人民政府政務院總理兼外交部部長，成為新中國成立後任命的第一任外交部長。他在1958年前一直兼任外交部長，是新中國外交事業的開拓者和奠基人，十分重視外交隊伍建設，為新中國外交事業發展做出了卓越貢獻。","m":"周恩來係新中國首任外交部長兼總理。","v":1,"src":[{"t":"中華人民共和國外交部：歷任外交部長","u":"https://www.mfa.gov.cn/web//ziliao_674904/wjrw_674925/2166_674931/200805/t20080509_9880973.shtml","d":"2008-05-09"}]},"7-外交38":{"o":["羽毛球","籃球","排球"],"x":["羽毛球雖然是中國強項運動，但在中美建交過程中未發揮關鍵外交作用","籃球在中美外交中的作用遠不及乒乓球","排球並非當時中美建交過程中的外交橋樑"],"w":"1971年4月，中美乒乓球隊在日本名古屋世乒賽相遇，美隊應邀訪華，開啟了著名的「乒乓外交」。這場體育外交突破冷戰僵局，為中美建交奠定基礎。1972年尼克遜訪華簽署《上海公報》，1979年正式建立外交關係。","m":"小球轉動大球，乒乓外交破冰河。","n":"問題説「今年是中美建交45週年」，若以2026年推算，45年前為1981年，但中美建交實際於1979年1月1日。若題目語境為2024年，則45年前為1979年正確。乒乓外交發生於1971年，先於建交8年。","v":1,"src":[{"t":"人民網：1971年4月10日 中美開始「乒乓外交」","u":"https://cpc.people.com.cn/BIG5/64162/64165/78561/79757/5554900.html","d":"2011-04-10"},{"t":"中新社：那年今天｜「乒乓外交」，以小球转动大球","u":"https://www.xhby.net/content/s6616351ae4b05f85c7ec9982.html","d":"2024-01-01"},{"t":"中新網：乒乓外交50年，中美「你来我往」仍需小球里的大智慧","u":"https://www.chinanews.com/gn/2021/04-09/9451356.shtml","d":"2021-04-09"}]},"7-外交39":{"o":["1989年","1993年","1995年"],"x":["1989年是天安門事件發生年，中國尚未加入APEC","1993年過早，中國加入時間已確定為1991年","1995年遠晚於中國實際加入APEC的時間"],"w":"中國於1991年11月正式加入亞太經合組織。當年在韓國漢城舉行的第三屆部長級會議上，中華人民共和國、中國台北和香港作為三個經濟體同時加入，這開創了同一主權國家及其地區經濟體共同參與國際組織的先例。","m":"九一年冬，中國加APEC，三體共參與。","n":"","v":1,"src":[{"t":"北京師範大學：國際觀察：中國加入APEC25年 推動全球及亞太合作","u":"https://psych.bnu.edu.cn/xsfz/lxxn/gjsy/4d7bd80c9b684cf7ba88c1ecc656562e.htm","d":"2016-11-12"},{"t":"中華人民共和國外交部：中國和該組織關係","u":"https://www.mfa.gov.cn/web/gjhdq_676201/gjhdqzz_681964/lhg_682278/zghgzz_682282/","d":"2023-06-01"},{"t":"維基百科：亞太經濟合作組織","u":"https://zh.wikipedia.org/zh-hans/%E4%BA%9A%E5%A4%AA%E7%BB%8F%E6%B5%8E%E5%90%88%E4%BD%9C%E7%BB%84%E7%BB%87","d":"2024-01-01"}]},"7-外交40":{"o":[],"x":[],"w":"和平共處五項原則由中國在1950年代初提出，內容涵蓋五個核心要素：互相尊重主權和領土完整、互不侵犯、互不干涉內政、平等互利、和平共處。這五項原則於1953年由周恩來首次向印度提出，旋於1954年訪印訪緬時正式確認。這是中國獨立和平外交政策的基礎，對塑造新中國外交格局具有深遠影響。","m":"五項原則記心中：尊重主權不侵犯，互不干政平等利，和平共處第一選。","n":"","v":1,"src":[{"t":"中華人民共和國外交部：弘揚和平共處五項原則携手構建人類命運共同體","u":"https://www.fmprc.gov.cn/web/wjb_673085/zzjg_673183/xws_674681/xgxw_674683/202406/t20240628_11443295.shtml","d":"2024-06-28"},{"t":"中華人民共和國司法部：和平共處五項原則","u":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/2021nzt/dsxxjy20210506/dszl/dsbk/202105/t20210511_391725.html","d":"2 和政府等自治機構，行使自治權。此制度既保護少數民族當家做主的權利，又維護國家統一。截至2008年，中國共建立155個民族自治地方，成為處理民族問題的成功典範。","m":"民族區域自治制，多民族國家統一體。","v":1,"src":[{"t":"中國的民族政策與各民族共同繁榮發展 - 中國政府網","u":"http://www.scio.gov.cn/zfbps/ndhf/2009n/202207/t20220704_130048.html","d":"2024-09-20"}]},"7-科技1":{"o":["雜交玉米之父李隆濱","小麥育種家黎漢雲","棉花專家王朝棟"],"x":["此人致力於玉米雜交育種，與水稻關係無關","此人主要從事小麥育種工作","此人專注棉花育種研究"],"w":"袁隆平院士開創了世界雜交水稻事業，建立了雜交水稻理論，育成了一大批雜交水稻新品種。透過科學研究與大規模推廣應用，中國水稻平均畝產從1950年的141公斤增長到1998年的450公斤，增長了2.2倍，大幅提升了國家糧食安全。","m":"袁隆平，雜交水稻之父，一粒種子改變世界。","v":1,"src":[{"t":"科技部：杂交水稻之父袁隆平：一颗种子改变世界","u":"https://www.moa.gov.cn/ztzl/xzgnylsn/gd_1/200909/t20090918_1353797.htm","d":"2009-09-18"},{"t":"中国农业科学院：袁隆平情系水稻五十载","u":"https://www.cae.cn/cae/html/main/col36/2014-10/29/20141029143139639951044_1.html","d":"2014-10-29"}]},"7-科技2":{"o":["萬里","華國鋒","李先念"],"x":["是中國政治人物，但未在科學大會上提出過此論述","為改革開放初期的黨和國家領導人，但非此論述提出者","擔任過國務院副總理，但與此科技論述無關"],"w":"鄧小平同志是中國改革開放的總設計師。在1988年9月5日會見捷克斯洛伐克總統胡薩克時，鄧小平深刻指出「科學技術是第一生產力」，繼承並發展了馬克思主義生產力學説。這一論述強調了科學技術對經濟發展的首要推動作用，為中國後來推行科教興國戰略奠定了理論基礎。","m":"鄧小平的科技論：第一生產力，興國的關鍵。","n":"注意：問題表述有誤。鄧小平雖在1978年全國科學大會上發表講話，但「科學技術是第一生產力」這一精準表述是在1988年9月5日才正式提出的，不是在1978年全國科學大會開幕式上。官方答案「鄧小平」仍是正確的。","v":1,"src":[{"t":"党史百科：「科学技术是第一生产力」","u":"https://qhrd.gov.cn/gzdt/ztzl/zxzt/srdxxjy/xxzl_343/202103/t20210330_15632.html","d":"2021-03-30"},{"t":"科技部：重温邓小平同志关于科技工作的重要论述","u":"https://www.most.gov.cn/szyw/yw/201408/t20140826_115246.html","d":"2014-08-26"}]},"7-科技3":{"o":["風雲號","神舟號","悟空號"],"x":["是中國氣象衞星系列，非量子科學實驗衞星","是中國載人飛船系列，非科學實驗衞星","是中國暗物質粒子探測衞星，不是量子科學實驗衞星"],"w":"「墨子號」量子科學實驗衞星是中國研製的世界上第一顆空間量子科學實驗衞星，於2016年8月16日在酒泉衞星發射中心成功發射。該衞星設計壽命2年，以中國古代偉大哲學家和科學家墨翟命名，旨在建立衞星與地面的遠距離量子科學實驗平台，取得量子力學基礎物理研究的重大突破。","m":"墨子號升空，量子通信夢圓中國。","v":1,"src":[{"t":"国家航天局：世界首颗量子科学实验卫星「墨子号」正式交付使用","u":"https://www.cnsa.gov.cn/n6758823/n6758838/c6770007/content.html","d":"2017-01-18"},{"t":"中国科学院：量子科学实验卫星","u":"https://www.cas.cn/zt/kjzt/lzwx/","d":"2016-08-16"}]},"7-科技4":{"o":["香港大學","香港中文大學","香港科技大學"],"x":["為頂尖大學，但在中俄火星探測計劃中角色有限","亦為研究名校，但在此計劃中並非主要參與單位","為科研強校，但對火星探測計劃的 "引力波","中微子","宇宙射線"],"x":["科學方向不同，馬里亞納海溝是地球洋底，引力波需太空探測","雖為基本粒子，但「宇宙幽靈」的稱號特指暗物質","宇宙射線已有多項研究，非錦屏大設施的主要探測目標"],"w":"錦屏大設施是中國迄今最深的地下實驗室。世界最深、最大的極深地下實驗室「錦屏大設施」位於四川錦屏山地下2400米，於2023年12月7日正式投入科學運行。該設施為暗物質、中微子和核物理研究提供了極低背景輻射的環境，其宇宙線通量僅為地表的一千萬分之一。暗物質被科學家譽為「宇宙幽靈」，是宇宙物質的主要成分之一，其本質仍是物理學的重大謎團。","m":"地下兩千四，幽靈現真身。","v":1,"src":[{"t":"新华网：世界最深、最大的极深地下实验室锦屏大设施投入科学运行","u":"http://www.news.cn/tech/2023-12/07/c_1130013197.htm","d":"2023-12-07"},{"t":"国家核安全局：世界最深、最大地下实验室——锦屏大设施正式投入科学运行","u":"https://nnsa.mee.gov.cn/ywdt/hyzx/202312/t20231208_1058510.html","d":"2023-12-08"}]},"7-科技13":{"o":["95%","92%","88%"],"x":["略低，中國太陽能硅片產量佔比應為97%","接近但仍未達標","明顯過低"],"w":"中國光伏產業已成全球主導力量。根據國際能源署的數據，中國生產了全球80%的太陽能板、85%的太陽能電池和97%的太陽能硅片。光伏產業鏈的上下游各環節中，中國的產能和產量佔比都超過93%，其中硅片環節最為突出。中國光伏製造業的規模、技術水準和市場份額均領先全球，為全球能源轉型和氣候變化應對作出了重要貢獻。","m":"光伏硅片九十七，中國產能世界第一。","v":1,"src":[{"t":"浙江信息港：中国光伏，大跃进、新节点","u":"https://zjic.zj.gov.cn/ywdh/nyhj/202308/t20230811_20439970.shtml","d":"2023-08-11"},{"t":"澎湃新闻：国际能源署最新报告：太阳能光伏供应链安全与成本竞争力如何平衡","u":"https://m.thepaper.cn/newsDetail_forward_18961414","d":"2022-07-29"}]},"7-科技14":{"o":["京歐班列","絲路班列","亞歐班列"],"x":["雖為國際貨運列車，但最長貨運班列是中歐班列，非京歐班列","為國際物流通道，但非貨運里程最長的班列","為泛指名稱，中歐班列是最具代表的貨運班列"],"w":"中歐班列是中國對外貿易的重要通道。中歐班列總里程長達10245公里，是目前全球最長的貨運班列，連接中國與歐洲多國，已成為「一帶一路」建設的重要載體。該班列大大縮短了運輸時間，降低了物流成本，為中歐貿易發展發揮了關鍵作用。截至2025年6月，中歐班列累計開行超110萬列，運送貨物逾1100萬標箱，發送貨值超過5200億美元。","m":"中歐班列萬里路，一帶一路新樞紐。","v":1,"src":[{"t":"中国政府网：中欧班列累计开行超10万列","u":"https://www.gov.cn/yaowen/liebiao/202411/content_6990227.htm","d":"2024-11-25"},{"t":"中国铁路：中欧班列线路及运费价格","u":"https://www.jd-link.com/articles/encyclopedias/719/","d":"2024-01-01"}]},"7-科技15":{"o":["霍英東獎","孫中山獎","李嘉誠基金獎"],"x":["雖為香港知名獎項，但「東方諾貝爾」的稱號屬於邵逸夫獎","為學術獎項，但不具有「東方諾貝爾」的地位","雖為慈善基金獎，但知名度和影響力不如邵逸夫獎"],"w":"邵逸夫獎是全球矚目的重要科學獎項。由香港影視製作人邵逸夫爵士於2002年創立，於2004年首次頒發，設有天文學、數學科學、生命科學與醫學、計算機科學四個獎項。邵逸夫獎獎金達100萬美元，不分獲奬者種族、國籍或宗教信仰，旨在表彰在學術及科學研究中取得突破成果、對人類生活產生深遠影響的科學家，因此被香港媒體譽為「東方諾貝爾獎」。","m":"邵逸夫獎，東方科學最高榮譽。","v":1,"src":[{"t":"生物通：100万美元巨奖：东方诺贝尔奖――邵逸夫奖","u":"https://www.ebiotrade.com/news
