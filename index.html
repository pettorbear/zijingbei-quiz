tps://ls.chiculture.org.hk/tc/idea-aspect/72","d":"2024-09-20"}]},"9-225":{"o":["絲綢和瓷器","紙張和製造技術","武器和軍事物資"],"x":["絲綢和瓷器雖受歡迎但不如茶文化廣泛","紙張和製造技術在十八世紀已不是主要出口","武器和軍事物資不是文化交流內容"],"w":"十八世紀後，中英文化交流不斷加強。中國的茶和茶文化在英國社會廣受歡迎，成為英國上流社會的時尚。從十七世紀中期開始，英國從東印度公司進口中國茶葉，到十八世紀需求激增，中國茶文化深深影響了英國飲食和生活方式。","m":"十八世紀茶文化傳英國，飲茶成風尚。","v":1,"src":[{"t":"英國人為何愛喝中國茶 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/281","d":"2024-09-20"},{"t":"中英文化交流 - 中國文化研究院","u":"https://chiculture.org.hk/index.php/tc/china-five-thousand-years/2002","d":"2024-09-20"}]},"9-226":{"o":["英國商船貨物號","荷蘭商船東方號","西班牙商船馬尼拉號"],"x":["英國商船是不是美國商船","荷蘭商船非美國國籍","西班牙商船不是開啟中美貿易的船隻"],"w":"1784年2月22日（美國總統華盛頓的生日），一艘360噸的美國商船「中國皇后號」從紐約啟航，載有西洋參、皮貨等商品。8月23日抵達澳門，8月28日到達廣州黃埔港。這是美國第一艘成功前往中國貿易的商船，開啟了中美直接貿易的先河。","m":"中國皇后號，1784年啟航美中通商路。","v":1,"src":[{"t":"開啟中美貿易的「中國皇后號」 - 新民周刊","u":"https://m.xinminweekly.com.cn/content/19407.html","d":"2024-09-20"},{"t":"「中國皇后號」如何打開中美交往大門 - 中國文化研究院","u":"https://chiculture.org.hk/sc/china-five-thousand-years/274","d":"2024-09-20"}]},"9-227":{"o":["成龍","尼古拉斯·凱奇","湯姆·克魯斯"],"x":["成龍是李小龍之後的功夫明星，但不是首位全球推廣者","尼古拉斯·凱奇不是華人","湯姆·克魯斯不是華人演員"],"w":"李小龍(1940-1973)是中國武術名揚海外的首位全球推廣者。他於1970年代主演功夫電影《龍爭虎鬥》等作品，成為好萊塢首位華人主角，創造2.3億美元票房。李小龍自創截拳道，融合中西武學，將「Kung Fu」一詞納入英文辭典，被美國《時代》雜誌選為20世紀全球20名「英雄與偶像」之一。","m":"李小龍推功夫，好萊塢第一華人星。","v":1,"src":[{"t":"李小龍 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E6%9D%8E%E5%B0%8F%E9%BE%8D","d":"2024-09-20"},{"t":"好萊塢首位華人主角：功夫巨星李小龍逝世50年 - 遠見雜誌","u":"https://www.gvm.com.tw/article/104676","d":"2024-09-20"}]},"9-228":{"o":["絲綢","陶瓷","茶葉"],"x":["絲綢是商品而非生物","陶瓷是工藝品而非珍稀動物","茶葉是農產品而非珍稀動物"],"w":"大熊貓是中國特有的珍稀動物。中國從1950年代開始，以大熊貓作為國禮贈送給蘇聯、朝鮮、美國、英國、法國、日本等友好國家。大熊貓温和可愛，代表和平與友誼，因此被譽為中國「和平、友誼的使者」。","m":"大熊貓是國禮，和平友誼使者。","v":1,"src":[{"t":"熊貓外交 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%86%8A%E7%8C%AB%E5%A4%96%E4%BA%A4","d":"2024-09-20"},{"t":"大熊貓 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E5%A4%A7%E7%86%8A%E7%8C%AB","d":"2024-09-20"}]},"9-229":{"o":["波蘭","南斯拉夫","匈牙利"],"x":["波蘭不是第一個建交國","南斯拉夫不是第一個建交國","匈牙利不是第一個建交國"],"w":"1949年10月2日，蘇聯政府致電周恩來表示願建立外交關係。10月3日，周恩來復電表示欣然接納。蘇聯成為第一個與新中國建立外交關係的國家，標誌著新中國開始走上世界外交舞台。","m":"1949年10月3日，蘇聯首先建交新中國。","v":1,"src":[{"t":"1949年10月3日 中蘇建交 - 中國共產黨新聞網","u":"http://cpc.people.com.cn/BIG5/64162/64165/70486/70489/4842429.html","d":"2024-09-20"},{"t":"百年瞬間丨中蘇建立大使級外交關係 - 共產黨員網","u":"https://www.12371.cn/2021/10/03/VIDE1633224120531812.shtml","d":"2024-09-20"}]},"9-230":{"o":["《北京協議》","《華盛頓宣言》","《聯合聲明》"],"x":["《北京協議》不是中美首份重要文件","《華盛頓宣言》不存在","《聯合聲明》不是1972年發布的正式名稱"],"w":"1972年2月21日至28日，美國總統尼克松應邀訪華。2月27日，中美兩國政府在上海簽署《聯合公報》（又稱《上海公報》），於28日正式發表。該公報標誌著中美兩國經過20多年對抗後開始走向關係正常化，為兩國建交奠定了重要基礎。","m":"1972年上海公報簽，中美建交新紀元。","v":1,"src":[{"t":"中華人民共和國和美利堅合眾國聯合公報（上海公報）- 中國政府網","u":"https://www.gov.cn/ztzl/zmdh/content_624341.htm","d":"2024-09-20"},{"t":"1972年尼克松訪華 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/1972%E5%B9%B4%E5%B0%BC%E5%85%8B%E6%9D%BE%E8%AE%BF%E5%8D%8E","d":"2024-09-20"}]},"9-231":{"o":["全運會足球賽","乒乓球公開賽","棋類競技大賽"],"x":["全運會是全國性而非地方性對外比賽","乒乓球公開賽起始時間不符","棋類競技大賽不是體育比賽"],"w":"「省港盃」足球賽是改革開放後第一個經中央政府批准的地方性對外體育比賽。1978年10月，中央政府批准舉辦此賽事。1979年1月，廣東隊與香港隊進行首場比賽，由香港商人何東提議創辦，成為粵港體育文化交流的重要平台。","m":"改革開放首次局，省港盃足球帶風頭。","v":1,"src":[{"t":"省港盃 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E7%9C%81%E6%B8%AF%E7%9B%83","d":"2024-09-20"},{"t":"體育交流與改革開放：「省港盃」足球賽 - 國史網","u":"http://hprc.cssn.cn/gsyj/whs/xzgwhjs/202004/t20200420_5116025.html","d":"2024-09-20"}]},"9-232":{"o":["南朝","隋朝","唐朝"],"x":["《敕勒歌》是北朝民歌，不是南朝","《敕勒歌》不是隋朝民歌","《敕勒歌》不是唐朝民歌"],"w":"《敕勒歌》是北朝民歌，收錄於《樂府詩集》。敕勒為鮮卑族後裔，此歌產生於五世紀中後期。民歌歌詠北國草原壯麗的風光，抒寫敕勒人熱愛家鄉的豪情，風格明朗豪爽，是北朝民歌的代表作品。","m":"敕勒歌，北朝民謠傳千古。","v":1,"src":[{"t":"敕勒歌 - 百度百科","u":"https://baike.baidu.com/item/%E6%95%95%E5%8B%92%E6%AD%8C/82668","d":"2024-09-20"},{"t":"中國古詩文精讀-敕勒歌 - 經典中文文學網","u":"https://www.classicalchineseliterature.org/article.php?article=%E6%95%95%E5%8B%92%E6%AD%8C","d":"2024-09-20"}]},"9-233":{"o":["黃河","黑龍江","珠江"],"x":["《江南》中的江不是黃河","《江南》中的江不是黑龍江","《江南》中的江指的是長江而非珠江"],"w":"《江南》是漢代樂府民歌，歌詠江南採蓮時的愉快情景。詩中「江」泛指長江以南的地區，特指秦漢時期長江以南的湖北、湖南、江西等地。詩歌通過「魚戲蓮葉」的重複描寫，表現江南水鄉的優美意境與勞動人民的歡樂心情。","m":"江南可採蓮，江指長江南。","v":1,"src":[{"t":"《江南》 - 漢樂府","u":"https://zh.wikisource.org/wiki/%E6%B1%9F%E5%8D%97_(%E6%BC%A2%E6%A8%82%E5%BA%9C)","d":"2024-09-20"},{"t":"江南（漢代樂府民歌）- 百度百科","u":"https://baike.baidu.com/item/%E6%B1%9F%E5%8D%97/10633535","d":"2024-09-20"}]},"9-234":{"o":["初秋","仲秋","暮秋"],"x":["三秋不是初秋","三秋不是仲秋","三秋雖涵蓋深秋但更指秋季整體"],"w":"《風》是唐代詩人李嶠的五言絕句。「解落三秋葉」指風能吹落秋季的樹葉。其中「三秋」在古詩中通常指秋季，也可指農曆九月。詩人以擬人手法描寫風的力量，整首詩巧妙地不見「風」字，卻句句寫風的作用。","m":"三秋即秋季，風解落葉忙。","v":1,"src":[{"t":"風·解落三秋葉 - 古文岛","u":"https://www.gushiwen.cn/mingju_1240.aspx","d":"2024-09-20"},{"t":"風（李峤） - 百度百科","u":"https://baike.baidu.com/item","d":"2024-09-20"}]},"9-235":{"o":["比喻","排比","擬人"],"x":["桃花潭比喻友誼但主要修辭是誇張","排比並非此詩主要修辭","擬人不是此詩的主要修辭手法"],"w":"李白《贈汪倫》運用誇張手法。詩人用「潭水深千尺」實際上潭深遠不足千尺這一不符事實的誇張表述，來比喻汪倫對他的友誼之深。「不及」二字更加強了友誼勝於千尺深潭的寓意，充分展現了李白的浪漫主義風格和對友誼的謳歌。","m":"千尺潭不如汪倫情，誇張手法最傳神。","v":1,"src":[{"t":"贈汪倫 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_proses/7829","d":"2024-09-20"},{"t":"贈汪倫 - 中國古詩文精讀","u":"https://www.classicalchineseliterature.org/article.php?article=%E8%B4%88%E6%B1%AA%E5%80%AB","d":"2024-09-20"}]},"9-236":{"o":["詩仙","詩魔","詩傳"],"x":["杜甫被稱為詩聖而非詩仙","詩魔是詩歌研究者的稱號不是詩人稱號","詩傳不是正確的詩人稱號"],"w":"杜甫（712-770）是唐代最偉大的詩人。他一生經歷玄宗、肅宗、代宗三代，其詩全面深刻地反映了唐王朝由盛轉衰的歷史過程。杜甫的詩集稱為「詩史」，後世尊他為「詩聖」。其詩作以寫實聞名，補史證史，是歷史的生動記錄。","m":"杜甫詩史詩聖稱，反映唐代興衰史。","v":1,"src":[{"t":"杜甫 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%9D%9C%E7%94%AB","d":"2024-09-20"}]},"9-237":{"o":["天氣現象","軍事力量","邊塞風景"],"x":["春風不是單純天氣現象，有比喻含義","春風不代表軍事力量","春風不單是邊塞風景"],"w":"王之渙《涼州詞》中「春風不度玉門關」的春風暗指朝廷的恩澤。詩人以春風比喻天子恩典，表達邊塞戍卒遠離朝廷恩澤的遺憾。「春風不度」既寫邊塞的自然荒涼，又借喻朝廷不體恤戍卒艱苦。此詩實為對朝廷疏於關懷邊塞將士的諷刺。","m":"春風喻君恩，邊關不得沾。","v":1,"src":[{"t":"涼州詞 - 中國古詩文精讀","u":"https://www.classicalchineseliterature.org/article.php?article=%E6%B6%BC%E5%B7%9E%E8%A9%9E%EF%BC%88%E5%85%B6%E4%B8%80%EF%BC%89%EF%BC%88%E9%BB%83%E6%B2%B3%E9%81%A0%E4%B8%8A%E7%99%BD%E9%9B%B2%E9%96%93%EF%BC%89","d":"2024-09-20"},{"t":"涼州詞 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_proses/70259","d":"2024-09-20"}]},"9-238":{"o":["端午節","中秋節","春節"],"x":["九月九日不是端午節","九月九日不是中秋節","九月九日不是春節"],"w":"王維《九月九日憶山東兄弟》中的「九月九日」指的是中國傳統重陽節。重陽節在農曆九月初九，古人有登高的習俗，民間流行在此日插茱萸以祛邪增壽。王維17歲時客居長安，逢重陽佳節，想起家鄉的兄弟，遂創作此詩抒發思鄉之情。","m":"九月九重陽，登高念故鄉。","v":1,"src":[{"t":"九月九日憶山東兄弟 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_proses/5650","d":"2024-09-20"},{"t":"九月九日憶山東兄弟 - 中國古詩文精讀","u":"https://www.classicalchineseliterature.org/article.php?article=%E4%B9%9D%E6%9C%88%E4%B9%9D%E6%97%A5%E6%86%B6%E5%B1%B1%E6%9D%B1%E5%85%84%E5%BC%9F","d":"2024-09-20"}]},"9-239":{"o":["白居易","李商隱","孟浩然"],"x":["白居易與柳宗元不是古文運動的主要推動者","李商隱與柳宗元沒有合作推動古文運動","孟浩然是山水詩人而非古文運動領導者"],"w":"柳宗元與韓愈並稱「韓柳」，是唐代古文運動的兩位主要領袖。兩人共同倡導改革文章體裁，主張學習三代兩漢的古文，扭轉駢文華而不實的風氣。柳宗元創作的《江雪》等詩文作品傳世，被尊為唐宋八大家之首。","m":"韓柳並稱古文家，倡導古文復興話。","v":1,"src":[{"t":"古文運動 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%8F%A4%E6%96%87%E8%BF%90%E5%8A%A8","d":"2024-09-20"},{"t":"江雪 - 中國古詩文精讀","u":"https://www.classicalchineseliterature.org/article.php?article=%E6%B1%9F%E9%9B%AA","d":"2024-09-20"}]},"9-240":{"o":["馬致遠","施耐庵","吳承恩"],"x":["馬致遠是雜劇作家不是《三國演義》作者","施耐庵著有《水滸傳》而非《三國演義》","吳承恩著有《西遊記》而非《三國演義》"],"w":"《三國演義》的作者為羅貫中（約1330-1400年）。全稱《三國志通俗演義》，成書於元末明初。羅貫中在民間傳説和藝人創作基礎上，依據陳壽《三國志》等史料，經過巨大創作勞動，寫成了規模宏偉的長篇章回小説，共24卷240回。後經毛綸、毛宗崗父子批改，形成現存的120回版本。","m":"羅貫中著三國，演義傳千古。","v":1,"src":[{"t":"三國演義 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%89%E5%9B%BD%E6%BC%94%E4%B9%89","d":"2024-09-20"},{"t":"羅貫中 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%BD%97%E8%B4%AF%E4%B8%AD","d":"2024-09-20"}]},"9-241":{"o":["張飛","劉備","曹操"],"x":["張飛以勇著稱，非義絕","劉備為仁義之主，但未獲此稱號","曹操以奸詐著稱，被稱奸絕"],"w":"關羽以忠義著稱。在曹營時雖受恩禮，卻不忘初心，華容道義釋曹操，身在曹營心在漢，最終因守義而自刎，堪稱『義絕』。","m":"關羽忠義第一，一生不改志。","n":"《三國演義》中『三絕』為：義絕（關羽）、智絕（諸葛亮）、奸絕（曹操）。","v":1,"src":[{"t":"Wikipedia - 關羽","u":"https://zh.wikipedia.org/zh-tw/%E5%85%B3%E7%BE%BD","d":"2026-09-20"}]},"9-242":{"o":["魯勇","魯力","魯猛"],"x":["非水滸傳人物正名","非水滸傳人物正名","非水滸傳人物正名"],"w":"魯智深是《水滸傳》中的重要人物，為梁山泊英雄之一，星號天孤星。他原名魯達，是渭州人，出身於基層武官。因仗義助人打死惡棍鄭屠，遭官府追捕，逃到五台山文殊院出家為僧，法名智深，因花臂刺青人稱『花和尚』。","m":"魯達仗義殺人逃出家，皈依佛門成智深。","v":1,"src":[{"t":"Wikipedia - 魯智深","u":"https://zh.wikipedia.org/zh-tw/%E9%B2%81%E6%99%BA%E6%B7%B1","d":"2026-09-20"}]},"9-243":{"o":["寶珠","靈璧","仙玉"],"x":["非小説中所記載的玉石","非小説中所記載的玉石","非小説中所記載的玉石"],"w":"《紅樓夢》開篇記載，女媧用頑石補天，留下一塊未用的石頭，得道人與和尚用法力將其雕成玉石，錄名『通靈寶玉』。賈寶玉生時口中銜著此玉，故與其結為一體，成為小説的重要象徵物。","m":"寶玉銜玉生，通靈伴一生。","v":1,"src":[{"t":"CTEXT - 紅樓夢第八回","u":"https://ctext.org/hongloumeng/ch8/zh","d":"2026-09-20"}]},"9-244":{"o":["《三國演義》","《水滸傳》","《紅樓夢》"],"x":["歷史演義小説，以正史為基礎","社會人物傳奇小説，題材來自民間","現實主義家族小説，無神話背景"],"w":"《西遊記》是中國古典四大名著之一，以唐僧西天取經的故事為主軸，融入豐富的神話與民間傳説。全書以孫悟空大鬧天宮等神話故事開篇，融『封神』『西牛賀洲』等中國古代神話於一體，最能代表以神話故事為背景的古典名著。","m":"西遊記神話濃，人妖鬼怪齊上陣。","v":1,"src":[{"t":"Wikipedia - 西遊記","u":"https://zh.wikipedia.org/zh-tw/%E8%A5%BF%E6%B8%B8%E8%AE%B0","d":"2026-09-20"}]},"9-245":{"w":"《紅樓夢》的『金陵十二釵』是小説重點塑造的十二位女性人物。金陵十二釵分為正冊、副冊、又副冊三部分。薛寶琴是薛寶釵的堂妹，出場於小説第四十九回，才貌雙全，獲得賈母寵愛。她雖在小説中刻畫細緻，但並未列入金陵十二釵正冊，後人編訂時才將她列入副冊。","m":"寶琴雖才貌佳，獨不入十二釵。","n":"薛寶琴在賈寶玉夢遊太虛幻境所見的『金陵十二釵』中無判詞，後人編輯時參考其人物重要性，將其編入副冊。","v":1,"src":[{"t":"Wikipedia - 金陵十二釵","u":"https://zh.wikipedia.org/zh-tw/%E9%87%91%E9%99%B5%E5%8D%81%E4%BA%8C%E9%92%97","d":"2026-09-20"}]},"9-246":{"o":["詩經","尚書","周易"],"x":["最早詩歌總集，非詞典","最早歷史文獻，非詞典","最早卜筮經典，非詞典"],"w":"《爾雅》是中國最早的一部訓詁書，也是現存世界上最早的單語言詞典。『爾』即『近』，『雅』即『正』，『爾雅』意為『近正』，旨在使語言接近官方規範。全書共19篇，記錄詞語含義，後世編字典多以其為範本。","m":"爾雅詞典之祖，訓詁最為早。","n":"爾雅成書時期説法不一，但通常認為在西漢時期被整理加工完成，後被列入儒家十三經之一。","v":1,"src":[{"t":"Wikipedia - 爾雅","u":"https://zh.wikipedia.org/zh-hk/%E5%B0%94%E9%9B%85","d":"2026-09-20"}]},"9-247":{"o":["詩經","爾雅","康熙字典"],"x":["古代詩歌總集，非字典","詞典而非字典，成書更早","清代編纂，成書時間遠晚"],"w":"《説文解字》是東漢許慎於公元100年著成的中國首部字典，也是現存最早的字典。許慎歷經21年的研究，歸納540個部首，共收9353個漢字及1163個異體字，開創了部首檢字的先河。書中系統闡述了『六書』（象形、指事、會意、形聲、轉注、假借）學説，成為文字學的奠基之作。","m":"説文解字開先河，許慎六書立規矩。","v":1,"src":[{"t":"Wikipedia - 說文解字","u":"https://zh.wikipedia.org/zh/%E8%AF%B4%E6%96%87%E8%A7%A3%E5%AD%97","d":"2026-09-20"}]},"9-248":{"w":"五經是儒家的五部最重要經典著作，分別為《詩經》《尚書》《禮記》《周易》《春秋》。其中《詩經》是上古詩歌總集，《尚書》是上古歷史文獻，《禮記》記載古代禮儀制度，《周易》是卜筮經典，《春秋》是編年史。五經成書時間跨越商周至春秋時期，是中國傳統文化的重要經典。","m":"詩書禮易春，五經是儒學根。","n":"古代本有『六經』概念（加上『樂經』），但《樂經》因秦火未存，故後世以五經為定數。","v":1,"src":[{"t":"中國文化研究院 - 四書五經","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2755","d":"2026-09-20"}]},"9-249":{"w":"四書是儒家的四部最重要經典著作，分別為《論語》《孟子》《大學》《中庸》。其中《論語》記錄孔子言論，《孟子》記錄孟子思想，《大學》闡述修身齊家治國平天下的理論，《中庸》提倡中道之學。四書的結集與推崇始於宋代朱熹，他編訂《四書章句集註》，使四書逐漸超越五經的地位，成為後世科舉必讀經典。","m":"論孟大中庸，四書是儒家根本。","v":1,"src":[{"t":"台灣宗教知識 - 四書","u":"https://religion.moi.gov.tw/Knowledge/Content?ci=2&cid=664","d":"2026-09-20"}]},"9-250":{"o":["蘇洵、李白、杜甫","蘇軾、杜甫、李白","蘇軾、蘇轍、司馬光"],"x":["李白杜甫非蘇家人，不符題意","杜甫李白非蘇家人，不符題意","司馬光非蘇洵之子，不符題意"],"w":"『三蘇』指北宋著名文學家蘇洵及其二子蘇軾、蘇轍，三人分別被稱為『老蘇』『大蘇』『小蘇』。蘇洵（1009-1066）後發奮讀書，蘇軾（1037-1101）被譽為『中國古代第一全才』，蘇轍（1039-1112）亦是傑出文豪。父子三人均入選『唐宋八大家』，詩賦傳頌千古，文學成就卓越。","m":"一門三父子，都是大文豪。","v":1,"src":[{"t":"Wikipedia - 三蘇","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%89%E8%8B%8F","d":"2026-09-20"}]},"9-251":{"o":["杜甫、白居易","李商隱、杜牧","王維、孟浩然"],"x":["白居易生活在中晚唐，與李白時代相隔較遠","李商隱杜牧為晚唐詩人，與李白杜甫時代不同","王維孟浩然為盛唐詩人，非『詩仙詩聖』代表"],"w":"『李杜』合稱唐代最偉大的兩位詩人。李白（701-762）以『詩仙』聞名，詩風飄逸豪放，代表作有《蜀道難》《將進酒》等。杜甫（712-770）被譽為『詩聖』，詩風沉鬱頓挫，被譽為『詩史』，現存詩歌逾1400首。二人一仙一聖，代表盛唐詩歌的最高成就。","m":"李白詩仙氣飄逸，杜甫詩聖史沉鬱。","v":1,"src":[{"t":"Wikipedia - 李杜","u":"https://zh.wikipedia.org/zh-tw/%E6%9D%8E%E6%9D%9C_(%E7%A7%B0%E5%91%BC)","d":"2026-09-20"}]},"9-252":{"o":["歷史傳記","民間故事","道德寓言"],"x":["歷史傳記為古代文獻體裁，不是小説起源","民間故事是小説的來源之一，但非主要起源","寓言為教化之作，不是小説主要起源"],"w":"中國古典小説有三大主要源頭：神話、寓言及歷史傳記。其中神話傳説乃最重要來源，例如女媧補天、夸父追日、大禹治水等古代神話故事，為後世小説創作提供了豐富想象與文化基礎。這些神話故事在代代相傳的過程中不斷衍變，最終發展為系統的文學創作。","m":"小説源於神話古，遠古故事代代傳。","v":1,"src":[{"t":"中國文化研究院 - 神話傳說及仙話的分別","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2784","d":"2026-09-20"}]},"9-253":{"w":"這道題考查《水滸傳》人物與情節的對應關係。魯智深在水滸傳中最著名的情節是『大鬧野豬林』，拳打洪教頭，保護被害的林沖。而『蔣門神』是《水滸傳》中的另一角色，與武松相關的情節（武松醉打蔣門神），並非魯智深的故事。因此『魯智深，醉打蔣門神』搭配不當。","m":"魯智深大鬧野豬林，蔣門神是武松的對手。","n":"此題答案搭配錯誤。魯智深著名情節應為『大鬧野豬林』或『倒拔垂楊柳』，蔣門神出現在武松的故事中。","v":1,"src":[{"t":"CTEXT - 水滸傳第七回","u":"https://ctext.org/wiki.pl?if=gb&chapter=635667","d":"2026-09-20"}]},"9-254":{"w":"中國古典四大名著是指：《三國演義》《西遊記》《水滸傳》《紅樓夢》。《三國演義》以三國時期歷史為背景，是歷史演義小説。《西遊記》融合神話與民間傳説，以唐僧西天取經為主線。《水滸傳》描寫梁山英雄的故事，是英雄傳奇小説。《紅樓夢》描寫賈家興衰，是現實主義家族小説。四部著作代表了中國古典小説的最高成就。","m":"三西水紅是四大，各具特色皆經典。","v":1,"src":[{"t":"Wikipedia - 四大名著","u":"https://zh.wikipedia.org/zh-tw/%E5%9B%9B%E5%A4%A7%E5%90%8D%E8%91%97","d":"2026-09-20"}]},"9-255":{"o":["范蠡《蠡計》","王昭君《怨詩》","林則徐《林文忠公日記》"],"x":["范蠡著名人物但非此句作者","王昭君是歷史人物但非此句作者","林則徐清代人物，時代不符"],"w":"『先天下之憂而憂，後天下之樂而樂』出自北宋文人政治家范仲淹所著的《岳陽樓記》。此句表達了范仲淹的人生志向與家國情懷，主張官員應以國家安定為優先，先於天下人憂慮，後於天下人享樂。這體現了儒家的責任精神與理想政治抱負。","m":"先憂後樂范仲淹，家國情懷在岳陽。","v":1,"src":[{"t":"維基文庫 - 岳陽樓記","u":"https://zh.wikisource.org/zh-hant/%E5%B2%B3%E9%99%BD%E6%A8%93%E8%A8%98","d":"2026-09-20"}]},"9-256":{"o":["吳敬梓","曹雪芹","馮夢龍"],"x":["吳敬梓著《儒林外史》，非志怪小説","曹雪芹著《紅樓夢》，非志怪小説","馮夢龍著通俗白話小説集，非文言志怪"],"w":"《聊齋志異》是清代著名文言短篇志怪小説集，共收491篇故事，主要記述狐仙鬼怪等奇異故事。作者蒲松齡（1640-1715）是山東淄博人，終身未中進士，為教書餬口。據傳他於村口開茶館，客人可以講述奇異故事作為茶費，蒲松齡將這些民間傳説整理加工，最終寫成《聊齋志異》，被譽為古代文言短篇小説的高峯。","m":"蒲松齡聊齋聞狐仙，志異怪譚傳千年。","v":1,"src":[{"t":"中國文化研究院 - 蒲松齡與《聊齋志異》","u":"https://www.chiculture.org.hk/tc/china-five-thousand-years/2738","d":"2026-09-20"}]},"9-257":{"o":["慶歷清明時節雨紛紛","獨在異鄉為異客","明月幾時有"],"x":["杜牧清明雨詩，無中秋色彩","王維重陽節遊子思鄉，非中秋","蘇軾中秋詞，但此為中秋佳節詩"],"w":"『月上柳梢頭，人約黃昏後』出自北宋歐陽修的《生查子·元夕》，是描寫元宵節（元夜）的愛情詩詞，不是中秋佳節的詩詞。詩歌描繪去年元宵節時月色皎潔、情人相約的温馨場景，以及今年重逢時舊人已去的悲傷對比。此詩易被誤認為中秋詩詞，實則為元宵節詩詞，乃常見混淆之處。","m":"元夕月上柳梢頭，並非中秋佳節詩。","n":"此題易混淆元宵節與中秋節。月上柳梢頭出自元夕詩，中秋佳節詩詞應為如蘇軾『明月幾時有』等作品。","v":1,"src":[{"t":"讀古詩詞網 - 月上柳梢頭賞析","u":"https://fanti.dugushici.com/mingju/12752","d":"2026-09-20"}]},"9-258":{"o":["菊、竹、梅","松、柳、竹","竹、梅、蘭"],"x":["菊花為秋天象徵，非歲寒三友","柳樹春天發芽，冬天凋零，不符要求","蘭花春夏盛開，非歲寒植物"],"w":"『歲寒三友』是中國古代傳統文化中的經典意象，指松、竹、梅三種植物。松樹常綠而挺立，竹子蒼翠而俊秀，梅花在寒冬盛開，三種植物皆能在嚴寒冬季堅強存活，象徵高潔、堅貞、傲骨，被視為君子品德的象徵。宋代以來，三友圖案常見於文人畫與瓷器等工藝品，是中華文化中廣為流傳的審美象徵。","m":"松竹梅三友，歲寒四君子。","v":1,"src":[{"t":"Wikipedia - 歲寒三友","u":"https://zh.wikipedia.org/zh-hant/%E5%B2%81%E5%AF%92%E4%B8%89%E5%8F%8B","d":"2026-09-20"}]},"9-259":{"o":["愛情","鄉愁","親情"],"x":["詩中未提及愛情關係","詩中未涉及思鄉之情","汪倫非親族關係，乃知己好友"],"w":"『桃花潭水深千尺，不及汪倫送我情』出自唐代大詩人李白的《贈汪倫》，描寫的是深厚的友誼。李白遊涇縣桃花潭時，當地友人汪倫以美酒款待，兩人結成知己。李白離別時，汪倫踏歌追來送行。詩中用比喻手法，把無形的友情比作深千尺的潭水，表達了對汪倫真摯友情的讚頌，是傳頌千古的友誼名篇。","m":"潭水深千尺，不及汪倫情。","v":1,"src":[{"t":"讀古詩詞網 - 贈汪倫賞析","u":"https://fanti.dugushici.com/mingju/9281","d":"2026-09-20"}]},"9-260":{"o":["夏季","秋季","冬季"],"x":["杜甫此詩明言『當春乃發生』，季節不符","秋雨為蕭瑟，與『潤物』之意不合","冬雨罕見，與詩意悖離"],"w":"杜甫的詩句『隨風潛入夜，潤物細無聲』出自《春夜喜雨》，描寫的是春季的雨。整首詩『好雨知時節，當春乃發生』開篇即點明春季。春雨滋潤萬物，靜悄悄地在夜間降落，潤澤植物而不張揚，體現了春天的温和與生機。杜甫以擬人化手法，將春雨人格化，讚頌其無聲滋潤萬物的美德。","m":"春夜好雨潤物細，無聲夜色最温柔。","v":1,"src":[{"t":"香港教育局 - 春夜喜雨","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/chi-edu/resources/pth_lt/19_chun_ye_xi_yu.pdf","d":"2026-09-20"}]},"9-261":{"o":["經、史、子、律","經、史、藝、集","經、籍、子、集"],"x":["法律屬於「子部」諸子百家，不是獨立分類","藝術屬於「子部」，不是單獨分類","「籍」不是四庫分類"],"w":"《四庫全書》按照中國古代圖書分類的四部分法編纂，將所有典籍分為經、史、子、集四大部分。經部主要是儒家經典如四書五經；史部是歷史及地理著作；子部包括諸子百家思想及宗教著作；集部則是詩詞文學著作。","m":"經典、歷史、學派、文集——四庫全書四部齊全。","n":"","v":1,"src":[{"t":"維基百科 - 四部分類法","u":"https://zh.wikipedia.org/zh-tw/%E5%9B%9B%E9%83%A8%E5%88%86%E9%A1%9E%E6%B3%95","d":"2026-09-20"}]},"9-262":{"o":["32字","24字","20字"],"x":["每句7字×4句=28字，不是32字","每句7字×4句=28字，不是24字","每句7字×4句=28字，不是20字"],"w":"七言絕句是近體詩的一種，由四句組成，每句七個字。計算方法為：4句×7字/句=28字。這是詩歌創作的基本規則。","m":"七言四句共28字，七乘四就清楚。","n":"","v":1,"src":[{"t":"維基百科 - 七言絕句","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%83%E8%A8%80%E7%B5%95%E5%8F%A5","d":"2026-09-20"}]},"9-263":{"o":["林沖風雪山神廟","武松景陽岡打虎","董卓義裏尋父記"],"x":["林沖是《水滸傳》人物，非《三國演義》","武松是《水滸傳》人物，非《三國演義》","董卓是《三國演義》人物但無此情節"],"w":"「迫上梁山」是《水滸傳》中的著名情節，講述林沖等英雄被迫背井離鄉、投靠梁山的故事。此情節屬於《水滸傳》而非《三國演義》。《三國演義》主要講述三國時期歷史事件。","m":"梁山好漢在《水滸》裏，三國英雄在《演義》中。","n":"迫上梁山是《水滸傳》情節，易與《三國演義》混淆。","v":1,"src":[{"t":"教育百科 - 逼上梁山","u":"https://pedia.cloud.edu.tw/Entry/Detail/?title=%E9%80%BC%E4%B8%8A%E6%A2%81%E5%B1%B1","d":"2026-09-20"}]},"9-264":{"o":["宋朝","元朝","漢朝"],"x":["西安鼓樂源於唐朝，非宋朝","西安鼓樂源於唐朝，非元朝","西安鼓樂源於唐朝，非漢朝"],"w":"西安鼓樂是流傳於西安及周邊地區的傳統音樂形式，起源於唐朝。在安史之亂期間，宮廷樂師流落民間，唐代燕樂傳入民間，發展成為西安鼓樂。它被譽為「中國古代音樂的活化石」，保持著相當完整的曲目、樂器及演奏形式。","m":"西安鼓樂唐朝生，活化石傳至今。","n":"","v":1,"src":[{"t":"中國文化研究院 - 西安鼓樂","u":"https://chiculture.org.hk/sc/china-five-thousand-years/3493","d":"2026-09-20"},{"t":"新華網 - 西安鼓樂傳承","u":"http://www.news.cn/local/2022-08/02/c_1128883760.htm","d":"2022-08-02"}]},"9-265":{"o":["隊樂","遊樂","步樂"],"x":["西安鼓樂分為坐樂和行樂，不是隊樂","西安鼓樂分為坐樂和行樂，不是遊樂","西安鼓樂分為坐樂和行樂，不是步樂"],"w":"西安鼓樂的表演形式主要分為兩種：坐樂是室內或室外固定場地演奏，樂手圍桌而坐；行樂是在街道行進和廟會羣眾場合進行，以曲調為主，節奏樂器伴奏。行樂又分同樂鼓和亂八仙兩種。","m":"坐着奏樂叫坐樂，行進奏樂叫行樂。","n":"","v":1,"src":[{"t":"中國文化研究院 - 西安鼓樂表演形式","u":"https://chiculture.org.hk/sc/china-five-thousand-years/3493","d":"2026-09-20"}]},"9-266":{"o":["城牆遺蹟","兵馬俑坑","華清池温泉"],"x":["城牆遺蹟是西安古都遺蹟，但不如大雁塔著名","兵馬俑在西安郊外秦陵，不是市內著名建築","華清池在驪山，非西安市內著名建築"],"w":"大雁塔始建於唐高宗永徽三年（652年），是玄奘為供奉從天竺帶回的佛經佛像而建的七層磚塔，高64.1米。它是現存最早、規模最大的唐代四方樓閣式磚塔，見證了佛教東傳中原的歷史，2014年被列入世界文化遺產，是古都西安的著名地標。","m":"大雁塔是西安象徵，唐代磚塔最雄偉。","n":"","v":1,"src":[{"t":"新華網 - 大雁塔文化地標","u":"https://www.news.cn/culture/20230510/e66a600ca88a4466b0dd27be56ac50e5/c.html","d":"2023-05-10"}]},"9-267":{"o":["北京","南京","洛陽"],"x":["北京只有遼、金、元、明、清五朝建都，不如西安多","南京不是十三朝古都","洛陽雖有多朝建都，次於西安"],"w":"西安古稱長安，是舉世聞名的世界四大古都之一，居中國四大古都之首。歷史上曾有13個朝代在此建都，包括周、秦、漢、西晉、前趙、前秦、後秦、西魏、北周、隋及唐，歷時近1100年。西安因地勢險要、土地肥沃而被歷代重視，是中國歷史上建都時間最長、建都朝代最多、影響力最大的都城。","m":"長安十三朝，西安是古都首。","n":"","v":1,"src":[{"t":"中國文化研究院 - 古都西安","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1924","d":"2026-09-20"}]},"9-268":{"o":["維園花燈展","利東街燈謎會","荷里活廣場賞月"],"x":["維園花燈展是中秋節活動但非香港獨特傳統","利東街燈謎會不是傳統中秋慶活動","荷里活廣場賞月不是香港中秋獨特活動"],"w":"香港獨特的中秋節慶活動是「大坑舞火龍」，已有超過百年歷史。這個傳統源於1880年大坑村民為驅趕瘟疫而舞動火龍的習俗。每年中秋節（農曆八月十四至十六），300多人舞動67米長的火龍穿梭大坑街道，場面壯觀，是香港非物質文化遺產代表作，2011年列入中國國家非遺名錄。","m":"香港中秋舞火龍，祈福祝安康世世遠。","n":"","v":1,"src":[{"t":"中國文化研究院 - 中秋節大坑舞火龍","u":"https://www.icho.hk/tc/web/icho/representative_list_taihang.html","d":"2026-09-20"},{"t":"香港旅遊發展局 - 大坑舞火龍","u":"https://www.discoverhongkong.com/eng/events/tai-hang-s-fire-dragon-dance.html","d":"2026-09-20"}]},"9-269":{"o":["大篆","隸書","行書"],"x":["秦半兩錢文用小篆書寫，不是大篆","秦半兩錢文用小篆書寫，不是隸書","秦半兩錢文用小篆書寫，不是行書"],"w":"秦朝半兩錢上的「半兩」二字屬於小篆字體，由秦國著名書法家李斯所推行的統一文字。秦始皇統一中國後實施「書同文字」政策，將各國異體字規範整理成小篆，作為統一文字標準。秦半兩錢文體現了這一政策的實施。","m":"秦小篆規範字，半兩錢上見精美。","n":"","v":1,"src":[{"t":"維基百科 - 半兩","u":"https://zh.wikipedia.org/zh-tw/%E5%8D%8A%E4%B8%A4","d":"2026-09-20"}]},"9-270":{"o":["貿易貨幣","祭祀禮品","儲存寶藏"],"x":["漢代金餅不作流通使用，不是貿易貨幣","金餅主要用於賞賜而非祭祀","儲存寶藏的金餅用途不是主要"],"w":"漢代文物「金餅」是高級禮儀品，主要用途是皇帝對官員和貴族的賞賜與饋贈。金餅一般重250克左右，大多數有戳記或銘文。漢代黃金不作流通使用，主要用於賞賜、饋贈、進貢等高級禮儀。漢武帝曾賞賜衞青、霍去病黃金數萬斤，可見當時的賞金之風。","m":"漢代金餅獻殷勤，賞賜官員顯富貴。","n":"","v":1,"src":[{"t":"百度百科 - 漢金餅","u":"https://baike.baidu.com/item/%E6%B1%89%E9%87%91%E9%A5%BC/2862049","d":"2026-09-20"},{"t":"香港古物古蹟辦事處 - 漢代金餅","u":"https://www.amo.gov.hk/tc/visitor-centre/exhibitions/heritage-discovery-centre/han-exhibition/ag12/index.html","d":"2026-09-20"}]},"9-271":{"o":["模板","鑄模","錢鍛"],"x":["模板不是古代錢幣模具的正式稱呼","鑄模用法不準確，應稱錢範","錢鍛不是錢幣模具的正式名稱"],"w":"中國古代鑄造錢幣的模具稱為「錢範」。錢範分為母範和子範兩種：母範用以翻製子範，錢文陽文正書，材質多為銅或石；子範直接用來鑄造錢幣，錢文陰文反書，材質有銅、鐵、土或滑石等。這種模具製造方法自春秋開始使用，沿用至清末。","m":"錢幣模具叫錢範，母子配對來鑄幣。","n":"","v":1,"src":[{"t":"維基百科 - 錢範","u":"https://zh.wikipedia.org/zh-tw/%E9%92%B1%E8%8C%83","d":"2026-09-20"}]},"9-272":{"o":["儒家","墨家","道家"],"x":["秦朝尊崇法家思想治國，不是儒家","秦朝尊崇法家思想，不是墨家","秦朝尊崇法家思想，不是道家"],"w":"秦朝政治思想尊崇法家學説。秦國通過商鞅變法採納法家思想，實現了富國強兵。秦始皇統一中國後，依然以法家思想為治國方針，實施「以法為教，以吏為師」政策，建立了絕對的君主專制制度。法家講求嚴刑峻法、中央集權，與儒家倫理思想形成對比。","m":"秦朝用法家，嚴刑峻法定山河。","n":"","v":1,"src":[{"t":"維基百科 - 法家","u":"https://zh.wikipedia.org/zh-hans/%E6%B3%95%E5%AE%B6","d":"2026-09-20"}]},"9-273":{"o":["城鎮道路寬度","戰車車身長度","馬匹蹄印深度"],"x":["車同軌規範的是輪距而非道路寬度","車同軌規範的是輪距而非車身長度","車同軌規範的是輪距而非馬蹄印"],"w":"秦始皇推行的「車同軌」政策規範的是車輪之間的距離（輪距）。秦朝規定所有車輛的輪距統一為六尺（約合1.38米）。這一政策是秦始皇大一統工程的重要組成部分，與「書同文」「錢同幣」並稱為三大標準化政策，有利於交通運輸的統一和經濟的發展。","m":"車同軌就是統一輪距，六尺為標準。","n":"","v":1,"src":[{"t":"維基百科 - 車同軌","u":"https://zh.wikipedia.org/zh-tw/%E8%BB%8A%E5%90%8C%E8%BB%8C","d":"2026-09-20"},{"t":"中國文化研究院 - 秦朝統一道路及車軌","u":"https://chiculture.org.hk/tc/china-five-thousand-years/462","d":"2026-09-20"}]},"9-274":{"o":["開放市場貿易，鼓勵商業活動","實行鹽鐵專賣制度","推行酒類專賣制度"],"x":["均田制是北魏才實施的制度，漢武帝未推行","實行鹽鐵專賣是漢武帝新經濟政策","實行酒類專賣是漢武帝新經濟政策"],"w":"漢武帝推行的新經濟政策包括實行鹽鐵酒類專賣、設立平準官控制物價等措施，目的是增加政府收入用於對外用兵。但均田制是北魏在386年才開始實施的土地分配製度，漢武帝時代並未實行此政策。均田制是更晚期的農業政策。","m":"漢武帝用專賣增收入，均田制是後代事。","n":"均田制是北魏才開始推行，不屬漢武帝政策。","v":1,"src":[{"t":"維基百科 - 漢武帝","u":"https://zh.wikipedia.org/zh-hk/%E6%B1%89%E6%AD%A6%E5%B8%9D","d":"2026-09-20"}]},"9-275":{"o":["閩越","東越","西南夷"],"x":["漢武帝征伐的是南越，不是閩越","漢武帝征伐的是南越，不是東越","西南夷不是國家，是各部落總稱"],"w":"漢武帝在位期間派遣遠征軍於元鼎五年（前112年）征服了南越國。戰爭中漢軍兵分五路，最終用一年時間平定了南越。戰後漢武帝在南越地區設置儋耳、珠崖、南海、蒼梧、鬱林、交趾等九郡，今日的廣東、廣西、海南及越南北部地區都納入了漢朝版圖。","m":"漢武帝南越征，開拓領土到嶺南。","n":"","v":1,"src":[{"t":"維基百科 - 南越國","u":"https://zh.wikipedia.org/zh-hant/%E5%8D%97%E8%B6%8A%E5%9B%BD","d":"2026-09-20"}]},"9-276":{"o":["修築長城防線","開闢駱駝商道","興建阿房宮"],"x":["開通靈渠是秦始皇政令，長城建築非秦首創","秦代未開闢駱駝商道","阿房宮是秦始皇宮殿，不是靈渠"],"w":"開通靈渠是秦始皇推行的重要政令。秦始皇三十三年（前214年），秦始皇命監御史祿開鑿靈渠，打通湘江與灕江之間的水上交通，以轉運糧餉和補充兵員，用於征伐嶺南百越。靈渠竣成後，大批北方軍民遷徙嶺南，嶺南地區正式納入中原王朝版圖，成為先秦三大水利工程之一。","m":"靈渠打通湘漓間，秦朝糧道通南蠻。","n":"","v":1,"src":[{"t":"中國地情網 - 興安靈渠","u":"https://zhongguodiqing.cn/zgzz/202110/t20211011_5366297.shtml","d":"2021-10-11"}]},"9-277":{"o":["仁義禮樂，儒家思想","嚴刑峻法，法家治國","得道者昌，天人感應"],"x":["漢高祖奉行無為而治，不是純儒家仁義思想","漢高祖不奉行秦朝的法家嚴刑","天人感應是漢武帝時期的思想"],"w":"漢高祖劉邦立國後奉行「黃老思想」，採取「無為而治」和「崇尚自然」的治國理念。這是對秦朝法家苛政的反思，目的是讓人民休養生息、恢復經濟。漢初實行十五税一制（田租為收成的1/15），是輕徭薄賦政策的明顯體現，使被秦朝戰爭摧殘的國家得以恢復。","m":"漢初無為治天下，休養生息百姓樂。","n":"","v":1,"src":[{"t":"中國文化研究院 - 開國神話漢高祖劉邦","u":"https://chiculture.org.hk/tc/china-five-thousand-years/4296","d":"2026-09-20"}]},"9-278":{"o":["土質陶體簡陋粗糙","表面光滑無任何紋飾","製作完成後經高温燒製"],"x":["秦俑土質並不簡陋，工藝精細","秦俑表面有詳細紋飾和彩繪","秦俑獨特之處在於彩繪顏色"],"w":"秦代兵馬俑在製作工藝方面的獨特之處在於有彩繪顏色。工匠們先在陶俑表面刷生漆層，乾後再繪製顏色。秦俑採用的色料主要為天然礦石，包括朱紅、紫紅、粉紅、深綠、粉綠、粉紫、藍色、黑色等十多種顏色，共有8種顏色20種色調。當年兵馬俑出土時這些彩繪才是其真實風貌。","m":"秦俑彩繪絢爛麗，出土瞬間見真容。","n":"","v":1,"src":[{"t":"人民網 - 秦俑彩繪","u":"http://culture.people.com.cn/BIG5/n/2014/0929/c172318-25760656.html","d":"2014-09-29"}]},"9-279":{"o":["紅色","白色","黃色"],"x":["秦尚水德對應黑色，不是紅色","秦尚水德對應黑色，不是白色","秦尚水德對應黑色，不是黃色"],"w":"秦朝尊崇「水德」，根據五行學説中北方對應水、水對應黑色的理論，秦始皇將黑色定為秦朝的國色。衣服、旄旌（旗幟上的垂飾）、節旗（官員的儀仗旗幟）都以黑色為主。這一政策體現了秦朝對阿陽五行學説的推崇，認為秦是以水德取代周朝火德。","m":"秦朝尚水德，黑色定國色。","n":"","v":1,"src":[{"t":"中新網 - 秦人崇尚黑色水德","u":"https://www.chinanews.com.cn/m/cul/2016/01-06/7704398.shtml","d":"2016-01-06"},{"t":"人民網 - 秦人為何愛黑色","u":"http://culture.people.com.cn/BIG5/n1/2016/0106/c172318-28020693.html","d":"2016-01-06"}]},"9-280":{"w":"「長樂未央」是漢代瓦當上的常見文字，代表著長久歡樂、永無盡頭。「未央」最早出自《詩經·庭燎》，本義為夜晚未盡。西漢宮殿以「長樂」為名，是帝王對與臣民長期和睦相處的願望。瓦當文字集中體現了古人對美好生活的嚮往，寓意國泰民安、政治清明、風調雨順。","m":"長樂未央寄願望，祝福萬歲永安康。","n":"","v":1,"src":[{"t":"百度百科 - 漢長樂未央瓦當","u":"https://baike.baidu.com/item/%E6%B1%89%E9%95%BF%E4%B9%90%E6%9C%AA%E5%A4%AE%E7%93%A6%E5%BD%93/3125849","d":"2026-09-20"},{"t":"MOE成語字典 - 長樂未央","u":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=11369&webMd=1&la=1","d":"2026-09-20"}]},"9-281":{"o":["大月氏","康居","大夏"],"x":["大月氏曾是張騫聯絡的夥伴，但第二次出使的主要目標並非大月氏","康居地處西域，但非第二次出使的主要聯合對象","大夏（大蕃）地距遙遠，不是第二次出使的首要聯絡國"],"w":"漢武帝欲「斷匈奴右臂」，故第二次派張騫出使西域時，主要任務是聯合烏孫國共同對抗匈奴。張騫建議向烏孫餽贈豐厚禮物，促使其東遷回故地並與漢朝結盟，此策略對穩定西域、削弱匈奴勢力極為關鍵。","m":"二次騫使烏孫，斷臂匈奴心。","n":"","v":1,"src":[{"t":"【漢】張騫第二次出使西域 (重點課題資源) - 教育局教育多媒體","u":"https://emm.edcity.hk/media/1_fwvkzuvh","d":"2026-09-20"},{"t":"張騫 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E9%A8%AB","d":"2026-09-20"},{"t":"Maritime Silk Road Society 海上絲綢之路協會","u":"https://maritimesilkroad.org.hk/tc/news/articlesDetail/144","d":"2026-09-20"}]},"9-282":{"o":["東漢","三國","晉朝"],"x":["東漢雖有後期混亂但並未被王莽篡奪","三國為東漢之後的時代，非王莽所建","晉朝更是遠後於新朝的朝代"],"w":"西漢末年外戚專權導致中央權力衰弱。王莽利用外戚身份一步步登上權力頂峯，於公元9年以偽造符瑞方式廢除孺子嬰，自立為帝建立新朝，終結西漢211年統治。","m":"外戚專權惡果，王莽新朝生。","n":"","v":1,"src":[{"t":"王莽篡漢後東漢仍重用外戚 不是學不乖 背後藏皇權困境 - 中時新聞網","u":"https://www.chinatimes.com/hottopic/20260803001426-260812","d":"2026-09-20"},{"t":"王莽 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%8E%8B%E8%8E%BD","d":"2026-09-20"},{"t":"新朝 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/%E6%96%B0%E6%9C%9D","d":"2026-09-20"}]},"9-283":{"o":["西域軍司令部","西域長史府","西域副都護"],"x":["西域軍司令部非正式機構名稱","西域長史府為下級行政機構，非班超主要成就","西域副都護為輔助職位，班超是都護而非副都護"],"w":"東漢明帝派班超出使西域，經過三十多年的不懈努力，班超成功使西域各國重新歸順漢室。永元三年被正式任命為西域都護，建立起對西域五十餘國的有效統治。西域都護府是漢代對西域行政管理的重要機構。","m":"班超三十年，重置西域府。","n":"","v":1,"src":[{"t":"班超 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E7%8F%AD%E8%B6%85","d":"2026-09-20"},{"t":"西域都護府 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/%E8%A5%BF%E5%9F%9F%E9%83%BD%E8%AD%B7%E5%BA%9C","d":"2026-09-20"},{"t":"班超再通西域 - 百度百科","u":"https://baike.baidu.com/item/%E7%8F%AD%E8%B6%85%E5%86%8D%E9%80%9A%E8%A5%BF%E5%9F%9F/366174","d":"2026-09-20"}]},"9-284":{"o":["董卓","呂布","孫權"],"x":["董卓雖專權但並未挾持漢獻帝至許昌","呂布為獨立軍閥，無此戰略舉措","孫權於南方獨立，與此事無涉"],"w":"東漢末年州牧割據導致中央權力崩潰。曹操遵從謀臣荀彧的建議，於196年迎接漢獻帝至許昌（今河南省許昌市），以「挾天子以令諸侯」的策略取得名義上的合法性，從而得以號令各路諸侯，奠定其統一北方的基礎。","m":"曹操挾帝至許昌，諸侯令從響。","n":"","v":1,"src":[{"t":"曹操迎天子 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E6%9B%B9%E6%93%8D%E8%BF%8E%E5%A4%A9%E5%AD%90","d":"2026-09-20"},{"t":"挾天子以令諸侯 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E6%8C%9F%E5%A4%A9%E5%AD%90%E4%BB%A5%E4%BB%A4%E8%AF%B8%E4%BE%AF","d":"2026-09-20"}]},"9-285":{"o":["青銅器","玉器","鐵器"],"x":["青銅器亦有發現但數量遠少於陶器","玉器為少量陪葬品，非主要出土文物","鐵器出土數量亦少於陶器"],"w":"香港地區漢代遺址的考古發掘中，陶器是最主要的出土文物，包括炊煮器、飲食器、貯藏器和陶屋等多種類型。李鄭屋漢墓出土的五十件陶器佔陪葬品大多數，其餘為青銅器等珍貴品。陶器之豐富反映了漢代香港地區的物質文化發展。","m":"香港漢物主陶器，日常生活見分明。","n":"","v":1,"src":[{"t":"李鄭屋漢墓：揭示香港兩千年前的身份 - 香港政府位置地政總署","u":"http://big5.locpg.gov.cn/jsdt/2023-09/28/c_1212278022.htm","d":"2026-09-20"},{"t":"古物古蹟辦事處 - 網上文章 - 香港特區政府","u":"https://www.amo.gov.hk/tc/about-us/online-articles/20260305/index.html","d":"2026-09-20"},{"t":"香港歷史博物館 - 從考古文物看漢代香港","u":"https://hk.history.museum/tc/web/mh/publications/spa_2010-01-08_01.html","d":"2026-09-20"}]},"9-286":{"o":["1952","1958","1960"],"x":["1952年為過早，實際發現時間更晚","1958年為發現後的後期","1960年遠後於實際發現年份"],"w":"李鄭屋漢墓於1955年8月在香港九龍深水埗地區被發現。當時香港政府興建徙置大廈時出土了這座東漢時期的墓葬。由於該地曾是客家人「李屋村」與「鄭屋村」的聚居地，故稱之為「李鄭屋漢墓」。1988年該墓葬被列為法定古蹟，現設博物館供公眾參觀。","m":"一九五五年八月，深水埗發現古墓。","n":"","v":1,"src":[{"t":"李鄭屋漢墓：揭示香港兩千年前的身份 - 香港政府","u":"http://big5.locpg.gov.cn/jsdt/2023-09/28/c_1212278022.htm","d":"2026-09-20"},{"t":"香港自遊樂在18區 - 李鄭屋漢墓博物館及漢花園","u":"https://www.gohk.gov.hk/tc/spots/spot_detail.php?spot=Lei+Cheng+Uk+Han+Tomb+Museum+and+Han+Garden","d":"2026-09-20"},{"t":"香港歷史博物館 - 李鄭屋漢墓","u":"https://hk.history.museum/tc/web/mh/about-us/lei-cheng-uk-han-tomb.html","d":"2026-09-20"}]},"9-287":{"o":["蒙恬","彭越","英布"],"x":["蒙恬為秦朝名將，與「多多益善」典故無關","彭越為漢初諸侯王，非出現在此成語故事中","英布為黥布，雖為名將但與此故事無關"],"w":"「多多益善」成語源自《史記·淮陰侯列傳》。漢武帝曾問韓信能統領多少兵馬，韓信答可統領一百萬。武帝笑言自己最多統領十萬，韓信答曰「陛下雖不能將兵，但善於將將」—— 意思是皇帝統治將軍的能力在於任用賢能，而非親自領兵，故需要的將才越多越好。","m":"韓信將兵多多益善，知人善任乃帝王。","n":"","v":1,"src":[{"t":"韓信帶兵 多多益善 - 當代中國","u":"https://www.ourchinastory.com/zh/5359/%E9%9F%93%E4%BF%A1%E5%B8%B6%E5%85%B5%20%E5%A4%9A%E5%A4%9A%E7%9B%8A%E5%96%84","d":"2026-09-20"},{"t":"【成語故事】多多益善 - 明慧網","u":"https://big5.minghui.org/mh/articles/2006/5/14/127394.html","d":"2026-09-20"}]},"9-288":{"o":["以代言體敍故事","載歌載舞的表演","融詩樂舞於一體"],"x":["代言體是特點但非核心定義","載歌載舞為形式特色，非核心定義","融合多元素但未能精確概括戲曲本質"],"w":"王國維在《宋元戲曲史》中對中國戲曲進行了經典定義，認為戲曲的核心在於「以歌舞演故事」。這個定義強調了歌、舞、故事三者的結合，是戲曲區別於詩歌、舞蹈等其他文藝形式的根本特徵，對後世戲曲研究產生深遠影響。","m":"王國維定義妙，歌舞演故事為核心。","n":"","v":1,"src":[{"t":"戲曲 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%88%8F%E6%9B%B2","d":"2026-09-20"},{"t":"與文字約會 - 香港電台","u":"https://app7.rthk.hk/special/adatewithreading/article.php?id=325","d":"2026-09-20"},{"t":"宋元戲曲史 - 中國哲學書電子化計劃","u":"https://ctext.org/wiki.pl?if=gb&res=228945","d":"2026-09-20"}]},"9-289":{"o":["唐代雜劇","宋代南戲","元代北曲"],"x":["唐代雜劇雖有發展但不是小戲源頭","宋代南戲形成較晚，非小戲最初源頭","元代北曲更是後出，無法成為小戲源頭"],"w":"中國戲曲「小戲」的源頭追溯至漢代百戲。漢代「百戲」（又稱「散樂」、「角觝戲」）已具雛型，多表現世俗生活故事，是戲劇表演藝術的早期形態。從漢代百戲發展到唐代「戲弄」（優戲），再到宋元南北戲的成熟，小戲始終保留著這一傳統的血脈。","m":"百戲播種子，小戲接薪火。","n":"","v":1,"src":[{"t":"戲曲 - 維基百科粵語版","u":"https://zh-yue.wikipedia.org/wiki/%E6%88%B2%E6%9B%B2","d":"2026-09-20"},{"t":"中國戲曲 - 教育局","u":"https://www.edb.gov.hk/tc/curriculum-development/kla/arts-edu/resources/mus-chinese-opera/index.html","d":"2026-09-20"},{"t":"戲曲 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E6%88%B2%E6%9B%B2","d":"2026-09-20"}]},"9-290":{"o":["崑山腔","京劇","越劇"],"x":["崑山腔是崑曲原名但傳播範圍不如崑曲國際化","京劇雖為國粹但成熟年代較晚，非「戲曲之母」","越劇為現代創編劇種，更非此榮譽得主"],"w":"崑曲於2001年被聯合國教科文組織列為「人類口述和非物質文化遺產代表作」。作為源於蘇州地區的古老劇種，崑曲集戲劇、音樂、舞蹈、武術於一身，藝術內涵深厚，在中國戲曲史上具有「戲曲之母」、「百戲之師」的重要地位，對後世各種地方戲曲產生了深遠影響。","m":"崑曲二零零一年，聯合國認其母。","n":"","v":1,"src":[{"t":"崑曲因何被稱為中國「百戲之祖」 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1298","d":"2026-09-20"},{"t":"中國有哪些項目入選世界遺產名單 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2713","d":"2026-09-20"},{"t":"部分非物質文化遺産項目介紹——崑曲 - 中國政府網","u":"http://big5.www.gov.cn/gate/big5/www.gov.cn/ztzl/whycr/content_638409.htm","d":"2026-09-20"}]},"9-291":{"o":["馬腔、薛腔、桂腔、廖腔、陳腔","薛腔、馬腔、廖腔、白腔、駱腔","薛腔、馬腔、廖腔、桂腔、阮腔"],"x":["陳腔並非粵劇五大流派之一","駱腔非傳統五大流派的標準説法","阮腔亦非官方認可的五大流派"],"w":"粵劇流派藝術的第一個高峯期出現於二十世紀上半葉，以薛覺先、馬師曾、廖俠懷、桂名揚、白駒榮五位大師創立的五大流派為標誌。這五大流派分別體現了各自獨特的唱腔風格，其中薛腔清亮流暢，馬腔蒼勁有力，廖腔帶有鼻音特色，桂腔融薛馬之長，白腔別具一格，共同推進了粵劇的藝術發展。","m":"五大流派薛馬廖桂白，各領風騷百年半。","n":"","v":1,"src":[{"t":"粵劇如何表現唱腔和說白 - 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/3340","d":"2026-09-20"},{"t":"粵劇 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E7%B2%B5%E5%8A%87","d":"2026-09-20"},{"t":"粵劇五大流派的說法 - Opera Preview","u":"https://www.operapreview.com/index.php/%E7%B6%B2%E4%B8%8A%E9%9B%9C%E8%AA%8C/item/1596-%E7%B2%B5%E5%8A%87%E4%BA%94%E5%A4%A7%E6%B5%81%E6%B4%BE%E7%9A%84%E8%AA%AA%E6%B3%95","d":"2026-09-20"}]},"9-292":{"o":["神功戲依次為《賀壽》《跳加官》《六國封相》《天姬送子》","神功戲依次為《賀壽》《六國封相》《跳加官》《天姬送子》","神功戲依次為《賀壽》《天姬送子》《跳加官》《六國封相》"],"x":["此順序混淆了《六國封相》和《跳加官》的位置","此順序將《六國封相》提前，違反傳統習俗","此順序完全顛倒了後三齣例戲的順序"],"w":"香港粵劇「神功戲」是祭祀神靈的傳統戲台活動，其例戲（開台例戲）依次序為《賀壽》（香花山大賀壽或小賀壽）、《跳加官》、《六國封相》、《天姬送子》。其中《六國封相》通常僅在首晚演出，這一順序由來已久，是粵劇傳統習俗的體現。","m":"神功例戲賀加封送子，序列莫亂記分明。","n":"題目陳述順序有誤：應為《賀壽》、《跳加官》、《六國封相》、《天姬送子》。","v":1,"src":[{"t":"神功戲 (香港) - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E7%A5%9E%E5%8A%9F%E6%88%B2_(%E9%A6%99%E6%B8%AF)","d":"2026-09-20"},{"t":"香港非物質文化遺產項目 - 香港政府","u":"https://www.hkichdb.gov.hk/zht/item.html?bf20c45b-b843-4dd8-861f-17f95e5dc799=","d":"2026-09-20"},{"t":"神功戲指南 - art-mate.net","u":"https://www.art-mate.net/muse/cantoneseoperaforappeasingods","d":"2026-09-20"}]},"9-293":{"o":["商高宗","商湯王","商成湯"],"x":["商高宗為商代中期君主，非成語故事所述主角","商湯王為商朝開國君主，非靡靡之音時代的君主","商成湯同為商朝開國者，非商紂王"],"w":"成語「靡靡之音」出自《韓非子·十過》。相傳商紂王時期樂官師延創作浮靡頹廢的音樂取悦紂王，導致紂王沉溺於酒色享樂，最終國家衰亡。後世以「靡靡之音」比喻能使人喪志敗德的腐蝕性文化，是儒家政治教化論中批評的典型案例。","m":"商紂靡靡音，亡國警世人。","n":"","v":1,"src":[{"t":"靡靡之音的解釋 - 漢典","u":"https://zdic.net/hant/%E9%9D%A1%E9%9D%A1%E4%B9%8B%E9%9F%B3","d":"2026-09-20"},{"t":"靡靡之音-歷史典故 - 印象河南","u":"http://www.yxhenan.com/info/hb/lsdg_13645_1430.html","d":"2026-09-20"},{"t":"靡靡之樂 - 百度百科","u":"https://baike.baidu.com/item/%E9%9D%A1%E9%9D%A1%E4%B9%8B%E4%B9%90/4846707","d":"2026-09-20"}]},"9-294":{"o":["西藏","青海","寧夏"],"x":["西藏民歌風格迥異，非《青春舞曲》來源","青海民歌特色差異，《青春舞曲》源自新疆","寧夏民歌文化與新疆維吾爾族民樂有別"],"w":"《青春舞曲》源自新疆維吾爾族民歌。1939年著名音樂家王洛賓在整理西北音樂時收集到這首民謠，後改編成現代歌曲。歌詞以「太陽下山明早依舊爬上來，花兒謝了明年還是一樣的開」等哲理性意象，傳達對青春、生命和人生輪迴的思考，具有濃厚的新疆民族特色。","m":"青春舞曲自新疆，維族民歌王洛賓傳。","n":"","v":1,"src":[{"t":"青春舞曲（王洛賓根據新疆維吾爾族民歌改編） - 百度百科","u":"https://baike.baidu.com/item/%E9%9D%92%E6%98%A5%E8%88%9E%E6%9B%B2/1109071","d":"2026-09-20"},{"t":"【歌曲賞析】王洛賓《青春舞曲》","u":"https://blog.udn.com/yite32/112011983","d":"2026-09-20"},{"t":"新疆民歌【青春舞曲】","u":"https://m.fysongs.com/songku_show.asp?id=38777","d":"2026-09-20"}]},"9-295":{"o":["梅蘭芳","程硯秋","尚小雲"],"x":["梅蘭芳為四大名旦之首，非「不是」","程硯秋為四大名旦之一，非「不是」","尚小雲為四大名旦之一，非「不是」"],"w":"京劇四大名旦係指民國十六年（1927年）由北京《順天時報》評選出的梅蘭芳、程硯秋、尚小雲、荀慧生四位著名旦角演員。楊小樓（1878—1938）為京劇武生一代宗師，與梅蘭芳、餘叔巖並稱「三大賢」，但他是武生而非旦角，故不在四大名旦之列。","m":"四大名旦皆旦角，楊小樓武生非其類。","n":"楊小樓為武生宗師而非旦角，故確實不是京劇四大名旦。四大名旦為梅蘭芳、程硯秋、尚小雲、荀慧生。","v":1,"src":[{"t":"京劇四大名旦 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E4%BA%AC%E5%89%A7%E5%9B%9B%E5%A4%A7%E5%90%8D%E6%97%A6","d":"2026-09-20"},{"t":"楊小樓 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E6%9D%A8%E5%B0%8F%E6%A5%BC","d":"2026-09-20"}]},"9-296":{"o":["才子佳人戲、英雄故事戲、家族恩怨戲","悲劇戲、喜劇戲、悲喜交雜戲","歷史戲、傳奇戲、現代戲"],"x":["才子佳人只是南戲常見題材，非系統分類","悲喜分類過於籠統，未反映南戲特點","歷史時代分類亦非南戲題材的正式分類"],"w":"南戲題材主要分為三類：一為「負心戲」，描寫男性背棄或拋棄女性的故事；二為「迫婚戲」，表現被強制婚配或反抗包辦婚姻的情節；三為「身份戲」，涉及身份認同、身份轉變或身份衝突的戲碼。這三大類題材反映了中國古代城市中下層民眾對愛情、婚姻和社會地位的真實關切，具有濃厚的民間色彩。","m":"負心迫婚身份戲，南戲三類映民心。","n":"","v":1,"src":[{"t":"南戲 - 維基百科","u":"https://zh.wikipedia.org/wiki/%E5%8D%97%E6%88%B2","d":"2026-09-20"},{"t":"「戲」在民間——成大王三慶談「南戲」裡的庶民趣味","u":"https://humanityisland.nccu.edu.tw/sanchingwang_a/","d":"2026-09-20"},{"t":"元代文學--21南戲的興起 - E寶月刊","u":"https://www.ebaomonthly.com/window/reading/chlit/ch6/ch6_21.htm","d":"2026-09-20"}]},"9-297":{"o":["檐幕或檐","防幕","天幕"],"x":["檐幕或簡稱檐是舞台上方的橫幕，功能與眉幕相同但為北方術語","防幕係指舞台側面的幕布，非舞台上方","天幕為舞台後景幕，功能不同於眉幕"],"w":"舞台表演區上方的布幕稱為「眉幕」，亦稱「檐幕」。眉幕懸掛在舞台台口（舞台與觀眾席分界線）上方，與左右兩側的側簾幕相配合，主要作用是遮擋舞台上空的燈光、吊杆等舞台機械裝置，使觀眾視線集中在表演區域，並能靈活控制舞台的視覺空間。","m":"眉幕掛台口，隱藏燈光幕後功。","n":"","v":1,"src":[{"t":"劇場及舞台演出常用名詞術語解釋 - 燈光音響學習網","u":"https://www.dgyxpxsp.com/index.php?m=home&c=View&a=index&aid=551","d":"2026-09-20"},{"t":"舞台幕布 - 百度百科","u":"https://baike.baidu.com/item/%E8%88%9E%E5%8F%B0%E5%B9%95%E5%B8%83/7020883","d":"2026-09-20"},{"t":"劇院及活動舞台幕布完全指南 - ShowTex","u":"https://www.showtex.cn/zh-hans/blog/bu-liao-gou-mai-zhi-nan/ju-yuan-ji-huo-dong-wu-tai-mu-bu-wan-quan-zhi-nan","d":"2026-09-20"}]},"9-298":{"o":["浙江","安徽","山東"],"x":["浙江為其他民歌主要來源地，非《茉莉花》","安徽民歌特色差異，《茉莉花》源自江蘇","山東民歌與江蘇民族音樂風格有別"],"w":"《茉莉花》是江蘇民歌，源於南京流傳數百年的民間樂曲《鮮花調》。1939年何仿從民間藝人處學得此曲，1957年正式改編並統一歌詞使其專注於茉莉花主題。該歌以簡潔優美的旋律和象徵純潔高雅的花卉意象，成為中國文化的國際代表，曾在香港回歸、奧運等重大場景亮相。","m":"茉莉花江蘇傳，南京鮮花調百年。","n":"","v":1,"src":[{"t":"茉莉花(江蘇民歌) - Spotify","u":"https://open.spotify.com/track/0s8tWTRo9QO4fnvxgWl0so","d":"2026-09-20"},{"t":"好一朵「傳唱」海外的茉莉花","u":"https://m.newsduan.com/static/content/MP/2023-06-28/1123536549737676800.html","d":"2026-09-20"},{"t":"茉莉花（1957年何仿改編的歌曲） - 百度百科","u":"https://baike.baidu.com/item/%E8%8C%89%E8%8E%89%E8%8A%B1/3899313","d":"2026-09-20"}]},"9-299":{"o":["李成","範寬","李昭道"],"x":["李成為北宋畫家，非五代人，風格亦異於《瀟湘圖》","範寬為北宋山水大師，時代晚於董源","李昭道為唐代畫家，時代更早，風格亦異"],"w":"《瀟湘圖》卷為五代南唐畫家董源的山水名作，現藏北京故宮。董源（934—約962）是南派山水畫的開山鼻祖，字叔達，江西進賢人，曾任南唐北苑副使。此圖以水墨間淡色，以點子皴法描繪平遠山水，山勢平緩連綿，大片水面中沙洲蘆渚映帶無窮，是南派山水畫風格的典型代表。","m":"董源五代南派祖，瀟湘圖卷北苑書。","n":"","v":1,"src":[{"t":"五代畫家董源的《潇湘图》 - 中國文人畫博覽園","u":"https://www.zgwrh.com/mingjiamingzuo/64.html","d":"2026-09-20"},{"t":"董源潇湘图卷 - 故宮博物院","u":"https://www.dpm.org.cn/collection/paint/234585.html","d":"2026-09-20"},{"t":"潇湘图（五代南唐董源畫作） - 百度百科","u":"https://baike.baidu.com/item/%E6%BD%87%E6%B9%98%E5%9B%BE/1892698","d":"2026-09-20"}]},"9-300":{"o":["音樂界","舞蹈界","文學界"],"x":["音樂界為聲樂相關，與梨園指戲曲界無關","舞蹈界為純舞蹈藝術，《梨園》特指戲曲","文學界為文字創作領域，非梨園所代"],"w":"「梨園」是中國古代對戲曲班子和戲曲演員的代稱。其典故源於唐朝，唐玄宗曾在皇宮梨園內集聚伶人三百人進行歌舞訓練。後世遂以「梨園」泛指戲班，稱戲曲演員為「梨園子弟」，稱幾代從事戲曲家族為「梨園世家」。歷經千年，這一稱呼已成為戲曲界的文化標誌。","m":"梨園唐代始，千年代稱戲曲師。","n":"","v":1,"src":[{"t":"梨園 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%A2%A8%E5%9B%AD","d":"2026-09-20"},{"t":"國立傳統藝術中心-梨園典故","u":"https://www.ncfta.gov.tw/cp.aspx?n=1778","d":"2026-09-20"}]},"8-1":{"o":["班超","蘇武","李廣"],"x":["班超主要護送西域諸國使節回漢，未有出使西域促成絲綢之路貫通的使命","蘇武主要作為漢使被匈奴俘虜，事蹟與絲綢之路關係不大","李廣為漢代將軍，對西域開拓無直接貢獻"],"w":"張騫奉漢武帝之命於建元二年（公元前139年）首次出使西域，歷經艱險13年，親自接觸大月氏、康居、大宛等西域各國，瞭解西域地理、物產與風俗，打通了橫貫中西的通道，史稱『鑿空』，奠定了後世絲綢之路的基礎。","m":"張騫鑿空西域，絲路始通暢。","src":[{"t":"知史 - 張騫與絲綢之路","u":"https://mychistory.com/a001-2/c0085","d":"2026-09-20"},{"t":"張騫 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E9%A8%AB","d":"2026-09-20"}],"v":1},"8-6":{"o":["西遊記","貞觀大唐傳","西域見聞錄"],"x":["《西遊記》是明代吳承恩創作的小説，非玄奘本人著作","《貞觀大唐傳》非玄奘著作","《西域見聞錄》並非玄奘的作品"],"w":"玄奘於貞觀三年（629年）西行求法，於645年返回長安時，攜回657部佛經。玄奘口述、弟子辯機筆撰的《大唐西域記》共12卷，詳細記錄了玄奘經過的110多個國家的地理、民族、言語、風俗與物產，成為研究7世紀西域歷史的重要文獻。","m":"玄奘西遊記述詳，《大唐西域記》傳。","src":[{"t":"大唐西域記 - Wikipedia","u":"https://ja.wikipedia.org/wiki/%E5%A4%A7%E5%94%90%E8%A5%BF%E5%9F%9F%E8%A8%98","d":"2026-09-20"},{"t":"大唐西域記","u":"https://www.y-history.net/appendix/wh0302-058.html","d":"2026-09-20"}],"v":1},"8-7":{"o":["《孝經》","《周易》","《詩經》"],"x":["《孝經》雖是儒家重要著作，但傳入歐洲最早的並非此書","《周易》雖有哲學價值，但並非首先被譯成拉丁文的儒家經典","《詩經》傳入歐洲時間較晚"],"w":"意大利耶穌會傳教士利瑪竇於16世紀末（約400多年前）到達中國，他尊重儒學，將《論語》的主要內容譯成拉丁文並帶回歐洲，這是孔子學説首次以系統的方式傳入西方，對啟蒙運動時期歐洲思想家產生了重大影響。","m":"利瑪竇譯論語，儒學傳歐洲。","src":[{"t":"孔子怎樣成為聖人？ | 中國文化研究院","u":"https://chiculture.org.hk/tc/china-five-thousand-years/256","d":"2026-09-20"}],"v":1},"8-10":{"o":["南宋","明朝","清朝"],"x":["南宋時中國經濟發達但政治割據，馬可波羅並未於此時來華","明朝時傳教士來華但馬可波羅不在此時代","清朝時馬可波羅已去世數百年"],"w":"馬可·波羅（1254-1324）是威尼斯商人及探險家。於1271年隨父親和叔叔經絲綢之路東行，於1275年抵達元朝的上都（開平）及大都（北京）。1292年奉忽必烈之命護送蒙古公主經海路到伊兒汗國，1295年返回歐洲。馬可波羅的遊記讓歐洲人深入瞭解中亞及中國。","m":"馬可波羅訪元朝，遊記傳歐洲。","src":[{"t":"馬可·波羅 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E9%A9%AC%E5%8F%AF%C2%B7%E6%B3%A2%E7%BD%97","d":"2026-09-20"}],"v":1},"8-26":{"o":["道教","儒教","伊斯蘭教"],"x":["玄奘追求的是佛教的真理，而非道教的修行","玄奘求學的是宗教信仰，儒教主要是倫理道德學説","伊斯蘭教在中國傳播較晚，玄奘年代尚無"],"w":"玄奘（602-664）是唐朝著名僧人，於貞觀三年（629年）秘密離開長安，決心西行天竺（印度）求取佛經。他在那爛陀寺等地研習佛教達十多年，不僅學習一家一派，而是虛心求教於各位名師，最終融會貫通，成為漢傳佛教最偉大的譯經師之一。","m":"玄奘求法佛教道，西天取經志氣高。","src":[{"t":"玄奘 - 维基百科","u":"https://zh.wikipedia.org/zh-cn/%E7%8E%84%E5%A5%98","d":"2026-09-20"}],"v":1},"8-27":{"o":["儒、墨、法三教","儒、佛、回教","儒、儒家、儒學"],"x":["墨家和法家並非中國民間常説的『三教』概念","佛教在民間信仰中叫『釋教』而非『回教』，回教指伊斯蘭教","儒、儒家、儒學是重複概念，不符合『三教』多元宗教的定義"],"w":"中國民間有『三教九流』的説法，三教指的是儒教、釋教（佛教）、道教，代表中國傳統思想中三大重要的宗教信仰體系。儒教強調社會規範與倫理道德，釋教強調精神修為與解脱輪迴，道教提倡簡樸與順應自然。自宋明以降，三教逐漸融合，相互吸收，形成獨特的『三教合一』現象。","m":"儒釋道三教，中華文化根。","src":[{"t":"三教 - 維基百科（粵文）","u":"https://zh-yue.wikipedia.org/wiki/%E4%B8%89%E6%95%99","d":"2026-09-20"},{"t":"三教合流 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E4%B8%89%E6%95%99%E5%90%88%E6%B5%81","d":"2026-09-20"}],"v":1},"8-28":{"o":["飛鳥時代","奈良時代","平安時代"],"x":["飛鳥時代雖有佛教傳入但尚未系統發展，主要系統化傳入在唐朝","奈良時代的佛教已經傳入但主要源自唐朝的推動","平安時代的主要佛教宗派（天台宗、真言宗）由最澄和空海從唐朝傳入"],"w":"日本佛教於飛鳥時代初傳，但於奈良及平安時代才得到系統發展。最重要的是，唐朝時期對日本佛教產生了決定性影響：鑑真大師於天寶7年（748年）經過六次嘗試終於抵達日本傳戒；最澄和空海則從唐朝傳入天台宗和真言宗，這兩宗成為平安時期日本佛教的主流。","m":"唐朝僧傳戒赴日本，天台真言成主流。","src":[{"t":"日本佛教 - 維基百科","u":"https://zh.m.wikipedia.org/zh-hk/%E6%97%A5%E6%9C%AC%E4%BD%9B%E6%95%99","d":"2026-09-20"},{"t":"4.2 对日交流 | 唐朝佛教是如何传到日本的？-三联生活网","u":"https://www.lifeweek.com.cn/article/62459","d":"2026-09-20"}],"v":1},"8-29":{"o":["山西五台山","浙江南海觀音山","雲南梵淨山"],"x":["山西五台山已列為四大名山之一","浙江南海觀音山非四大名山","雲南梵淨山非四大佛教名山"],"w":"中國佛教四大名山為：山西五台山（文殊菩薩道場）、浙江普陀山（觀世音菩薩道場）、四川峨眉山（普賢菩薩道場）、安徽九華山（地藏菩薩道場）。這四座山嶺各代表一位菩薩，是佛教信徒重要的朝聖地。","m":"五台普陀峨眉山，九華四座名山傳。","src":[{"t":"中国佛教四大名山_百度百科","u":"https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E4%BD%9B%E6%95%99%E5%9B%9B%E5%A4%A7%E5%90%8D%E5%B1%B1/2267734","d":"2026-09-20"},{"t":"四大佛教名山 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E5%9B%9B%E5%A4%A7%E4%BD%9B%E6%95%99%E5%90%8D%E5%B1%B1","d":"2026-09-20"}],"v":1},"8-30":{"o":["觀音菩薩","天后娘娘","南海女神"],"x":["觀音菩薩是佛教菩薩，而媽祖信仰源於民間信仰","天后娘娘是媽祖在某些地區的稱呼，但不如『媽祖』通用","南海女神非對媽祖的正式稱呼"],"w":"媽祖原名林默娘，是北宋福建湄洲島的漁家女。生前樂善好施，能預知風暴，救濟船隊，死後被沿海漁民尊為海上守護神。中國沿海地區漁民在出海前會祭祀媽祖，祈求風調雨順、平安歸來。媽祖信仰至今已超過千年，信眾遍佈全球華人地區。","m":"漁民祭媽祖，風平浪靜返故鄉。","src":[{"t":"海の女神「媽祖」 | Ocean Newsletter","u":"https://www.spf.org/opri/newsletter/175_3.html","d":"2026-09-20"},{"t":"台灣神明介紹 - 媽祖","u":"https://www.taiwanese-gods.org/gods/taoism/mazu/","d":"2026-09-20"}],"v":1},"8-31":{"o":["日本奈良大佛","泰國玉佛","緬甸仰光大金塔"],"x":["日本奈良大佛為青銅坐佛但高度低於香港天壇大佛","泰國玉佛乃立佛而非坐佛，且高度較小","緬甸仰光大金塔為塔型建築，非坐佛"],"w":"香港天壇大佛座落於大嶼山寶蓮寺前，高26.4米，連蓮花座及基座總高約34米，由207塊銅片組成，重250公噸。1981年開始籌建，1993年12月29日開光，耗資逾6000萬港元。天壇大佛是目前世界上最大的户外青銅坐佛。","m":"天壇大佛靈氣聚，香港昂坪瞰天下。","src":[{"t":"天壇大佛 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E5%A4%A9%E5%9D%9B%E5%A4%A7%E4%BD%9B","d":"2026-09-20"},{"t":"天壇大佛的建造","u":"https://plm.org.hk/buddha.php","d":"2026-09-20"}],"v":1},"8-32":{"o":["道教","伊斯蘭教","祆教"],"x":["道教藝術並無體現在莫高窟壁畫中","伊斯蘭教壁畫在敦煌極少見","祆教影響力有限，莫高窟主要不反映祆教"],"w":"敦煌莫高窟位於甘肅敦煌市東南，現有735個洞窟，壁畫4.5萬平方米，泥質彩塑2415尊，是世界最大、內容最豐富的佛教藝術寶庫。莫高窟始建於十六國前秦，歷經隋唐五代等各朝代興建，壁畫既反映佛教題材（如佛傳故事、本生故事）也反映當時社會生活，盛唐時期壁畫水平最高。","m":"千佛洞內畫佛事，敦煌藝術代千年。","src":[{"t":"敦煌莫高窟 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E8%8E%AB%E9%AB%98%E7%AA%9F","d":"2026-09-20"},{"t":"敦煌莫高窟 世上最完整佛教藝術寶庫 | 當代中國","u":"https://www.ourchinastory.com/zh/333/%E6%95%A6%E7%85%8C%E8%8E%AB%E9%AB%98%E7%AA%9F-%E4%B8%96%E4%B8%8A%E6%9C%80%E5%AE%8C%E6%95%B4%E4%BD%9B%E6%95%99%E8%97%9D%E8%A1%93%E5%AF%B6%E5%BA%AB","d":"2026-09-20"}],"v":1},"8-34":{"w":"儒家經典是記載孔子及後世儒家學説的重要文獻。其中最重要的四部著作合稱『四書』，由南宋朱熹編訂，包括《論語》（記孔子言論）、《孟子》（記孟子學説）、《大學》（闡述修身齊家治國平天下）、《中庸》（強調中和之道）。這四書是儒家思想的集中體現，歷代科舉考試的重要內容，也是東亞儒學文明的核心文獻。","m":"四書五經經世學，儒家智慧傳千年。","src":[{"t":"四書 - Wikipedia","u":"https://ja.wikipedia.org/wiki/%E5%9B%9B%E6%9B%B8","d":"2026-09-20"},{"t":"四書五經 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%9B%9B%E4%B9%A6%E4%BA%94%E7%BB%8F","d":"2026-09-20"}],"v":1},"8-43":{"o":["身份象徵","美容裝飾","表示離婚的女性"],"x":["身份象徵是耳環的重要用途之一，並非『不是』","美容裝飾確實是古代耳環的用途","表示離婚的女性並非古代耳環的原始用途"],"w":"中國古代耳環最原始的用途多樣化。據考古記載，耳環的用途包括身份象徵（表示女性身份地位）、裝飾美化、辟邪護佑等。明代《留青日札》記載女子穿耳戴耳環乃『賤者之事』，説明耳環曾用以標示身份。但表示離婚的女性並非耳環的原始或重要用途。","m":"耳環古用多重責，身份裝飾護佑全。","n":"題目要求選出『不是』耳環用途的項目。官方答案為『表示離婚的女性』，符合歷史事實，此用途並無可靠史料支持。","src":[{"t":"中國古代的耳飾究竟有多美","u":"https://kknews.cc/culture/3vva3g8.html","d":"2026-09-20"},{"t":"你知道耳环是怎么来的吗？古代男子竟用此物来防范女人_百科TA说","u":"https://wapbaike.baidu.com/tashuo/browse/content?id=9ecbf4e3eb0fdfd59ec0e14a","d":"2026-09-20"}],"v":1},"8-44":{"o":["上元節、中元節、下元節","清明節、中秋節、重陽節","春節、清明節、端午節"],"x":["上元節、中元節、下元節是『三元節』，與『三冥節』概念不同","清明節、中秋節、重陽節不符合『三冥節』的定義","春節、清明節、端午節中無法形成『冥節』主題"],"w":"中國民間的三冥節（又稱『三鬼節』）指清明節、中元節、下元節。清明節（農曆三月初五前後）是祭祖掃墓的節日；中元節（農曆七月十五）是道教地官赦罪之日，民間普度孤魂；下元節（農曆十月十五）是道教水官解厄之日。這三個節日都涉及祭祀鬼神和祖先，故稱『三冥節』。","n":"『三冥節』與『三元節』是兩個不同的概念。三元節指上元、中元、下元，主要源於道教；三冥節特指與『冥界』相關的三個祭祀節日。","src":[{"t":"三元節 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%89%E5%85%83%E8%8A%82","d":"2026-09-20"},{"t":"中國文化通識｜三大鬼節是哪三個？ | 當代中國","u":"https://www.ourchinastory.com/zh/6702/%E4%B8%AD%E5%9C%8B%E6%96%87%E5%8C%96%E9%80%9A%E8%AD%98%EF%BD%9C%E4%B8%89%E5%A4%A7%E9%AC%BC%E7%AF%80%E6%98%AF%E5%93%AA%E4%B8%89%E5%80%8B%EF%BC%9F","d":"2026-09-20"}],"v":1},"8-47":{"o":["60至70歲","70至80歲","90至100歲"],"x":["60至70歲稱『花甲』或『耳順之年』，不是『杖朝』和『耄耋』","70至80歲稱『古稀』或『懸車之年』，不是『杖朝』","90至100歲稱『鮐背』或『期頤』，不是『杖朝』和『耄耋』"],"w":"杖朝之年與耄耋之年是古代對高齡的雅稱。杖朝之年特指80歲，源自古制男子年滿80歲後可在朝堂上使用木杖；耄耋之年指80至90歲，『耄』（音『冒』）『耋』（音『疊』）合指高齡。這些術語反映了古代對長壽老者的尊重。","m":"八十杖朝稱，八九耄耋過。","src":[{"t":"杖朝之年是多少岁？指男子80岁？_神巴巴测试网","u":"https://services.shen88.cn/bazisuanming/bazirumen-68836.html","d":"2026-09-20"},{"t":"耄耋:解釋_中文百科全書","u":"https://www.newton.com.tw/wiki/%E8%80%84%E8%80%8B","d":"2026-09-20"}],"v":1},"8-49":{"o":["漢文帝","漢景帝","漢成帝"],"x":["漢文帝曾使用過西曆元旦，但未正式統一","漢景帝為景帝，時代較晚於武帝改革","漢成帝時間更晚，曆法已確定"],"w":"自漢朝開始，朝代逐漸統一以夏曆（農曆）正月初一為『歲首』。漢武帝於公元前104年頒佈《太初曆》，正式確定以農曆正月初一為一年的開始，此後稱為『正月旦』或『年節』。這一決定一直延續至今，隋唐宋明皆遵循此制，成為中華文化中最重要的年節傳統。","m":"武帝太初立曆法，正月初一萬年傳。","src":[{"t":"春節 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E6%98%A5%E7%AF%80","d":"2026-09-20"},{"t":"一锤定音！汉代如何奠定我们两千多年的春节格局","u":"https://www.szdag.gov.cn/gzdt/gzdt/content/post_1656812.html","d":"2026-09-20"}],"v":1},"8-50":{"o":["清明節","中秋節","重陽節"],"x":["清明節有掃墓習俗，但無春聯傳統","中秋節以月餅和賞月為主，無春聯","重陽節為秋季節日，與春節節氣不合"],"w":"春聯（又稱福貼、春貼、門對）是春節的傳統裝飾物，用毛筆將吉利字詞書寫在紅紙上，貼於門、牆之上。粵語地區稱為『揮春』。春聯起源於古代『桃符』信仰，寓意為新年祈福、辟邪保佑。春聯上通常寫對聯或吉祥話語，成為農曆新年不可或缺的文化象徵。","m":"紅紙揮春貼新年，家家户户慶團圓。","src":[{"t":"春聯 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E6%98%A5%E8%81%AF","d":"2026-09-20"},{"t":"揮春 - 維基百科（粵文）","u":"https://zh-yue.wikipedia.org/wiki/%E6%8F%AE%E6%98%A5","d":"2026-09-20"}],"v":1},"8-51":{"o":["男18，女12","男22，女18","男25，女20"],"x":["男18，女12不符合古代冠禮和笄禮的年齡規定","男22，女18晚於古代成年年齡","男25，女20更是超出古代規定"],"w":"『冠禮』和『笄禮』是中國古代漢族的成年禮儀式。冠禮在男子20歲時舉行，象徵男性成人；笄禮在女子15歲時舉行，象徵女性成人。若女子已成人但遲遲未許嫁，則到20歲時必須舉行笄禮。這些禮儀自西周延續至明朝，是儒家禮教的重要內容。","m":"男冠二十女笄十五，古禮成人有年紀。","src":[{"t":"冠禮 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E5%86%A0%E7%A6%AE","d":"2026-09-20"},{"t":"笄禮 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E7%AC%84%E7%A6%AE","d":"2026-09-20"}],"v":1},"8-52":{"o":["是"],"x":["登高採菊是重陽節（九月九）的習俗，而非端午節習俗"],"w":"『登高採菊』並非端午節的習俗。登高賞菊是重陽節（農曆九月九日）的傳統活動，寓意遠離災厄、祈求長壽。端午節（農曆五月五日）的主要習俗是吃粽子、賽龍舟、掛艾葉等，紀念屈原。兩個節日的習俗完全不同。","m":"端午粽子龍舟賽，重陽菊花登高見。","src":[{"t":"重陽節的典故與習俗-民間習俗","u":"https://www.sim.org.tw/festival65.html","d":"2026-09-20"},{"t":"重陽節 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E9%87%8D%E9%99%BD%E7%AF%80","d":"2026-09-20"}],"v":1},"8-53":{"o":["黃帝軒轅氏","大禹治水","伏羲畫卦"],"x":["黃帝軒轅氏是另一位中華民族始祖，非『炎帝』所指","大禹治水是大禹的成就，與炎帝關係不大","伏羲畫卦是伏羲的傳説，非炎帝事蹟"],"w":"炎帝又被稱為『神農氏』，是中華民族的人文始祖之一。炎帝神農為天下萬民開創農業、桑麻業，發明瞭製陶、弓箭、五絃琴等，並親嚐百草以醫治黎民疾病，建立了中醫藥的基礎。炎帝與黃帝並稱為中華民族始祖，後人自稱『炎黃子孫』。","m":"神農嚐百草，炎帝傳農業。","src":[{"t":"炎帝 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%82%8E%E5%B8%9D","d":"2026-09-20"},{"t":"炎帝- 中华民族的三大始祖之一","u":"https://wapbaike.baidu.com/tashuo/browse/content?id=9167c87c2559f8c2f5d1c1f8","d":"2026-09-20"}],"v":1},"8-54":{"o":["12個字","8個字","5個字"],"x":["十二地支才是12個字","天干與地支合為十二支","五行對應數字為5"],"w":"天干是中國古代用來表示次序的十個字：甲、乙、丙、丁、戊、己、庚、辛、壬、癸。天干與地支結合用於紀年、紀月、紀日、紀時，是中國傳統曆法的基礎。","m":"天干十字順序記「甲乙丙丁戊己庚辛壬癸」","v":1,"src":[{"t":"天干地支（中国古代天文历法的基本计数单位）","u":"https://baike.baidu.com/item/%E5%A4%A9%E5%B9%B2%E5%9C%B0%E6%94%AF/278140","d":"2026-09-20"},{"t":"天干 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E5%A4%A9%E5%B9%B2","d":"2026-09-20"}]},"8-55":{"o":["《三字經》","《論語》","《孝經》"],"x":["三字經雖講孝道但此句出自弟子規","論語是孔子言論集但此句出自弟子規","孝經講孝道但此句出自弟子規"],"w":"《弟子規》是清代李毓秀撰寫的兒童蒙學讀物，原名《訓蒙文》。該書以孝道為首要，「父母教，須敬聽；父母責，須順承」出自《入則孝》篇章，教導兒童應尊敬父母，接受父母教誨。","m":"敬聽父命順其責，孝道根本弟子規","v":1,"src":[{"t":"父母教，须敬听。父母责，须顺承。 - 《弟子规》","u":"https://www.dizigui.cn/zja02.asp","d":"2026-09-20"},{"t":"国学经典《弟子规》全文及译文","u":"https://www.guoxuemeng.com/guoxue/13852.html","d":"2026-09-20"}]},"8-56":{"o":["黃河","黃帝陵","皇帝"],"x":["黃河是水而非人物代稱","黃帝陵是地點而非人物代稱","皇帝是統治者通稱，黃指特定人物"],"w":"「炎黃子孫」中的「炎」指炎帝，「黃」指黃帝。炎帝和黃帝是中國上古時代的傳説中的兩位聖賢，被視為中華文明的始祖。代代相傳，中國人自稱為炎黃子孫，象徵血緣與文化相承。","m":"炎帝和黃帝是祖先，炎黃子孫傳萬年","n":"黃帝亦稱軒轅氏，炎帝亦稱神農氏，兩人為中華民族共同祖先","v":1,"src":[{"t":"炎黄子孙 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E7%82%8E%E9%BB%84%E5%AD%90%E5%AD%99","d":"2026-09-20"},{"t":"炎黄（华夏文明始祖）","u":"https://baike.baidu.com/item/%E7%82%8E%E9%BB%84/22031149","d":"2026-09-20"},{"t":"刘永国：\"炎黄子孙\"的来历","u":"http://hb.china.com.cn/sz/2022-09/26/content_42098282.html","d":"2026-09-20"}]},"8-57":{"o":["鳳凰","麒麟","老鷹"],"x":["鳳凰是女性角色蟒袍的紋樣","麒麟是吉祥瑞獸但不是蟒袍主紋","老鷹不是京劇蟒袍的傳統紋樣"],"w":"京劇服裝中的蟒袍是帝王將相的官服，上面繡有龍紋。龍象徵帝王權力與尊貴身份，五爪龍為皇帝專用，四爪蟒為官員使用。蟒袍因紋樣酷似龍而得名。","m":"蟒袍繡龍象帝王，官員穿著顯身份","n":"蟒袍五爪龍與四爪蟒的區別在於皇帝與普通官員的等級區分","v":1,"src":[{"t":"京剧行头之蟒袍","u":"http://www.wenyiw.com/2015/jiaoshi_0119/5346.html","d":"2026-09-20"},{"t":"蟒袍_百度百科","u":"https://baike.baidu.com/item/%E8%9F%92%E8%A2%8D/6617004","d":"2026-09-20"},{"t":"线上展览 | 龙凤呈祥---中国京剧服饰纹样图片展","u":"https://www.sznews.com/content/mb/2021-08/09/content_24468314.htm","d":"2026-09-20"}]},"8-58":{"o":["分封制國家","民主制國家","共和制國家"],"x":["分封制是夏朝之前商代的制度","民主制是近代才出現的政治制度","共和制與中國古代帝制相反"],"w":"夏朝（約公元前2070年至公元前1600年）是中國歷史上第一個奴隸制國家。大禹治水有功，得到各部落首領擁護，建立了夏族王權。禹死後，其子啟繼承王位，標誌著從原始社會的禪讓制向世襲制的轉變。","m":"夏朝建立奴隸制，禹傳啟開家天下","v":1,"src":[{"t":"夏朝（中国历史朝代）","u":"https://baike.baidu.com/item/%E5%A4%8F%E6%9C%9D/22101","d":"2026-09-20"},{"t":"夏朝 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E5%A4%8F%E6%9C%9D","d":"2026-09-20"}]},"8-59":{"o":["發明造紙術","改進冶鐵術","創制印刷術"],"x":["造紙術是蔡倫改進而非原發明者創造","冶鐵術改進者非蔡倫","印刷術的發明者是後代工匠"],"w":"蔡倫（63年－121年）是東漢時期的宦官和發明家。他在公元105年改進了造紙術，用樹皮、麻布、破漁網等為原料，製造出質量更好、成本更低的紙張，被稱為「蔡侯紙」。這項改進使紙張成為替代簡牘的主要書寫材料，對人類文明傳播產生了深遠影響。","m":"蔡倫改紙質，文明傳千年","v":1,"src":[{"t":"蔡伦造纸（历史事件）","u":"https://baike.baidu.com/item/%E8%94%A1%E4%BC%A6%E9%80%A0%E7%BA%B8/10589533","d":"2026-09-20"},{"t":"蔡伦 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E8%94%A1%E4%BC%A6","d":"2026-09-20"},{"t":"造纸术（中国古代四大发明之一）","u":"https://baike.baidu.com/item/%E9%80%A0%E7%BA%B8%E6%9C%AF/106744","d":"2026-09-20"}]},"8-60":{"o":["《史記》","《後漢書》","《三國志》"],"x":["史記是西漢司馬遷所著，為通史而非漢代專史","後漢書記載東漢而非西漢","三國志記載三國時期而非漢代"],"w":"漢朝繼承秦代史官修史的傳統，在中央設置史官編撰歷史。其中最著名的兩部是《史記》和《漢書》。《史記》由西漢司馬遷編著，記載自黃帝至漢武帝時期的歷史；《漢書》由東漢班固編著，是中國第一部紀傳體斷代史。","m":"司馬遷著史記，班固寫漢書","v":1,"src":[{"t":"史记 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E5%8F%B2%E8%AE%B0","d":"2026-09-20"},{"t":"汉书 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E6%B1%89%E4%B9%A6","d":"2026-09-20"},{"t":"《史记》光芒盖过《汉书》？司马迁和班固的分歧在哪","u":"https://www.visitbeijing.com.cn/article/47QkT5pi2TX","d":"2026-09-20"}]},"8-61":{"o":["茶馬之路","草原之路","南海之路"],"x":["茶馬之路是中國西南與西藏的貿易路線","草原之路是指北方遊牧民族路線","南海之路是海上貿易路線"],"w":"張騫（前164年－前114年）是西漢時期的外交家和探險家。西漢建元二年（前139年），他首次奉漢武帝之命出使西域，於元光六年（前129年）突破匈奴包圍，最終抵達大宛。第二次出使西域時，他派遣隨員訪問了大月氏、康居等多個國家。這條通道被後世稱為「絲綢之路」，促進了中國與中亞、西亞各國的政治、經濟和文化交流。","m":"張騫開絲路，東西文化通","n":"絲綢之路名稱源於絲綢為主要貿易品，後世才有此稱呼","v":1,"src":[{"t":"张骞出使西域（历史事件）","u":"https://baike.baidu.com/item/%E5%BC%A0%E9%AA%9E%E5%87%BA%E4%BD%BF%E8%A5%BF%E5%9F%9F/5299360","d":"2026-09-20"},{"t":"张骞 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E5%BC%B5%E9%A8%AB","d":"2026-09-20"},{"t":"敦煌宝藏｜张骞出使西域图：凿空丝路的图像记忆","u":"https://www.dha.ac.cn/info/1266/2524.htm","d":"2026-09-20"}]},"8-62":{"o":["漢朝","商朝","周朝"],"x":["漢朝雖然統一但不是第一個","商朝未能完全統一中國","周朝是分封制而非中央集權"],"w":"秦朝是中國歷史上第一個統一的、多民族的、中央集權的封建國家。秦始皇嬴政於公元前221年滅六國，建立統一帝國。他廢除分封制實行郡縣制，統一文字、度量衡與貨幣，建立了後世2000多年沿襲的封建國家框架。","m":"秦始皇統一天下，郡縣制永傳","v":1,"src":[{"t":"秦朝 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E6%9C%9D","d":"2026-09-20"},{"t":"中国历史上第一个统一的多民族的中央集权的封建国家--秦","u":"https://kz.china-embassy.gov.cn/chn/gyzg/zggk/jianshi/201008/t20100804_1364728.htm","d":"2026-09-20"}]},"8-63":{"o":["西方人","中原人","華人"],"x":["西方人是對歐洲人的統稱而非中國人","中原人是對中原地區人的稱呼","華人是現代通用術語，不是唐朝海外稱呼"],"w":"唐朝（618年－907年）是當時世界上最強盛的國家之一，與亞歐各國均有往來。從唐太宗貞觀之治開始，唐朝威震中亞、西亞及南海諸國。海外各國因此開始用「唐」字稱呼中國的一切，中國人被稱為「唐人」，中文被稱為「唐字」，中國本土被稱為「唐山」。","m":"唐朝盛世威四方，海外因此稱唐人","n":"唐人街（Chinatown）名稱由此而來，華僑移民聚居地沿用此稱","v":1,"src":[{"t":"唐人 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E5%94%90%E4%BA%BA","d":"2026-09-20"},{"t":"唐人（唐朝时期的中国人的称谓）_百度百科","u":"https://baike.baidu.com/item/%E5%94%90%E4%BA%BA/77879","d":"2026-09-20"},{"t":"为什么是唐人街不是汉人街？","u":"https://www.gjrwls.com/jinghua/20240626/990561048174002176.html","d":"2026-09-20"}]},"8-64":{"o":["徐和","麻貴","戚繼光"],"x":["徐和無此下西洋紀錄","麻貴是明代將領而非航海家","戚繼光是防禦倭寇的將領非航海家"],"w":"鄭和（1371年－1433年）是明代傑出的航海家，原姓馬名和。在明永樂年間（1405年－1433年），他奉明成祖之命七次下西洋，統領龐大船隊訪問了三十多個國家和地區。鄭和船隊的總航程超過七萬海里，規模遠超同時代歐洲航海家，是世界航海史上的壯舉。","m":"鄭和下西洋，船隊走大洋","n":"鄭和出身穆斯林家庭，最後一次航行於1433年因病在古里逝世","v":1,"src":[{"t":"郑和下西洋（明朝历史事件）","u":"https://baike.baidu.com/item/%E9%83%91%E5%92%8C%E4%B8%8B%E8%A5%BF%E6%B4%8B/23805","d":"2026-09-20"},{"t":"鄭和下西洋 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E9%83%91%E5%92%8C%E4%B8%8B%E8%A5%BF%E6%B4%8B","d":"2026-09-20"},{"t":"鄭和為何要七次下西洋？","u":"https://chiculture.org.hk/tc/china-five-thousand-years/90","d":"2026-09-20"}]},"8-65":{"o":["頤和園","天壇","圓明園"],"x":["頤和園是皇帝避暑勝地而非官方宮殿","天壇是祭祀場所而非帝王宮殿","圓明園是皇帝離宮而非中央宮殿"],"w":"明成祖朱棣於永樂四年（1406年）下詔營建北京宮殿，開始了紫禁城的工程。耗時14年的興建，於永樂十八年（1420年）十一月竣工完成，宣告北京宮殿建成。隨後朱棣正式將首都從南京遷至北京，開啟了紫禁城作為明清兩代皇帝駐蹕地的600年歷史。","m":"朱棣遷都北京，故宮建成象徵權力","v":1,"src":[{"t":"永乐营北京 - 故宫博物院","u":"https://www.dpm.org.cn/subject_600/buildingdetails/253788.html","d":"2026-09-20"},{"t":"紫禁城建成六百年暨故宫博物院成立九十五周年","u":"https://www.dpm.org.cn/subject_600/index.html","d":"2026-09-20"},{"t":"故宫 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E6%95%85%E5%AE%AB","d":"2026-09-20"}]},"8-66":{"o":["會子","銀票","金票"],"x":["會子是南宋後期的紙幣比交子晚","銀票是明清時期的紙幣","金票是近代紙幣"],"w":"交子（jiāo zǐ）是世界上最早的紙幣，出現於北宋時期的四川成都。最初由十六位富商設立「交子鋪」發行民間紙幣，到北宋天聖元年（1024年），官府正式在成都建立「益州交子務」，發行官方統一面額的交子，成為世界上第一種政府發行的紙幣，比歐洲紙幣早超過600年。","m":"交子宋代出，世界最早紙幣流","v":1,"src":[{"t":"交子 世上最早紙幣 | 人間福報","u":"https://nie.merit-times.com.tw/newsdetail_tw.php?id=10864","d":"2026-09-20"},{"t":"交子_百度百科","u":"https://baike.baidu.com/item/%E4%BA%A4%E5%AD%90/564925","d":"2026-09-20"},{"t":"世界上最早的纸币，起源于1000年前的中国","u":"https://www.gzstv.com/a/b034d05f023840b686e6078afc2a63cb","d":"2026-09-20"}]},"8-67":{"o":["《北京條約》","《馬關條約》","《辛丑條約》"],"x":["北京條約是第二次鴉片戰爭簽訂","馬關條約是中日甲午戰爭後簽訂","辛丑條約是八國聯軍戰爭後簽訂"],"w":"1840年英國發動第一次鴉片戰爭，清政府戰敗。1842年8月29日，雙方代表在英國軍艦上簽訂《南京條約》，這是中國近代史上被迫簽署的第一個不平等條約。條約規定中國向英國賠款2100萬銀元、開放五個通商口岸、割讓香港島等內容，標誌著中國喪權辱國時代的開始。","m":"南京條約一八四二年，中國首次失主權","v":1,"src":[{"t":"鴉片戰爭 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E9%B8%A6%E7%89%87%E6%88%98%E4%BA%89","d":"2026-09-20"},{"t":"中英簽訂《南京條約》","u":"https://www.ourchinastory.com/zh/4665/%E4%B8%AD%E8%8B%B1%E7%B0%BD%E8%A8%82%E3%80%8A%E5%8D%97%E4%BA%AC%E6%A2%9D%E7%B4%84%E3%80%8B","d":"2026-09-20"},{"t":"《南京條約》簽訂180年 中國近代史上第一份不平等條約","u":"https://www.hkchronicles.org.hk/%E9%A6%99%E6%B8%AF%E5%BF%97/%E6%94%BF%E6%B2%BB/%E5%8D%97%E4%BA%AC%E6%A2%9D%E7%B4%84%E7%B0%BD%E8%A8%82180%E5%B9%B2","d":"2026-09-20"}]},"8-68":{"o":["中美戰爭","中俄戰爭","中日甲午戰爭"],"x":["未曾發生中美戰爭於此時期","未曾發生中俄正面戰爭","中日甲午戰爭確實發生於1894年"],"w":"1894年爆發的中日甲午戰爭，是中國與日本之間的大規模軍事衝突。戰爭於7月25日開始，至1895年4月17日《馬關條約》簽訂而結束。中國戰敗，蒙受巨大損失。這場戰爭的失敗對中國造成巨大衝擊，激發了中國知識菁英尋求變革，發起了維新變法運動（1898年），試圖通過制度改革實現國家現代化。","m":"甲午戰爭中國敗，維新變法來改革","v":1,"src":[{"t":"甲午戰爭 | 中國文化研究院 - 燦爛的中國文明","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1913","d":"2026-09-20"},{"t":"甲午戰爭 - 維基百科","u":"https://zh.wikipedia.org/zh-tw/%E7%94%B2%E5%8D%88%E6%88%B0%E7%88%AD","d":"2026-09-20"},{"t":"中日甲午战争_百度百科","u":"https://baike.baidu.com/item/%E4%B8%AD%E6%97%A5%E7%94%B2%E5%8D%88%E6%88%98%E4%BA%89/461750","d":"2026-09-20"}]},"8-69":{"o":["維新變法運動","洋務運動","辛亥革命"],"x":["維新變法運動是1898年而非文藝復興","洋務運動在19世紀中期而非文藝復興","辛亥革命是1911年而非新文化運動"],"w":"胡適是中國現代思想家、文學家和哲學家。1926年他在英國進行演講，英方稱胡適為「中國文藝復興之父」。「中國文藝復興」指的是新文化運動（1915年起），這場運動以反對舊禮教、提倡新思想為核心，主張「德先生」（民主）和「賽先生」（科學），推動了中國思想文化的現代化進程。","m":"胡適領新文化，文藝復興中國夢","n":"新文化運動特別強調白話文代替文言文，打破文化舊秩序","v":1,"src":[{"t":"胡適 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E8%83%A1%E9%81%A9","d":"2026-09-20"},{"t":"胡適（中国现代思想家、文学家、哲学家）","u":"https://baike.baidu.com/item/%E8%83%A1%E9%80%82/119246","d":"2026-09-20"},{"t":"新文化偶像的塑造：胡适及其受众","u":"https://www.xsyk021.com/fileXSYK/journal/article/xsyk/2020/12/PDF/202012zhangzhongmin.pdf","d":"2026-09-20"}]},"8-70":{"w":"秦始皇修築直道和馳道，主要目的是貫通各郡和重要城市的交通運輸。馳道是中央政府控制的高等級道路網，由鹹陽向四周放射狀延伸，連接各郡重要城市。直道則從鹹陽北向通至邊郡九原，用於軍事防禦與快速調度。這個交通網絡使秦始皇可以快速傳遞政令、調配軍隊和物資，鞏固對全國的統治和防禦匈奴入侵。","m":"秦道連四方，政令快速傳","n":"直道與馳道合計構建起中國古代第一個全國性交通網絡","v":1,"src":[{"t":"驰道（中国古代的高等级道路体系）","u":"https://baike.baidu.com/item/%E9%A9%B0%E9%81%93/5907720","d":"2026-09-20"},{"t":"秦直道 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E7%A7%A6%E7%9B%B4%E9%81%93","d":"2026-09-20"},{"t":"【道中华】秦始皇没有高铁动车，面对空前广阔的国家，他是怎么传递政令的？","u":"https://www.neac.gov.cn/seac/c103391/202303/1161551.shtml","d":"2026-09-20"}]},"8-71":{"o":["康有為","梁啟超","鄒容"],"x":["康有為主張維新變法而非民生主張","梁啟超是改革家但非最早提出民生主張","鄒容是民主革命家但非最早提出民生主張"],"w":"孫中山（1866年－1925年）是中國近代史上最早關注並提出「民生」主張的人物。他創立的三民主義包括民族、民權、民生三大主義，其中民生主義針對經濟平等問題，主張「平均地權」和「節制資本」，採取温和社會主義方針，力圖通過國家調節解決人民的經濟問題。","m":"孫中山提民生，三民主義護人民","v":1,"src":[{"t":"孙中山\"三民主义\"中的核心价值思想","u":"https://fuwu.12371.cn/2014/02/17/ARTI1392606137590486_all.shtml","d":"2026-09-20"},{"t":"三民主義 - 維基百科","u":"https://zh.wikipedia.org/zh-hant/%E4%B8%89%E6%B0%91%E4%B8%BB%E7%BE%A9","d":"2026-09-20"},{"t":"孫中山 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E5%AD%AB%E4%B8%AD%E5%B1%B1","d":"2026-09-20"}]},"8-72":{"o":["廬山","延安","瑞金"],"x":["廬山是國民黨軍事基地而非會師地點","延安是後來中共根據地而非朱毛會師地點","瑞金是中華蘇維埃共和國首都但非1928年會師地點"],"w":"1928年4月28日，朱德、陳毅率領的湘南起義部隊與毛澤東領導的工農革命軍在井岡山地區勝利會師，地點在寧岡礱市。隨後兩支隊伍於5月4日合併為工農革命軍第四軍（後改稱工農紅軍第四軍），朱德任軍長，毛澤東任黨代表，陳毅任政治部主任。這次會師標誌著井岡山根據地初步鞏固，對中國革命事業的發展產生了深遠影響。","m":"朱毛會師井岡山，革命力量合為強","v":1,"src":[{"t":"井冈山会师 - 战争回顾 - 华夏经纬网","u":"https://www.huaxia.com/c/2021/04/13/567867.shtml","d":"2026-09-20"},{"t":"井冈山会师（中国革命历史事件）","u":"https://baike.baidu.com/item/%E4%BA%95%E5%86%88%E5%B1%B1%E4%BC%9A%E5%B8%88/64013","d":"2026-09-20"},{"t":"朱毛会师 - 维基百科","u":"https://zh.wikipedia.org/zh-hans/%E6%9C%B1%E6%AF%9B%E4%BC%9A%E5%B8%88","d":"2026-09-20"}]},"8-73":{"o":["鴉片戰爭","甲午戰爭","八國聯軍之役"],"x":["鴉片戰爭是中國戰敗簽訂不平等條約","甲午戰爭中國同樣戰敗","八國聯軍戰爭中國遭聯軍入侵"],"w":"抗日戰爭（1937年至1945年）是中國近代史上對帝國主義侵略的第一次完全勝利。在這場長達8年的全民抗戰中，中國人民以3500萬以上的軍民傷亡和6000億美元的經濟損失代價，最終徹底擊敗日本軍國主義。這場勝利不僅洗刷了百年恥辱，捍衞了國家主權，而且促進了中華民族的大覺醒與大團結，是中華民族從衰敗走向振興的偉大轉折點。","m":"抗戰勝利八年功，民族振興起新宏","v":1,"src":[{"t":"抗日戰爭是近代以來中國抗擊外敵入侵的第一次完全勝利","u":"http://cpc.people.com.cn/BIG5/n/2015/0826/c83083-27519238.html","d":"2026-09-20"},{"t":"中国抗日战争 - 维基百科","u":"https://zh.wikipedia.org/wiki/%E4%B8%AD%E5%9B%BD%E6%8A%97%E6%97%A5%E6%88%98%E4%BA%89","d":"2026-09-20"},{"t":"中國人民抗日戰爭勝利紀念日","u":"https://www.ourchinastory.com/zh/6714/%E4%B8%AD%E5%9C%8B%E4%BA%BA%E6%B0%91%E6%8A%97%E6%97%A5%E6%88%B0%E7%88%AD%E5%8B%9D%E5%88%A9%E7%B4%80%E5%BF%B5%E6%97%A5","d":"2026-09-20"}]},"8-74":{"o":["第二次中日戰爭開始","八一三淞滬會戰","1935年華北事變"],"x":["第二次中日戰爭開始的是1937年全面抗戰，非第二次中日戰爭","八一三淞滬會戰是七七事變後才發生","華北事變發生於1935年，早於七七事變"],"w":"七七事變（盧溝橋事變）發生於1937年7月7日，日軍以尋找失蹤士兵為藉口，炮擊中國守軍據點，引發雙方全面武裝衝突。此事件標誌著中國從被動應對日本侵略轉變為全面、全民族的抗日戰爭，成為中國全國性抗日戰爭的開始。","m":"七七盧溝橋，全民抗戰開。","n":"","v":1,"src":[{"t":"中國文化研究院 - 盧溝橋事變與全面抗戰爆發","u":"https://chiculture.org.hk/tc/photo-story/3234","d":"2024-09-20"},{"t":"中央社 - 開箱老照片七七盧溝橋事變","u":"https://www.cna.com.tw/news/ahel/202307065006.aspx","d":"2023-07-06"}]},"8-75":{"o":["中華民國的成立","中共一大召開","新民主主義革命的勝利"],"x":["中華民國成立於1912年，尚未結束半殖民地狀態","中共一大召開於1921年，並非終結半殖民地半封建社會","新民主主義革命勝利與中華人民共和國成立是同一事件"],"w":"中華人民共和國成立於1949年10月1日，徹底結束了舊中國半殖民地半封建社會的歷史。國民黨政權被推翻，帝國主義列強的不平等條約被廢除，中國成為真正的獨立主權國家，從根本上改變了中華民族被奴役的地位。","m":"一九四九，新中國，封建半殖民地終結。","n":"","v":1,"src":[{"t":"中國文化研究院 - 中華人民共和國成立概覽","u":"https://chiculture.org.hk/tc/photo-story/3530","d":"2024-09-20"},{"t":"七一網 - 新民主主義革命勝利","u":"https://m.12371.gov.cn/content/2022-02/03/content_408660.html","d":"2022-02-03"}]},"8-76":{"o":["第27屆夏季奧林匹克運動會","第30屆夏季奧林匹克運動會","亞洲運動會"],"x":["第27屆於2000年在澳洲悉尼舉行，不是北京","第30屆於2012年在英國倫敦舉行，不是北京","亞洲運動會與奧運會不同"],"w":"第29屆夏季奧林匹克運動會於2008年8月8日至24日在北京舉行，是中國首次舉辦奧運會。此屆奧運會成就斐然，中國以51面金牌名列獎牌榜首，成為奧運歷史上首個亞洲國家登上金牌榜首，圓了中國人奧運夢想。","m":"2008北京奧運，圓了百年夢。","n":"","v":1,"src":[{"t":"中國奧委會官方網站 - 第29屆北京奧運會","u":"https://www.olympic.cn/games/summer/summer/2010/0210/24918.html","d":"2024-09-20"},{"t":"中國體育總局 - 第二十九屆北京奧運會","u":"https://www.sport.gov.cn/n4/n14741/n14751/c734708/content.html","d":"2024-09-20"}]},"8-77":{"w":"何鴻燊博士先後向國家捐獻了兩件重要的十二生肖銅像。2003年捐獻豬首銅像予文物保護基金，後由保利集團收購現藏保利藝術博物館；2019年為慶祝中華人民共和國70週年和澳門回歸20週年，捐獻馬首銅像予國家文物局，2020年分配至圓明園保存。這些國寶級文物的回歸，彰顯了愛國企業家的文化擔當。","m":"何鴻燊捐獻銅像，豬首馬首回家。","n":"","v":1,"src":[{"t":"澎湃新聞 - 何鴻燊捐贈馬首銅像","u":"https://www.thepaper.cn/newsDetail_forward_4943823","d":"2019-11-13"},{"t":"香港01 - 何鴻燊捐馬首銅像入藏圓明園","u":"https://www.hk01.com/%E5%8D%B3%E6%99%82%E4%B8%AD%E5%9C%8B/397826/","d":"2019-12-13"}]},"8-78":{"o":["克孜爾千佛洞壁畫","雲岡石窟壁畫","龍門石窟壁畫"],"x":["克孜爾千佛洞位於新疆，非隋唐時期最著名","雲岡石窟位於山西，主要為北魏時期","龍門石窟位於河南，雖有隋唐作品但敦煌最著名"],"w":"敦煌莫高窟壁畫是隋唐時期最著名的壁畫藝術。莫高窟開鑿於4世紀，隋唐時期達到鼎盛，洞窟數量達千餘個。隋唐壁畫以經變畫著稱，色彩明亮、構圖宏大，人物造型生動，代表了當時中國藝術的最高成就。","m":"敦煌莫高窟，隋唐壁畫最著名。","n":"","v":1,"src":[{"t":"敦煌研究院 - 莫高窟簡介","u":"https://www.dha.ac.cn/info/1425/3659.htm","d":"2024-09-20"},{"t":"絲路遺產 - 魏晉到隋唐石窟寺藝術敦煌莫高窟","u":"http://www.silkroads.org.cn/portal.php?mod=view&aid=24694","d":"2024-09-20"}]},"8-79":{"o":["北周","南宋","元代"],"x":["北周時期尚未有清明上河圖","南宋時期已是宋末，非原作年代","元代時清明上河圖已為傳世名畫"],"w":"《清明上河圖》是北宋張擇端創作的風俗畫傑作，描繪北宋首都開封汴河兩岸的繁榮景象。全畫採用散點透視法，構圖縝密，人物眾多，是現存最完整的北宋社會生活寫照，被列為中國十大傳世名畫之一，現藏北京故宮博物院。","m":"清明上河圖，北宋風俗畫。","n":"","v":1,"src":[{"t":"故宮博物院 - 清明上河圖特展","u":"http://theme.npm.edu.tw/exh105/RiverQingming/ch/index.html","d":"2024-09-20"},{"t":"典藏ARTouch - 最知名的風俗畫《清明上河圖》","u":"https://artouch.com/artco-kids/content-12102.html","d":"2024-09-20"}]},"8-80":{"o":["王獻之","蕭衍","陸機"],"x":["王獻之是王羲之之子，非作者","蕭衍是梁代帝王，並非作者","陸機為晉代書法家，非此作者"],"w":"《蘭亭集序》由東晉書法家王羲之創作於永和九年（公元353年），是他與文人雅集時應邀所寫的序文。此作以秀麗勁健的行書著稱，歷代被推為「天下第一行書」，代表了王羲之書法藝術的最高成就，對後世書法影響深遠。","m":"蘭亭王羲之，天下第一行書。","n":"","v":1,"src":[{"t":"故宮博物院 - 王羲之行書蘭亭序卷","u":"https://www.dpm.org.cn/collection/handwriting/228277.html","d":"2024-09-20"},{"t":"書法字典 - 王羲之《蘭亭序》","u":"https://www.shufazidian.com/ziliao/41453.html","d":"2024-09-20"}]},"8-81":{"o":["篆文","隸文","草文"],"x":["篆文是秦代文字，非商代","隸文出現於秦漢，非商代","草文是草書，非商代刻畫文字"],"w":"甲骨文是商代王室用於占卜記事而在龜甲及獸骨上契刻的文字，是中國已知最早的成體系的成熟文字。甲骨文的發現和研究提供了商代歷史文明的直接證據，今天的漢字體系正是從甲骨文演變和發展而來，甲骨文因此被視為中華文明的重要源頭。","m":"商代甲骨文，中華文字之根。","n":"","v":1,"src":[{"t":"中研院歷史語言研究所 - 殷商占卜的取材與過程","u":"https://museum.sinica.edu.tw/resources/item/61/","d":"2024-09-20"},{"t":"CASE報科學 - 商代晚期的甲骨卜辭與文字刻寫","u":"https://case.ntu.edu.tw/blog/?p=43990","d":"2024-09-20"}]},"8-82":{"o":["是"],"x":["歐陽詢是初唐楷書四大家之一，歐陽修是北宋文學家，兩人不同"],"w":"歐陽洵（557-641年）是唐代書法家，為初唐楷書四大家之一（歐陽詢、顏真卿、柳公權、趙孟頫）。北宋書法四大家（宋四家）為蘇軾、黃庭堅、米芾、蔡襄。題目中的歐陽洵確實不屬於北宋時期的書法家四大家。","m":"歐陽詢唐代人，北宋四家有他人。","n":"易混：歐陽詢（唐代書法家）與歐陽修（北宋文學家）是不同人物。北宋書法四大家是蘇、黃、米、蔡。","v":1,"src":[{"t":"維基百科 - 歐陽修","u":"https://zh.wikipedia.org/zh-tw/%E6%AC%A7%E9%98%B3%E4%BF%AE","d":"2024-09-20"}]},"8-83":{"o":["陶器","玉器","漆器"],"x":["陶器在商周時期已不是主要成就","玉器工藝雖發達但非最能代表此時期特徵","漆器工藝出現較晚，非此時期主要"],"w":"商、周和春秋時期，青銅器是最重要的藝術品，具有富有想像力和高度的裝飾性。青銅器集實用性、禮儀性和藝術性於一身，紋飾繁複，包括饕餮紋、雲雷紋、蟠龍紋等，造型雄奇壯觀，成為該時代美術成就的標誌，深深反映了古代工藝技術和美學水準。","m":"商周春秋青銅器，想像力與裝飾美。","n":"","v":1,"src":[{"t":"典藏ARTouch - 善銅十物商周青銅器名品賞析","u":"https://artouch.com/views/content-1095.html","d":"2024-09-20"},{"t":"維基百科 - 中國青銅器","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%AD%E5%9B%BD%E9%9D%92%E9%93%9C%E5%99%A8","d":"2024-09-20"}]},"8-84":{"o":["彩陶","石刻","木雕"],"x":["彩陶是新石器時代的藝術，非漢代最完整","石刻在漢代已有但非最完整的畫作","木雕易腐爛，非最完整的出土品"],"w":"漢朝繪畫今已幾乎無存，最完整的為馬王堆漢墓出土的帛畫。馬王堆帛畫創作於西漢早期，色彩鮮豔保存完好，採用T字形構圖，上層描繪天界，中層為墓主人和仕女形象，下層描繪地界，既反映墓主人的地上生活，也寄託其地下生活的期望，是研究漢代社會生活的重要藝術文獻。","m":"馬王堆帛畫，漢朝最完整。","n":"","v":1,"src":[{"t":"湖南省博物館 - 馬王堆一號漢墓T形帛畫","u":"https://www.hnmuseum.com/zh-hans/zuixintuijie/%E9%A9%AC%E7%8E%8B%E5%A0%86%E4%B8%80%E5%8F%B7%E6%B1%89%E5%A2%93t%E5%BD%A2%E5%B8%9B%E7%94%BB","d":"2024-09-20"},{"t":"維基百科 - 馬王堆一號漢墓帛畫","u":"https://zh.wikipedia.org/zh-tw/%E9%A9%AC%E7%8E%8B%E5%A0%86%E4%B8%80%E5%8F%B7%E6%B1%89%E5%A2%93%E5%B8%9B%E7%94%BB","d":"2024-09-20"}]},"8-85":{"o":["石碑與磚刻","木刻與竹簡","陶片與碎瓷"],"x":["石碑與磚刻為主要形式但不如壁畫泥塑重要","木刻與竹簡不屬於佛教石窟藝術","陶片與碎瓷非石窟主要藝術形式"],"w":"魏晉南北朝時期佛教藝術興盛，石窟相繼開鑿，大量的壁畫與泥塑描繪宗教內容，同時反映現實生活。壁畫以經變畫著稱，色彩絢麗；泥塑造型逼真，包括佛像、菩薩、守護神等。這些作品既是宗教信仰的表現，也是當時社會生活、民俗風情的珍貴記錄。","m":"魏晉南北朝石窟，壁畫泥塑描宗教。","n":"","v":1,"src":[{"t":"絲路明珠 - 麥積山石窟的歷史與藝術","u":"http://www.news.cn/local/2023-04/28/c_1129576269.htm","d":"2023-04-28"}]},"8-86":{"o":["粉彩瓷","五彩瓷","白瓷"],"x":["粉彩瓷是清代創新的瓷器種類","五彩瓷是明代發展完善的瓷器","白瓷雖然優美但非元代景德鎮最著名"],"w":"元代是景德鎮真正馳名的時期，創新了多種瓷器品種。釉裡紅是當時的新創瓷器，因製造難度極高而產量稀少；青花瓷則是元代景德鎮的另一重要創新，通過氧化鈷著色，色澤深青明亮，其卓越的製瓷技術對後世明清瓷器產生了深遠影響，元青花成為收藏界的珍品。","m":"元代景德鎮，釉裡紅配青花。","n":"","v":1,"src":[{"t":"故宮博物院 - 景德鎮窑青花釉里紅","u":"https://www.dpm.org.cn/collection/ceramic/226716.html","d":"2024-09-20"},{"t":"澎湃新聞 - 何鴻燊捐贈馬首銅像，昔日圓明園十二銅像今何在","u":"https://www.thepaper.cn/newsDetail_forward_4943823","d":"2024-09-20"}]},"8-88":{"o":["大篆","隸書","楷書"],"x":["大篆是商周文字，秦代未統一使用","隸書是秦代俗體，未作為官方統一文字","楷書出現於漢代，非秦代統一文字"],"w":"秦始皇滅六國後，發現各地文字差異大，不利於統治。因此命丞相李斯等人，以秦文字為基礎，參考六國文字，創造出形體勻圓整齊、筆畫簡略的小篆作為官方規範文字。小篆成為秦代的標準官方文字，用於皇帝詔書和正式文件，是中國文字統一的重要標誌。","m":"秦始皇統文字，小篆為標準。","n":"","v":1,"src":[{"t":"堡壘郵報 - 秦始皇統一文字不只用了李斯小篆","u":"https://www.bastillepost.com/hongkong/article/3085239/","d":"2024-09-20"},{"t":"百度百科 - 小篆","u":"https://baike.baidu.com/item/%E5%B0%8F%E7%AF%86/809877","d":"2024-09-20"}]},"8-90":{"o":["秦漢時期","唐宋時期","宋元時期"],"x":["秦漢時期文字尚未發展成藝術形式","唐宋時期文字藝術已成熟，非真正發展時期","宋元時期文字藝術已發展完善"],"w":"中國的漢字於魏晉南北朝時期真正發展成為一門藝術。此時期書法藝術達到新高度，五種書體（篆、隸、楷、行、草）同時並行發展，名家輩出如「二王」（王羲之、王獻之），形成了南北兩派風格。書法理論也得到長足發展，為唐宋書法藝術的繁榮奠定了堅實基礎。","m":"魏晉南北朝，漢字成藝術。","n":"","v":1,"src":[{"t":"故宮博物院 - 筆墨見真章故宮書法導賞","u":"https://www.npm.gov.tw/Exhibition-Content.aspx?sno=04013357","d":"2024-09-20"}]},"8-91":{"o":["康熙、雍正","嘉慶、道光","光緒、宣統"],"x":["康熙、雍正喜愛書法而非花鳥畫","嘉慶、道光對花鳥畫成就不高","光緒、宣統時代已是晚清"],"w":"中國古代皇帝中最愛好花鳥畫並具有相當成就的是乾隆皇帝和宋徽宗。宋徽宗趙佶於花鳥畫方面成就最高，傳世有《枇杷山鳥圖》等精品，創立「宣和體」；乾隆皇帝則支持宮廷畫家創作花卉畫，建立了龐大的花卉圖鑑，將其作為展現品味與修養的方式。","m":"乾隆宋徽宗，花鳥畫成就高。","n":"官方答案為「乾隆、宋徽宗」，歷代中此二人對花鳥畫成就最著。","v":1,"src":[{"t":"故宮青少版 - 「藝術家」宋徽宗","u":"https://young.dpm.org.cn/info/493","d":"2024-09-20"},{"t":"故宮博物院展覽 - 皇帝的移動花園清代宮廷花卉畫","u":"https://theme.npm.edu.tw/exh113/emperors_garden/","d":"2024-09-20"}]},"8-92":{"o":["謝稚暉","陸探微","張僧繇"],"x":["謝稚暉是畫家但未創作洛神賦圖","陸探微是六朝四大家之一但非此作者","張僧繇為南朝畫家，生活年代晚於顧愷之"],"w":"《洛神賦圖》是東晉著名畫家顧愷之根據曹植文學名著《洛神賦》的故事情節創作的傑作。全卷長達近六米，以長卷形式描繪曹植對洛水之神的愛慕和惆悵。顧愷之「才絕、畫絕、痴絕」，此作代表了東晉人物畫的最高成就，是中國古代第一部改編自文學作品的繪畫作品。","m":"洛神賦圖顧愷之，曹植之愛化丹青。","n":"原作已失，現存主要是宋代的四件摹本。","v":1,"src":[{"t":"當代中國 - 香港故宮洛神賦圖北宋摹本","u":"https://www.ourchinastory.com/zh/4308","d":"2024-09-20"},{"t":"PAR表演藝術雜誌 - 顧愷之傳世之作《洛神賦圖》","u":"https://par.npac-ntch.org/tw/article/doc/GFC6O6GYNS","d":"2024-09-20"}]},"8-93":{"o":["文徵明","祝允明","徐禎卿"],"x":["文徵明是唐寅的同時代畫家，非其別號","祝允明是書法家，非唐寅的別號","徐禎卿是詩人，非唐寅的別號"],"w":"「六如居士」是明代著名畫家唐寅的別號。唐寅（1470-1524）字伯虎，又字子畏，人稱唐伯虎。「六如」取自《金剛經》「六如偈」的佛理，表示世事如夢、如幻、如泡、如影、如露、如電。唐寅工詩文書畫，與沈周、文徵明、仇英並稱「吳門四家」，與文徵明、祝允明、徐禎卿並稱「江南四大才子」。","m":"六如居士唐伯虎，江南四才子。","n":"","v":1,"src":[{"t":"澎湃新聞 - 江南名士唐寅六如居士的如夢人生","u":"https://www.thepaper.cn/newsDetail_forward_16016305","d":"2023-03-31"},{"t":"維基百科 - 唐寅","u":"https://zh.wikipedia.org/zh-hans/%E5%94%90%E5%AF%85","d":"2024-09-20"}]},"8-98":{"o":["北周","東漢","南朝"],"x":["北周是北方朝代，霍去病在西漢","東漢時期尚未有霍去病墓","南朝時期已是南北朝，遠晚於西漢"],"w":"霍去病墓位於陝西興平茂陵墓園，建於公元前117年西漢武帝時期。墓地保存有18件石雕藝術品，包括著名的「馬踏匈奴」、「強人搏熊」等，是中國現存最早、最完整的陵墓石雕羣。這些石雕採用圓雕和浮雕相結合的手法，造型古拙蒼勁，既實用又富有藝術性，代表了西漢石刻藝術的最高成就。","m":"霍去病墓石雕，西漢藝術瑰寶。","n":"","v":1,"src":[{"t":"人民網陝西頻道 - 茂陵霍去病墓石雕群","u":"http://sn.people.com.cn/n2/2020/0605/c378288-34064922.html","d":"2020-06-05"},{"t":"維基百科 - 霍去病墓","u":"https://zh.wikipedia.org/zh-hans/%E9%9C%8D%E5%8E%BB%E7%97%85%E5%A2%93","d":"2024-09-20"}]},"8-99":{"w":"張仲景被尊稱為醫聖，是東漢時期（西元二世紀）傑出的醫學家。他著作的《傷寒雜病論》是中國最早的理論聯繫實際的臨牀診療專書，成書於公元200年至210年。全書分為《傷寒論》和《金匱要略》二部分，共收397個治療方法和113個藥方。張仲景創立了六經辨證理論和七方十劑制度，為中醫學的發展和完善奠定了堅實基礎。","m":"張仲景醫聖，傷寒雜病論。","n":"","v":1,"src":[{"t":"台灣衛生福利部中醫藥司 - 傷寒雜病論","u":"https://dep.mohw.gov.tw/DOCMAP/cp-831-5978-108.html","d":"2024-09-20"},{"t":"維基百科 - 傷寒雜病論","u":"https://zh.wikipedia.org/zh-tw/%E5%82%B7%E5%AF%92%E9%9B%9C%E7%97%85%E8%AB%96","d":"2024-09-20"}]},"8-100":{"o":["扁鵲","李時珍","張仲景"],"x":["扁鵲是戰國時期名醫，以診斷聞名，非外科專家","李時珍是明代藥物學家，著《本草綱目》","張仲景是東漢醫聖，以傷寒論著稱"],"w":"華佗（約145年-208年）是東漢末年著名醫學家，被譽為「外科之祖」或「外科聖手」，是世界上第一位使用全身麻醉進行手術的醫學家。他發明瞭「麻沸散」，可以使病人全身麻醉，然後進行開腹手術。","m":"華佗麻沸散，開腹手術第一人；外科鼻祖東漢名。","n":"華佗與董奉、張仲景並稱「建安三神醫」，也與扁鵲、張仲景、李時珍並稱中國古代四大名醫。","v":1,"src":[{"t":"當代中國：史上超強外科神醫","u":"https://www.ourchinastory.com/","d":"2026-09-20"},{"t":"維基百科：華佗","u":"https://zh.wikipedia.org/zh-hant/%E5%8D%8E%E4%BD%97","d":"2026-09-20"}]},"8-101":{"o":["齊桓公","趙王","秦始皇"],"x":["齊桓公是春秋時期齊國國君，非《韓非子·喻老》故事主角","趙王不是該典故的人物","秦始皇時代晚於《韓非子》成書時期"],"w":"「諱疾忌醫」出自《韓非子·喻老》，講述戰國時期蔡桓公（後考證為田氏代齊後的齊國國君）因諱疾忌醫，拒絕名醫扁鵲的診治，最終病情惡化、病入膏肓至死亡的故事。用來比喻人因隱瞞病情而延誤治療。","m":"蔡桓公諱疾忌醫，終至喪生。","n":"蔡桓公應為田氏代齊以後齊國的國君，本名田午，歷史文獻記載較少，但該典故在中醫養生和醫學倫理中意義深遠。","v":1,"src":[{"t":"中文百科全書：蔡桓公","u":"https://www.newton.com.tw/wiki/%E8%94%A1%E6%A1%93%E5%85%AC","d":"2026-09-20"},{"t":"教育部《成語辭典》：諱疾忌醫","u":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=483&webMd=2&la=1","d":"2026-09-20"}]},"8-102":{"o":["唐朝","元朝","明朝"],"x":["唐朝雖有醫學成就，但法醫學專著非唐代著作","元朝官府法醫實踐豐富，但專著成書於宋代","明朝時《洗冤集錄》已成為歷代司法檢驗標準"],"w":"《洗冤集錄》是南宋法醫學家宋慈於1247年編撰而成的世界第一部法醫學專著。宋慈根據他在二十多年刑事工作中的驗屍經驗編撰此書，成為歷代官府屍傷檢驗的藍本，並曾定為宋、元、明、清各代的刑事檢驗準則。","m":"《洗冤集錄》宋慈作，世界第一法醫學著。","n":"《洗冤集錄》共五卷53條，內容涵蓋檢驗總論、驗屍、驗骨、驗傷、中毒、救死方等，1950年代蘇聯評價其為「世界最古的法醫學著作」。","v":1,"src":[{"t":"知史：宋朝法醫學名著《洗冤集錄》","u":"https://www.mychistory.com/a001-2/c0494","d":"2026-09-20"},{"t":"維基百科：洗冤集錄","u":"https://zh.wikipedia.org/zh-hant/%E6%B4%97%E5%86%A4%E9%9B%86%E5%BD%95","d":"2026-09-20"}]},"8-103":{"o":["李時珍","扁鵲","張仲景"],"x":["李時珍是明代藥物學家，發明麻藥非其貢獻","扁鵲是戰國時期名醫，時代早於麻沸散發明","張仲景是東漢醫聖，以傷寒論著稱，未發明麻藥"],"w":"麻沸散是華佗在東漢時期發明的全身麻醉藥物，是人類醫學史上的革命性發明。華佗用麻沸散使患者全身麻醉，然後進行開腹手術，比西方19世紀發現麻醉藥早了1600多年。","m":"華佗麻沸散，東漢開先河；全身麻醉術，世界第一人。","n":"麻沸散的具體配方已失傳，後人根據古籍記載推測其成分，但確切配方難以確定。","v":1,"src":[{"t":"知史：「麻沸散」是最早的麻藥嗎？","u":"https://mychistory.com/a001-2/2021-04-07-02-26-11","d":"2026-09-20"},{"t":"維基百科：麻沸散","u":"https://zh.wikipedia.org/zh-tw/%E9%BA%BB%E6%B2%B8%E6%95%A3","d":"2026-09-20"}]},"8-104":{"o":["本草綱目","傷寒論","黃帝內經"],"x":["《本草綱目》是明代李時珍所著，成書於16世紀，非最早藥物學著作","《傷寒論》是東漢張仲景著的醫學著作，非專門藥物學著作","《黃帝內經》是中醫理論著作，非專門藥物學著作"],"w":"《神農本草經》是現存最早的中藥學專著，相傳為神農氏所著，約成書於秦漢時期。書中記載365種藥物，分為上、中、下三品，開創了君臣佐使的方劑理論，奠定了中藥學的基本理論構架，對中醫藥理論體系的形成有深遠影響。","m":"《神農本草經》秦漢時，365種藥物療疾病。","n":"《神農本草經》的作者和成書時間因歷史久遠難以確定，但其在中醫藥發展中的地位無可爭議。","v":1,"src":[{"t":"維基百科：神農本草經","u":"https://zh.wikipedia.org/zh-tw/%E7%A5%9E%E5%86%9C%E6%9C%AC%E8%8D%89%E7%BB%8F","d":"2026-09-20"},{"t":"立夫中醫藥博物館","u":"https://www2.cmu.edu.tw/~cmcshow/article.php?aid=7f2a5959535a033e6044be941ebce3cb&pgid=28&n=10","d":"2026-09-20"}]},"8-105":{"o":["中醫推拿","中醫拔罐","中醫藥膳"],"x":["中醫推拿是傳統療法，未在2010年被列入非遺名錄","中醫拔罐是傳統療法，非2010年新增非遺項目","中醫藥膳是飲食療法，非2010年非遺代表作"],"w":"2010年11月16日，聯合國教科文組織在肯尼亞內羅畢召開第五次保護非物質文化遺產政府間委員會會議，正式將「中醫針灸」列入人類非物質文化遺產代表作名錄，與「京劇」等51項新增遺產同時通過。這是對中醫針灸這一傳統醫學瑰寶的全球認可。","m":"中醫針灸2010年入遺產，聯合國教科文組織肯尼亞會。","n":"中醫針灸在2010年列入非遺後，已成為全球公認的中華文明瑰寶，代表中國古代醫學的精粹。","v":1,"src":[{"t":"中國非物質文化遺產網：入選非遺十周年 中醫針灸再出發","u":"https://www.ihchina.cn/news_1_details/22213.html","d":"2026-09-20"},{"t":"聯合國新聞：「中醫針灸」和「京劇」等51項遺產跻身非物質文化遺產名錄","u":"https://news.un.org/zh/story/2010/11/141252","d":"2026-09-20"}]},"8-106":{"o":["世界非物質文化遺產","聯合國教科文組織名錄","中國傳統工藝"],"x":["世界非物質文化遺產是國際組織認定，2006年涼茶列入國家級","聯合國教科文組織名錄是國際性的，2006年是國家級認定","中國傳統工藝太寬泛，2006年涼茶文化特指非遺項目"],"w":"涼茶於2006年5月20日被中華人民共和國國務院列入國家級非物質文化遺產名錄，成為518種首批國家級非遺項目之一。涼茶是粵、港、澳地區根據當地氣候、水土特徵，在中醫養生理論指導下發展而成的傳統飲料，具有清熱解毒、祛濕等功效，已成為文化遺產重點保護對象。","m":"涼茶2006年入遺產，國家級非遺首批名。","n":"涼茶在首批518項國家級非遺中獨特之處在於是唯一用秘方和專用術語界定的非遺項目，由粵港澳三地共同申報。","v":1,"src":[{"t":"維基百科：涼茶","u":"https://zh.wikipedia.org/wiki/%E5%87%89%E8%8C%B6","d":"2026-09-20"},{"t":"中國文化研究院：涼茶","u":"https://ls.chiculture.org.hk/tc/explore/0022","d":"2026-09-20"}]},"8-107":{"o":["《難經》、《傷寒論》","《本草綱目》、《千金方》","《黃帝內經》、《本草綱目》"],"w":"2011年5月，由中國國家圖書館藏元古林書堂刻本《黃帝內經》和中醫科學院藏金陵本《本草綱目》被聯合國列入《世界記憶名錄》。這是對中華醫學文明的最高國際認可，彰顯這兩部典籍在人類醫學史上的重要地位。《黃帝內經》是現存最早的傳統中華醫學著作，對後世中醫理論影響深遠；《本草綱目》由明代李時珍歷時27年編撰而成，內容涉及多個科學領域。","m":"黃帝內經和本草綱目，2011年入世界記憶錄。","n":"2011年6月1日國家中醫藥管理局與國家檔案局聯合召開新聞通氣會，正式宣佈這一國際認可。","v":1,"src":[{"t":"中國政府網：兩部門介紹《本草綱目》等入選《世界記憶名錄》","u":"http://big5.www.gov.cn/gate/big5/www.gov.cn/gzdt/2011-06/02/content_1875897.htm","d":"2026-09-20"},{"t":"中國非物質文化遺產網：入选「世界记忆」的金陵本《本草纲目》","u":"https://www.ihchina.cn/news_1_details/10701.html","d":"2026-09-20"}]},"8-108":{"o":["觀察舌象、脈象","觸摸患者身體","詢問患者病史"],"x":["觀察舌象、脈象屬於望診和切診的範疇","觸摸患者身體主要是切診","詢問患者病史是問診的內容"],"w":"中醫四診法中的「聞診」是醫師透過聽覺和嗅覺瞭解病人情況的診斷方式。具體包括兩個方面：一是傾聽患者的説話聲音、咳嗽聲、呼吸聲等；二是嗅聞患者口氣或身體異味。這些信息能幫助中醫師判斷患者的正氣盈虧和邪氣的性質。","m":"聞診傾聽嗅聞法，聲音氣味知病情。","n":"四診法包括望、聞、問、切四種診斷方法，聞診是其中重要一環，與其他三診相輔相成。","v":1,"src":[{"t":"維基百科：聞診","u":"https://zh.wikipedia.org/zh-tw/%E9%97%BB%E8%AF%8A","d":"2026-09-20"},{"t":"衞生署中醫藥規管辦公室：診斷方法","u":"https://www.cmro.gov.hk/html/b5/useful_information/public_health/pamphlet/Diagnostic_Methods_and_Features_of_CMP.html","d":"2026-09-20"}]},"8-109":{"w":"中國陸地總面積約960萬平方公里，這是中國官方長期以來的標準統計數據，約佔世界陸地總面積的1/15。2023年中國發佈新版標準地圖時，將國土面積數據更新至1045萬平方公里，但傳統教科書和官方資料仍以960萬為基準。","m":"中國陸地面積960萬方，佔世界十五分之一。","n":"2023年中國發佈最新版標準地圖，國土面積統計調整至1045萬平方公里，但習題通常仍採用960萬的傳統數據。","v":1,"src":[{"t":"當代中國：中國地理小知識","u":"https://www.ourchinastory.com/zh/5734/%E4%B8%AD%E5%9C%8B%E5%9C%B0%E7%90%86%E5%B0%8F%E7%9F%A5%E8%AD%98%EF%BD%9C%E4%B8%AD%E5%9C%8B%E6%9C%89%E5%A4%9A%E5%A4%A7%EF%BC%9F%E9%9D%A2%E7%A9%8D%E6%8E%A5%E8%BF%91%E6%95%B4%E5%80%8B%E6%AD%90%E6%B4%B2%EF%BC%81","d":"2026-09-20"},{"t":"中國政府網：國情","u":"https://www.gov.cn/guoqing/","d":"2026-09-20"}]},"8-110":{"o":["西沙羣島","東沙羣島","釣魚島"],"x":["西沙羣島位於南海北部，非中國最南領土","東沙羣島位於南海北部，非最南領土","釣魚島位於東海，與最南領土無關"],"w":"中國最南的領土是南沙羣島，其中曾母暗沙是中國的最南端領土點。南沙羣島由230多個島、洲、礁、沙、灘組成，南北長500多海里，東西寬400多海里，總面積約90萬平方公里，地處太平洋和印度洋之間的國際航道要衝。","m":"南沙羣島最南端，曾母暗沙是邊界。","n":"南沙羣島涉及多國主權爭議，包括中華人民共和國、越南、菲律賓等7個國家聲稱擁有部分島礁主權。","v":1,"src":[{"t":"維基百科：南沙群島","u":"https://zh.wikipedia.org/zh-tw/%E5%8D%97%E6%B2%99%E7%BE%A4%E5%B2%9B","d":"2026-09-20"},{"t":"公共電視：我們的島 - 南沙群島","u":"https://ourisland.pts.org.tw/county/479","d":"2026-09-20"}]},"8-111":{"o":["第一","第二","第四"],"x":["第一是俄羅斯，面積最大","第二是加拿大，次於俄羅斯","第四存在爭議，取決於統計方式"],"w":"中國領土面積在世界各國中目前居於第三位，面積約960萬平方公里。在中國之前的是俄羅斯聯邦（面積最大）和加拿大（第二大）。但值得注意的是，不同國家對領土面積的計算標準和方法存在差異，如對某些有爭議領土的認定、湖泊面積計入等因素，美國與中國的排名在某些統計中會互換。","m":"中國領土世界第三，俄加之後排。","n":"中國官方確認領土面積世界排名為第三，但根據不同計算方式，與美國的排名有時會有爭議。","v":1,"src":[{"t":"維基百科：世界各國和地區面積列表","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%96%E7%95%8C%E5%90%84%E5%9B%BD%E5%92%8C%E5%9C%B0%E5%8C%BA%E9%9D%A2%E7%A9%8D%E5%88%97%E8%A1%A8","d":"2026-09-20"},{"t":"當代中國：中國地理小知識","u":"https://www.ourchinastory.com/zh/5734","d":"2026-09-20"}]},"8-112":{"o":["蘇伊士運河","巴拿馬運河","黑龍江"],"x":["蘇伊士運河長約193公里，非世界最長運河","巴拿馬運河長約51公里，非最長","黑龍江是天然河流，非人工運河"],"w":"京杭大運河全長1,794公里，北起北京，南至杭州，是世界上最長的人工運河，也是中國最長的運河。京杭大運河開鑿於2,500年前，從春秋時期開始修建，隋煬帝時期形成初步規模，元世祖忽必烈時期進一步拓建至現在的規模。這條運河連接了海河、黃河、淮河、長江、錢塘江五大水系，對中國水運和經濟發展起了重要作用。","m":"京杭大運河一千七百九十四，世界最長人工渠。","n":"京杭大運河於2014年被列入世界文化遺產，蘇伊士運河長193公里，約為京杭大運河的九分一。","v":1,"src":[{"t":"當代中國：開鑿於2500年前 京杭大運河斷流百年首次全線通水","u":"https://www.ourchinastory.com/zh/4054/%E9%96%8B%E9%91%BF%E6%96%BC2500%E5%B9%B4%E5%89%8D-%E4%BA%AC%E6%9D%AD%E5%A4%A7%E9%81%8B%E6%B2%B3%E6%96%B7%E6%B5%81%E7%99%BE%E5%B9%B4%E9%A6%96%E6%AC%A1%E5%85%A8%E7%B7%9A%E9%80%9A%E6%B0%B4","d":"2026-09-20"},{"t":"中國文化：京杭大運河","u":"https://chinacurrent.com/education/article/2021/04/22073.html","d":"2026-09-20"}]},"8-113":{"o":["黃果樹瀑布","九寨溝","張家界"],"x":["黃果樹瀑布位於貴州，李白詩句並非指此","九寨溝以多個瀑布羣著稱，非特指一處瀑布","張家界以砂岩峯林著稱，非李白詩中瀑布"],"w":"李白的《望廬山瀑布》中「飛流直下三千尺，疑是銀河落九天」指的是廬山瀑布。廬山位於江西省九江市南部，瀑布從懸崖飛流而下，李白用誇張的手法、高浪漫的想像力，將瀑布比作銀河從天而降。這首詩運用比喻、誇張等修辭手法，是李白最著名的山水詩。","m":"廬山瀑布李白詩，飛流三千疑銀河。","n":"李白詩中「三千尺」是傳統誇張表述，代表極其高遠，非實際尺寸測量。","v":1,"src":[{"t":"民初思韻：飛流直下三千尺,疑是銀河落九天","u":"http://www.rocidea.com/one?id=14231","d":"2026-09-20"}]},"8-114":{"o":["8.5公里","6.8公里","9.2公里"],"x":["8.5公里數據不符合官方統計","6.8公里為不正確的長度","9.2公里超過官方公布的長度"],"w":"北京中軸線全長7.8公里，北起鐘鼓樓，南至永定門，是世界上最長的城市軸線。北京中軸線始建於13世紀，形成於16世紀，體現了中國傳統都城規劃的理想秩序，2024年7月被列入聯合國世界文化遺產名錄。","m":"北京中軸線七點八公里，世界最長城市軸。","n":"北京中軸線保護區域包括15處建築及遺存，包括天壇、天安門、故宮等著名地標，是北京城市文化象徵。","v":1,"src":[{"t":"當代中國：世界最長城市中軸線 7.8公里看盡北京城800年變遷","u":"https://www.ourchinastory.com/zh/5955/%E4%B8%96%E7%95%8C%E6%9C%80%E9%95%B7%E5%9F%8E%E5%B8%82%E4%B8%AD%E8%BB%B8%E7%B7%9A--7.8%E5%85%AC%E9%87%8C%E7%9C%8B%E7%9B%A1%E5%8C%97%E4%BA%AC%E5%9F%8E800%E5%B9%B4%E8%AE%8A%E9%81%B7","d":"2026-09-20"},{"t":"星島日報：7.8公里世界最長 北京中軸線成功申遺","u":"https://std.stheadline.com/daily/article/2613307/%E6%97%A5%E5%A0%B1-%E4%B8%AD%E5%9C%8B-7-8%E5%85%AC%E9%87%8C%E4%B8%96%E7%95%8C%E6%9C%80%E9%95%B7-%E5%8C%97%E4%BA%AC%E4%B8%AD%E8%BB%B8%E7%B7%9A%E6%88%90%E5%8A%9F%E7%94%B3%E9%81%BA","d":"2026-09-20"}]},"8-115":{"o":["湖南","安徽","浙江"],"x":["湖南有洞庭湖，非最大淡水湖","安徽有巢湖，非最大淡水湖","浙江有西湖，但非最大淡水湖"],"w":"鄱陽湖是中國最大的淡水湖，位於江西省北部、長江南岸。鄱陽湖面積約3,583平方公里，南北長173公里，東西最寬74公里，湖岸線長1,200公里。鄱陽湖接納五大河流來水，每年向長江輸送的水量佔長江干流年水量的五分之一，是長江中下游的重要調節湖泊。","m":"鄱陽湖最大淡水湖，位於江西北部長江南。","n":"鄱陽湖是中國五大淡水湖（鄱陽湖、洞庭湖、太湖、巢湖、洪澤湖）中最大的，也是候鳥的重要越冬地。","v":1,"src":[{"t":"維基百科：鄱陽湖","u":"https://zh.wikipedia.org/wiki/%E9%84%B1%E9%98%B3%E6%B9%96","d":"2026-09-20"},{"t":"中國科學院地理科學與資源研究所：中國最大的淡水湖","u":"http://www.igsnrr.cas.cn/cbkx/kpyd/dlzs/land/202009/t20200910_5692506.html","d":"2026-09-20"}]},"8-116":{"o":["青海","新疆","內蒙古"],"x":["青海位於高原，但未特稱「世界屋脊」","新疆是中國最大自治區，無此稱號","內蒙古不在高原地區，無此稱號"],"w":"西藏自治區有「世界屋脊」之稱。西藏位於青藏高原西南部，平均海拔在4,000米以上，是全球最高最大的高原所在地。青藏高原素有「世界屋脊」及「世界第三極」之稱，面積250萬平方公里，佔中國總面積的四分之一。西藏自治區佔據青藏高原主體區域，海拔高度使其成為「世界屋脊」的核心部分。","m":"西藏自治區世界屋脊，高原海拔四千米。","n":"青藏高原是世界最高的高原，西藏佔據其主要部分，故西藏被稱為「世界屋脊」或「世界第三極」。","v":1,"src":[{"t":"維基百科：西藏自治區","u":"https://zh.wikipedia.org/zh-tw/%E8%A5%BF%E8%97%8F%E8%87%AA%E6%B2%BB%E5%8C%BA","d":"2026-09-20"},{"t":"中國文化研究院：西藏自治區","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1928","d":"2026-09-20"}]},"8-117":{"o":["廣西","廣東","福建"],"x":["廣西有北部灣，但無此稱號","廣東鄰近海岸，但海南島才有此稱號","福建有海灣風景，但非題目所指"],"w":"海南島有「天涯海角」及「東方夏威夷」的稱號。海南島位於南海，具有優美的海濱風景，天涯海角是海南著名景區，位於三亞市南端，相傳情侶同至此地可一生一世相守。海南島因其湛藍的海水、綿延的沙灘、怡人的氣候及奢華度假設施，被譽為「東方夏威夷」，是國內外遊客的熱門旅遊目的地。","m":"海南島天涯海角東方夏威夷，美景如畫度假天堂。","n":"天涯海角是海南島最南端的旅遊景區，三亞市因其優美風景和國際度假村聞名，已成為中國最重要的海濱旅遊目的地之一。","v":1,"src":[{"t":"維基百科：天涯海角","u":"https://zh.wikipedia.org/wiki/%E5%A4%A9%E6%B6%AF%E6%B5%B7%E8%A7%92","d":"2026-09-20"},{"t":"TripAdvisor：海南景點評論","u":"https://www.tripadvisor.com/Attraction_Review-g297427-d503338-Reviews-Tianya_Haijiao-Sanya_Hainan.html","d":"2026-09-20"}]},"8-118":{"o":["嘉峪關","居庸關","八達嶺"],"x":["嘉峪關位於甘肅，為西部要塞，無此稱號","居庸關位於北京，無此稱號","八達嶺為長城景區，非特定關隘稱號"],"w":"山海關有「天下第一關」之稱，位於河北省秦皇島市東北，是明朝長城最東端的重要關隘。山海關古稱榆關，因北倚燕山、南連渤海而得名。山海關城牆高14米、厚7米、周長4公里，城有四門，東門（鎮東門）上有明代書法家肖顯所書的「天下第一關」匾額。此關地勢險要，易守難攻，歷為兵家必爭之地，1987年作為長城的一部分列入世界文化遺產。","m":"山海關天下第一關，明代長城東端要塞。","n":"山海關在地理位置上確實位於長城最東端，北鄰渤海，南瀕碣石山，戰略位置極其重要。","v":1,"src":[{"t":"維基百科：山海關","u":"https://zh.wikipedia.org/zh-tw/%E5%B1%B1%E6%B5%B7%E5%85%B3","d":"2026-09-20"},{"t":"國家文化記憶庫2.0：萬里長城天下第一關山海關","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Place&id=477015","d":"2026-09-20"}]},"8-119":{"o":["開封","西安","南京"],"x":["開封位於河南中部，非龍門石窟所在地","西安位於陝西，龍門石窟在河南洛陽","南京位於江蘇，與龍門石窟距離遙遠"],"w":"龍門石窟位於河南省洛陽市南郊，是中國著名的三大石刻藝術寶庫之一（與敦煌莫高窟、大同雲岡石窟並列），同時被譽為世界最偉大的古典藝術寶庫之一。龍門石窟現存窟龕2,345個以上，佛像約11萬體，規模龐大。其中奉先寺盧舍那大佛高達17.14米，面容相傳映照武則天風采，是龍門石窟的象徵。龍門石窟凝聚了北魏至唐代千年的造像藝術精華。","m":"龍門石窟在洛陽，三大石刻藝術寶庫。","n":"龍門石窟造營始於北魏孝文帝遷都洛陽（493年），經過4個多世紀的持續開鑿，達到規模最大是在唐代。","v":1,"src":[{"t":"Skyticket 觀光指南：龍門石窟","u":"https://skyticket.jp/guide/113009/","d":"2026-09-20"},{"t":"中華人民共和國世界遺產：龍門石窟","u":"https://www.his-j.com/theme/world-heritage/asia/china/longmen/","d":"2026-09-20"}]},"8-120":{"o":["廣西壯族自治區","貴州省","四川省"],"x":["廣西是中國少數民族人口最多的省級行政區，但世居少數民族數量不是最多的","貴州省有17個世居少數民族，遠少於雲南的25個","四川省少數民族數量遠低於雲南省"],"w":"雲南省共有25個世居少數民族，是全國少數民族最多的省份。這些民族大多聚居於雲南，包括哈尼族、白族、傣族等15個為雲南獨有的民族，佔全國該民族總人口的80%以上。","m":"雲南25個民族——中國民族大家庭的搖籃。","n":"","v":1,"src":[{"t":"北京市密雲區人民政府：我國世居少數民族分佈最多的省份","u":"https://www.bjmy.gov.cn/zwgk/ztbd/cjqgmztjjbsfq/mzzsll/202409/t20240910_443078.html","d":"2024-09-10"},{"t":"中國青年網：雲南25個少數民族","u":"http://cunguan.youth.cn/ztzz2/wlmz/tplb/201807/t20180726_11681383.htm","d":"2018-07-26"}]},"8-121":{"o":["重慶、武漢、杭州","重慶、南京、西安","南京、武漢、南昌"],"x":["杭州雖然夏季炎熱，但傳統上不列入'三大火爐'之中","西安是北方城市，不屬於長江流域火爐城市","南昌在民間傳説中曾被稱為火爐，但官方並未確認其地位"],"w":"長江三大火爐是指重慶、南京、武漢三座城市。這一説法源於民國時期，指的是這些城市夏季氣温高、濕度大，持續時間長，體感炎熱難熬。儘管'火爐'城市在氣象上並無嚴格定義，但這三座城市的高温特徵確實顯著。","m":"重、南、武三城夏日如爐——長江火爐三巨頭。","n":"注意：'火爐'城市為民間流傳説法，無官方氣象標準；近年來隨著氣候變化，高温城市排名已發生變化。","v":1,"src":[{"t":"中國新聞網：三大火爐民間流傳無確切定義","u":"https://www.chinanews.com/gn/2012/08-22/4124175.shtml","d":"2012-08-22"},{"t":"中國科學院地理科學與資源研究所：長江流域三大火爐","u":"http://www.igsnrr.cas.cn/cbkx/kpyd/dlzs/land/202009/t20200910_5692555.html","d":"2020-09-10"}]},"8-122":{"o":["3.2萬公里","2.5萬公里","1.2萬公里"],"x":["3.2萬公里是包括大陸和島嶼的總海岸線長度，題目問的是具體數值","2.5萬公里數值不符合實際統計","1.2萬公里遠低於實際大陸海岸線長度"],"w":"中國海岸線總長為3.2萬公里，其中大陸海岸線為1.8萬公里，島嶼海岸線為1.4萬公里。這些數據是根據海岸線測量標準進行統計的。中國擁有世界上最長的海岸線之一。","m":"中國海岸線3.2萬公里——大陸1.8萬，島嶼1.4萬。","n":"","v":1,"src":[{"t":"中華人民共和國自然資源部：海岸線信息","u":"https://fgw.fujian.gov.cn/ztzl/hxlsjjsyqzt/haxjj/202207/t20220714_5953615.htm","d":"2022-07-14"}]},"8-123":{"o":["中西區","灣仔區","南區"],"x":["中西區位於香港島西部，博物館實際位於東區","灣仔區位於香港島東中部，非東區","南區位於香港島南部，距離東區較遠"],"w":"香港抗戰及海防博物館於2024年9月3日由原海防博物館改設並重開，位於香港東區筲箕灣東喜道。該建築由逾百年歷史的舊鯉魚門炮台改建而成，面積約3.42萬平方米，設有11個展覽廳，其中四個專為抗戰主題展覽廳。","m":"香港抗戰海防館——東區筲箕灣，古炮台新生命。","n":"","v":1,"src":[{"t":"香港古物古蹟辦事處：香港抗戰及海防博物館","u":"https://www.amo.gov.hk/tc/heritage-trails/dongjiang-column-heritage-trail/hkmwrcd/index.html","d":"2024-09-03"},{"t":"中國新聞網：香港海防博物館改設為抗戰及海防博物館","u":"https://www.chinanews.com.cn/dwq/2024/05-17/10218788.shtml","d":"2024-05-17"}]},"8-124":{"o":["《吳子兵法》","《司馬法》","《黃帝陰符經》"],"x":["《吳子兵法》雖為重要兵書，但成書時代較晚，現存版本不如《孫子兵法》完整","《司馬法》雖有歷史記載，但現存第一部完整軍事著作應為《孫子兵法》","《黃帝陰符經》屬於道家類著作，非軍事著作"],"w":"《孫子兵法》是中國現存第一部完整的軍事著作，由春秋時期吳國將軍孫武所著，約6000字，共13篇。它被列為世界最早的三大兵書之一，已有2500年歷史，對人類軍事思想產生了深遠影響。唐代名將李世民曾讚歎'觀諸兵書，無出孫武'。","m":"孫武《孫子兵法》——世界最早，聞名千年。","n":"","v":1,"src":[{"t":"中國外文出版發行事業局：《孫子兵法》介紹","u":"http://www.cicg.org.cn/2021-01/21/content_41424298.htm","d":"2021-01-21"},{"t":"中國政府網：《孫子兵法》","u":"http://keywords.china.org.cn/m/2024-08/28/content_117392904.html","d":"2024-08-28"}]},"8-125":{"o":["秦漢時期","戰國時期","先秦時期"],"x":["秦漢時期的長城雖然規模更大，但不是最早修築時期","戰國時期長城與春秋戰國時期重疊，但題目已給出為春秋戰國時期","先秦時期的表述過於籠統，應特指春秋戰國"],"w":"中國長城最早修築於春秋戰國時期，約公元前7至前5世紀。最初由諸侯國如楚、齊、韓、魏、趙、燕等為相互防禦而修築，用於防禦其他諸侯國或北方遊牧民族。當時各國長城規模較小，共幾千公里。到秦統一後才開始修築萬里長城。","m":"長城春秋始——諸侯築防線，秦才成萬里。","n":"","v":1,"src":[{"t":"中國長城文化遺產委員會：長城修築歷史","u":"http://www.greatwallheritage.cn/CCMCMS/html/1/56/149/1785.html","d":"2020-09-10"},{"t":"中華人民共和國長城故事：春秋戰國時代的長城","u":"https://changcheng.ctnews.com.cn/2022-05/30/content_124369.html","d":"2022-05-30"}]},"8-126":{"o":["王禎","沈括","蔡倫"],"x":["王禎是元代印刷技術改進者，而非活字印刷發明者","沈括是北宋科學家，曾記載磁針原理，但未發明活字印刷","蔡倫是東漢造紙術發明者，時代早於活字印刷"],"w":"活字印刷術由北宋布衣畢昇在庶曆間（1041-1048年）發明。畢昇用膠泥制字，一個字為一個印刷體，經火燒硬成陶質。排版時預先在鐵板上鋪蠟與松香混合物，排好字後加熱，使字印與混合物結為一體。這項發明被列為中國古代四大發明之一。","m":"畢昇膠泥活字——北宋革命，改寫印刷史。","n":"","v":1,"src":[{"t":"中國非物質文化遺產網：活字印刷術","u":"https://www.ihchina.cn/news_1_details/22243.html","d":"2024-08-28"},{"t":"新華網：毕昇到古登堡——中西印刷術交流","u":"http://www.news.cn/world/20250424/319bdfeb04e046bb9dad80ec142d49c7/c.html","d":"2025-04-24"}]},"8-127":{"o":["水漏","沙漏","漏刻"],"x":["水漏為水力計時工具，與'寸光陰'無直接關聯","沙漏原理與日晷不同，不能直觀表現光影移動","漏刻是水力計時裝置，非光影測時工具"],"w":"成語'一寸光陰一寸金'與古代計時工具日晷有關。日晷由晷盤和晷針組成，利用太陽投影在晷盤上的影子移動來指示時辰。'一寸光陰'指的是晷針影子在晷盤上移動一寸距離所耗費的時間，暗示時間流逝的珍貴，提醒人們珍惜光陰。","m":"日晷影子一寸移——光陰金玉不可失。","n":"","v":1,"src":[{"t":"人民日報：'一寸光陰'到底有多久？","u":"https://www.xhby.net/content/s67ddff61e4b0fec08799fd2a.html","d":"2025-03-22"},{"t":"中國氣象局：日晷和漏刻——古老時光的計時器","u":"https://www.cma.gov.cn/kppd/kppdqxsj/kppdqxgc/202111/t20211103_4159859.html","d":"2021-11-03"}]},"8-128":{"o":["鐵礦石礦物","重力加速度","地球旋轉"],"x":["鐵礦石雖含鐵元素，但指南針的原理是磁性而非鐵性本身","重力加速度與指南針無關","地球旋轉與指南針的發明原理無直接關係"],"w":"指南針是古代中國勞動人民對磁石磁性認識的結果，為中國古代四大發明之一。中國先民早在春秋時期就在採礦冶煉中認識了磁石，戰國時期已製出比較精確的指南針'司南'。沈括在《夢溪筆談》中首次指出指南針存在磁偏角，領先世界千年。","m":"古人認識磁石磁性——指南針應運而生。","n":"","v":1,"src":[{"t":"天津大學材料科學
