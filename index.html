的數據，在4.6西格瑪置信度水平（誤報率小於五十萬分之一）上發現了具有納赫茲引力波特徵的四極相關信號證據。這是納赫茲引力波搜尋的重要突破，標誌著中國納赫茲引力波探測研究達到世界領先水平。","m":"天眼觀星辨引波，中國科學領先全球","n":"","v":1,"src":[{"t":"「中國天眼」發現納赫茲引力波存在關鍵證據","u":"https://www.cas.cn/zt/kjzt/2023kjpd/2023kjrb1/202312/t20231229_4993283.shtml","d":"2023-12-29"},{"t":"中國天眼FAST納赫茲引力波搜尋研究取得重大突破","u":"https://www.cas.cn/yw/202306/t20230629_4918284.shtml","d":"2023-06-29"},{"t":"「中國天眼」看到納赫茲引力波存在關鍵證據","u":"http://www.news.cn/tech/20230630/5b79052e40a54c9ca2bd8f0b5d4c5ceb/c.html","d":"2023-06-30"}]},"7-科技31":{"o":["傳統計算機","光學計算機","生物計算機"],"x":["九章三號具有255個光子，計算能力遠超經典超級計算機","求解特定問題的速度比超算快一億億倍","代表中國在光量子計算領域的重大進步"],"w":"2023年10月11日，中國科學技術大學宣佈成功構建「九章三號」量子計算原型機。該機器由255個光子組成，由潘建偉、陸朝陽等科學家及中科院上海微系統所聯合研製。九章三號求解高斯玻色採樣數學問題的速度比目前最快超級計算機「Frontier」快一百萬倍，能在一微秒內處理最複雜的樣本。該成就標誌著中國量子計算研究邁入新階段。","m":"九章三號光子舞，量子計算超越人工智能","n":"","v":1,"src":[{"t":"「九章三號」來了：中國研製量子計算機再進一步","u":"http://finance.people.com.cn/n1/2023/1011/c1004-40093194.html","d":"2023-10-11"},{"t":"「九章三號」量子計算原型機問世 中國確立算力新里程碑","u":"http://www.news.cn/tech/2023-10/11/c_1129911227.htm","d":"2023-10-11"},{"t":"【新華網】「九章三號」來了：中國研製量子計算機再進一步","u":"https://www.cas.cn/cm/202310/t20231011_4973949.shtml","d":"2023-10-11"}]},"7-科技32":{"o":["38次","39次","41次"],"x":["雪龍2號在2024年4月訪港時，中國第40次南極考察隊圓滿完成任務","這是雪龍2號首次訪港，展示國家極地科考成就","40次科學考察體現中國極地科研的堅持與進展"],"w":"2024年4月8日，中國第一艘自主建造的極地科學考察破冰船「雪龍2號」首次到訪香港。該船在完成第40次南極科學考察任務後來港訪問，為期5天。雪龍2號船長122.5米，排水量近1.4萬噸，由中國自主設計建造。此次訪港期間，中國第40次南極考察隊的科學家進行了多項科普交流，展現了中國在極地科研領域的重大成就。","m":"雪龍二號訪香江，南極第四十次輝煌","n":"","v":1,"src":[{"t":"「雪龍2」號首次訪港 展示國家極地科考成就","u":"http://www.locpg.gov.cn/jsdt/2024-04/09/c_1212350630.htm","d":"2024-04-09"},{"t":"香港政府新聞網 - 雪龍2號抵港訪問五天","u":"https://www.news.gov.hk/chi/2024/04/20240408/20240408_170443_441.html","d":"2024-04-08"},{"t":"我國首艘自主建造極地科學考察破冰船「雪龍2」號抵達香港","u":"https://www.eworldship.com/html/2024/OperatingShip_0409/202196.html","d":"2024-04-09"}]},"7-科技33":{"o":["中山站","昆侖站","泰山站"],"x":["長城站於1984年12月建造，是中國第一座南極考察站","經過27天日夜奮戰於1985年2月14日建成，2月20日舉行落成典禮","位於南極洲喬治王島南部，是中國南極科考的破冰者"],"w":"1984年12月，中國科考隊在南極洲喬治王島開始建設中國第一座常年南極科學考察站——長城站。隊員由591人組成，包括科學家、軍人、記者、建築工人等。他們頂風冒雪，日夜奮戰，僅用27天時間就建成了這座科考站，創造了南極考察史上的奇蹟。1985年2月15日（北京時間）電站建設全部完成，2月20日舉行落成典禮正式開站。長城站位於喬治王島南部，佔地面積2.52平方公里，標誌著中國邁入極地科學考察的新時代。","m":"長城站南極立，二十七天築奇蹟","n":"","v":1,"src":[{"t":"百年瞬間丨中國首個南極科考站——長城站建成","u":"http://www.12371.cn/2021/02/15/VIDE1613350681025607.shtml","d":"2021-02-15"},{"t":"長城站：中國第一座南極科學考察站","u":"https://www.12371.cn/2020/01/10/VIDE1578641236491598.shtml","d":"2020-01-10"},{"t":"長城站38歲了！聽第一任站長揭秘中國首次南極科考","u":"https://news.bjd.com.cn/2023/02/16/10338585.html","d":"2023-02-16"}]},"7-科技34":{"o":["第二例","第三例","第四例"],"x":["2023年5月4日全球首例非人靈長類動物介入式腦機接口試驗在北京成功","猴子通過意念操縱機械臂自主取食，實現主動控制","此項技術突破了血管內腦電信號採集等核心技術"],"w":"2023年5月4日，全球首例非人靈長類動物介入式腦機接口試驗在北京成功完成。由南開大學段峯教授團隊牽頭，與301醫院、心瑋醫療聯合進行。試驗中，雙手被綁住的猴子通過意念（腦電信號）成功操縱機械臂，將食物送入嘴邊。與需要在大腦打洞的其他技術不同，此方案採用成熟的神經介入技術，安全性更高。該成就標誌著中國腦機接口技術躋身國際領先行列。","m":"猴腦意念控機臂，中國腦機技術領全球","n":"","v":1,"src":[{"t":"全球首例！南開團隊牽頭完成介入式腦機接口非人靈長類動物試驗","u":"https://news.nankai.edu.cn/ywsd/system/2023/05/05/030055887.shtml","d":"2023-05-05"},{"t":"全球首例！國產腦機接口讓猴子通過意念取食","u":"https://www.nbd.com.cn/articles/2023-05-17/2829854.html","d":"2023-05-17"},{"t":"猴腦主動腦控機械臂！中國完成首例非人靈長類動物介入式腦機接口試驗","u":"https://www.thepaper.cn/newsDetail_forward_22976286","d":"2023-05-05"}]},"7-科技35":{"o":["第二","第三","第四"],"x":["港珠澳大橋全長55公里，是世界最長的跨海橋樑","主體工程「海中橋隧」長35.578公里，海底隧道長約6.75公里","大橋能抗16級颱風、8級地震，設計使用壽命120年"],"w":"港珠澳大橋是連接香港、珠海、澳門的超大型跨海通道，全長約55公里，是世界上最長的跨海大橋。大橋集橋、島、隧道於一體，主體工程「海中橋隧」長35.578公里，海底隧道長約6.75公里，是世界上最長的沉管海底隧道。大橋採用雙向六線行車，設計速度每小時100公里，能抗16級颱風、8級地震，設計使用壽命長達120年，被稱為「現代世界七大奇蹟」之一。","m":"港珠澳大橋世界長，跨海壯舉百年夢","n":"","v":1,"src":[{"t":"圖解港珠澳大橋：世界上最長的跨海橋樑工程","u":"https://chiculture.org.hk/tc/china-today/24","d":"2019-02-01"},{"t":"世界十大最長跨海大橋排名","u":"https://web.phb123.com/city/jz/20166.html","d":"2023-11-15"},{"t":"【港珠澳大橋】集橋島隧一體 世界最長跨海橋","u":"https://www.hk01.com/%E5%8D%B3%E6%99%82%E4%B8%AD%E5%9C%8B/249980/%E6%B8%AF%E7%8F%A0%E6%BE%B3%E5%A4%A7%E6%A9%8B-%E9%9B%86%E6%A9%8B%E5%B3%B6%E9%9A%A7%E4%B8%80%E9%AB%94-%E4%B8%96%E7% 9-20"},{"t":"中華人民共和國外交部：中國人民解放軍是維護地區和世界和平的強大力量","u":"https://www.mfa.gov.cn/zwbd_673032/fbwz/202107/t20210731_9172552.shtml","d":"2021-07-31"}]},"7-軍事33":{"o":["全國人民代表大會","國務院","中共中央委員會"],"x":["是國家權力機構，非軍隊領導機關","是政府行政機構，非軍事領導機關","是黨的決策機構，領導地位在憲法軍事條款中居次"],"w":"根據中華人民共和國憲法，中央軍事委員會是領導全國武裝力量的最高軍事決策和指揮機構。中央軍事委員會由主席、副主席和委員組成，實行主席負責制。黨的中央軍事委員會與國家中央軍事委員會為一體，以中央軍事委員會的名義行使職權。","m":"中央軍委領導權，武裝力量在其中","n":"","v":1,"src":[{"t":"維基百科：中央軍事委員會","u":"https://zh.wikipedia.org/zh-hans/%E4%B8%AD%E5%A4%AE%E5%86%9B%E4%BA%8B%E5%A7%94%E5%91%98%E4%BC%9A","d":"2026-09-20"},{"t":"周口人大網：百題百析⑰中華人民共和國全國武裝力量由中央軍委領導","u":"https://zkrd.henanrd.gov.cn/2024/07-10/211981.html","d":"2024-07-10"},{"t":"新華網：建軍之本 強軍之魂","u":"http://www.news.cn/politics/2021-09/16/c_1127867827.htm","d":"2021-09-16"}]},"7-軍事34":{"o":["城市廣場","山洞或山脈","高層建築頂樓"],"x":["空曠易受衝擊波傷害，防護能力差","環境難以控制，可能被困","距離爆炸過近，防護不足"],"w":"遇到空襲等緊急情況時，地下停車場是較好的防護地點。地下停車場通常位於地下3至4層，距離地面約10米，具有堅固的混凝土結構和防爆設計，可以有效阻擋核爆炸的光輻射、衝擊波和高温。許多中國城市的地下停車場和地下超市都兼具民防設施功能。","m":"地下停車場深藏，核防護有保障","n":"","v":1,"src":[{"t":"觀察者網：北京地鐵能防原子彈？你不知道的人防工程，關鍵時刻救你命！","u":"https://user.guancha.cn/main/content?id=553113&s=wapzwyess","d":"2026-09-20"},{"t":"澎湃號·湃客：欢迎来到末日地下掩体","u":"https://www.thepaper.cn/newsDetail_forward_22259962","d":"2026-09-20"},{"t":"網易訂閱：當核武器在上空引爆，我們該如何自救，躲進地下停車場安全嗎？","u":"https://www.163.com/dy/article/G4NOPE3O055218RY.html","d":"2026-09-20"}]},"7-軍事35":{"o":["六大戰區","四大戰區","八大戰區"],"x":["多於現有編制","少於現有編制","超過實際軍事組織數量"],"w":"2016年2月1日，中國人民解放軍五大戰區正式成立並授旗。五大戰區分別為東部戰區（司令部駐南京）、南部戰區、西部戰區（司令部駐成都）、北部戰區（司令部駐瀋陽）、中部戰區（司令部駐北京）。此次改革由原來的七大軍區調整為五大戰區，標誌著「軍委管總、戰區主戰、軍種主建」的軍事領導體制改革基本完成。","m":"五大戰區護家園，東南西北中齊看","n":"","v":1,"src":[{"t":"維基百科：中國人民解放軍戰區","u":"https://zh.wikipedia.org/zh-cn/%E4%B8%AD%E5%9B%BD%E4%BA%BA%E6%B0%91%E8%A7%A3%E6%94%BE%E5%86%9B%E6%88%98%E5%8C%BA","d":"2026-09-20"},{"t":"百度百科：中國人民解放軍五大戰區","u":"https://baike.baidu.com/item/%E4%B8%AD%E5%9B%BD%E4%BA%BA%E6%B0%91%E8%A7%A3%E6%94%BE%E5%86%9B%E4%BA%94%E5%A4%A7%E6%88%98%E5%8C%BA/19332115","d":"2026-09-20"},{"t":"昆侖策研究院：軍改後 03-20"}]},"5-1":{"w":"1842年8月29日，中英鴉片戰爭結束，清政府與英國簽署《南京條約》。該條約要求中國割讓香港島給英國，開放五處通商口岸，並賠償英軍軍費等共2100萬銀元。香港自此淪為英國殖民地。","m":"一八四二年秋，南京條約割香港。","v":1,"src":[{"t":"香港割讓 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/%E9%A6%99%E6%B8%AF%E5%89%B2%E8%AE%93","d":"2024-03-15"},{"t":"戰史今日8月29日：中英簽訂《南京條約》 - 中新網","u":"https://www.chinanews.com.cn/mil/2014/08-29/6544422.shtml","d":"2014-08-29"}]},"5-2":{"w":"1997年7月香港回歸，面臨亞洲金融危機威脅。特區政府在中央政府支持下，於1997年10月起動用官方外匯儲備，與國際炒家進行激烈的金融保衞戰，最終於1998年8月成功擊退國際炒家，維護了港元聯繫匯率制度的穩定，保護了香港金融安全。","m":"九七年秋，港府捍衞港幣，聯繫匯率護港金。","v":1,"src":[{"t":"香港金融保衛戰 - 中國人民大學金融案例中心","u":"http://case.sf.ruc.edu.cn/alk/alfl/jr/f2130a6c3ec54fd38747c1320cf96de7.htm","d":"2015-08-28"},{"t":"香港聯繫匯率制度 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/%E9%A6%99%E6%B8%AF%E8%81%AF%E7%B9%AB%E5%8C%AF%E7%8E%87%E5%88%B6%E5%BA%A6","d":"2024-03-20"}]},"5-3":{"w":"1998年5月24日，香港特別行政區舉行首屆立法會選舉。選舉產生60名議員，其中地方選區20人，選舉委員會委任10人，功能界別30人。投票率達53.29%，反映市民對特區民主制度的參與。首屆立法會於1998年7月1日成立，任期至2000年6月30日。","m":"九八年五月選立會，香港民主邁新步。","v":1,"src":[{"t":"1998年香港立法會選舉 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/1998%E5%B9%B4%E9%A6%99%E6%B8%AF%E7%AB%8B%E6%B3%95%E6%9C%83%E9%81%B8%E8%88%89","d":"2024-03-18"},{"t":"選舉管理委員會 - 1998年立法會換屆選舉","u":"https://www.eac.hk/tc/elections/legco/1998.html","d":"2024-03-15"}]},"5-4":{"w":"1997年10月開始，國際炒家索羅斯對香港發動金融攻擊，試圖摧毀港元聯繫匯率制度。特區政府在中央政府的強大支持下，動用官方外匯儲備進行長達近一年的金融保衞戰。於1998年8月28日，港府成功擊退國際炒家，港元匯率反彈至歷史最強水平，聯繫匯率制度得到維護。","m":"九七金融危機激，港府保衞戰功績。","v":1,"src":[{"t":"香港金融保衛戰 - 中國財政金融案例中心","u":"http://case.sf.ruc.edu.cn/alk/alfl/jr/f2130a6c3ec54fd38747c1320cf96de7.htm","d":"2015-08-28"}]},"5-5":{"w":"1999年11月28日，香港特別行政區舉行首屆區議會選舉。選舉恢復了委任議員制度，民選議席增加至390個，加上102名委任議員和27名當然議員，區議會議員總數達519名，創歷史新高。投票率為35.82%。","m":"九九年秋，區議會選舉新起步。","v":1,"src":[{"t":"1999年香港區議會選舉 - 維基百科","u":"https://zh.wikipedia.org/zh-hans/1999%E5%B9%B4%E9%A6%99%E6%B8%AF%E5%8D%80%E8%AD%B0%E6%9C%83%E9%81%B8%E8%88%89","d":"2024-03-18"}]},"5-6":{"w":"2000年12月1日，香港政府正式實施強制性公積金（強積金，簡稱MPF）制度，為就業人士提供退休保障。除獲豁免人士外，年滿18至64歲的僱員和自僱人士須參加計劃，僱員和僱主各按入息的5%供款。強積 3-15"},{"t":"香港舉辦文化合作論壇推動亞洲文化和諧共生 - 廣東省港澳辦","u":"https://www.gdhmo.gov.cn/xwzx/sgazx/gayw/content/post_94220.html","d":"2024-03-18"}]},"5-12":{"o":["三地一時遊","市民遊計劃","境外遊計劃"],"x":["這是2003年後為吸引內地旅客而設的計劃名稱，不是個人遊","此為香港政府制訂，非中央政府推出的惠港政策","此泛指所有內地赴港旅客計劃，不是官方用語"],"w":"2003年香港遭非典疫情重創，經濟陷入衰退。中央政府為支持香港復蘇，於7月28日起開放廣東四市居民以「個人遊」身份赴港澳旅遊，打破過去只允許探親、商務、旅行團赴港的限制，成為CEPA旅遊服務承諾的重要體現。","m":"非典後救香港，個人遊潮起。","n":"官方簡稱為「個人遊」，後來擴展至全國49個城市。","v":1,"src":[{"t":"旅遊事務署：個人遊計劃","u":"https://www.tourism.gov.hk/tc/visitor_ind.php","d":"2026-09-20"},{"t":"新華網：為香港旅遊業帶來巨大改變","u":"http://www.news.cn/2023-07/27/c_1129772252.htm","d":"2023-07-27"}]},"5-13":{"o":["CEPAL（拉丁美洲經委會）","ASEAN（東盟）","WTO（世界貿易組織）"],"x":["該組織是區域性經濟委員會，非中港專款協議","該組織範圍不包括中港兩地商貿關係","該組織為全球貿易框架，非專針對中港"],"w":"2003年6月29日簽訂的CEPA（《內地與香港關於建立更緊密經貿關係的安排》）於2004年1月1日正式實施。這一協議是中央支持香港度過非典疫情的重要措施，在貿易、投資、服務等領域建立特殊優惠關係，標誌著內地與香港經貿一體化的新階段。","m":"中港更緊密，CEPA來相連。","n":"CEPA亦是該年推出「個人遊」的法律依據。","v":1,"src":[{"t":"中國政府網：CEPA原文","u":"https://wits.worldbank.org/GPTAD/PDF/archive/China-HongKong.pdf","d":"2004-01-01"},{"t":"世界銀行貿易協定數據庫","u":"https://worldtradelaw.net/document.php?id=fta/agreements/chinhkfta.pdf","d":"2003-06-29"}]},"5-14":{"o":["聯合國貿易和發展會議","亞太經濟合作組織","國際貨幣基金組織"],"x":["該組織主要從事發展研究，不定期舉辦部長級會議","該組織會議輪流在成員經濟體舉辦，2005年非在香港","該組織工作重點不在貿易談判"],"w":"2005年12月13日至18日，世界貿易組織第六次部長級會議在香港會議展覽中心舉行，逾150個WTO成員國派代表參加。此次會議推進多哈回合談判，在農業補貼削減、知識產權藥物獲取等方面取得進展，是香港作為國際商貿樞紐的重要體現。","m":"貿易部長香港聚，多哈談判有進度。","n":"這是香港首次舉辦WTO部長級會議，凸顯國際地位。","v":1,"src":[{"t":"世界貿易組織官網：2005年香港部長級會議","u":"https://www.wto.org/english/thewto_e/minist_e/min05_e/min05_e.htm","d":"2005-12-18"},{"t":"維基百科：世界貿易組織第六次部長級會議","u":"https://zh.wikipedia.org/zh-cn/%E4%B8%96%E7%95%8C%E8%B2%BF%E6%98%93%E7%B5%84%E7%B9%94%E7%AC%AC%E5%85%AD%E6%AC%A1%E9%83%A8%E9%95%B7%E7%B4%9A%E6%9C%83%E8%AD%B0","d":"2026-09-20"}]},"5-15":{"o":["聯合國教科文組織","聯合國兒童基金會","國際勞工組織"],"x":["該機構負責教科文事務，首長非來自中國","該機構專責兒童福利，2006年首長非中國籍","該機構涉及勞工事務，首長通常由歐洲人擔任"],"w":"2006年11月，香港醫學專家陳馮富珍經中國政府提名，以150票獲得世界衞生組織(WHO)總幹事職位，成為聯合國系統機構中首位擔任最高領導職務的中國人。她於2007年 制，實際為深港通","京港通無此官方互聯互通機制"],"w":"2016年8月16日，中國證監會主席劉士餘與香港證監會主席唐家成在北京共同簽署《聯合公告》，原則批准建立深港股票市場交易互聯互通機制。深港通於同年12月5日正式開通，分為深股通及港股通，無總額度限制，相比滬港通更為開放，標誌著內地資本市場進一步對外開放。","m":"深港通十二月通，互聯互通更寬鬆。","n":"深港通標的擴至小盤股，投資範圍更廣。","v":1,"src":[{"t":"中國證監會：深港通聯合公告","u":"https://www.csrc.gov.cn/csrc/c106256/c1654020/content.shtml","d":"2016-08-16"},{"t":"維基百科：深港通","u":"https://zh.wikipedia.org/zh-hans/%E6%B7%B1%E6%B8%AF%E9%80%9A","d":"2026-09-20"}]},"5-27":{"o":["《港澳同胞回鄉證條例》","《出境入境管理法》","《香港特別行政區維護國家安全法》"],"x":["此為港澳居民身份證件相關法律，不涉及國歌尊重","此為出入境行政法規，與國歌法無關","此為2020年後立法，非2017年11月全人大常委會決定"],"w":"2017年11月4日，十二屆全國人民代表大會常務委員會第三十次會議表決通過決定，在《香港特別行政區基本法》附件三和《澳門特別行政區基本法》附件三中增加《中華人民共和國國歌法》。此為香港基本法附件三首次增加新的全國性法律，強調國歌作為國家象徵的神聖性，香港隨後於2020年6月通過《國歌條例》實施。","m":"國歌法列附件三，香港本地立法施。","n":"《國歌條例》於2020年6月12日生效，規範國歌使用。","v":1,"src":[{"t":"中國人大網：國歌法列入基本法附件三","u":"http://www.npc.gov.cn/zgrdw//npc/////cwhhy/12jcwh/2017-11/01/content_2030247.htm","d":"2017-11-04"},{"t":"香港政府新聞處：國歌條例生效","u":"https://www.info.gov.hk/gia/general/202006/12/P2020061200855.htm","d":"2020-06-12"}]},"5-28":{"o":["山東艦航母編隊","遼寧艦核心艦隊","濟南艦特遣隊"],"x":["山東艦首次訪港於2021年6月，非2017年回歸二十週年","「核心艦隊」非官方編隊稱呼，正式名為航母編隊","濟南艦為驅逐艦，非編隊指揮艦，虛構稱呼"],"w":"2017年7月7日至11日，中國人民解放軍海軍航母編隊由遼寧艦（我國首艘航母）率領，搭載導彈驅逐艦濟南艦、銀川艦和導彈護衞艦煙台艦，停靠香港參加香港回歸祖國20週年慶祝活動。此為航母編隊首次停靠香港，遼寧艦首次對公眾開放，掀起全港「國寶熱潮」，彰顯國防實力。","m":"遼寧艦航母香港停，國防實力向民展。","n":"編隊停靠期間舉行甲板招待會，官兵深入社區交流。","v":1,"src":[{"t":"人民日報：遼寧艦抵達香港","u":"http://en.people.cn/n3/2017/0707/c90786-9238421.html","d":"2017-07-07"},{"t":"CNN：遼寧艦香港之行","u":"https://www.cnn.com/2017/07/04/asia/liaoning-hong-kong-china/index.html","d":"2017-07-04"}]},"5-29":{"o":["10週年","15週年","25週年"],"x":["香港回歸10週年在2007年，該協議簽於2017年","香港回歸15週年在2012年，與簽署年份不符","香港回歸25週年為2022年，亦非協議簽署年"],"w":"2017年7月1日，正值香港回歸祖國20週年，國家主席習近平出席見證，《深化粵港澳合作推進大灣區建設及框架協議》由香港特首林鄭月娥、澳門特首崔世安、國家發改委主任何立峯、廣東省長馬興瑞聯合簽署。該協議標誌著粵港澳大灣區由願景轉為實際行動計劃。","m":"回歸廿年簽協議，大灣區建設啟新篇。","n":"此協議後來發展為「粵港澳大灣區發展規劃綱要」，於2019年2月公佈。","v":1,"src":[{"t":"香港特區政府：粵港澳大灣區框架協議","u":"https://www.info.gov.hk/gia/general/201707/01/P2017070100409.ht 安排。","m":"憲法第三十一條授權設立特區。","n":"","v":1,"src":[{"t":"基本法 - 第一章 - 香港特區政府","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter1.html","d":"2026-09-20"}]},"5-72":{"o":["南海縣","增城縣","陽江縣"],"x":["香港在秦代屬於南海郡番禺縣管轄，不是南海縣","香港在秦代屬於番禺縣，不是增城縣","香港在秦代屬於番禺縣，不是陽江縣"],"w":"公元前214年，秦始皇統一嶺南地區後設立南海郡，香港被納入南海郡番禺縣的管轄範圍，這是香港正式被納入中央政權管理的開始。番禺縣當時為南海郡郡治，今天即廣州市。","m":"秦代香港屬番禺縣管轄。","n":"","v":1,"src":[{"t":"番禺縣 - 維基百科","u":"https://zh.wikipedia.org/zh-hk/%E7%95%AA%E7%A6%BA%E7%B8%A3","d":"2026-09-20"}]},"5-73":{"o":["中華民國","獨立國家","英國"],"x":["香港特別行政區是中華人民共和國不可分離的部分，不是中華民國","香港不是獨立國家，而是中華人民共和國的組成部分","香港已於1997年回歸中國，不再屬於英國"],"w":"根據《基本法》第一條，香港特別行政區是中華人民共和國不可分離的部分。香港於1997年7月1日回歸中國，成立香港特別行政區，在「一國兩制」框架下享有高度自治，同時作為中華人民共和國不可分割的一部分。","m":"香港永遠是中國不可分離的部份。","n":"","v":1,"src":[{"t":"基本法 - 第一章 - 香港特區政府","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter1.html","d":"2026-09-20"}]},"5-74":{"o":["行政管理權、立法權","司法權和終審權","財政收入權"],"x":["沒有列舉行政管理權","沒有列舉司法權和終審權","基本法未規定香港有財政收入權"],"w":"香港特別行政區依照基本法實行高度自治，享有四項核心權力。首先是行政管理權，即香港特區政府執行法律和日常管理事務。其次是立法權，由立法會行使。最後是獨立的司法權和終審權，由各級法院行使。","m":"香港「四權」：行政、立法、司法、終審。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：中華人民共和國香港特別行政區基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_2.htm","d":"2022-06-07"}]},"5-75":{"o":["行政管理權","立法權","對外事務權"],"x":["基本法規定是司法權和終審權，非行政管理權","基本法規定是司法權和終審權，非立法權","司法權不包括對外事務權"],"w":"香港基本法第十九條明確規定，香港特別行政區法院享有獨立的司法權和終審權。終審法院是香港最高司法機關，具有終審判決權，不受任何機構干涉。","m":"法院專職：司法權和終審權。","n":"","v":1,"src":[{"t":"終審法院：《基本法》下的終審法院","u":"https://www.hkcfa.hk/tc/about/overview/basic_law/index.html","d":"2024"}]},"5-76":{"o":["可以擁有","看情況而定"],"x":["題目要求否定，海關關長不可擁有外國居留權","題目明確禁止，無需條件判斷"],"w":"香港基本法第一百零一條明確規定，海關關長必須由在外國無居留權的香港特別行政區永久性居民中的中國公民擔任。這是對政府高層官員的國籍和居留權的重要限制，確保國家安全。","m":"關長須無外國居留權，守護國境。","n":"","v":1,"src":[{"t":"中華人民共和國香港特別行政區基本法：第四章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_5.htm","d":"2022-06-07"}]},"5-77":{"o":["十年","三十年","一百年"],"x":["基本法規定是五十年，非十年","基本法規定是五十年，非三十年","基本法規定是五十年，非一百年"],"w":"基本法第五條訂明，香港特別行政區保持原有的資本主義制度和生活方式，五十年不變。這是鄧小平於1984年提出的「一國兩制」方針的核心部分，旨在保證香港的穩定性和可預測性。","m":"資本主義五十年，香港穩定心。","n":"","v":1,"src":[{"t":"維基百科：五十年不變","u":"https://zh.wikipedia.org/zh-hans/%E4%BA%94%E5%8D%81%E5%B9%B4%E4%B8%8D%E8%AE%8A","d":"2024"}]},"5-78":{"o":["全部廢除","必須按基本法修改","由新政府重新制定"],"x":["基本法要求保留非抵觸條款，不是廢除","原有法律在非抵觸情況下自動保留","基本法並未規定重新制定原有法律"],"w":"基本法第八條規定，香港原有的法律除同基本法相抵觸或經立法機關修改者外，予以保留。全國人大常委會回歸前進行了法律審查，決定不採用的條例和附屬立法極少。這體現了『舊制保留』的原則。","m":"港法保留，不抵觸無恙。","n":"","v":1,"src":[{"t":"律政司：香港的法律制度 - 《基本法》","u":"https://www.doj.gov.hk/tc/our_legal_system/basic_law.html","d":"2024"}]},"5-79":{"o":["全國人民代表大會","香港立法會","香港行政長官"],"x":["香港直轄於中央人民政府，非全國人大","香港立法會是本地立法機構，非上級機構","行政長官是特區首長，非香港上級機構"],"w":"香港特別行政區直轄於中央人民政府。中央人民政府代表國家對香港行使主權，同時根據『一國兩制』原則授權香港進行高度自治。這是香港行政地位的法律基礎。","m":"香港直轄中央，國家統一無空言。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法簡介","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_2.htm","d":"2022-06-07"}]},"5-80":{"o":["全國人民代表大會","香港特別行政區立法會","香港終審法院"],"x":["授權機構是中央人民政府，非全國人大","香港立法會無權授權外交事務","終審法院是司法機構，無權授權外交"],"w":"中央人民政府授權香港特別行政區自行處理有關的對外事務。根據基本法第十三條，香港在貿易、海運、民用航空、通訊等領域可以簽署協議，體現『一國兩制』下的對外自主權。","m":"中央授權對外事務，香港享自主交涉。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法全文","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-81":{"o":["向聯合國請求協助","自行出資尋求國際救援","向香港立法會申請撥款"],"x":["基本法規定向中央請求駐軍協助，非向聯合國","救災應該向中央請求駐軍協助，非依靠國際","駐軍協助是法定程序，無需立法會撥款"],"w":"基本法第十四條規定，香港特別行政區政府在必要時可向中央人民政府請求駐軍協助維持社會治安和救助災害。駐軍協助完成後即返回駐地，這是中央對香港的國防責任。","m":"災難請駐軍，中央來相助。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：第二章 中央和香港特別行政區的關係","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-82":{"o":["香港特別行政區行政長官","香港特別行政區立法會","香港終審法院"],"x":["行政長官提名，中央人民政府任免，非行政長官直接任免","立法會無權任免政府官員","終審法院是司法機構，無權任免政府官員"],"w":"基本法規定，香港特別行政區行政機關的主要官員由中央人民政府任免。行政長官可以提名或建議任免，但最終任免權在中央。這確保了特區主要官員的國家代表性。","m":"官員任免中央定，香港建議報上層。","n":"","v":1,"src":[{"t":"基本法第六十一條、第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"2024"}]},"5-83":{"o":["法律繼續有效","需要立法會重新審議","由中央人民政府重新制定"],"x":["經全國人大常委會發回的法律不能繼續有效","全國人大常委會發回不需重新審議，直接失效","失效由法律自動失效條款規定，非中央重新制定"],"w":"基本法第十七條規定，經全國人民代表大會常務委員會發回的法律立即失效。全國人大常委會可將香港立法機關制定的法律發回，如認為其不符合基本法關於中央管理事務及中央和香港特別行政區關係的條款。","m":"全國人大常發回，港法即刻失效無所謂。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：第二章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-84":{"o":["由香港立法會自行決定","必須由香港直接採納為本地法律","需要中央人民政府批准後才能使用"],"x":["附件三法律可公布或立法實施，非由立法會自決","可以公布直接實施，不限於立法方式","公布或立法實施已是獲批的結果，不需再批"],"w":"基本法附件三列舉的全國性法律可通過公布或立法實施兩種方式在香港特別行政區實施。公布是指直接生效，立法實施是指香港根據本地情況制定相關法律。","m":"附件三法律雙軌道，公布或立法皆可為。","n":"","v":1,"src":[{"t":"基本法附件三：全國性法律","u":"https://www.basiclaw.gov.hk/tc/basiclaw/annex3.html","d":"2024"}]},"5-85":{"o":["20週年","30週年","40週年"],"x":["2022年是香港回歸25週年，非20週年","2022年是香港回歸25週年，非30週年","2022年是香港回歸25週年，非40週年"],"w":"2022年是香港特別行政區成立二十五週年。香港於1997年7月1日回歸中國，2022年正好是第25週年。香港特區政府舉辦系列慶祝活動，主題為「砥礪奮進廿五載，攜手再上新征程」。","m":"九七回歸二十五年，2022年香港新景象。","n":"","v":1,"src":[{"t":"香港特別行政區25週年紀念官方網站","u":"https://www.hksar25.gov.hk/","d":"2022"}]},"5-86":{"o":["香港特別行政區行政長官","香港特別行政區立法會","香港終審法院"],"x":["授權權力的機構是全國人大，非行政長官","立法會是香港本地權力機構，無權授權新權力","終審法院無權授予香港新權力"],"w":"基本法第二十條規定，香港特別行政區可享受中央人民政府授予的其他權力，並由全國人民代表大會決定授予。全國人大作為最高權力機構，可以根據需要授予香港新的權力。","m":"新權全國人大授，香港自治有上限。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法第二章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-87":{"o":["香港特別行政區永久性居民","香港特別行政區非永久性居民","香港政府行政官員"],"x":["參加全國人大的是人大代表身分的人，而非所有永久性居民","非永久性居民根據基本法無選舉權","行政官員參加為官方代表，非普通市民代表"],"w":"基本法第二十一條規定，香港特別行政區全國人民代表大會代表可以參加國家最高權力機關的工作。這些代表由中國公民身分的香港市民按全國人大決定的辦法選舉產生。","m":"港人人大代表，參與國家最高權。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：第二章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-88":{"o":["全國人民代表大會","香港特別行政區立法會","香港特別行政區終審法院"],"x":["需要香港特別行政區政府同意，非全國人大同意","立法會無權審查中央機構設立","終審法院無相關權限"],"w":"基本法規定，中央政府各部門在香港特別行政區設立機構，須徵得香港特別行政區政府的同意，並須經中央人民政府批准。這確保香港特區對本地事務的控制權。","m":"中央建機構港府知，雙重同意保自治。","n":"","v":1,"src":[{"t":"政制及內地事務局：《基本法》","u":"https://www.cmab.gov.hk/tc/issues/basic2.htm","d":"2024"}]},"5-89":{"o":["第十八條","第二十條","第二十五條"],"x":["基本法規定是第二十三條，非第十八條","基本法規定是第二十三條，非第二十條","基本法規定是第二十三條，非第二十五條"],"w":"基本法第二十三條訂明，香港特別行政區應自行立法禁止叛國、分裂國家、煽動叛亂、顛覆中央人民政府及竊取國家機密的行為。這是確保國家安全的重要法律責任。","m":"第二十三條國安責，叛亂分裂必禁止。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：第二章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"}]},"5-90":{"o":["香港特別行政區非永久性居民","所有在香港居住滿三年的外國人","香港特別行政區永久性居民中的外國人"],"x":["基本法規定永久性居民享有選舉權，非非永久性居民","外國人無選舉權","基本法未給予永久性居民身分的外國人選舉權"],"w":"基本法第二十六條規定，只有香港特別行政區永久性居民才享有選舉權和被選舉權。永久性居民是指有香港居留權的人士，包括中國公民和其他擁有永久居留權的外國人。","m":"永久居民方投票，被選舉權同享受。","n":"","v":1,"src":[{"t":"基本法第三章：居民的基本權利和義務","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter3.html","d":"2024"}]},"5-91":{"o":["永久性居民和外國人","香港國籍居民和非香港居民","公民和非公民"],"x":["基本法規定兩類是永久性和非永久性，非居民和外國人","基本法未涉及『香港國籍』概念","基本法未使用『公民』和『非公民』的分類"],"w":"基本法第二十四條定義，香港特別行政區居民包括永久性居民和非永久性居民兩類。永久性居民擁有香港居留權，非永久性居民則無。","m":"永久非永久二分類，香港居民身分兩重天。","n":"","v":1,"src":[{"t":"基本法第三章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter3.html","d":"2024"}]},"5-92":{"o":["由中央人民政府直接頒布執行","列入基本法附件三後在香港適用","僅作為道德指引，不具法律效力"],"x":["國際公約需通過香港法律實施才有效力，非中央直接頒布","基本法未要求列入附件三","人權公約在港具有法律效力"],"w":"基本法第三十九條規定，《公民權利和政治權利國際公約》在香港特別行政區通過香港特別行政區法律予以實施。香港於1991年制定《香港人權法案條例》以落實國際公約。","m":"國際人權公約港法承，本地制度保權益。","n":"","v":1,"src":[{"t":"基本法第三章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter3.html","d":"2024"}]},"5-93":{"o":["城市原居民","少數民族居民","海外回歸香港的原居民"],"x":["基本法保護的是新界原居民，非城市原居民","基本法未涉及少數民族，而涉及的是新界原居民","基本法未將海外回歸者列為被保護對象"],"w":"基本法第四十條規定，新界原居民的合法傳統權益受香港特別行政區的保護。新界原居民指的是1898年前已在新界村落居住者及其父系後裔，享有傳統村屋興建權等特殊權益。","m":"新界原居民權益受保，傳統權益代代傳。","n":"","v":1,"src":[{"t":"香港政府新聞：新界原居民的合法傳統權益","u":"https://www.info.gov.hk/gia/general/200103/28/0328179.htm","d":"2001-03-28"}]},"5-94":{"o":["可以","可以但需滿足額外條件","可以參加部分選舉"],"x":["外國旅客沒有香港永久性居民身份，不符合選民資格","需要成為香港永久性居民才能取得選舉權","旅客身份不同於永久居民，不能行使選舉權"],"w":"香港基本法規定選民資格須為香港特別行政區永久性居民。外國旅客若無在香港連續合法居住滿七年，則不能取得永久居民身份，因此不能參加區議會或立法會選舉。","m":"永久居民先，旅客後；選舉權利有階梯。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-95":{"o":["30周歲","35周歲","45周歲"],"x":["30周歲不符合年齡要求","35周歲仍未達行政長官最低年齡限制","45周歲超過基本法規定的年齡"],"w":"香港基本法第44條規定行政長官需年滿40周歲，同時須在香港連續居住滿20年，並為香港永久性居民中的中國公民，無外國居留權。","m":"四十歲方可領導香港。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-96":{"o":["全國人民代表大會","香港立法會","香港行政會議"],"x":["全國人民代表大會無權批准修改香港行政長官產生辦法","香港立法會無權單獨修改行政長官的產生辦法","香港行政會議無權批准基本法層級的修改"],"w":"根據香港基本法第160條，基本法的修改權屬於全國人民代表大會，但行政長官產生辦法的修改需要經全國人民代表大會常務委員會批准。","m":"修法須經京城全委會。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第八章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter8.html","d":"1990-04-04"}]},"5-97":{"o":["四年","三年","六年"],"x":["四年是立法會的一般任期，不是選舉委員會任期","三年不符合香港的選舉週期設定","六年超過香港製度中的標準任期"],"w":"香港基本法附件一規定行政長官選舉委員會每屆任期五年。行政長官任期五年，可連任一次，選舉委員會的五年任期與行政長官的任期相配套。","m":"五年一度選，委員會相同。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 附件一","u":"https://www.basiclaw.gov.hk/tc/basiclaw/annex1.html","d":"1990-04-04"}]},"5-98":{"o":["香港立法會主席","香港特別行政區財政司司長","香港特別行政區行政會議"],"x":["立法會主席不負責接收行政長官的財產申報","財政司司長不是財產申報的接收機構","行政會議不是財產申報的指定機構"],"w":"香港基本法第47條規定行政長官就任時必須向香港特別行政區終審法院首席法官申報財產，並記錄在案，這是行政長官就職的重要程序。","m":"終審首席守財政，行政長官須申報。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-99":{"o":["香港立法會","香港行政會議","全國人民代表大會常務委員會"],"x":["立法會通過法案後無公布權","行政會議無權簽署公布法律","全國人民代表大會常務委員會不負責香港法律的簽署公布"],"w":"香港基本法第48條規定行政長官擁有簽署立法會通過的法案及公布法律的職權。法案經行政長官簽署公布後方能生效。","m":"行政長官筆一揮，法案才生效。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-100":{"o":["在一個月內予以簽署公布","立即解散立法會","交由全國人民代表大會常務委員會決定"],"x":["一個月內簽署是行政長官拒絕後的期限，不是初次處理的時限","立即解散立法會不符合基本法程序","全國人民代表大會常務委員會無權決定個別法案是否生效"],"w":"香港基本法第49條規定行政長官認為立法會通過的法案不符合香港利益時，可在三個月內將法案發回立法會重議。這體現了行政與立法的制衡。","m":"三個月內發回重議，權力有制衡。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-101":{"o":["香港立法會","香港特別行政區司法機構","中央人民政府"],"x":["立法會無權批准行政長官解散立法會的決定","司法機構無權對行政決定進行預先批准","中央人民政府不參與香港內部解散立法會的程序"],"w":"香港基本法第50條規定行政長官在解散立法會前必須徵詢行政會議的意見。行政會議是協助行政長官決策的諮詢機構，體現了重要決策的制度監督。","m":"解散立法會先問行會，制度有制衡。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-102":{"o":["尋求全國人民代表大會常務委員會的協調","繼續與立法會協商","立法會應自動解散重選"],"x":["全國人民代表大會常務委員會無權代替行政長官決定辭職問題","單純協商無法解決的僵局應由行政長官承擔責任","立法會無權決定是否解散"],"w":"香港基本法第52條規定行政長官因立法會拒絕通過財政預算案而解散立法會，重選的立法會如繼續拒絕通過所爭議的原案，行政長官必須辭職。這確保了政府與立法會之間的權力制衡。","m":"預算案拒兩次，長官必辭職。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-103":{"o":["財政司司長","律政司司長","行政會議主席"],"x":["財政司司長不是首位代理人，政務司司長排列在前","律政司司長在代理順序中排列更後","行政會議主席無權代理行政長官職務"],"w":"香港基本法第53條規定行政長官短期不能履行職務時，由政務司司長、財政司司長、律政司司長依次臨時代理。政務司司長是政府內排序最高的官員。","m":"政務司長最先代，順序：政財律。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-104":{"o":["立法會","全國人民代表大會常務委員會","香港永久性居民代表"],"x":["立法會無權任免行政會議成員","全國人民代表大會常務委員會無權直接任免香港行政會議成員","香港永久性居民代表無法律身份任免成員"],"w":"香港基本法第54條規定行政會議成員由行政長官委任和任免。行政長官在行政會議的組成和成員安排上擁有完全的決定權。","m":"行政會議誰拍板？行政長官説了算。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-105":{"o":["民事訴訟工作","行政管理工作","監察舞弊工作"],"x":["律政司不主管民事訴訟，由法院負責","行政管理工作屬於其他政府部門","監察舞弊工作由廉政公署負責"],"w":"香港基本法第63條規定律政司主管刑事檢察工作。律政司司長身為政府首席法律顧問，負責所有罪案的檢控，並在審訊中代表香港特區進行刑事檢控。","m":"律政司主抓刑事檢，檢控責任不旁貸。","n":"","v":1,"src":[{"t":"律政司 - 香港的法律制度","u":"https://www.doj.gov.hk/tc/our_legal_system/index.html","d":"2026-01-01"}]},"5-106":{"o":["三分之二票數","三分之一票數","全票同意"],"x":["三分之二票數是立法會議員個人法案的要求，不是政府法案","三分之一票數過低，不符合政府法案的通過要求","全票同意在民主制度中不合理"],"w":"香港基本法附件二規定政府提出的法案須獲得出席立法會會議的全體議員過半數票同意方為通過。這反映了政府在立法程序中的優勢地位。","m":"政府法案需過半，民間法案需更多。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 附件二","u":"https://www.basiclaw.gov.hk/tc/basiclaw/annex2.html","d":"1990-04-04"}]},"5-107":{"o":["四年","三年","五年"],"x":["四年是現行立法會的一般任期，不是第一屆的任期","三年不符合過渡安排的設定","五年是行政長官的任期，不是立法會的"],"w":"香港基本法規定香港特別行政區第一屆立法會的任期為兩年（1998年7月至2000年6月），這是過渡性的特殊安排。從第二屆開始，立法會每屆任期四年。","m":"第一屆特殊只兩年，穩定過渡銜接好。","n":"","v":1,"src":[{"t":"香港特別行政區立法會歷史、規則及行事方式參考手冊 第一部分","u":"https://www.legco.gov.hk/general/chinese/procedur/companion/chapter_2/chapter_2.html","d":"1998-07-01"}]},"5-108":{"o":["由行政長官委任","由香港居民普選產生","由選舉委員會選舉"],"x":["行政長官無權任免立法會主席","香港居民無直接普選立法會主席的制度","選舉委員會選舉的對象是行政長官，不是立法會主席"],"w":"香港基本法第71條規定立法會主席由立法會議員互選產生。主席主持會議、進行行政及禮儀工作，確保立法會會議能順利進行。","m":"互選產生主席人，議員民主決權。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-109":{"o":["香港立法會主席","全國人民代表大會常務委員會","香港特別行政區終審法院"],"x":["立法會主席無權直接決定是否召開緊急會議，僅可應行政長官要求","全國人民代表大會常務委員會無權干涉香港內部會議召開","終審法院無權決定立法會會議安排"],"w":"香港基本法第72條規定立法會主席須應行政長官的要求召開緊急會議。這賦予行政長官在緊急情況下快速調動立法會的權力。","m":"緊急時刻主席服行，行政長官要求馬上行。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-110":{"o":["制定和修改","制定和廢除","修改和廢除"],"x":["僅制定和修改不包括廢除權","制定和廢除缺少修改權","修改和廢除缺少制定權"],"w":"香港基本法第73條規定立法會的法律職權包括制定、修改和廢除法律。立法會作為香港特別行政區的唯一立法機關，掌握完整的立法權。","m":"三權俱全：制修廢，立法會全握住。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-111":{"o":["立法會","全國人民代表大會常務委員會","香港人民"],"x":["立法會無權批准議員提出的法案","全國人民代表大會常務委員會無權批准香港議員的法案","香港人民無法律身份批准法案提出"],"w":"香港基本法第74條規定涉及政府政策的法律草案須先獲得行政長官的書面同意方能提出。這體現了行政與立法在政策制定上的協調機制。","m":"涉政策法案提出先，長官書面簽同意。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-112":{"o":["提交全國人民代表大會常務委員會備案","由香港終審法院司法覆核批準","經香港行政會議批准"],"x":["備案是公布後的程序，不是生效前的必要條件","終審法院無權對法案進行先前的司法覆核","行政會議無權批准已通過的法案"],"w":"香港基本法第48和49條規定立法會通過的法案經行政長官簽署和公布後方能生效。公布通常在香港政府憲報上刊登，自刊登之日起生效。","m":"簽署加公布，立法才生效成。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-113":{"o":["開會期間","赴會途中","會議休會期間"],"x":["會議休會期間仍可被逮捕，不受保護","赴會途中被逮捕是違反基本法的","開會期間逮捕議員違反基本法第78條"],"w":"香港基本法第78條規定立法會議員在出席會議和赴會途中不受逮捕。這是對議員人身權利的保護，保障議員能自由地履行職責而不受行政干涉。","m":"會議赴會兩時段，逮捕違法絕不行。","n":"","v":1,"src":[{"t":"香港特別行政區基本法 第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"1990-04-04"}]},"5-114":{"o":["撤銷其立法會議員身份但保留公務人員身份","令其保留兩個身份","取消其公務人員身份"],"x":["這些做法不符合基本法對利益衝突的規定","基本法要求必須放棄其中一個身份","立法會規則不允許兼任公務人員"],"w":"根據《基本法》第七十九條，立法會議員如接受政府委任而出任公務人員，會產生利益衝突。按照基本法規定，立法會主席須宣告該議員喪失立法會議員的資格，以維持司法獨立和立法機構的清廉。","m":"政府公務人員身份與立法會議員身份不能兼容，必須放棄議員資格","n":"","v":1,"src":[{"t":"香港特別行政區立法會歷史、規則及行事方式參考手冊：第一部分","u":"https://www.legco.gov.hk/general/chinese/procedur/companion/chapter_3/chapter_3.html","d":"2025-09-20"},{"t":"基本法第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"2025-09-20"}]},"5-115":{"o":[],"x":[],"w":"香港高等法院由兩個主要司法部分組成，分別是上訴法庭和原訟法庭。上訴法庭處理對下級法院裁定的上訴，原訟法庭則行使第一審的司法權，處理最嚴重的犯罪和重大民事案件。","m":"高等法院分為上訴庭和初審庭，一上一下，職能不同","n":"","v":1,"src":[{"t":"香港司法機構便覽","u":"https://www.judiciary.hk/zh/publications/judfactsheet.html","d":"2025-09-20"},{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_8.htm","d":"2025-09-20"}]},"5-116":{"o":["立法會","全國人民代表大會","中央人民政府"],"x":["立法會無權任命法官","全國人民代表大會不負責香港法院法官任免","中央人民政府不直接任命香港法院法官"],"w":"《基本法》第四十八條規定，行政長官可依照法定程序任命各級法院法官。香港的司法獨立是「一國兩制」的重要體現，行政長官作為行政首長行使此項職權，體現了香港行政機構的權限。","m":"法官由特首任命，體現行政權在司法人事上的最終決定權","n":"","v":1,"src":[{"t":"基本法第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"2025-09-20"},{"t":"香港政府：立法會十一題—法官任命","u":"https://www.info.gov.hk/gia/general/200607/12/P200607120096.htm","d":"2006-07-12"}]},"5-117":{"o":["行政會議","中央人民政府","全國人大常委會"],"x":["行政會議無權同意法官免職","中央人民政府不獲此權力","全國人大常委會不參與此事"],"w":"根據《基本法》第八十八和八十九條的規定，終審法院法官的免職必須徵得立法會的同意。立法會作為權力機構代表人民進行監督，確保司法獨立和司法人事的穩定。","m":"免除終審法官須得立法會同意，體現立法權對司法獨立的保障","n":"","v":1,"src":[{"t":"香港政府：立法會資料摘要—高等法院首席法官的任命","u":"https://www.legco.gov.hk/yr00-01/chinese/panels/ajls/papers/b338c04.pdf","d":"2025-09-20"},{"t":"司法獨立：基本法解讀","u":"https://www.doj.gov.hk/sc/publications/pdf/basiclaw/cbasic16_3.pdf","d":"2025-09-20"}]},"5-118":{"o":["不能","必須改變制度","需經特首批准才可保留"],"x":["基本法禁止保留原有任免制度","所有司法人員制度必須統一改革","特首才是決定權限的機構"],"w":"《基本法》第九十一條明文規定，法官以外的其他司法人員原有的任免制度繼續保持。這確保了香港司法系統的延續性和穩定性，同時體現了對香港原有法治傳統的尊重。","m":"司法人員舊制度照用，只有法官須按新安排","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法第五章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_8.htm","d":"2025-09-20"},{"t":"司法獨立基本法解讀","u":"https://www.doj.gov.hk/sc/publications/pdf/basiclaw/cbasic16_3.pdf","d":"2025-09-20"}]},"5-119":{"o":["上報中央人民政府","按個案向全國人大要求","由中央政府強制規定"],"x":["上報程序不是進行司法協助的方式","全國人大逐案要求不符合體系","中央強制規定違背協商原則"],"w":"《基本法》第九十五條規定，香港特別行政區可與全國其他地區的司法機關通過協商依法進行司法方面的聯繫和相互提供協助。協商是雙方平等討論、達成共識的過程，體現了「一國兩制」下的司法合作精神。","m":"全國各地司法機關聯繫須經協商，體現平等合作精神","n":"","v":1,"src":[{"t":"《基本法》框架下的區際司法協助","u":"http://www.npc.gov.cn/npc/c2/c189/c221/201905/t20190522_33548.html","d":"2025-09-20"},{"t":"香港政府新聞網：鞏固司法互助 加強專業交流","u":"https://www.news.gov.hk/chi/2023/04/20230419/20230419_114436_074.html","d":"2023-04-19"}]},"5-120":{"o":["由特首自行決定","毋須任何授權","完全獨立進行"],"x":["特首無權自行決定對外司法安排","不需授權違反一國原則","完全獨立與「一國」框架不符"],"w":"《基本法》第九十六條明確規定，香港特別行政區政府可與外國就司法互助關係作出適當安排，但必須在中央人民政府的協助或授權下進行。這體現了「一國」原則，即外交事務歸中央管理。","m":"涉及外國司法協議須中央授權，不可自行決定","n":"","v":1,"src":[{"t":"律政司：與內地及澳門特區相關事項","u":"https://www.doj.gov.hk/tc/mainland_and_macao/RRECCJ.html","d":"2025-09-20"},{"t":"律政司：公約及國際協定—刑事司法協助","u":"https://www.doj.gov.hk/tc/external/table3ti.html","d":"2025-09-20"}]},"5-121":{"o":["是政權性組織","屬於地方人民代表大會性質","具有立法權"],"x":["區議會具有政權性質違反基本法","區議會非人民代表大會制度的部分","區議會無法制定法律"],"w":"《基本法》第九十七條規定，香港特別行政區可設立非政權性的區域組織，區議會就屬此類。區議會主要是諮詢和服務性質的組織，負責提出建議、協助政府推行計劃及舉辦文化康樂活動，而非權力機構。","m":"區議會是諮詢服務機構，非政權組織，無立法監察權","n":"","v":1,"src":[{"t":"民政事務總署：地區治理—區議會","u":"https://www.had.gov.hk/tc/public_services/district_governance/dbmain.htm","d":"2025-09-20"},{"t":"教育局：公民、經濟與社會支援教材","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/pshe/references-and-resources/ces/support_materials_S2/M2.2%20HKSAR%20governance_electoral%20system%20(Chi)_20241125.pdf","d":"2024-11-25"}]},"5-122":{"o":["可以聘請","可以聘請但有條件限制","可經特別批准聘請"],"x":["基本法允許聘用外籍人士擔任主要官員","條件限制不適用於處長等主要官員","特別批准能改變基本法限制"],"w":"《基本法》第一百零一條規定，香港特別行政區政府不可聘請英籍和其他外籍人士擔任主要官員，如各司司長、副司長、各局局長、警務處處長、入境事務處處長等。這些職位因涉及國家安全和重要決策，必須由具有香港永久居民身份且無外國居留權的中國公民擔任。","m":"主要官員（司長、處長等）必須是香港籍中國公民，絕對禁止外籍人士","n":"","v":1,"src":[{"t":"基本法第四章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter4.html","d":"2025-09-20"},{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_11.htm","d":"2025-09-20"}]},"5-123":{"o":["中華人民共和國","香港特別行政區","香港政府"],"x":["僅效忠中華人民共和國不完整","僅效忠香港特別行政區違反一國原則","效忠香港政府為行政不法"],"w":"《基本法》第一百零四條規定，行政長官就職時必須依法宣誓擁護《基本法》並效忠「中華人民共和國香港特別行政區」。這表述將中央政府與香港特區視為一個整體，體現「一國兩制」的核心，即香港是中國的特別行政區。","m":"特首宣誓效忠「中華人民共和國香港特別行政區」，體現一國兩制","n":"注意「中華人民共和國香港特別行政區」是作為一個整體來表述","v":1,"src":[{"t":"香港政府新聞網：行政長官出席宣誓儀式致辭","u":"https://www.info.gov.hk/gia/general/202012/18/P2020121800272.htm","d":"2020-12-18"},{"t":"全國人民代表大會常務委員會：基本法第一百零四條解釋","u":"https://www.basiclaw.gov.hk/filemanager/content/tc/files/basiclawtext/basiclawtext_doc27.pdf","d":"2025-09-20"}]},"5-124":{"o":["需要上繳中央","部分收入需上繳","須經中央批准後才上繳"],"x":["基本法規定香港收入須上繳","部分收入共享違反財政獨立","中央批准程序違反自主原則"],"w":"《基本法》第一百零六條明確規定，香港特別行政區財政獨立，所有財政收入全部用於自身需要，不上繳中央人民政府。同時規定中央人民政府也不在香港特區徵税。這充分體現了香港的高度自治權。","m":"香港財政收入完全自主不上繳，體現財政獨立原則","n":"","v":1,"src":[{"t":"財經事務及庫務局：根據基本法政府收入的政策原則","u":"https://www.fstb.gov.hk/tc/treasury/general/policies-principles-of-general-revenue.htm","d":"2025-09-20"},{"t":"香港政府：公共財政知多少","u":"https://www.gov.hk/tc/about/abouthk/factsheets/docs/public_finance.pdf","d":"2025-09-20"}]},"5-125":{"o":["因地制宜","靈活變通","預算赤字"],"x":["因地制宜不適用於財政預算","靈活變通會導致不可控支出","預算赤字違反量入為出原則"],"w":"《基本法》第一百零七條規定，香港特別行政區財政預算以量入為出為原則。「量入為出」意指收入與支出相平衡，政府支出不超過收入，避免赤字，體現審慎的財政管理方針。","m":"量入為出就是收支平衡，入多少出多少，不能赤字","n":"","v":1,"src":[{"t":"香港立法會：開支預算及財務建議","u":"https://www.legco.gov.hk/tc/legco-business/useful-information/budget-financial-proposals.html","d":"2025-09-20"},{"t":"《基本與公共財政簡報》","u":"https://www.ate.gov.hk/tchinese/doc/PSHE03_1819/PSHE03_1819_Basic%20Law%20and%20Public%20Finance%20PowerPoint.pdf","d":"2025-09-20"}]},"5-126":{"o":["是","部分管制","需視外國財政狀況而定"],"x":["基本法規定香港實行外匯管制","只有部分外匯受管制不符合原則","外匯管制須視環境而定"],"w":"《基本法》第一百一十二條明確規定，香港特別行政區不實行外匯管制政策，港幣自由兑換，開放外匯、黃金、證券、期貨等市場，政府保障資金流動和進出的自由。這是香港國際金融中心地位的重要基礎。","m":"香港無外匯管制，港幣自由兑換，資金自由進出","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_12.htm","d":"2025-09-20"},{"t":"香港金融管理局：貨幣","u":"https://www.hkma.gov.hk/chi/key-functions/money/","d":"2025-09-20"}]},"5-127":{"o":["中國","香港","中華人民共和國"],"x":["以中國名義會混淆主權","以香港單獨名義違反國際慣例","以中華人民共和國名義與國際組織規則不符"],"w":"《基本法》第一百五十一條規定，香港特別行政區可在經濟、貿易、金融等領域以「中國香港」的名義單獨與世界各國簽訂協議和參加國際組織。「中國香港」既體現香港的身份，又表明與國家的關係，符合國際慣例。","m":"國際名義用「中國香港」，既示中國身份又顯香港地位","n":"","v":1,"src":[{"t":"工業貿易署：世貿組織與中國香港","u":"https://www.tid.gov.hk/tc/our_work/hk_participation_in_ito/wto/overview/hk_participation.html","d":"2025-09-20"},{"t":"商務及經濟發展局：對外商貿關係","u":"https://www.cedb.gov.hk/tc/policies/external-commercial-relations.html","d":"2025-09-20"}]},"5-128":{"o":["由中央人民政府決定處理","交由英國政府處理","由內地省市決定"],"x":["中央決定違反香港自治權","英國不再有權決定香港土地問題","內地省市決定不符合香港特區地位"],"w":"《基本法》第一百二十三條規定，香港特別行政區成立以後滿期而沒有續期權利的土地契約將由香港特別行政區自行制定法律和政策處理。這充分體現香港對土地事務的自主權，香港政府已於2024年推行《政府租契續期條例》。","m":"滿期無續期權土地由香港自行制定法律處理","n":"","v":1,"src":[{"t":"地政總署：香港的土地租用制度和土地政策","u":"https://www.landsd.gov.hk/tc/resources/land-info-stat/land-tenure-system-land-policy.html","d":"2025-09-20"},{"t":"香港政府：《政府租契續期條例》明日生效","u":"https://www.info.gov.hk/gia/general/202407/04/P2024070400669.htm","d":"2024-07-04"}]},"5-129":{"o":["非軍用船隻","民用商業船隻","港澳船隻"],"x":["非軍用船隻亦需特許違反原則","民用商業船隻無須許可符合國際法","港澳船隻無須特許許可"],"w":"《基本法》第一百二十六條規定，外國軍用船隻進入香港特別行政區須經中央人民政府特別許可。軍艦涉及國防和國家安全，須由中央把關；而其他商業船隻等可根據香港特區的法律自由進出。","m":"外國軍艦進港須中央特許，民用船隻照常進出","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法第五章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_13.htm","d":"2025-09-20"},{"t":"立法會支援教材：香港特區的管治","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/pshe/references-and-resources/ces/support_materials_S2/M2.2%20HKSAR%20governance_electoral%20system%20(Chi)_20241125.pdf","d":"2024-11-25"}]},"5-130":{"o":["民用航空器","商業飛機","聯合國飛機"],"x":["民用航空器無須特許違反國防原則","商業飛機可自由進港符合經貿自由","聯合國飛機不受限制"],"w":"《基本法》第一百二十九條規定，外國國家航空器進入香港特別行政區前須經中央人民政府特別許可。國家航空器涉及國防安全，與軍艦相同須由中央把關；而民用飛機等根據香港特區法律可正常進出。","m":"外國國家航空器進港須中央特許，民航客機正常進出","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法第五章","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_13.htm","d":"2025-09-20"},{"t":"民航處常見問題","u":"https://www.cad.gov.hk/chinese/faq.html","d":"2025-09-20"}]},"5-131":{"o":[],"x":[],"w":"《基本法》第一百三十一條規定，在香港特別行政區成立前已取得專業和執業資格者，可依據有關規定保留原有資格。香港特區政府繼續承認成立前已承認的專業團體，這些團體可自行審核和頒授專業資格，確保了香港專業制度的延續。","m":"特區成立前的專業資格繼續有效，專業團體自主頒授","n":"","v":1,"src":[{"t":"中華人民共和國香港特別行政區基本法","u":"https://cs.mfa.gov.cn/zlbg/flfg/crjxg/201107/t20110726_961869.shtml","d":"2025-09-20"},{"t":"香港基本法全文PDF版本","u":"https://www.basiclaw.gov.hk/filemanager/content/tc/files/basiclawtext/basiclaw_full_text.pdf","d":"2025-09-20"}]},"5-132":{"o":["只保護公有企業財產","不保護任何私人財產","須經政府批准的財產"],"x":["基本法只保護公有企業無法保護市場","不保護私人財產違反市場經濟原則","須批准的財產無法保障私權"],"w":"《基本法》第六條明確規定，香港特別行政區依法保護私有財產權。第一百零五條進一步規定，私人和法人財產的取得、使用、處置和繼承的權利，以及徵用財產時得到補償的權利均受法律保護。這確保了私人企業的合法財產權。","m":"基本法保障私產權利，取得、使用、繼承、補償都受保護","n":"","v":1,"src":[{"t":"基本法第一章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter1.html","d":"2025-09-20"},{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_12.htm","d":"2025-09-20"}]},"5-133":{"o":[],"x":[],"w":"根據《基本法》第三十九條的規定，國際勞工公約在香港繼續有效並須通過香港法律實施。香港特別行政區保護勞工的合法權益，包括福利待遇和退休保障。香港現行的《僱傭條例》等法律對勞工權利提供全面保護，包括遣散費、長期服務金、強制性公積金等制度。","m":"勞工福利和退休保障納入法律保護框架，多層次制度保障","n":"基本法第36條和第39條涉及勞工權利；具體規定由香港法律實施","v":1,"src":[{"t":"勞工處主要勞工法例一覽","u":"https://www.labour.gov.hk/tc/legislat/contentA.htm","d":"2025-09-20"},{"t":"人力事務委員會文件","u":"https://www.legco.gov.hk/yr98-99/chinese/panels/mp/papers/mp2705_5.htm","d":"1999-05-27"}]},"5-134":{"o":["應予停止適用","須經香港立法會同意","由香港政府單獨決定"],"x":["基本法第153條明確指未參加但已適用於香港的國際協議可繼續適用","不涉及立法會同意程序","適用權屬中央人民政府"],"w":"根據基本法第153條，中華人民共和國尚未參加但已適用於香港的國際協議仍可繼續適用。中央人民政府可根據需要授權或協助香港政府作出相應安排，以保護香港原有的國際法律地位。","m":"『未參加已適用』仍可繼續用，香港國際地位得保護。","n":"","v":1,"src":[{"t":"中華人民共和國外交部：基本法中有關香港對外事務的規定主要有哪些","u":"https://www.mfa.gov.cn/ziliao_674904/zcwj_674915/200011/t20001107_7949749.shtml","d":"2000-11-07"},{"t":"香港基本法官方網站：第七章","u":"https://www.basiclaw.gov.hk/tc/basiclaw/chapter7.html","d":"2024-01-01"}]},"5-135":{"o":["香港立法會","香港行政長官","香港終審法院"],"x":["香港立法會無此權限，對外機構設立屬中央事權","行政長官無報備權，行政長官本人是中央任命","司法機構對此無權限"],"w":"基本法第156條規定，香港可在外國設立官方或半官方經濟和貿易機構，但須向中央人民政府報備。這體現了『一國』原則下中央對香港對外經濟事務的監督權。","m":"經濟機構外設要報備，中央人民政府把關。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：中華人民共和國香港特別行政區基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_3.htm","d":"2022-06-07"},{"t":"中華人民共和國外交部：基本法中有關香港對外事務的規定主要有哪些","u":"https://www.mfa.gov.cn/web/ziliao_674904/zcwj_674915/200011/t20001107_7949749.shtml","d":"2000-11-07"}]},"5-136":{"o":["由香港行政長官同意","由香港立法會同意","毋需任何批准"],"x":["行政長官無此權限，涉及國家主權","香港立法會亦無此權限","外國官方機構涉及國家主權，必須中央批准"],"w":"基本法第157條明確規定，外國在香港設立官方或半官方機構須經中央人民政府批准。已建交國家的領事機構予以保留，未建交國家的根據情況決定，這體現中央對香港對外關係的最終管理權。","m":"外國官方機構進香港，中央人民政府來批准。","n":"","v":1,"src":[{"t":"中央人民政府駐香港特別行政區聯絡辦公室：中華人民共和國香港特別行政區基本法","u":"http://www.locpg.gov.cn/2022-06/07/c_1211653784_16.htm","d":"2022-06-07"},{"t":"中華人民共和國外交部：基本法中有關香港對外事務的規定主要有哪些","u":"https://www.mfa.gov.cn/web/ziliao_674904/zcwj_674915/200011/t20001107_7949749.shtml","d":"2000-11-07"}]},"5-137":{"o":["香港特別行政區政府","香港立法會","香港終審法院"],"x":["基本法委員會專門為全國人大常委會解釋基本法時提供意見","香港立法會無此地位","司法機構不涉及對基本法的解釋"],"w":"基本法第158條規定，全國人大常委會對基本法解釋前應徵詢基本法委員會意見。基本法委員會由全國人大常委會設立，專門就基本法解釋提供諮詢，確保解釋符合基本法立法原意。","m":"人大常委會要釋法，基本法委員會先諮詢。","n":"","v":1,"src":[{"t":"中國法律檢索系統北大法寶：全國人民代表大會常務委員會解釋基本法","u":"https://law.pkulaw.com/jieshi/71c9030947101d70bdfb.html","d":"2016-11-05"},{"t":"中央人民政府駐香港特別行政區聯絡辦公室：基本法委員會","u":"http://www.locpg.gov.cn/jsdt/1999-07/19/c_125955534.htm","d":"1999-07-19"}]}," chambers.com/insights2.aspx?id=404&t=6","d":"2024-01-01"}]},"5-154":{"o":["司法權","立法權","行政權"],"x":["司法權已在「獨立的司法權、終審權」中提及","立法權不在憲法或基本法有關國安法條款中","行政權不屬香港特區獨立權力範疇"],"w":"《香港國安法》第4條訂明香港特區應尊重和保障人權，依法保護香港居民的權利自由。法律明確地在「尊重香港特區獨立的司法權、終審權」之外，另闡明要尊重其「核心價值」，包括依法治國、人權保護等基本原則。","m":"司法獨立有司法權、終審權，再加上核心價值三支柱。","n":"官方答案為「核心價值」，此指的是法治、人權等制度的根本價值。","v":1,"src":[{"t":"律政司：《香港國安法》簡介","u":"https://www.doj.gov.hk/tc/miscellaneous/pdf/safeguarding_national_security_c.pdf","d":"2021-04-01"}]},"5-155":{"o":["12個領域","8個領域","20個領域"],"x":["中國國家安全涵蓋16個領域而非12個","8個領域遠不能涵蓋國家安全的廣泛內涵","20個領域超出最初確定的範圍"],"w":"中國確立了國家安全的16個範疇，包括政治安全、國土安全、軍事安全、經濟安全、文化安全、社會安全、科技安全、網絡安全、生態安全、資源安全、核安全、海外利益安全、生物安全、太空安全、深海安全及極地安全。這16個領域涵蓋了國家安全的各個方面。","m":"十六個領域，從政治到極地，全面守護。","n":"","v":1,"src":[{"t":"香港教育局：國家安全重點領域","u":"https://ls.chiculture.org.hk/tc/idea-aspect/682","d":"2024-01-01"},{"t":"全民國家安全教育日官方網站","u":"https://www.nsed.gov.hk/national_security/index.php?a=safety","d":"2024-01-01"}]},"5-156":{"o":["外部威脅","地區衝突","經濟競爭"],"x":["國家安全既要防範外部威脅，也要重視內部安全","地區衝突只是國家安全的單一方面","經濟競爭不能替代內部安全防範"],"w":"國家安全概念的發展已從單純防禦外部威脅擴展到重視內部穩定。中國強調既要防範來自外部的安全威脅，也要防止內部的分裂、動盪等安全隱患，形成內外兼顧的國家安全戰略。","m":"外有敵手內有患，內外安全都得看。","n":"","v":1,"src":[{"t":"全民國家安全教育日：國家安全概念","u":"https://www.nsed.gov.hk/","d":"2024-01-01"}]},"5-157":{"o":["會","部分影響","需要具體評估"],"x":["《香港國安法》明確訂明不會影響居民的基本權利","權利和自由依法受保護，不受無端影響","官方政策明確承諾維護這些權利"],"w":"《香港國安法》第4條明確規定，香港特區維護國家安全應當尊重和保障人權，依法保護香港居民根據《基本法》和相關國際公約享有的言論、新聞、出版、結社、集會、遊行、示威等基本權利和自由。法律明確訂明不會影響這些權利。","m":"國安法保護權利自由，港人基本權益有保障。","n":"雖然國安法明確訂明不會影響這些權利，但實際實施過程中國際上對香港新聞自由有關注。","v":1,"src":[{"t":"律政司：《香港國安法》與人權保護","u":"https://www.doj.gov.hk/tc/miscellaneous/pdf/safeguarding_national_security_c.pdf","d":"2021-04-01"},{"t":"香港政府新聞網：《香港國安法》實施六周年","u":"https://www.info.gov.hk/gia/general/202606/30/P2026063000293.htm","d":"2026-06-30"}]},"5-158":{"o":["2050年","2070年","2040年"],"x":["中國目標是2060年而非2050年","2070年超出了中國公布的目標時間表","2040年與現實時間安排不符"],"w":"2020年9月，中國國家主席習近平在聯合國大會上宣布，中國將努力於2060年前實現碳中和。這是中國應對氣候變化、踐行綠色發展理念的重要承諾，設定了明確的時間目標。","m":" 制","集體領導制"],"x":["中華人民共和國國家機構實行民主集中制而非三權分立","人民民主制不是具體的國家機構運行原則","集體領導制是黨的原則而非國家機構原則"],"w":"中華人民共和國憲法第三條規定，中華人民共和國的國家機構實行民主集中制的原則。全國人民代表大會和地方各級人民代表大會都由民主選舉產生，對人民負責，受人民監督。國家行政機關、監察機關、審判機關、檢察機關都由人民代表大會產生，對它負責，受它監督。","m":"民主集中制運行，代表大會是關鍵。","n":"","v":1,"src":[{"t":"中國人大網：民主集中制","u":"http://www.npc.gov.cn/WZWSREL3pncmR3L25wYy94aW53ZW4vcmRsdC9zZC8yMDEzLTA1LzIwL2NvbnRlbnRfMTc5NTYwOS5odG0=","d":"2024-01-01"}]},"5-170":{"o":["民主自治制度","基層自治制度","少數民族聚居地區分設制度"],"x":["正確的制度名稱是民族區域自治制度而非民主自治制度","基層自治制度是村鎮級組織管理制度","少數民族聚居地區分設制度不是正式名稱"],"w":"在國家統一領導下，各少數民族聚居的地方實行民族區域自治制度。民族自治地方建立自治區、自治州、自治縣，實行人民代表大會制度和民族區域自治制度相結合，維護國家統一和少數民族地區發展。","m":"民族區域自治制度，維護統一促進平等。","n":"","v":1,"src":[{"t":"中國政府網：民族區域自治制度","u":"http://big5.www.gov.cn/gate/big5/www.gov.cn/test/2012-06/20/content_2165897.htm","d":"2024-01-01"}]},"5-171":{"o":["集體","個人","政府機構"],"x":["城市土地屬於國家所有而非集體","個人可能擁有住宅用地使用權但不擁有土地所有權","政府機構代表國家管理土地"],"w":"中華人民共和國憲法第十條規定，城市的土地屬於國家所有。相比之下，農村和城市郊區的土地，除法律規定屬於國家所有的以外，屬於集體所有。這反映了中國關於城市發展和國家控制的基本原則。","m":"城市土地國有，是中國城市建設的基礎。","n":"","v":1,"src":[{"t":"維基文庫：中華人民共和國憲法","u":"https://zh.wikisource.org/zh-hant/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E5%AE%AA%E6%B3%95","d":"2024-01-01"}]},"5-172":{"o":["私有財產","個人財產","公民所有物"],"x":["國家禁止破壞的是國家和集體財產而非私有財產","私有財產受法律保護但不屬於國家禁止破壞的對象","個人財產屬於私權範疇"],"w":"中華人民共和國憲法第十二條規定，社會主義公共財產是神聖不可侵犯的。國家保護社會主義公共財產。禁止任何組織或者個人用任何手段侵佔或者破壞國家和集體的財產。","m":"公產神聖不可侵，破壞國家集體財產違法。","n":"","v":1,"src":[{"t":"6laws.net：中華人民共和國憲法","u":"https://www.6laws.net/6law/law-gb/%E4%B8%AD%E8%8F%AF%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9C%8B%E6%86%B2%E6%B3%95.htm","d":"2024-01-01"}]},"5-173":{"o":["政府干涉經營","行政控制","計劃分配權"],"x":["國有企業擁有自主經營權而非受政府干涉","行政控制與自主經營的原則相悖","計劃經濟時代已過，現在是自主經營"],"w":"中華人民共和國憲法第十六條規定，國有企業在法律規定的範圍內有自主經營的權利。國有企業實行民主管理，通過職工代表大會和其他形式，實行民主管理。國有企業享有法律規定的經營自主權，不受行政干涉。","m":"國有企業有自主經營權，法律保護其權益。","n":"","v":1,"src":[{"t":"維基文庫：中華人民共和國憲法","u":"https://zh.wikisource.org/zh-hant/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E5%AE%AA%E6%B3%95","d": 兵役——公民的義務和責任","v":1,"src":[{"t":"中華人民共和國兵役法","u":"https://law.pkulaw.com/falv/6a9dc31be3bd94e4bdfb.html","d":"2011-12-29"}]},"5-194":{"o":["沒有"],"x":["違反憲法第五十六條關於公民納税義務的規定"],"w":"根據《中華人民共和國憲法》第五十六條規定，中華人民共和國公民有依照法律納税的義務。納税是國家根據法律規定向公民徵收貨幣和實物的行為，具有強制性、無償性和法律依據性，是公民應盡的法定義務。","m":"公民有責任，依法要納税。","n":"","v":1,"src":[{"t":"【一分鐘學憲法】甚麼是依法納稅的義務","u":"https://sfj.yueyang.gov.cn/24459/content_586908.html","d":"2026-09-20"}]},"5-195":{"o":["二分之一以上","四分之三以上"],"x":["二分之一以上的贊成票不足以體現憲法修改的重要性和廣泛共識","四分之三以上的要求超過了現行憲法規定的三分之二多數"],"w":"《中華人民共和國憲法》規定，憲法修改由全國人民代表大會提議或由全國人大代表五分之一以上提出，須經全國人民代表大會代表三分之二以上的多數通過。三分之二的高度要求確保了憲法修改具有廣泛的共識基礎，體現了憲法的莊嚴性。","m":"修改憲法要三分之二，共識才算穩妥。","n":"","v":1,"src":[{"t":"中華人民共和國憲法","u":"https://www.gov.cn/guoqing/2018-03/22/content_5276318.htm","d":"2026-09-20"}]},"5-196":{"o":["副委員長","秘書長"],"x":["副委員長主持常委會工作，但無權召集會議","秘書長協助委員長工作，但無召集權"],"w":"根據《中華人民共和國憲法》和全國人大常委會的組織制度，全國人民代表大會常務委員會會議由委員長召集並主持。委員長可以委託副委員長主持會議，但召集權屬於委員長。全國人大常委會會議每兩個月召開一次，如有特殊需要，可以臨時召集。","m":"常委會會議由委員長召，秩序才能井井有條。","n":"","v":1,"src":[{"t":"全國人大常委會會議是怎樣召開的","u":"http://www.npc.gov.cn/npc/c2/c30834/202501/t20250109_442315.html","d":"2026-09-20"}]},"5-197":{"o":["全國人民代表大會","最高人民法院"],"x":["全國人民代表大會是最高國家權力機關，而非最高國家權力機關的執行機關","最高人民法院是國家司法機關，不是最高國家權力機關的執行機關"],"w":"根據《中華人民共和國憲法》，全國人民代表大會是中華人民共和國最高國家權力機關，行使最高立法權、最高決定權、最高任免權和最高監督權。國務院（中央人民政府）是最高國家權力機關的執行機關，同時也是最高國家行政機關，負責執行全國人大的決議。","m":"全國人大掌權力，國務院來執行。","n":"","v":1,"src":[{"t":"中華人民共和國國務院組織法","u":"http://www.mod.gov.cn/gfbw/fgwx/flfg/16293111.html","d":"2026-09-20"}]},"5-198":{"o":["副總理","國務委員"],"x":["副總理可協助總理工作，但無權召集國務院會議","國務委員協助國務院總理工作，但無獨立召集權"],"w":"根據《中華人民共和國國務院組織法》和國務院工作規則，國務院常務會議和國務院全體會議由國務院總理召集並主持。國務院實行總理負責制，副總理、國務委員、秘書長等協助總理開展工作，但只有總理有權召集和主持國務院各類會議。國務院常務會議一般每週召開一次。","m":"國務院開會由總理領，各部門隨後聽決定。","n":"","v":1,"src":[{"t":"中華人民共和國國務院組織法","u":"https://www.stats.gov.cn/gk/tjfg/xgfxfg/202503/t20250312_1958941.html","d":"2026-09-20"}]},"5-199":{"o":["人民大會堂","故宮"],"x":["人民大會堂是人民代表大會舉辦會議的場所，不是國徽中央的建築","故宮是歷代皇帝的宮殿，不代表新中國的象徵"],"w":"《中華人民共和國憲法》規定國徽的構成元素。中華人民共和國國徽的中央是五星照耀下的天安門，周圍環繞著穀穗和齒輪。天安門象徵中國人民反帝反封建的不屈民族精神；齒輪和穀穗分別象徵工人階級與農民階級；五顆星代表在中國共產黨領導下的人民大團結。","m":"國徽有五星天安門，齒輪穀穗圍成圓。","n":"","v":1,"src":[{"t":"中華人民共和國國徽","u":"https://zh.wikipedia.org/zh-hans/%E4%B8%AD%E5%8D%8E%E4%BA%BA%E6%B0%91%E5%85%B1%E5%92%8C%E5%9B%BD%E5%9B%BD%E5%BE%BD","d":"2026-09-20"},{"t":"國徽誕生背後的故事","u":"http://www.moe.gov.cn/jyb_xwfb/moe_2082/zl_2019n/2019_zl51/201907/t20190704_388889.html","d":"2026-09-20"}]},"5-200":{"o":[],"x":[],"w":"根據《中華人民共和國憲法》第三十二條，中華人民共和國對於因為政治原因要求避難的外國人，可以給予受庇護的權利。政治庇護（亦稱政治避難）是國家向因政治原因受到本國通緝或追訴的外國人提供保護、允許其入境居留、並拒絕本國政府引渡要求的行為，是國際法中的重要原則。","m":"政治避難受庇護，人道原則要遵守。","n":"受庇護的權利是中國憲法明確賦予外國人的權利，體現了人道主義精神。","v":1,"src":[{"t":"庇護權","u":"https://zh.wikipedia.org/zh-hans/%E5%BA%87%E8%AD%B7%E6%AC%8A","d":"2026-09-20"},{"t":"宪法知识系列解读（三十二）关于保护外国人合法权益的规定","u":"http://www.bhrdw.gov.cn/Content-1768.html","d":"2026-09-20"}]}}</script>

function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000)}
function dayLabel(n){var d=new Date(n*86400000);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function status(r){if(!r||(r.c+r.w===0&&!r.k))return'new';if(r.s>=3)return'mastered';if(r.w>0)return r.s===0?'wrong':'firming';return'learning'}
function seen(r){return r&&(r.c+r.w>0)}
function pool(k,cat){return BANK.filter(function(x){return x.refs[k]!==undefined&&(!cat||x.cat===cat)}).sort(function(a,b){return a.ord[k]-b.ord[k]})}
function cats(k){var o=[];pool(k).forEach(function(x){if(o.indexOf(x.cat)<0)o.push(x.cat)});return o}
function refLabel(x){var ks=Object.keys(x.refs).sort().reverse();var k=x.refs[S.set.bank]!==undefined?S.set.bank:ks[0];return BNAME[k]+' '+x.refs[k]}
function hot(x){return Object.keys(x.refs).length>1}
function hotLabel(x){return '高頻：'+Object.keys(x.refs).sort().reverse().map(function(k){return BNAME[k]}).join('、')+'都出現'}

 if(ok){r.c++;if(r.s>=3){r.d=T+14}else if(r.lc!==T){r.s=Math.min(3,r.s+1);r.lc=T;r.d=T+[1,1,3,7][r.s]}}
 else{r.w++;r.s=0;r.lw=T;r.lc=-1;r.d=T+1}
 r.t=Date.now();var d=S.days[T]||(S.days[T]={n:0,c:0,nw:0});d.n++;if(ok)d.c++;if(first)d.nw++;save()}

parent:function(){var T=today(),ids=Object.keys(S.q).filter(function(id){return BYID[id]}),mast=0,wl=wrongLists();ids.forEach(function(id){if(status(S.q[id])==='mastered')mast++});
 var n7=0,c7=0,act=0,dd=[];for(var i=6;i>=0;i--){var d=S.days[T-i]||{n:0,c:0};dd.push([T-i,d.n]);n7+=d.n;c7+=d.c;if(d.n)act++}
 var mx=Math.max.apply(null,dd.map(function(x){return x[1]}).concat([1]));
 var h='<div class="top"><h1 class="serif">家長看板</h1><span class="chip">'+cloudLabel()+'</span></div><div class="kpis"><div class="card kpi"><span class="small muted">已掌握</span><b class="serif" style="color:var(--ok)">'+mast+'</b><span class="xs muted">全部 '+BANK.length+' 題</span></div><div class="card kpi"><span class="small muted">最近 7 天練習</span><b class="serif">'+act+' 天</b><span class="xs muted">共答 '+n7+' 題</span></div><div class="card kpi"><span class="small muted">最近 7 天正確率</span><b class="serif">'+(n7?Math.round(c7/n7*100)+'%':'未有')+'</b></div><div class="card kpi"><span class="small muted">錯題本未掌握</span><b class="serif" style="color:var(--accent-ink)">'+wl.wrong.length+'</b><span class="xs muted">鞏固中 '+wl.firming.length+'</span></div></div><div class="cols" style="margin-top:16px"><div class="stack">';
 h+='<div class="card"><b class="serif">最近 7 天答題數</b><div class="days" style="margin-top:10px">'+dd.map(function(x){return '<div style="height:'+(x[1]/mx*100)+'%" title="'+x[1]+' 題"></div>'}).join('')+'</div><div class="dayl">'+dd.map(function(x){return '<span>'+dayLabel(x[0])+'</span>'}).join('')+'</div></div>';
 var bk=S.set.bank,by={};pool(bk).forEach(function(x){var r=S.q[x.id];if(!seen(r))return;by[x.cat]=by[x.cat]||[0,0];by[x.cat][0]+=r.c;by[x.cat][1]+=r.c+r.w});
 var rows=Object.keys(by).map(function(c){return[c,by[c][0]/by[c][1]*100]}).sort(function(a,b){return b[1]-a[1]});
 h+='<div class="card"><div class="row between"><b class="serif">'+BNAME[bk]+'各主題正確率</b><span class="xs muted">低於 60% 以紅色標示</span></div>'+(rows.length?rows.map(function(r){return '<div class="catrow"><span>'+esc(r[0])+'</span><div class="bar'+(r[1]<60?' red':'')+'"><i style="width:'+r[1]+'%"></i></div><b style="text-align:right">'+Math.round(r[1])+'%</b></div>'}).join(''):'<p class="small muted">這個題庫還沒有答題紀錄。</p>')+'<label class="xs muted" for="pbank">切換題庫</label><select id="pbank" data-change="pbank">'+BANKS.map(function(b){return '<option value="'+b.k+'"'+(b.k===bk?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select></div>';
 h+='<div class="card"><b class="serif">題庫進度與解析進度</b>'+BANKS.map(function(b){var ps=pool(b.k),m=ps.filter(function(x){return status(S.q[x.id])==='mastered'}).length,e=ps.filter(function(x){return EXPL[x.id]&&EXPL[x.id].v}).length,u=ps.filter(function(x){return EXPL[x.id]&&EXPL[x.id].w&&!EXPL[x.id].v}).length,o=ps.filter(function(x){return EXPL[x.id]&&EXPL[x.id].o}).length;return '<div style="margin-top:10px"><div class="row between small"><span>'+esc(b.name)+'</span><span>已掌握 '+m+' / '+ps.length+'</span></div><div class="bar"><i style="width:'+(m/ps.length*100)+'%"></i></div><div class="xs muted">有四個選項 '+o+' 題；解析已核對出處 '+e+' 題，未核對 '+u+' 題</div></div>'}).join('')+'</div></div><div class="stack">';
 var miss=ids.filter(function(id){return S.q[id].w>=2}).sort(function(a,b){return S.q[b].w-S.q[a].w}).slice(0,6);
 h+='<div class="card"><b class="serif">答錯最多的題</b>'+(miss.length?miss.map(function(id){var x=BYID[id];return '<div class="small" style="padding:8px 0;border-top:1px solid var(--line);margin-top:8px">'+esc(x.q)+'<div class="xs muted">答案：'+esc(x.a)+'，答錯 '+S.q[id].w+' 次</div></div>'}).join(''):'<p class="small muted">暫時沒有答錯兩次以上的題。</p>')+'</div>';
 h+='<div class="card"><div class="row between"><b class="serif">孩子回報的解析問題</b><span class="xs muted">'+S.rep.length+' 條</span></div>'+(S.rep.length?S.rep.map(function(r,i){var x=BYID[r.id];return '<div class="small" style="padding:8px 0;border-top:1px solid var(--line);margin-top:8px"><b>'+esc(x?refLabel(x):r.id)+'</b>：'+esc(r.x)+'<div><button class="btn ghost" style="width:auto;padding:0" data-act="delrep" data-i="'+i+'">已處理，移除</button></div></div>'}).join(''):'<p class="small muted">暫時沒有回報。</p>')+'</div>';
 h+='<div class="card"><b class="serif">題庫核對</b><div class="xs muted">官方資料的勘誤與處理</div>'+ERRATA.map(function(r){return '<div class="small" style="padding:8px 0;border-top:1px solid var(--line);margin-top:8px"><b>'+esc(r[0])+'</b><div class="muted">'+esc(r[1])+'</div></div>'}).join('')+'</div>';
 h+='<div class="card stack"><b class="serif">設定</b><label class="small" for="ai">顯示尚未核對出處的 AI 解析</label><select id="ai" data-change="ai"><option value="0"'+(S.set.ai?'':' selected')+'>不顯示（建議）</option><option value="1"'+(S.set.ai?' selected':'')+'>顯示，並註明未核對</option></select></div>';
 h+='<div class="card stack"><b class="serif">用 GitHub 同步進度</b><div class="xs muted">在每部裝置輸入同一個 GitHub Token（只需勾選 gist 權限），進度會存到你帳戶裏一個私人 gist，各裝置自動合併。Token 只存在這部裝置的瀏覽器內。</div>'+(gh&&gh.token?'<div class="small">狀態：'+(cloud==='gh'?'已連接':'未連上')+(gh.last?'，上次同步 '+new Date(gh.last).toLocaleString():'')+'</div>'+(ghMsg?'<div class="small" style="color:var(--accent-ink)">'+esc(ghMsg)+'</div>':'')+'<div class="grid2"><button class="btn" data-act="ghnow">立即同步</button><button class="btn" data-act="ghoff">中斷連接</button></div>':'<label class="small" for="ghtok">GitHub Token</label><input id="ghtok" type="password" autocomplete="off" style="min-height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:inherit;padding:0 12px;width:100%">'+(ghMsg?'<div class="small" style="color:var(--accent-ink)">'+esc(ghMsg)+'</div>':'')+'<button class="btn" data-act="ghon">連接 GitHub</button>')+'</div>';
 h+='<div class="card stack"><b class="serif">備份與還原</b><div class="xs muted">換裝置或清除瀏覽器資料前，先複製下面的進度代碼保存；在新裝置貼上再按「還原」。</div><textarea id="bk" aria-label="進度代碼">'+(V.showbk?esc(JSON.stringify(S)):'')+'</textarea><div class="grid2"><button class="btn" data-act="showbk">顯示進度代碼</button><button class="btn" data-act="restore">還原</button></div><button class="btn ghost" data-act="reset">'+(V.confirmReset?'再按一次確認：清除全部進度':'清除全部進度')+'</button></div></div></div>';
 return h+tabbar('parent')}
};

var ACT={
home:function(){if(tick){clearInterval(tick);tick=null}sess=null;V={name:'home'}},wrongbook:function(){V={name:'wrongbook',tab:'wrong'}},parent:function(){V={name:'parent'}},
bank:function(el){S.set.bank=el.getAttribute('data-k');S.set.cat='';save()},
seq:function(){var ps=pool(S.set.bank),i=S.seq[S.set.bank]||0;if(i>=ps.length){i=0;S.seq[S.set.bank]=0;save();toast('這份題庫已刷完一遍，從第 1 題重新開始')}start('seq',ps.slice(i).map(function(x){return x.id}),{seqBank:S.set.bank,seqBase:i});return true},
random:function(el){var n=+el.getAttribute('data-n')||50;start('random',shuffle(BANK).slice(0,n).map(function(x){return x.id}));return true},
redo:function(){var wl=wrongLists();start('redo',shuffle(wl.wrong.concat(wl.firming)));return true},
reveal:function(){sess.reveal=true},
pick:function(el){var o=sess.opts[+el.getAttribute('data-i')],x=BYID[sess.ids[sess.i]];answer(o===x.a,o);return true},
unsure:function(){answer(false,null);return true},selfok:function(){answer(true,null);return true},selfno:function(){answer(false,null);return true},
next:function(){next();return true},
notyet:function(){var id=sess.ids[sess.i];if(!sess.again[id]){sess.again[id]=1;sess.ids.push(id)}next();return true},
gotit:function(){var id=sess.ids[sess.i],r=S.q[id]||(S.q[id]={s:0,c:0,w:0,d:today(),lc:-1,lw:-1,k:0,t:0});r.k=1;r.t=Date.now();save();next();return true},
quizthese:function(){var ids=[];sess.ids.forEach(function(id){if(ids.indexOf(id)<0)ids.push(id)});start('quiz',shuffle(ids));return true},
redobad:function(){start('redo',shuffle(sess.ids.filter(function(id){return sess.res[id]===false})));return true},
report:function(){sess.report=true},
sendrep:function(){var t=(document.getElementById('rep').value||'').trim();if(!t){toast('請先寫下問題');return true}S.rep.push({id:sess.ids[sess.i],x:t.slice(0,300),t:Date.now()});save();sess.report=false;toast('已送出，爸爸媽媽會在家長看板看到')},
delrep:function(el){S.rep.splice(+el.getAttribute('data-i'),1);save()},
wtab:function(el){V.tab=el.getAttribute('data-v');V.open=null},wopen:function(el){var id=el.getAttribute('data-id');V.open=V.open===id?null:id},
showbk:function(){V.showbk=true},
ghon:function(){var t=(document.getElementById('ghtok').value||'').trim();if(!t){toast('請先貼上 Token');return true}gh={token:t,id:null,last:0};saveGh();ghMsg='';toast('正在連接 GitHub…');ghSync();return true},
ghnow:function(){toast('正在同步…');ghSync();return true},
ghoff:function(){gh=null;saveGh();ghMsg='';if(cloud==='gh')cloud='local'},
restore:function(){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||o.v!==1)throw 0;merge(o);save();toast('已還原並合併進度')}catch(e){toast('進度代碼不正確，請整段複製再貼上')}},
reset:function(){if(!V.confirmReset){V.confirmReset=true;return}S=blank();save();V={name:'parent'};toast('已清除全部進度')}
};
var CHANGE={cat:function(v){S.set.cat=v;save()},pbank:function(v){S.set.bank=v;S.set.cat='';save()},nw:function(v){S.set.nw=+v;save()},rd:function(v){S.set.round=+v;save()},ai:function(v){S.set.ai=+v;save()}};

function toast(m){var t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none'},2600)}
function render(){app.className=V.name==='parent'?'wide':'';app.innerHTML=(VIEW[V.name]||VIEW.home)()}
app.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');if(!el||el.disabled)return;var f=ACT[el.getAttribute('data-act')];if(!f)return;if(f(el)!==true)render()});
app.addEventListener('change',function(ev){var el=ev.target.closest('[data-change]');if(!el)return;var f=CHANGE[el.getAttribute('data-change')];if(f){f(el.value);render()}});
render();initCloud();if(gh&&gh.token)ghSync();
})();
</script>
</body>
