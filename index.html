<style>

*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}

button,select,textarea{font:inherit;color:inherit}

#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin-bottom:12px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

<script id="expl" type="application/json">{"9-1":{"o":["薄荷","當歸","人參"],"x":"薄荷、當歸、人參都是中藥，但沒有端午掛門的習俗。","w":"農曆五月古稱「惡月」，濕熱多蟲，古人在門上插艾草（常與菖蒲同掛）辟邪驅疫。艾草有濃烈香氣及藥用價值，《荊楚歲時記》已載懸艾之俗。","m":"端午插艾，惡氣不來。","v":1,"src":[{"t":"中國文明網：端午節為甚麼要掛艾草","u":"http://www.wenming.cn/wmdjr_299/dwj/cs/202306/t20230616_6622115.htm","d":"2023-06-16"},{"t":"央廣網：端午節為什麼要掛艾草","u":"https://ent.cnr.cn/ylzt/daunwu/minsu/20210608/t20210608_525507815.shtml","d":"2021-06-08"}]},"9-2":{"o":["孔子","岳飛","介子推"],"x":"介子推與寒食節有關；孔子、岳飛與端午無關。","w":"端午本源自先秦時令節日，後世逐漸把紀念愛國詩人屈原演變成端午的主要內容，食粽紀念屈原是流傳最廣的說法。","m":"粽葉裹米投江去，年年五月念屈原。","v":1,"src":[{"t":"中國非物質文化遺產網：端午節（屈原故里端午習俗）","u":"https://www.ihchina.cn/tenyear_protect_detail/19820.html","d":"查詢日期 2026-09-20"}]},"9-3":{"o":["臘月二十三","正月十五","臘月三十"],"x":"臘月二十三是北方「小年」；正月十五是元宵；臘月三十是除夕。","w":"臘八節即農曆十二月（臘月）初八，由古代年終「臘祭」演變而來。南朝《荊楚歲時記》載十二月八日為臘日，後與佛祖成道日結合，民間有食臘八粥之俗。","m":"臘月初八喝臘八粥。","n":"先秦至唐宋「臘日」日期並不固定，定於「初八」是南北朝以後、受佛教影響而成。","v":1,"src":[{"t":"上海科技大學：歲時傳統中國節·臘八節","u":"https://shanghaitech.edu.cn/2025/0107/c1001a1105757/page.htm","d":"2025-01-07"},{"t":"維基百科（百科類來源，僅作輔助）：臘八節","u":"https://zh.wikipedia.org/zh-hans/腊八节","d":"查詢日期 2026-09-20"}]},"9-4":{"o":["七月初七","八月十五","五月初五"],"x":"七月初七是七夕；八月十五是中秋；五月初五是端午。","w":"重陽節為農曆九月初九。九月九日日月並陽、兩九相重，故稱重陽，有登高、賞菊、敬老等習俗。","m":"九月九，兩陽重。","v":1,"src":[{"t":"中國政府網：重陽節","u":"https://www.gov.cn/node_13949/content_802921.htm","d":"查詢日期 2026-09-20"}]},"9-5":{"o":["寒食節","下元節","臘八節"],"x":"寒食、下元、臘八都是另外的節日，不是冬至的別稱。","w":"冬至是二十四節氣之一，民間又稱冬節、長至節、亞歲，自古有「冬至大如年」之說；香港及華南地區有做冬、吃湯圓的習俗。","m":"冬至又叫冬節，做冬吃湯圓。","v":1,"src":[{"t":"中國氣象局：冬至節氣的民俗文化","u":"https://www.cma.gov.cn/2011xzt/2020zt/2020_24jq/dz/202111/t20211103_4134398.html","d":"查詢日期 2026-09-20"}]},"9-6":{"o":["放鞭炮","貼紅色春聯","點燈守夜"],"x":"其餘三項都正好對應年獸害怕的東西。","w":"「年」獸傳說中，人們用燃放爆竹、張貼門神春聯、掛紅等方法把牠嚇走；吃餃子是年夜飯食俗，與驅趕「年」的傳說無直接關係。","m":"紅色、爆竹嚇走年；餃子只是團圓飯。","v":1,"src":[{"t":"榆林網（轉載）：年的來歷和傳說","u":"https://www.ylrb.com/2/zt/2023zt/wmdjr/cjdt/349814.shtml","d":"查詢日期 2026-09-20"}]},"9-7":{"o":["粽子","月餅","湯圓"],"x":"粽子屬端午；月餅屬中秋；湯圓屬元宵和冬至。","w":"七夕（乞巧節）最有名的應節食品是「巧果」，又叫乞巧果子，以油、麵、糖、蜜製成；「乞巧」寓意姑娘們祈求心靈手巧。","m":"七夕乞巧，吃巧果。","v":1,"src":[{"t":"文化和旅遊部：七夕·中國傳統「乞巧節」的來歷和習俗","u":"https://www.mct.gov.cn/whzx/whyw/201112/t20111201_707482.htm","d":"2011-12-01"},{"t":"中國文明網：七夕習俗·吃巧果","u":"http://www.wenming.cn/wmdjr_299/20240807/f09513bc16cf4187a528b402490c7e72/c.html","d":"2024-08-07"}]},"9-8":{"o":["燒鵝","雲吞麵","煲仔飯"],"x":"其餘三款是香港常見食品，但不是原居民的節慶傳統菜。","w":"盆菜是香港新界圍村原居民的傳統菜式，已有數百年歷史；每逢喜慶節日、婚嫁、祭祖（食山頭）都會圍盆而食，象徵團圓和睦。","m":"圍村喜慶，圍盆而食。","v":1,"src":[{"t":"人民日報海外版：香港新界盆菜宴背後的故事","u":"http://paper.people.com.cn/rmrbhwb/html/2018-03/09/content_1840732.htm","d":"2018-03-09"},{"t":"中新網：盆菜，港人舌尖上的共同記憶","u":"https://www.chinanews.com.cn/dwq/2025/01-21/10357256.shtml","d":"2025-01-21"}]},"9-9":{"o":["雄黃酒","屠蘇酒","桂花酒"],"x":"雄黃酒是端午；屠蘇酒是春節；桂花酒多與中秋有關。","w":"重陽節正值秋菊盛開，慶祝活動一般包括登高遠眺、觀賞菊花、遍插茱萸、吃重陽糕、飲菊花酒等，寓意辟邪祈壽。","m":"重陽登高，飲菊花酒。","v":1,"src":[{"t":"中國政府網：重陽節","u":"https://www.gov.cn/node_13949/content_802921.htm","d":"查詢日期 2026-09-20"}]},"9-10":{"o":["12","36","72"],"x":"12 是月份數；72 是「七十二候」（每個節氣再分三候），不是題目問的等分。","w":"古人把太陽在黃道上運行一周（360 度）分為 24 等分，每 15 度為一個節氣，合稱二十四節氣，用以反映季節、氣候和農時；2016 年獲聯合國教科文組織列入人類非物質文化遺產。","m":"一年 24 節氣，15 度一個。","v":1,"src":[{"t":"中國文化研究院「燦爛的中國文明」：何謂二十四節氣？","u":"https://chiculture.org.hk/tc/china-five-thousand-years/676","d":"查詢日期 2026-09-20"}]},"9-11":{"o":["冬泳","滑雪","靜坐不動"],"x":"冬泳、滑雪屬冬季活動；春天宜多活動而不是久坐。","w":"中醫講究順應四時。春天陽氣生發，宜多到戶外散步、踏青、打太極等舒緩運動，以助生發陽氣、舒暢氣血。","m":"春天到郊外踏青，生發陽氣。","v":1,"src":[{"t":"廣東省中醫藥局：春暖花開季，動養身心正當時","u":"http://szyyj.gd.gov.cn/zyyfw/ysbj/content/post_4395426.html","d":"2024-03-16"}]},"9-12":{"o":["秦朝","唐朝","明朝"],"x":"明朝是春聯「普及」的時期，不是「起源」。","w":"一般認為正式的春聯起源於五代。五代末後蜀主孟昶題於桃符的「新年納餘慶，嘉節號長春」被視為中國最早的一副春聯。後蜀是「十國」之一，故答案「五代十國」成立。","m":"五代後蜀孟昶，寫下第一副春聯。","n":"官方原文「五代十国」用了簡體「国」字。另有更早源流之說：敦煌遺書已有唐代聯句，北宋《茅亭客話》另記「天垂餘慶，地接長春」。比賽仍以官方答案為準。","v":2,"src":[{"t":"中國社會科學網：春聯·寄托美好生活願望","u":"https://www.cssn.cn/skgz/bwyc/202402/t20240227_5734928.shtml","d":"2024-02-27"},{"t":"國家民委「道中華」：辭舊迎新說春聯","u":"https://www.neac.gov.cn/seac/c103391/202301/1160453.shtml","d":"2023-01"}]},"9-13":{"o":["目","鼻","舌"],"x":"目對肝、鼻對肺、舌對心。","w":"中醫理論認為「腎開竅於耳」。《素問》有「腎在竅為耳」，《靈樞》謂「腎氣通於耳，腎和則耳能聞五音」，故聽力與腎氣盛衰相關。","m":"腎氣通於耳。","v":1,"src":[{"t":"中國中醫藥報：先天之本腎的生理功能解說","u":"http://www.cntcm.com.cn/2021-04/26/content_89148.htm","d":"2021-04-26"}]},"9-14":{"o":["生薑","肉桂","人參"],"x":"生薑、肉桂性溫熱，用來驅寒；人參用來補氣，都不是清熱藥。","w":"菊花性微寒，功效為疏散風熱、平肝明目、清熱解毒，臨床可用於熱毒瘡瘍、疔瘡腫痛等，故說它「清熱解毒」成立。","m":"菊花疏風、明目、又解毒。","n":"菊花最主要的功效是疏散風熱、平肝明目；「清熱解毒」之力，野菊花比一般菊花更強。","v":2,"src":[{"t":"人民政協網：菊花茶的功效和禁忌","u":"http://www.rmzxw.com.cn/c/2018-05-09/2047793.shtml","d":"2018-05-09"},{"t":"河南中醫藥大學第三附屬醫院：菊花和野菊花一字之差，是同一種中藥嗎？","u":"https://zysfy.com.cn/m/Article/5247.html","d":"查詢日期 2026-09-20"}]},"9-15":{"o":["心","肝","脾"],"x":"脾（胃）是「後天之本」，最容易混淆。","w":"中醫認為腎藏「先天之精」，是臟腑陰陽之本、生命之源，故稱「先天之本」；明代《醫宗必讀》明確提出「腎為先天之本」。","m":"腎藏先天精，故為先天之本。","v":1,"src":[{"t":"中國中醫藥報：先天之本腎的生理功能解說","u":"http://www.cntcm.com.cn/2021-04/26/content_89148.htm","d":"2021-04-26"}]},"9-16":{"o":["冬蟲夏草","枸杞","黃芪"],"x":"冬蟲夏草產於青藏高原；枸杞以寧夏出名；黃芪是補氣藥，都沒有這個稱號。","w":"肉蓯蓉寄生於沙漠梭梭根部，是名貴補益中藥，歷史上曾為西域貢品，素有「沙漠人參」之稱。","m":"沙漠裏的人參——肉蓯蓉。","v":1,"src":[{"t":"人民日報海外版：「沙漠人參」——肉蓯蓉","u":"http://paper.people.com.cn/rmrbhwb/html/2019-12/06/content_1960139.htm","d":"2019-12-06"}]},"9-17":{"o":["青花瓷","唐三彩","漆器"],"x":"青花瓷、唐三彩都是陶瓷，不用銅胎；漆器是塗漆，不用燒釉。","w":"景泰藍正名「銅胎掐絲琺瑯」，以紫銅製胎、掐絲、填琺瑯釉（多為藍色），反復入爐燒結、磨光、鍍金而成；因明景泰年間盛行、釉色多藍而得名，為「燕京八絕」之一。","m":"紫銅掐絲填藍釉，景泰年間得其名。","v":1,"src":[{"t":"中國非物質文化遺產網：被誤解的景泰藍","u":"https://www.ihchina.cn/art/detail/id/10926.html","d":"查詢日期 2026-09-20"}]},"9-18":{"o":["飲食養生","運動養生","起居養生"],"x":"這句話沒有提到吃、運動或作息。","w":"這兩句意思是得意時不驕、失意時不亂，強調調節情緒和心態。中醫養生把調攝喜怒憂思等情緒稱為「情志養生」，故答案成立。","m":"心態平和，就是情志養生。","n":"原句出自明代崔銑《六然訓》「得意澹然、失意泰然」，本為處世修養格言；把它對應「情志養生」屬合理引申。","v":2,"src":[{"t":"北京中醫藥大學中醫藥博物館：春季養生原則（論情志養生）","u":"https://bowuguan.bucm.edu.cn/kpzl/zyyzs/10627.htm","d":"查詢日期 2026-09-20"}]},"9-19":{"o":["清晨","正午","半夜"],"x":"清晨、正午、半夜都不合「昏禮」的原意。","w":"古人認為黃昏（傍晚）是陽往陰來的吉時，故在黃昏行娶親之禮，「婚禮」即源自「昏禮」。","m":"昏禮就是黃昏成親。","n":"唐代以後，部分地方迎親改在清晨進行。","v":1,"src":[{"t":" kongzi.org/zt/qqtjk/kzzh/201609/t20160923_20590.htm","d":"2016-09"}]},"9-59":{"o":["孔子","韓非子","墨子"],"x":"韓非子主張君主集權，與此相反；墨子主張兼愛、非攻。","w":"「民為貴，社稷次之，君為輕」出自《孟子·盡心下》，體現孟子「民貴君輕」的民本思想。","m":"民貴君輕，出自孟子。","v":1,"src":[{"t":"司法部·智慧普法平台：民貴君輕","u":"http://legalinfo.moj.gov.cn/zhfxfzwh/fzwhfsgs/202402/t20240221_494856.html","d":"2024-02-21"}]},"9-60":{"o":["忠、孝、節、義、勇","溫、良、恭、儉、讓","禮、樂、射、御、書"],"x":"「溫良恭儉讓」是形容孔子待人態度的五種品德；「禮樂射御書（數）」是六藝。","w":"「五常」即仁、義、禮、智、信。孔子倡仁、義、禮，孟子增「智」，漢代董仲舒再加「信」，合稱「五常之道」。","m":"仁義禮智信，五常。","v":1,"src":[{"t":"人民網·理論：古代中華思想中的核心價值觀","u":"http://theory.people.com.cn/BIG5/n/2014/0213/c40531-24348761.html","d":"2014-02-13"}]},"9-61":{"o":["孔子","莊子","論語"],"x":"孔子言論出自《論語》，不是本句話；莊子與該思想無關；《論語》是孔子言行錄，非該句出處。","w":"「天將降大任於斯人也，必先苦其心志，勞其筋骨……」出自《孟子·告子下》，孟子用此闡述人才成長需經歷磨練的道理，強調實踐歷練對人才培育的重要性。","m":"天下大任靠磨練，孟子講苦難成人。","v":1,"src":[{"t":"中國文化研究院：孟子如何成為儒家「亞聖」","u":"https://chiculture.org.hk/tc/china-five-thousand-years/376","d":"2026-09-20"}]},"9-62":{"o":["指父親的德行","指祖先的智慧","指師長的教導"],"x":"悌不是指父親德行或祖先智慧，而是兄弟關係；師長教導亦非悌的定義。","w":"「悌」是儒家倫理的重要概念，指兄弟姊妹之間應和睦共處、互相友愛，與孝並列為儒家倫理之首。孔子強調通過事兄悌可使順心轉移至長輩。","m":"悌就是兄弟姊妹友愛心。","v":1,"src":[{"t":"中國文化研究院：甚麼是悌德","u":"https://chiculture.org.hk/tc/china-five-thousand-years/1244","d":"2026-09-20"}]},"9-63":{"o":["論語","大學","中庸"],"x":"《論語》是孔子言論集；《大學》《中庸》為四書之列，但該句為《三字經》名句。","w":"「人之初，性本善……」是《三字經》首句，這部宋元間的蒙學經典強調教育對人性的塑造作用，成為傳統啟蒙讀物的典範，廣為後世兒童誦讀。","m":"三字經頭三句講人性善。","v":1,"src":[{"t":"中國文化研究院：古時有哪些識字課本","u":"https://chiculture.org.hk/tc/china-five-thousand-years/4223","d":"2026-09-20"}]},"9-64":{"o":["聖廟","廟堂","祭祀廟"],"x":"聖廟特指孔子廟宇以外的聖人廟；廟堂為泛稱；祭祀廟未具體名稱。","w":"孔廟又稱「文廟」，為歷代祭祀孔子的廟宇。最著名的曲阜孔廟規模宏大，建於孔子去世次年（前478年），經歷代重修擴建，現佔地逾21萬平方米，黃瓦紅牆規格等同皇宮。","m":"孔廟別名就是文廟。","v":1,"src":[{"t":"中國文化研究院：曲阜孔廟的入門須知","u":"https://chiculture.org.hk/tc/china-five-thousand-years/3734","d":"2026-09-20"}]},"9-65":{"o":["琴、棋、書、畫、詩、禮","詩、書、禮、樂、易、春秋","讀、寫、算、禮、樂、體育"],"x":"琴棋書畫詩禮為文人修養，非古代學子「六藝」；其他組合亦非傳統六藝之定義。","w":"儒家教育中的「六藝」為：禮、樂、射、禦、書、數，是先秦時期兒童必須掌握的基本才能。其中射為箭術，禦為駕馬，書為書法，數為數學，禮樂為文化修養的基礎。","m":"六藝禮樂射禦書數。","n":"官方答案寫「禦」，正字應為「御」（駕馬之意），係簡轉繁誤字。","v":1,"src":[{"t":"中國文化研究院：「射」、「御」是古代體育項目","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2720","d":"2026-09-20"}]},"9-66":{"o":["杭州","廣州","寧波"],"x":"杭州為運河樞紐而非海上絲路港口；廣州雖為貿易港但歷史名氣小於泉州；寧波為北方貿易點。","w":"福建泉州因海上絲綢之路繁榮而興起，宋元時期成為「東方第一大港」，被聯合國教科文組織確認為海上絲綢之路重要起點。其獨特之處在於佛教、伊斯蘭教、基督教、印度教、摩尼教、猶太教等多元宗教在此和諧共存，堂堂成為多元信仰的文化展示中心。","m":"泉州海絲港口宗教多。","v":1,"src":[{"t":"中國文化研究院：泉州因何是海上絲路始發地","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2598","d":"2026-09-20"}]},"9-67":{"o":["樂山大佛","雲岡石窟第20窟","靈山大佛"],"x":"樂山大佛高71米，為石刻大佛；雲岡第20窟為露天石刻；靈山大佛為銅像但高度不如中原大佛。","w":"世界最高的佛教造像是河南平頂山的中原大佛（又稱鯉山大佛），總高208米，身高108米，為銅鑄立佛，始建1997年，2008年9月開光，耗銅3300噸、黃金108公斤，表面由13300塊銅板焊接而成。","m":"中原大佛208米世界最高。","n":"須區分「世界最高佛教造像」與「世界最高雕像」；印度團結雕像高達182米但非佛像，故中原大佛確為世界最高佛教造像。","v":1,"src":[{"t":"排行榜123網：中原大佛建築百科","u":"https://www.phb123.com/bk/jianzhu/fdli2724.html","d":"2026-09-20"},{"t":"維基百科（百科輔助）：中原大佛","u":"https://zh.wikipedia.org/zh-hans/%E4%B8%AD%E5%8E%9F%E5%A4%A7%E4%BD%9B","d":"2026-09-20"}]},"9-68":{"o":["瓷器燒製技術","鐵器冶煉技術","造紙印刷技術"],"x":"瓷器技術源於陶瓷傳統，與煉丹術無直接關係；鐵器冶煉早於道教；造紙印刷亦非煉丹術導出。","w":"道教煉丹術本為求仙的製藥手段，道士在混合硝石、硫黃、木炭進行化學實驗時發現其易燃易爆性，北宋軍事技術家遂利用此特性製造火器，火藥技術由此發明與應用，成為中國四大發明之一。","m":"煉丹三物搗一起，不小心發現火藥技。","v":1,"src":[{"t":"中國文化研究院：中國古代怎樣發明火藥","u":"https://chiculture.org.hk/tc/china-five-thousand-years/196","d":"2026-09-20"}]},"9-69":{"o":["佛教","民間信仰","基督教"],"x":"黃大仙祠主祀黃大仙仙人，非佛教場所；不屬民間信仰主流；非基督教廟宇。","w":"香港黃大仙祠屬道教廟宇。黃大仙信仰源於浙江金華，1921年由梁仁庵道長傳入香港並建立嗇色園黃大仙祠，1956年開放予公眾參拜，以「普濟勸善」為核心，藥籤與運籤享譽香港，每年農曆初一上「頭炷香」成為港人習俗。","m":"黃大仙祠係道教廟，香港信仰第一大。","v":1,"src":[{"t":"中國文化研究院：黃大仙信俗","u":"https://ls.chiculture.org.hk/tc/explore/0043","d":"2026-09-20"}]},"9-70":{"o":["《弟子規》、《聲律啟蒙》、《幼學瓊林》","《孝經》、《詩經》、《禮經》","《百家姓》、《千字文》、《古文觀止》"],"x":"前述組合為其他蒙學教材但使用範圍較小；經書為專業教材不屬蒙養課本；古文觀止為進階讀物。","w":"宋代以後使用最廣的蒙養教材為「三百千」：《三字經》、《百家姓》、《千字文》。三者皆為古代啟蒙讀物，以易記易誦之形式傳授識字、歷史知識與道德教育。《三字經》用三言句，《百家姓》列舉姓氏，《千字文》以四言韻句組成，共1000字無重複。","m":"宋後蒙養三本書，三字百家千字文。","v":1,"src":[{"t":"中國文化研究院：古時有哪些識字課本","u":"https://chiculture.org.hk/tc/china-five-thousand-years/4223","d":"2026-09-20"}]},"9-71":{"o":["深圳","浦東","珠海"],"x":"深圳面積1997平方公里，海南面積3.39萬平方公里，海南為最大；浦東非經濟特區；珠海面積1735平方公里亦小於海南。","w":"中國面積最大的經濟特區是海南。海南於1988年4月建省辦經濟特區，全島面積3.39萬平方公里，為中國面積最大的經濟特區。2018年習近平總書記宣佈支持海南全島建設自由貿易試驗區，逐步探索中國特色自由貿易港建設。","m":"海南經濟特區最寬敞。","v":1,"src":[{"t":"新華網：新中國首批經濟特區是哪幾個城市","u":"http://www.news.cn/sikepro/20210414/f04a50a7b7c94142a5d6fcc9f233ab7/c.html","d":"2026-09-20"}]},"9-72":{"o":[],"w":"該題為多選題，表述正確的有三項：第一，人類命運共同體理念由習近平於2013年提出；第二，其核心內涵為建設持久和平、普遍安全、共同繁榮、開放包容、清潔美麗的世界；第三，該理念連續多年寫入聯合國決議，已成為國際共識。","m":"習提人類命運體，五位一體入聯決。","v":1,"src":[{"t":"新華網：構建人類命運共同體的時代價值和實踐成就","u":"http://www.news.cn/world/20240430/e3a267d0063e405bbc9d36a65f4d6e41/c.html","d":"2026-09-20"}]},"9-73":{"o":["黨章","人民代表大會制度","民法典"],"x":"黨章為黨的根本法，非國家根本大法；人大制度為政治制度而非根本大法；民法典為民事法律而非根本大法。","w":"中國的根本大法是憲法。憲法為國家最高法律，具最高法律效力，是國家治理與穩定的根本法，代表黨與人民的集中意志，規定國家政治與社會生活的根本原則。","m":"憲法就是根本大法。","v":1,"src":[{"t":"新華網：學習手記丨憲法的根基在於人民發自內心的擁護","u":"https://www.news.cn/politics/20251204/6f7c25d808aa4efb9b939102393fa375/c.html","d":"2026-09-20"}]},"9-74":{"o":[],"w":"該題為多選題，三項表述均正確：第一，RCEP於2022年1月1日對首批成員國正式生效；第二，該協定覆蓋中國、日本、韓國、澳大利亞、紐西蘭及東盟十國共十五成員，人口、經濟體量、貿易額均佔全球約三分之一；第三，RCEP為當前全球規模最大、成員最多的自由貿易協定，90%以上貨物貿易將實現零關稅。","m":"RCEP二二年生效全球最大。","v":1,"src":[{"t":"新華網：RCEP生效！全球最大自由貿易區正式啟航","u":"http://www.news.cn/fortune/2022-01/01/c_1128223217.htm","d":"2026-09-20"}]},"9-75":{"o":["1932年","1935年","1936年"],"x":"1932年紅軍尚在根據地未開始長征；1935年為遵義會議年份，非長征開始；1936年為長征結束年。","w":"中國工農紅軍長征開始於1934年。1934年10月，第五次反「圍剿」失利後，中央紅軍主力約十萬人從江西於都集結出發，踏上戰略轉移的漫漫征途，歷時兩年，跨越近百條江河、40餘座高山險峰，其中海拔4000米以上雪山20餘座。1935年1月召開的遵義會議為長征中的歷史轉折點。","m":"長征起於一九三四年十月。","v":1,"src":[{"t":"新華網：偉大征程丨長征：氣壯山河的英雄史詩","u":"https://www.news.cn/politics/20260606/9d827a00211b476c942fe2b09a86873f/c.html","d":"2026-09-20"}]},"9-76":{"o":["渡過金沙江","翻越夾金山","強渡烏江"],"x":"渡過金沙江、翻越夾金山、強渡烏江都是長征途中的戰役或事件，但不是長征勝利的標誌，標誌是三大主力最終會師。","w":"1936年10月9日和22日，紅一、二、四方面軍三大主力分別在甘肅會寧和寧夏將台堡勝利會師，三支主力的匯合標誌著紅軍長征的勝利結束。","m":"會寧會師＝三大主力會合＝長征勝利結束。","v":1,"src":[{"t":"中國軍網：1936年10月9日，紅軍三大主力會師","u":"https://photo.81.cn/tsjs/2017-10/09/content_7779025.htm","d":"2017-10-09"},{"t":"人民網：紅軍三大主力會師之地將台堡","u":"http://politics.people.com.cn/n1/2019/0816/c1001-31298501.html","d":"2019-08-16"}]},"9-77":{"o":["湘江戰役","強渡烏江","飛奪瀘定橋"],"x":"湘江戰役是最慘烈的戰役，強渡烏江是突破封鎖線，飛奪瀘定橋是翻越高山的關鍵，但四渡赤水最具戰略性，打破敵人圍追堵截企圖。","w":"四渡赤水戰役（1935年1月-3月）是遵義會議後中央紅軍在川黔滇邊境的一次高度靈活的運動戰，毛澤東通過四次渡赤水巧妙機動，擺脫敵軍幾十萬兵力的圍追堵截，扭轉了長征以來的被動局面。","m":"四渡赤水＝靈活變通＝打破敵人圍追。","v":1,"src":[{"t":"人民網：四渡赤水 神來之筆","u":"http://military.people.com.cn/BIG5/n1/2026/0903/c1011-40791743.html","d":"2026-09-03"},{"t":"中華人民共和國國防部：四渡赤水戰役","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4849498.html","d":"2016-08-19"}]},"9-78":{"o":["崇山峻嶺山","烏蒙山","岷山"],"x":"烏蒙山、崇山峻嶺都是長征經過的山，但夾金山（海拔4000多米）是中央紅軍翻越的第一座大雪山，最具歷史意義。","w":"1935年6月，中央紅軍在毛澤東、周恩來、朱德指揮下，首次翻越夾金山，這座橫跨四川寶興縣和小金縣的雪山是長征途中遇到的第一座高海拔大雪山。","m":"夾金山＝第一座大雪山＝長征最初的高山關鍵。","v":1,"src":[{"t":"人民網：紅軍長征走過的第一座大雪山","u":"http://sc.people.com.cn/BIG5/n2/2021/1225/c345509-35067729.html","d":"2021-12-25"},{"t":"新華網：中央紅軍長征翻越夾金山","u":"http://www.news.cn/local/20241226/203285d2ba4d43b09a4380cb59aa1311/c.html","d":"2024-12-26"}]},"9-79":{"o":["四渡赤水","強渡烏江","飛奪瀘定橋"],"x":"四渡赤水是最精彩的運動戰，強渡烏江和飛奪瀘定橋都是成功戰役，但湘江戰役因紅軍傷亡最大（近五萬人）被公認為長征中最慘烈。","w":"1934年11月25日至12月1日的湘江戰役中，中央紅軍在廣西興安、灌陽、全州一帶與國民黨近30萬大軍血戰四天四夜，付出三萬人犧牲的慘重代價，因此被譽為「長征史上最慘烈的一戰」。","m":"湘江戰役＝死傷最重＝最慘烈。","v":1,"src":[{"t":"新華網：湘江突圍：長征中最為慘烈的戰役","u":"http://www.xinhuanet.com/politics/2016-08/10/c_1119366491.htm","d":"2016-08-10"},{"t":"人民網黨史頻道：湘江戰役","u":"http://dangshi.people.com.cn/n1/2016/0229/c85037-28159039.html","d":"2016-02-29"}]},"9-80":{"o":["馬匹和騾馬","竹筏","木舟"],"x":"馬匹在草地上易陷沼澤，竹筏和木舟只能在河流上使用，而草地是沼澤溼地，紅軍只能依靠步行，沿草叢根部艱難行進。","w":"紅軍過草地時面臨沼澤溼地和缺乏糧食的極端困境，紅軍指戰員和少量畜力主要靠步行通過，他們腳踏草叢根部沿草甸前進，這也是為甚麼要宰殺馬匹和犛牛做肉乾作為糧食。","m":"過草地＝沼澤溼地＝步行才能過。","v":1,"src":[{"t":"人民網：紅軍過沼澤草地經歷怎樣生死考驗","u":"http://military.people.com.cn/BIG5/n1/2016/0906/c1011-28693656.html","d":"2016-09-06"}]},"9-81":{"o":["1935年","1934年","1937年"],"x":"長征於1934年10月出發，1935年紅一方面軍到達陝北，但直到1936年10月三大主力才全部會師，長征才正式宣告結束。","w":"紅軍長征於1934年10月開始，經過兩年艱苦跋涉，到1936年10月，紅一、二、四方面軍三大主力分別在會寧和將台堡勝利會師，長征正式宣告勝利結束。","m":"長征結束＝1936年10月＝三大主力會師時。","v":1,"src":[{"t":"中國軍網：1936年10月9日紅軍三大主力會師","u":"https://photo.81.cn/tsjs/2017-10/09/content_7779025.htm","d":"2017-10-09"}]},"9-82":{"o":["第四次反圍剿失敗","敵軍突然進攻","根據地資源枯竭"],"x":"第四次反圍剿失敗發生在第五次之前，敵軍進攻和資源枯竭都是促成因素，但第五次反圍剿的失敗是直接引發長征的原因。","w":"1933年10月開始的第五次反圍剿中，蔣介石調集近百萬兵力，採取「堡壘主義」戰略對中央蘇區進行大規模圍剿。在王明「左」傾教條主義領導下，中央紅軍戰略錯誤，終於在1934年10月戰役失敗，被迫開始長征。","m":"第五次反圍剿失敗＝長征直接原因。","v":1,"src":[{"t":"中國共產黨歷史研究網：第五次反圍剿失敗","u":"https://www.dswxyjy.org.cn/n/2013/0221/c244514-20554378.html","d":"2013-02-21"}]},"9-83":{"o":["四渡赤水","強渡烏江","飛奪瀘定橋"],"x":"四渡赤水最精彩、強渡烏江和飛奪瀘定橋也很關鍵，但湘江戰役傷亡最大、最為悲壯，且直接導致遵義會議召開，最為關鍵。","w":"湘江戰役（1934年11月）是長征中最悲壯和最關鍵的戰役，中央紅軍損失近三萬人，付出巨大犧牲才突破敵人圍堵。這次失敗直接導致遵義會議召開，糾正了「左」傾錯誤，是長征轉折的契機。","m":"湘江戰役＝最悲壯、最關鍵＝促成遵義轉折。","v":1,"src":[{"t":"新華網：湘江突圍——長征中最為慘烈的戰役","u":"http://www.xinhuanet.com/politics/2016-08/10/c_1119366491.htm","d":"2016-08-10"},{"t":"共產黨員網：湘江戰役是一場甚麼樣的戰役","u":"https://www.12371.cn/2022/04/11/ARTI1649666126550508.shtml","d":"2022-04-11"}]},"9-84":{"o":["周恩來","朱德","徐海東"],"x":"周恩來、朱德都是長征的重要領導人，徐海東是傑出指揮官，但「紅軍不怕遠征難」這著名詩句出自毛澤東的《七律·長征》。","w":"毛澤東於1935年9月下旬創作、10月定稿了七律《長征》。詩中開篇「紅軍不怕遠征難，萬水千山只等閒」表現了紅軍的英勇無畏精神，是毛澤東本人最重要的長征詩詞作品。","m":"「紅軍不怕遠征難」＝毛澤東《七律·長征》＝長征最著名詩篇。","v":1,"src":[{"t":"古文岛：七律·長征原文賞析","u":"https://www.gushiwen.cn/mingju/juv_e675d2810600.aspx","d":"2026-09-20"},{"t":"中國共產黨歷史研究網：《七律·長征》的來龍去脈","u":"https://www.dswxyjy.org.cn/n1/2017/1121/c244523-29659205.html","d":"2017-11-21"}]},"9-85":{"o":["搶奪軍糧","殲滅敵軍主力","建立根據地"],"x":"搶奪軍糧是過程、殲滅敵軍主力是期望但難以實現、建立根據地是政治目標，但四渡赤水的首要和直接目的是通過機動戰術擺脫敵人圍追堵截。","w":"四渡赤水戰役中，中央紅軍在遵義會議確立毛澤東領導後，採取高度靈活的運動戰方針。紅軍在川黔滇邊界四次穿越赤水河，與敵人兜圈子，通過精妙的戰略機動擺脫敵軍幾十萬重兵的包圍圈。","m":"四渡赤水＝機動戰術＝擺脫包圍是主要目的。","v":1,"src":[{"t":"人民網：四渡赤水——高超指揮藝術的生動體現","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4849498.html","d":"2016-08-19"},{"t":"西藏國防動員辦：紅軍四渡赤水絕地重生","u":"https://drc.xizang.gov.cn/gfdy/gfdy_zzzl/202401/t20240112_398366.html","d":"2024-01-12"}]},"9-86":{"o":["金沙江","大渡河","瀘定河"],"x":"大渡河是飛奪瀘定橋的地點，瀘定河與大渡河在瀘定一帶重合但名稱不同，金沙江是之後才渡過的，烏江才是打破鐵桶計劃的強渡點。","w":"1935年1月，中央紅軍強渡烏江，突破了貴州軍隊的防線。這一戰鬥打破了蔣介石妄圖在烏江一帶「鐵桶合圍」紅軍的計劃，使紅軍得以進入相對開闊的黔北高原地區，為隨後進行遵義會議創造了條件。","m":"烏江強渡＝打破敵人圍堵＝長征局勢開始扭轉。","n":"「鐵桶計劃」一說多源自廬山會議（1933年）對第五次反圍剿的總體戰略規劃，與烏江戰役（1935年1月）的直接關聯在不同來源中表述有異，但烏江確是打破敵人圍追的關鍵。","v":1,"src":[{"t":"新華網：強渡烏江——長征中的軍事地理解讀","u":"https://www.news.cn/politics/20260826/b1a1cc6b00b745a1b528bdb4b08d7873/c.html","d":"2026-08-26"},{"t":"中國共產黨歷史研究網：紅軍強渡烏江經歷怎樣艱險","u":"https://www.dswxyjy.org.cn/n1/2016/0914/c396980-28716021.html","d":"2016-09-14"}]},"9-87":{"o":["金沙江","烏江","瀘定河"],"x":"金沙江和烏江都是長征中渡過的河流，瀘定河就是大渡河在瀘定一帶的別稱，但飛奪瀘定橋戰鬥發生在大渡河上。","w":"1935年5月29日，中央紅軍在朱德、毛澤東等指揮下，四川紅一方面軍二十三團在瀘定橋一帶執行飛奪任務。瀘定橋橫跨大渡河，是連接川西兩岸的重要通道，高度約30多米，橋面由13條鐵鏈組成。","m":"飛奪瀘定橋＝大渡河上＝紅軍的驚人壯舉。","v":1,"src":[{"t":"中華人民共和國國防部：飛奪瀘定橋——中國革命史上的不朽篇章","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4833421.html","d":"2016-08-19"},{"t":"新華社資料：百年瞬間——紅軍飛奪瀘定橋","u":"https://www.12371.cn/2021/05/24/VIDE1621818302445676.shtml","d":"2021-05-24"}]},"9-88":{"o":["將台堡","陝北吳起鎮","寧夏固原"],"x":"將台堡在寧夏西吉縣，是紅二方面軍會師地點（10月22日），寧夏固原是地級市，陝北吳起鎮是紅一方面軍到達陝北的地點，但會寧是紅一、四方面軍首次會師地（10月9日）。","w":"1936年10月9日至10月22日，紅一、二、四方面軍三大主力在甘肅會寧和寧夏將台堡分別勝利會師。其中會寧是紅一、四方面軍最初會師地點，是長征中最關鍵的會師所在地。","m":"會寧＝三大主力首次會合＝長征勝利的象徵。","v":1,"src":[{"t":"人民網：紅軍三大主力會師之地將台堡","u":"http://politics.people.com.cn/n1/2019/0816/c1001-31298501.html","d":"2019-08-16"},{"t":"澎湃新聞：將台堡——紅軍長征史上最後一次會師","u":"https://www.thepaper.cn/newsDetail_forward_8352935.html","d":"2019-06-25"}]},"9-89":{"o":["村婦人","農民","地主"],"x":"故事發生在湖南汝城，涉及的是紅軍女戰士與老鄉的感人故事，人物是徐解秀老人而非村婦人、農民或地主身份描述。","w":"1934年11月，三名女紅軍在長征途中借宿於湖南汝城沙洲瑤族村徐解秀老人家中，身體虛弱的徐解秀主動收留飢寒交迫的女紅軍。臨別時女紅軍把唯一的被子剪成一半留給徐解秀，這個故事深刻反映了紅軍與老鄉之間的魚水深情。","m":"半條被子＝紅軍與老鄉＝魚水情深的象徵。","v":1,"src":[{"t":"新華網：「半條被子」的故事在繼續","u":"http://www.news.cn/20251104/a8b8b821623a4b368c04ae539304529d/c.html","d":"2025-11-04"},{"t":"中華人民共和國最高人民檢察院：「半條被子」的故事","u":"https://www.spp.gov.cn/spp/dsxxjy/202104/t20210406_530308.shtml","d":"2021-04-06"}]},"9-90":{"o":["約10萬人","約5萬人","約12萬人"],"x":"約5萬人不足以進行長征，約12萬人超過了實際人數，長征過程中損失慘重（湘江戰役後銳減到三萬多人），但出發人數確實是約8.6萬人。","w":"1934年10月16-19日，中共中央委員會、中央革命軍事委員會與中央紅軍（紅一方面軍）主力，包括一、三、五、八、九軍團及直屬部隊，共計約八萬六千人從江西瑞金突破敵人第一道封鎖線，開始長征。","m":"長征出發＝8.6萬人＝中央紅軍的初始規模。","v":1,"src":[{"t":"中國共產黨中央委員會：1934年中央紅軍長征出發","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4852696.html","d":"2016-08-19"},{"t":"新華網：紅一方面軍長征序列","u":"http://www.xinhuanet.com/politics/2016-10/12/c_129318563.htm","d":"2016-10-12"}]},"9-91":{"o":["紅一方面軍","紅二方面軍","紅四方面軍"],"x":"這三個方面軍都是長征中紅軍的主力，但題目問的是「三軍」確切指的是甚麼。","w":"《七律·長征》寫於1935年10月，「三軍過後盡開顏」的「三軍」指紅軍的三大主力——紅一、二、四方面軍。雖然有學者認為這是對全軍的泛稱，但官方答案明確為三大主力。","m":"紅軍長征時共有三支主力隊伍。","n":"關於「三軍」的含義有一說認為是泛指全軍，另一說認為特指紅一、二、四方面軍。毛澤東1958年批注曾提「三軍」指三個方面軍，但寫詩時紅二方面軍尚未成立。","v":1,"src":[{"t":"中國文化研究院：詩意長征","u":"https://www.dswxyjy.org.cn/BIG5/n1/2022/1024/c244516-32550502.html","d":"2022-10-24"}]},"9-92":{"o":["梅里雪山","海螺溝冰川","玉龍雪山"],"x":"這些都是中國有名的高山，但海拔最高的紅軍烈士墓在雅克夏雪山。","w":"海拔最高的紅軍烈士墓位於雅克夏雪山北坡的山口，海拔4450米，埋葬著1936年7月犧牲的12位紅軍戰士，1952年被發現。","m":"海拔最高紅軍墓＝雅克夏雪山（4450米）。","v":1,"src":[{"t":"新華社：重登亞克夏雪山","u":"https://www.news.cn/20260703/1307bcf2dd824080a1f466a4fada00d0/c.html","d":"2026-07-03"}]},"9-93":{"o":["湘江戰役","四渡赤水","烏江戰役"],"x":"這些都是長征中紅軍經歷的著名戰役，但平型關大捷是1937年八路軍在全面抗戰期間的戰役。","w":"平型關大捷發生於1937年9月25日，是八路軍第115師在全面抗戰初期對日軍的勝利，並非長征時期的戰役。長征是1934-1935年紅軍的戰略轉移。","m":"平型關大捷是抗戰時期的戰役，不屬於長征。","n":"平型關大捷發生在長征後三年的抗日戰爭期間，時間完全不同。","v":1,"src":[{"t":"中國文化研究院：平型關戰役","u":"https://chiculture.org.hk/tc/photo-story/3237","d":"2026-09-20"}]},"9-94":{"o":["北斗衛星系統發射成功","玉兔月球車發射成功","白鶴灘水電站建成"],"x":"前兩個是航天成就，但後者是水利工程，不屬於航天領域。","w":"中國航天領域的重要成就包括：1970年4月24日「東方紅一號」衛星發射成功；2003年10月15日「神舟五號」載人飛船發射成功；2007年10月24日「嫦娥一號」月球探測衛星發射成功；2021年5月15日「天問一號」火星探測器成功著陸。","m":"記住中國航天三個里程碑：人造衛星、載人航天、深空探測。","v":1,"src":[{"t":"國家科學技術研究服務平台：1970年4月24日","u":"https://www.ncsti.gov.cn/kcfw/jnr/202203/t20220325_63748.html","d":"2022-03-25"},{"t":"中國載人航天工程官方網站：神舟五號","u":"https://www.cmse.gov.cn/fxrw/szwh/jchg_193/200809/t20080918_23560.html","d":"2008-09-18"},{"t":"中國國家航天局：嫦娥一號探測器","u":"https://www.cnsa.gov.cn/n6758824/n6759008/n6759013/c6794312/content.html","d":"2026-09-20"},{"t":"人民網：天問一號登陸火星","u":"http://finance.people.com.cn/BIG5/n1/2022/0526/c1004-32430560.html","d":"2022-05-26"}]},"9-95":{"o":["遼寧艦是中國購買俄羅斯的航空母艦","山東艦採用斜坡飛行甲板","福建艦配備核動力推進系統"],"x":"遼寧艦確實基於俄羅斯舊船改造，山東艦採用斜坡甲板，福建艦採用電磁彈射。","w":"遼寧艦是中國第一艘服役的航空母艦，於2012年9月25日交付；山東艦是中國第一艘國產航空母艦，於2019年12月17日服役；福建艦是中國完全自主設計建造的彈射型航空母艦，2025年11月5日入列。","m":"遼寧艦第一艘、山東艦第一國產、福建艦首彈射。","v":1,"src":[{"t":"香港中華文化研究院：國產航母山東艦","u":"https://ls.chiculture.org.hk/tc/explore/0125","d":"2026-09-20"},{"t":"當代中國：福建艦出海首次航行試驗","u":"https://www.ourchinastory.com/zh/11320/%E7%A6%8F%E5%BB%BA%E8%89%A6%EF%BD%9C%E5%87%BA%E6%B5%B7%E9%A6%96%E6%AC%A1%E8%88%AA%E8%A1%8C%E8%A9%A6%E9%A9%97-%E6%B5%B7%E8%A9%A6%E8%A9%A6%E7%94%9A%E9%BA%BC%EF%BC%9F%E9%9B%BB%E7%A3%81%E5%BD%88%E5%B0%84%E6%9C%89%E5%A4%9A%E5%BC%B1%EF%BC%9F","d":"2026-09-20"}]},"9-96":{"o":["蘇-35戰鬥機","俄羅斯S-400防空系統","以色列鐵穹防空系統"],"x":"蘇-35是俄羅斯戰機，S-400是俄羅斯防空系統，鐵穹是以色列防空系統。","w":"99式主戰坦克是中國在1992年研製的第三代坦克；東風-41洲際導彈是中國自主研製的固體燃料洲際彈道導彈，射程14000公里；殲-20隱形戰鬥機是中國自主研製的第五代隱身戰鬥機，2011年首飛，2017年服役。","m":"99坦克、東風導彈、殲20戰機都是中國自主研製。","v":1,"src":[{"t":"當代中國：99A坦克亞洲第一","u":"https://www.ourchinastory.com/zh/1294/%E9%AB%98%E4%BF%A1%E6%81%AF%E5%8C%96%20%E7%8C%9B%E7%81%AB%E5%8A%9B%2099A%E5%9D%A6%E5%85%8B%E4%BA%9E%E6%B4%B2%E7%AC%AC%E4%B8%80","d":"2026-09-20"},{"t":"當代中國：殲-20隱形戰鬥機首飛成功","u":"https://www.ourchinastory.com/zh/726/%E6%AE%B2-20%E9%9A%B1%E5%BD%A2%E6%88%B0%E6%A9%9F%E9%A6%96%E9%A3%9B%E6%88%90%E5%8A%9F","d":"2026-09-20"}]},"9-97":{"o":["造紙術","印刷術","指南針"],"x":"這些也是四大發明，但對軍事戰爭的影響比不上火藥，火藥能直接製成爆炸性武器。","w":"火藥是中國古代四大發明之一，由硝石、硫黃、木炭配製而成，13-14世紀後被大量用於製造大炮和火箭等火藥武器，對軍事戰爭的影響最為深遠。","m":"火藥最直接用於軍事武器，影響最大。","v":1,"src":[{"t":"中國文化研究院：中國古代怎樣發明火藥","u":"https://chiculture.org.hk/tc/china-five-thousand-years/196","d":"2026-09-20"}]},"9-98":{"o":["十八位武術家的合稱","十八種武術招式","十八首武術歌謠"],"x":"「十八般武藝」是指技能和兵器，不是人、招式或歌謠。","w":"「十八般武藝」最初指使用十八種兵器的技能。根據明朝謝肇淛的《五雜組》，十八種兵器為：弓、弩、槍、刀、劍、矛、盾、斧、鉞、戟、鞭、鐧、撾、殳、叉、耙、繩套、白打。","m":"十八般武藝 = 十八種兵器 + 使用技能。","v":1,"src":[{"t":"教育部《國語辭典》：十八般武藝","u":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=8606&webMd=2&la=1","d":"2026-09-20"}]},"9-99":{"o":["戈","矛","槍"],"x":"戈、矛、槍都是進攻性武器，但干是防禦性武器。","w":"「化干戈為玉帛」中，「干」（盾牌）是防禦武器，「戈」（戟狀長柄武器）是進攻武器。古代「干」字象形一根分叉的長柄工具，後來用作防禦武器。","m":"干 = 盾（守），戈 = 矛（攻）。","v":1,"src":[{"t":"江門市人民政府：化干戈為玉帛中的防御武器","u":"http://www.jiangmen.gov.cn/gzhd/lywh/content/post_2265663.html","d":"2026-09-20"}]},"9-100":{"o":["長矛","弓箭","盔甲"],"x":"長矛是攻擊武器，弓箭是遠程武器，盔甲是穿戴裝備但保護面積有限。","w":"盾牌是古代戰爭中用來抵擋箭矢和敵人衝擊的防護裝備，通常由木材和皮革製成，表面覆蓋皮革以防止箭矢穿透。","m":"盾牌用來防守，保護士兵身體。","v":1,"src":[{"t":"北京市文物局：中國古代盾牌文化展","u":"https://wwj.beijing.gov.cn/bjww/wwjzzcslm/1731063/1731073/1731074/325860607/index.html","d":"2026-09-20"},{"t":"北京日報網：古人早期使用的盾牌長啥樣","u":"https://news.bjd.com.cn/2022/09/01/10142740.shtml","d":"2022-09-01"},{"t":"百度百科：盾牌（百科輔助）","u":"https://baike.baidu.com/item/%E7%9B%BE%E7%89%8C/80154","d":"2026-09-20"}]},"9-101":{"o":["投石機","雲梯","壕溝"],"x":"投石機用於遠程投擲，雲梯用於登城，壕溝是防禦工事，都不是用巨木撞擊的器械。","w":"衝車是古代攻城的大型器械，在四輪車上安裝巨木，前包鐵皮，用來撞擊城門。唐朝的衝車長度可達50米以上。","m":"衝車 = 四輪車 + 巨木撞錘。","v":1,"src":[{"t":"中文百科全書：衝車古代攻城器械","u":"https://www.newton.com.tw/wiki/%E8%A1%9D%E8%BB%8A","d":"2026-09-20"},{"t":"華夏經緯網：巨木雷動震城垣—中國古代撞擊類攻守城器械","u":"https://www.huaxia.com/c/2025/07/17/2051950.shtml","d":"2025-07-17"},{"t":"維基百科：衝車（百科輔助）","u":"https://zh.wikipedia.org/zh-hant/%E5%86%B2%E8%BD%A6","d":"2026-09-20"}]},"9-102":{"o":["劍","斧頭","長矛"],"x":"劍、斧頭、長矛都是近距離武器，弓弩才是遠程攻擊。","w":"弓弩是古代遠程攻擊武器，弓用於投射箭矢，弩具有威力大、射程遠、精準度高的特點。宋代床弩的射程可超過1.5公里。","m":"弓弩能遠距離殺傷敵人。","v":1,"src":[{"t":"新華社：箭矢騰空射青云——中國古代弓弩箭","u":"https://www.news.cn/milpro/20241114/c133f3f0f71647f0a32e6216cb9ab7f8/c.html","d":"2024-11-14"}]},"9-103":{"o":["龍泉劍","承影劍","昆吾劍"],"x":"這些都是著名的古代名劍，但越王勾踐劍被稱為「天下第一劍」。","w":"越王勾踐劍是春秋晚期越國的青銅劍，1965年在湖北江陵出土。劍身銘文為「越王鳩淺自作用劍」，被稱為「天下第一劍」，因其千年不鏽、削鐵如泥的特性而著稱。","m":"越王劍千年不鏽，堪稱天下第一。","v":1,"src":[{"t":"湖北省文化和旅遊廳：晒晒咱的鎮館之寶⑫越王勾踐劍—「天下第一劍」","u":"http://wlt.hubei.gov.cn/bmdt/mtjj/202506/t20250619_5698147.shtml","d":"2025-06-19"},{"t":"光明網：越王勾踐劍「天下第一劍」","u":"https://news.gmw.cn/2025-06/19/content_38099488.htm","d":"2025-06-19"},{"t":"維基百科：越王勾踐劍（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E8%B6%8A%E7%8E%8B%E5%8B%BE%E8%B7%B5%E5%89%91","d":"2026-09-20"}]},"9-104":{"o":["香港大學","香港中文大學","香港城市大學"],"x":"這些都是香港高等教育機構，但香港科技大學才是發射香港高教界第一顆衛星的大學。","w":"香港科技大學於2023年8月25日發射了「香港科大—雄彬一號」衛星，這是香港高等教育界首家發射衛星的高等院校，也是香港教界首枚衛星。","m":"香港科技大學發射香港教界第一顆衛星。","v":1,"src":[{"t":"當代中國：香港科技大學周五發射衛星 港高教界第一枚","u":"https://www.ourchinastory.com/zh/6688/%E9%A6%99%E6%B8%AF%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%B8%E5%91%A8%E4%BA%94%E7%99%BC%E5%B0%84%E8%A1%9B%E6%98%9F%20%E6%B8%AF%E9%AB%98%E6%95%99%E7%95%8C%E7%AC%AC%E4%B8%80%E6%9E%9A","d":"2026-09-20"}]},"9-105":{"o":["「長征一號」火箭升空","「神舟一號」無人飛船升空","「嫦娥一號」衛星升空"],"x":"長征火箭是運載工具，嫦娥一號升空於2007年，都與4月24日無關。","w":"中國航天日訂於4月24日，紀念1970年4月24日「東方紅一號」衛星升空。該衛星由長征一號火箭於21時35分發射，標誌著中國進入太空時代。","m":"4月24日 = 東方紅一號升空 = 中國航天日。","v":1,"src":[{"t":"澎湃新聞：1970年4月24日中國第一顆人造地球衛星升空","u":"https://m.thepaper.cn/newsDetail_forward_30698402","d":"2026-09-20"}]},"9-106":{"o":["嫦娥砂","嫦娥晶石","嫦娥玉"],"x":"嫦娥砂、嫦娥晶石、嫦娥玉都不是中國在月球發現並命名的新礦物。","w":"嫦娥五號在月球樣品中發現了人類在月球發現的第六種新礦物，名為嫦娥石。嫦娥石是一種磷酸鹽礦物，呈柱狀晶體，存在於月球玄武岩顆粒中。經國際礦物學協會新礦物命名委員會投票通過確認為新礦物。","m":"嫦娥五號帶回的月球第六種新礦物就叫嫦娥石。","v":1,"src":[{"t":"新華網：中國發現月球新礦物","u":"https://www.news.cn/tech/20260424/0e7bea9b9dc5485bbc6bef56a99f7186/c.html","d":"2026-04-24"}]},"9-107":{"o":["赤柱軍營","九龍灣軍營","沙田軍營"],"x":"赤柱軍營、九龍灣軍營、沙田軍營都是駐港部隊的軍營，但面積都比石崗軍營細。","w":"石崗軍營位於香港新界元朗區石崗錦田公路 260 號，是駐港部隊佔地面積最大的軍營，並包含石崗機場。","m":"石崗軍營是駐港部隊面積最大的軍營。","v":1,"src":[{"t":"香港特別行政區政府資訊中心：立法會十題：使用和管理軍事用地","u":"https://www.info.gov.hk/gia/general/201801/10/P2018011000392.htm","d":"2018-01-10"},{"t":"維基百科：香港軍營列表（百科輔助）","u":"https://zh.wikipedia.org/zh-hk/%E9%A6%99%E6%B8%AF%E8%BB%8D%E7%87%9F%E5%88%97%E8%A1%A8","d":"2026-09-20"},{"t":"維基百科：香港軍營列表（百科輔助）","u":"https://zh.wikipedia.org/zh-hk/%E9%A6%99%E6%B8%AF%E8%BB%8D%E7%87%9F%E5%88%97%E8%A1%A8","d":"2026-09-20"}]},"9-108":{"o":["北京","上海","廣州"],"x":"中國國際航空航天博覽會的舉辦地點是珠海，不是北京、上海或廣州。","w":"中國國際航空航天博覽會由中央人民政府批準，逢雙年舉辦。自 1996 年創辦以來，一直在廣東省珠海市定期舉辦，現已發展成為世界五大航展之一。","m":"中國航展定期在珠海舉辦。","v":1,"src":[{"t":"中國工信部裝備工業發展中心：珠海航展","u":"https://www.sastind.gov.cn/history/n152/n6760440/n6760441/c6841484/content.html","d":"2026-09-20"}]},"9-109":{"o":["波音公司","空中客車公司","洛克希德馬丁公司"],"x":"C919 不是波音、空客或洛克希德馬丁製造的，而是中國自主研發的。","w":"C919 大型客機由中國商用飛機公司研製，是中國首款按照國際通行適航標準自行研製、具有自主知識產權的噴氣式幹線客機。已開通內地至香港航線。","m":"C919 是中國商飛研製的國產大客機。","v":1,"src":[{"t":"中國文化研究院：C919 大型客機","u":"https://ls.chiculture.org.hk/tc/explore/0211","d":"2026-09-20"}]},"9-110":{"o":["造紙術","指南針","火藥"],"x":"造紙術、指南針、火藥是中國四大發明，不是針灸療法。","w":"中國四大發明是指造紙術、指南針、火藥和活字印刷術。針灸療法是中國傳統醫學的重要組成部分，屬於醫療技術而非發明之列。","m":"四大發明不包括針灸，針灸是醫學而非發明。","v":1,"src":[{"t":"香港教育局：明愛屯門馬登基金中學中一級中國歷史科課題漢代的科技發明","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/pshe/references-and-resources/chinese-history/Papermaking_Worksheet_Caritas_Tuen_Mun_Marden_Foundation_Secondary_School.pdf","d":"2026-09-20"},{"t":"中國新聞網：四大發明","u":"http://keywords.china.org.cn/2024-08/28/content_117392148.html","d":"2024-08-28"},{"t":"維基百科：中國四大發明（百科輔助）","u":"https://zh-yue.wikipedia.org/wiki/%E4%B8%AD%E5%9C%8B%E5%9B%9B%E5%A4%A7%E7%99%BC%E6%98%8E","d":"2026-09-20"}]},"9-111":{"o":["30 萬件","40 萬件","45 萬件"],"x":"故宮陶瓷器藏品不是 30 萬、40 萬或 45 萬件，而是 35 萬件。","w":"故宮博物院擁有約 35 萬件陶瓷器藏品，其總量居世界博物館之首。藏品覆蓋面極廣，貫穿整個中國陶瓷史，是中國古代藝術品的重要寶庫。","m":"故宮陶瓷器藏品有 35 萬件，世界之最。","v":1,"src":[{"t":"故宮博物院官方網站：陶瓷藏品","u":"https://www.dpm.org.cn/collection/ceramics.html","d":"2026-09-20"},{"t":"新華社新聞：香港故宮文化博物館展出逾百件明代陶瓷珍品","u":"http://www.news.cn/ci/20240710/ebc150a873164ca28af8848124ac3646/c.html","d":"2024-07-10"}]},"9-112":{"o":["冬天","秋天","夏天"],"x":"《清明上河圖》描繪的不是冬天、秋天或夏天，而是春天景象。","w":"一般認為北宋風俗畫《清明上河圖》描繪的是春天景象。畫中有大量柳樹且多未展新芽、有四十把雨傘暗示清明細雨、家家戶戶門上插柳枝，這些都是春天清明節的特徵。","m":"《清明上河圖》描繪的是春天清明時節的景象。","n":"學術界存在春景/秋景之爭，但主流學者認為為春景。","v":1,"src":[{"t":"教育局古代文物教學資源：清明上河圖","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/pshe/references-and-resources/chinese-history/ancient_artifacts/Chapter11.pdf","d":"2026-09-20"}]},"9-113":{"o":["黃庭堅","米芾","蔡襄"],"x":"黃庭堅、米芾、蔡襄是北宋四大書法家中的其他三位，不是題目要求的蘇軾。","w":"北宋四大書法家為蘇軾、黃庭堅、米芾、蔡襄，合稱「蘇黃米蔡」。蘇軾（蘇東坡）是北宋文豪，詩詞文賦及書法繪畫均成就極高，是文學藝術史上的全才。","m":"「蘇黃米蔡」中的蘇軾是北宋四大書法家之首。","v":1,"src":[{"t":"台灣文化部文化資產局：國家文化資產網（宋代四大書家行草特質之研究）","u":"https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Object&id=556054","d":"2026-09-20"},{"t":"維基百科：宋四家（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%AE%8B%E5%9B%9B%E5%AE%B6","d":"2026-09-20"},{"t":"維基百科：宋四家（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E5%AE%8B%E5%9B%9B%E5%AE%B6","d":"2026-09-20"}]},"9-114":{"o":["龍山文化","河姆渡文化","大汶口文化"],"x":"西安半坡人面魚紋彩陶盆不是龍山、河姆渡或大汶口文化的作品，而是仰韶文化。","w":"西安半坡出土的人面魚紋彩陶盆是我國新石器時代仰韶文化彩陶的傑出代表。1955 年出土於半坡遺址，為細泥紅陶，高 16.5 釐米，是仰韶彩陶工藝的代表作。","m":"半坡人面魚紋彩陶盆是仰韶文化的傑出代表。","v":1,"src":[{"t":"中國國家博物館：人面魚紋彩陶盆","u":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247218.shtml","d":"2026-09-20"}]},"9-115":{"o":["夏代","商代","東周"],"x":"毛公鼎不是夏代、商代或東周時期的作品，而是西周青銅器。","w":"毛公鼎屬於西周晚期青銅器，是西周宣王年間毛公為紀念宣王任命所鑄造。通高 53.8 釐米，內壁鑄有 32 行 499 字的銘文，是西周散文的代表作。","m":"毛公鼎是西周時期的重要青銅器。","v":1,"src":[{"t":"人民網藝術頻道：毛公鼎","u":"http://art.people.com.cn/n1/2016/0308/c206244-28180146.html","d":"2026-09-20"}]},"9-116":{"o":["秦代","三國時期","東漢"],"x":"長沙馬王堆 T 形畫不是秦代、三國或東漢時期的作品，而是西漢時期。","w":"長沙馬王堆 T 形畫是西漢時期的作品，1972 年出土於馬王堆一號漢墓。畫長 205 釐米，寬 92 釐米，上中下三部分分別描繪天界、人界、冥界，代表西漢時期的仙界與巫術思想。","m":"馬王堆 T 形畫是西漢時期的重要文物。","v":1,"src":[{"t":"湖南省博物館：馬王堆一號漢墓T形帛畫","u":"https://www.hnmuseum.com/zh-hans/zuixintuijie/%E9%A9%AC%E7%8E%8B%E5%A0%86%E4%B8%80%E5%8F%B7%E6%B1%89%E5%A2%93t%E5%BD%A2%E5%B8%9B%E7%94%BB","d":"2026-09-20"},{"t":"維基百科：馬王堆一號漢墓帛畫（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E9%A9%AC%E7%8E%8B%E5%A0%86%E4%B8%80%E5%8F%B7%E6%B1%89%E5%A2%93%E5%B8%9B%E7%94%BB","d":"2026-09-20"},{"t":"維基百科：馬王堆一號漢墓帛畫（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E9%A9%AC%E7%8E%8B%E5%A0%86%E4%B8%80%E5%8F%B7%E6%B1%89%E5%A2%93%E5%B8%9B%E7%94%BB","d":"2026-09-20"}]},"9-117":{"o":["曹霸","韓幹","周昉"],"x":"曹霸和韓幹是唐代以畫馬著稱的名家，周昉則以畫仕女著稱。","w":"唐代以畫馬著稱的名家是曹霸和韓幹。其中韓幹（約 706-783）成名於開元年間，是對後代影響最大的畫馬名家，被譽為畫馬大師。","m":"唐代畫馬名家主要是曹霸和韓幹。","n":"官方答案為張萱，但張萱以仕女畫著稱，唐代畫馬名家通常指曹霸、韓幹。","v":1,"src":[{"t":"故宮博物院：韓幹","u":"https://www.dpm.org.cn/lemmas/241526.html","d":"2026-09-20"},{"t":"維基百科：韓幹（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E9%9F%93%E5%B9%B9","d":"2026-09-20"},{"t":"維基百科：張萱（唐朝畫家）（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E8%90%B1_(%E5%94%90%E6%9C%9D%E7%95%AB%E5%AE%B6)","d":"2026-09-20"}]},"9-118":{"o":["高克恭","黃公望","王蒙"],"x":"高克恭、黃公望、王蒙是其他元代畫家，但沒有倪瓚的「不求形似，聊以自娛」的著名言論。","w":"倪瓚（1301-1374）是元代著名畫家，曾說：「僕之所謂畫者，不過逸筆草草，不求形似，聊以自娛耳」。倪瓚代表元代南方派山水畫，採用「不求形似」的寫意畫法。","m":"倪瓚以「不求形似，聊以自娛」的寫意畫風聞名。","v":1,"src":[{"t":"光明網：元畫的寫意","u":"https://epaper.gmw.cn/wzb/html/2018-02/03/nw.D110000wzb_20180203_3-06.htm","d":"2018-02-03"},{"t":"書法空間：元代倪瓚","u":"https://www.9610.com/nizan/hua14.htm","d":"2026-09-20"},{"t":"維基百科：倪瓚（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%80%AA%E7%93%92","d":"2026-09-20"}]},"9-119":{"o":["平遙","運城","太原"],"x":"永樂宮位於芮城，不是平遙、運城市區或太原。","w":"保存有大量元代壁畫的永樂宮位於山西芮城縣城北 3 公里的龍泉村。永樂宮現存壁畫面積超過 1000 平方米，以三清殿內的《朝元圖》最為著名，被譽為「東方藝術畫廊」。","m":"永樂宮是山西芮城的元代壁畫寶庫。","v":1,"src":[{"t":"新華社：山西芮城永樂宮壁畫","u":"https://www.chinanews.com.cn/cul/2026/09-15/10696820.shtml","d":"2026-09-15"}]},"9-120":{"o":["工筆畫法","水墨暈染","淡彩繪畫"],"x":"李公麟《五馬圖》採用的不是工筆、水墨暈染或淡彩繪畫，而是白描表現手法。","w":"李公麟《五馬圖》採用白描表現手法。白描是用細筆勾畫輪廓，略加烘染，不加過多色彩。李公麟以細緻、準確的線條描繪五馬神態，達到了白描畫法的高峰。","m":"李公麟《五馬圖》以白描手法著稱。","v":1,"src":[{"t":"典藏ARTouch：李公麟白描與五馬圖繪畫史","u":"https://artouch.com/artcobooks/content-193585.html","d":"2026-09-20"}]},"9-121":{"o":["王羲之《蘭亭序》","《曹全碑》","《禮器碑》"],"x":"這三項都是漢代或晉代的著名碑帖，但《曹全碑》和《禮器碑》屬於隸書碑帖但名氣較小，王羲之作品屬於行書，時代更晚。","w":"《張遷碑》立於公元186年，是東漢著名隸書碑帖。碑文以方筆為主，字體沉穩樸拙，雄厚蒼勁，堪稱漢代隸書的上品，為歷代書法家所器重，是臨摹隸書的經典範本。","m":"張遷碑是漢隸典範，方筆雄渾堪稱上品。","v":1,"src":[{"t":"光明網：為《張遷碑》歸個派","u":"https://wenyi.gmw.cn/2023-05/04/content_36537589.htm","d":"2023-05-04"},{"t":"書法藝術網：漢隸經典六碑","u":"https://m.sfrx.cn/html/2016/yshy_0601/592.html","d":"2026-09-20"},{"t":"維基百科（繁體）：張遷碑（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E9%A8%AB","d":"2026-09-20"}]},"9-122":{"o":["王維《送元二使安西》","顧愷之《魏晉人物故事》","謝赫《古畫品錄》"],"x":"王維是詩人而非畫論家，顧愷之和謝赫的理論與「外師造化，中得心源」的表述不符。","w":"張璪（一作張藻）是唐代著名畫家，最早提出「外師造化，中得心源」的理論。此言出自唐代張彥遠《歷代名畫記》的記載，強調藝術創作既要師法自然，也要融合藝術家的內心感悟。","m":"張璪唐代畫家，外師自然內得心源。","n":"張璪亦作張藻，確為唐代畫家（非其他朝代）。","v":1,"src":[{"t":"維基百科（繁體）：張璪（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B5%E7%92%AA_(%E5%94%90%E6%9C%9D)","d":"2026-09-20"},{"t":"光明網：外師造化 中得心源","u":"https://news.gmw.cn/2022-09/25/content_36046770.htm","d":"2026-09-20"}]},"9-123":{"o":["宋代《廣陵散》","唐代《高山流水》","五代《漁樵問答》"],"x":"《廣陵散》源於東漢故事，《高山流水》和《漁樵問答》成曲年代更晚或無明確出處。","w":"《陽關三疊》取材自王維《送元二使安西》，於隋唐時代被編成琴歌。曲譜現存最早版本收集於1491年龔經編釋的《浙音釋字琴譜》。官方答案「隋唐」指音樂成曲的時代。","m":"王維詩詞化琴歌，隋唐成曲明代譜。","n":"《陽關三疊》成曲於隋唐，但現存琴譜最早為明代1491年，官方答案「隋唐」指歌曲創作時代而非譜本時代。","v":1,"src":[{"t":"長雲樂集：樂曲介紹-陽關三疊／陽關曲／渭城曲","u":"https://blog.udn.com/gogo7637/11359517","d":"2026-09-20"},{"t":"維基百科（繁體）：陽關三疊（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E9%98%B3%E5%85%B3%E4%B8%89%E5%8F%A0","d":"2026-09-20"},{"t":"維基百科：陽關三疊（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E9%98%B3%E5%85%B3%E4%B8%89%E5%8F%A0","d":"2026-09-20"}]},"9-124":{"o":["晉代陸機《文賦》","宋代《詩集傳》","元代周密《唱論》"],"x":"這些文獻都不是宋詞歌譜，無法與現存最早的宋詞歌譜相提並論。","w":"《白石道人歌曲》是南宋姜夔所編的歌詞集，現存宋代唯一有樂譜的詞集。其中十七首詞配有自注工尺旁譜，是研究宋代詞樂的珍貴資料，也是最早現存的宋詞歌譜。","m":"姜夔白石歌曲，現存唯一宋詞譜。","v":1,"src":[{"t":"中國國家博物館：《白石道人歌曲》","u":"https://www.chnmuseum.cn/zp/zpml/gjwxbt/202203/t20220301_254048.shtml","d":"2022-03-01"},{"t":"人民網：布衣詞人姜夔和他的《續書譜》","u":"http://yn.people.com.cn/BIG5/n2/2021/1126/c372453-35023399.html","d":"2021-11-26"},{"t":"維基百科（繁體）：白石道人歌曲（百科輔助）","u":"https://zh.wikipedia.org/wiki/%E7%99%BD%E7%9F%B3%E9%81%93%E4%BA%BA%E6%AD%8C%E6%9B%B2","d":"2026-09-20"}]},"9-125":{"o":["硯","筆","紙"],"x":"硯、筆、紙都是文房四寶之一，而顏料不是傳統文房四寶。","w":"文房四寶是指筆、墨、紙、硯。顏料不屬於文房四寶。文房四寶之名起源於南北朝時期，自宋朝以來特指湖筆、徽墨、宣紙、端硯。","m":"文房四寶是筆墨紙硯，顏料並非其中之一。","v":1,"src":[{"t":"中國文化研究院：文房四寶是哪四寶？","u":"https://chiculture.org.hk/index.php/tc/china-five-thousand-years/1289","d":"2026-09-20"}]},"9-126":{"o":["歐陽詢","褚遂良","顏真卿"],"x":"歐陽詢、褚遂良、顏真卿都是著名書法家，但並非被尊稱為「書聖」。","w":"王羲之（303年—361年），字逸少，東晉書法家，被後人尊稱為「書聖」。其書法變當時流行的章草、八分為今草、行書、楷書，是書體轉換時期的高峰。其代表作《蘭亭序》被譽為天下第一行書。","m":"王羲之東晉書聖，蘭亭序傳世。","v":1,"src":[{"t":"中國文化研究院：書聖王羲之","u":"https://chiculture.org.hk/tc/china-five-thousand-years/3063","d":"2026-09-20"}]},"9-127":{"o":["《八駿圖》","《馬陰連雨》","《雄鷹展翅》"],"x":"這些都是徐悲鴻的作品，但並非《愚公移山》，也不是以民族團結對抗日本侵略為主題。","w":"徐悲鴻於1940年創作《愚公移山》，一幅為紙本設色國畫（完成於大吉嶺），一幅為布面油畫（完成於印度國際大學）。該畫取材於中華民族古老寓言，表現中國人民堅韌不拔的精神，創作於抗日戰爭最艱難時期，象徵中華民族終將戰勝日本侵略者。","m":"愚公移山寓言，象徵民族團結抗日。","v":1,"src":[{"t":"北京市文物局：徐悲鸿画作《愚公移山》的保护历程","u":"https://wwj.beijing.gov.cn/bjww/362760/362770/620812/index.html","d":"2026-09-20"}]},"9-128":{"o":["齊白石","潘天壽","李可染"],"x":"齊白石擅長花卉蟲草，潘天壽和李可染都是山水畫大家，但都不是最著名的潑墨畫家。","w":"張大千（1899年—1983年）是中國現代最著名的潑墨畫家。他在57歲時自創潑彩畫法，承唐代王洽潑墨畫法基礎，揉入西歐繪畫色光關係，發展出富有現代感的潑墨潑彩畫風，被譽為「東方之筆」。","m":"張大千潑墨大師，西方色彩融入東方筆。","v":1,"src":[{"t":"非池中藝術網：認識張大千","u":"https://artemperor.tw/focus/1933","d":"2026-09-20"}]},"9-129":{"o":[],"x":"","w":"「國畫四君子」是指梅、蘭、竹、菊四種植物。此概念在明代形成，其中梅代表高潔，蘭代表幽遠，竹代表貞節，菊代表淡泊，各象徵品德中不同的美德，是中國傳統書畫中最受推崇的題材。","m":"梅蘭竹菊四君子，品德象徵代代傳。","v":1,"src":[{"t":"典藏ARTouch：集合啦！梅竹蘭菊：中國書畫中「四君子」概念的形成","u":"https://artouch.com/gumeishu/gumeishu_report/content-182489.html","d":"2026-09-20"},{"t":"維基百科（香港繁體）：四君子（百科輔助）","u":"https://zh-yue.wikipedia.org/wiki/%E5%9B%9B%E5%90%9B%E5%AD%90","d":"2026-09-20"},{"t":"維基百科：花中四君子（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E8%8A%B1%E4%B8%AD%E5%9B%9B%E5%90%9B%E5%AD%90","d":"2026-09-20"}]},"9-130":{"o":[],"x":"","w":"花鳥畫是以花卉、鳥類、動物、植物、昆蟲等自然界中各種生物為題材的一種繪畫形式。雖然名稱叫「花鳥畫」，但涵蓋內容相當廣泛，包括花、鳥、細小植物、昆蟲以至水中生物，是中國傳統三大畫科之一。","m":"花鳥畫涵蓋動植昆蟲，自然之美盡入畫。","v":1,"src":[{"t":"台北故宮：筆歌墨舞—故宮繪畫導賞II（花鳥畫）","u":"https://theme.npm.edu.tw/PaintingsinNPM11206/page_3","d":"2026-09-20"},{"t":"維基百科（繁體）：花鳥畫（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E8%8A%B1%E9%B8%9F%E7%94%BB","d":"2026-09-20"},{"t":"維基百科：花鳥畫（百科輔助）","u":"https://zh.wikipedia.org/zh-hant/%E8%8A%B1%E9%B8%9F%E7%94%BB","d":"2026-09-20"}]},"9-131":{"o":["打通通往西域的商路","建立漢代駐西域官吏","尋找烏孫等小國支持"],"x":"打通商路是後來的結果，建立駐官吏是更後來的事，尋找烏孫支持並非主要目的。","w":"漢武帝派張騫出使西域的主要目的是聯合大月氏，共同對抗匈奴。大月氏曾被匈奴擊敗西遷，漢武帝希望與其結盟，形成南北夾擊之勢以削弱匈奴勢力。雖然張騫未能成功聯合大月氏，但其使命開啟了絲綢之路的序幕。","m":"張騫西域使命，聯月反匈為首要。","v":1,"src":[{"t":"新華社：一帶一路·中國故事｜張騫故里的光榮與夢想","u":"https://www.news.cn/local/2023-10/08/c_1129904539.htm","d":"2023-10-08"},{"t":"牛頓百科：張騫出使西域","u":"https://www.newton.com.tw/wiki/%E5%BC%B5%E9%A8%AB%E9%80%9A%E8%A5%BF%E5%9F%9F","d":"2026-09-20"},{"t":"維基百科（繁體）：張騫（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%BC%B9%E9%A8%AB","d":"2026-09-20"}]},"9-132":{"o":["盛裝食物用於日常膳食","盛放寶物用於王室收藏","烹飪食物用於宴飲招待"],"x":"後母戊鼎主要用途是祭祀，而非儲存食物、保存寶物或烹飪食物。","w":"後母戊鼎是商朝後期王室祭祀用的青銅方鼎，鼎腹內壁著有銘文「後母戊」。此鼎重達832.84公斤，是目前最重的單體青銅禮器。青銅鼎在商代已發展為祭祀天帝和祖先的「神器」，用以祭天祀祖，緬懷先祖功德。","m":"後母戊鼎商代祭器，祭祀天地與祖先。","v":1,"src":[{"t":"中國國家博物館：「后母戊」青銅方鼎","u":"https://www.chnmuseum.cn/zp/zpml/kgfjp/202008/t20200824_247255.shtml","d":"2020-08-24"},{"t":"中國社會科學院：「道中華」後母戊大方鼎","u":"https://www.neac.gov.cn/seac/c103391/202307/1166479.shtml","d":"2023-07-19"},{"t":"維基百科（簡體）：後母戊鼎（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E5%90%8E%E6%AF%8D%E6%88%8A%E9%BC%8E","d":"2026-09-20"}]},"9-133":{"o":["北晉","南宋","南梁"],"x":"北晉不存在，南宋和南梁都是南方政權但建立者和時代不同。","w":"西晉滅亡後，司馬睿在王導等士族支持下，於公元317年在南方建康稱晉王，隔年（公元318年）正式稱帝，建立東晉。東晉是南方的晉朝政權，與北方被羯族等少數民族統治的五胡十六國形成對立。","m":"司馬睿南方建東晉，河山分裂五胡亂。","v":1,"src":[{"t":"人民網：東晉開國皇帝司馬睿曾成功越獄","u":"http://fj.people.com.cn/BIG5/n2/2016/0425/c337010-28212851.html","d":"2016-04-25"},{"t":"人民網：東晉為何到處是貪官","u":"http://culture.people.com.cn/BIG5/n/2015/0805/c22219-27415293.html","d":"2015-08-05"},{"t":"維基百科（香港繁體）：司馬睿（百科輔助）","u":"https://zh-yue.wikipedia.org/wiki/%E5%8F%B8%E9%A6%AC%E7%9D%BF","d":"2026-09-20"}]},"9-134":{"o":["于敏中","盧見曾","陸錫熊"],"x":"于敏中是總裁之一，盧見曾是總裁之一，陸錫熊是總纂官之一，都不是主持編纂者。","w":"紀昀（1724年—1805年），字曉嵐，是乾隆時期著名學者。乾隆時期編纂《四庫全書》時，紀昀擔任總纂官（首席編輯），與陸錫熊等合作完成了《四庫全書》及《四庫全書總目》的編纂。官方答案「紀曉嵐」是其別稱。","m":"紀昀曉嵐總纂官，四庫全書編成典。","n":"嚴格而言，《四庫全書》總裁為于敏中等人，紀昀身為總纂官主持具體編纂工作。官方答案「紀曉嵐」是其常用別稱。","v":1,"src":[{"t":"維基百科（繁體）：紀昀（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E7%B4%80%E6%98%80","d":"2026-09-20"},{"t":"故宮博物院：紀曉嵐與《四庫全書》","u":"https://www.dpm.org.cn/studytwo_detail/100227.html","d":"2026-09-20"}]},"9-135":{"o":["徵收農民稅賦以支撑國防","登記農民身份以便於徵兵","追蹤農民流動以防止逃亡"],"x":"徵收稅賦和徵兵是編戶制度的目的之一，但不是最主要的；追蹤流動是方法但不是主要目的。","w":"漢代編戶制度是對民眾按戶進行紀錄和管理的制度，實施的主要目的是為了加強國家對農民的控制和剝削。透過嚴密的戶籍制度，政府可以準確掌握人民的住所、姓名、年齡、財產等信息，便於徵收賦稅和徵募勞役，同時限制人口流動。豪強地主藉著土地私有制，透過分租方式，實際上剝削農民達50%的地租。","m":"編戶制度國家控制，農民沉重賦稅與勞役。","v":1,"src":[{"t":"中國文化研究院：中國古代田制與賦役","u":"https://chiculture.org.hk/tc/china-five-thousand-years/4071","d":"2026-09-20"}]},"9-136":{"o":["夏","周","秦"],"x":"夏朝無出土文字證實，周朝文字出現於商之後，秦朝是商之後的王朝。","w":"商朝出土的甲骨文是目前已發現中國最早的成系統文字符號，在殷墟遺址發現，是第一個有文字同時期直接證實的王朝。","m":"甲骨文在商朝—殷墟出土，商是文字王朝。","n":"夏朝有文獻記載但無出土文字證實；商朝以前無文字出土。","v":1,"src":[{"t":"中華人民共和國國防部：桂陵之戰","u":"http://www.mod.gov.cn/gfbw/gfjy_index/js_214151/4925037.html","d":"2026-09-20"}]},"9-137":{"o":["《國歌》","《中華人民共和國進行曲》","《天安門進行曲》"],"x":"《國歌》太籠統，《中華人民共和國進行曲》和《天安門進行曲》都不是正式國歌名稱。","w":"1949年中華人民共和國成立時採納《義勇軍進行曲》作為國歌，由田漢作詞、聶耳作曲，歌詞於2004年正式寫入憲法。","m":"義勇軍進行曲—祖國國歌，聶耳譜寫。","v":1,"src":[{"t":"中華人民共和國駐捷克大使館：中華人民共和國國歌","u":"https://cz.china-embassy.gov.cn/zts/zggk/200405/t20040531_3029617.htm","d":"2026-09-20"}]},"9-138":{"o":["良渚人","馬家浜人","黃河流域人"],"x":"良渚和馬家浜文化雖在長江流域但時間較晚，黃河流域主要是粟而非水稻。","w":"河姆渡人距今約7000年，是長江流域原始農耕代表，開創稻作農業，住干欄式木結構房屋以適應暖熱潮濕環境。","m":"河姆渡—水稻+干欄—長江文明搖籃。","v":1,"src":[{"t":"湖北省長江文化研究院：長江流域文化發展沿革","u":"https://yrcri.ac.cn/detail_168.html","d":"2026-09-20"}]},"9-139":{"o":["神舟一號","神舟三號","神舟四號"],"x":"神舟一號和三號、四號都是無人飛船，只有神舟五號是第一艘載人飛船。","w":"2003年10月15日，神舟五號載人飛船成功發射，航天員楊利偉成為中國第一位進入太空的人，標誌中國成為世界第三個掌握載人航天技術的國家。","m":"神舟五號2003年—楊利偉—中國飛天夢圓。","n":"嚴格說是「神舟五號」（2003年楊利偉），題目官方答案「神舟號」為簡稱。","v":1,"src":[{"t":"中國日報網：【黨史聲音日曆】中國第一艘載人飛船神舟五號成功發射","u":"https://china.chinadaily.com.cn/a/202110/15/WS61696ceaa3107be4979f2dd9.html","d":"2026-09-20"}]},"9-140":{"o":["貿易","農業灌溉","居住"],"x":"長城不是用於貿易或灌溉，更不是居住地，其核心功能是軍事防禦。","w":"長城的主要功能是防禦敵人進攻，保護中原地區免受遊牧民族侵擾。以城牆為主體，配合隘口、軍堡、烽火台等多種防禦設施，形成完整防禦體系。","m":"長城防禦—北方邊患—千里屏障。","v":1,"src":[{"t":"中國網：長城","u":"http://keywords.china.org.cn/2024-08/28/content_117376894.html","d":"2026-09-20"}]},"9-141":{"o":["漢、魏、晉","齊、蜀、吳","燕、魏、吳"],"x":"《三國演義》敘述的是三國時期（220-280年），三國是魏蜀吳，不是漢晉或其他組合。","w":"《三國演義》記述魏、蜀、吳三國時期的政治軍事鬥爭。魏由曹操之子曹丕建立（220年），蜀由劉備建立（221年），吳由孫權建立（229年）。","m":"三國演義—魏蕭何敗—曹劉孫三國鼎立。","v":1,"src":[{"t":"三國文史三國演義電子辭典：為什麼以「魏、蜀、吳」稱三國？","u":"https://cne3online.com/culture/view/12334176/123457458012025.shtml","d":"2026-09-20"}]},"9-142":{"o":["杭州","南京","西安"],"x":"杭州稱「西湖之城」，南京稱「六朝古都」，西安稱「古都」，都不是「世界園藝之都」。","w":"昆明於1999年舉辦世界園藝博覽會，是世界上首個完整保留的世園會會址，因此被譽為「世界春城花都」；官方答案「世界園藝之都」為引申說法。","m":"昆明春城—1999世園會—花都美譽。","n":"昆明正式稱號為「世界春城花都」而非「世界園藝之都」，但因1999世園會留下世界園藝博覽園，故題目簡稱可通融。","v":1,"src":[{"t":"昆明市人民政府門戶網站：世界春城花都","u":"https://www.km.gov.cn/zjkm/cspp/sjcchd/index_10.shtml","d":"2026-09-20"}]},"9-143":{"o":["新政變法","甲午變法","庚子新政"],"x":"新政變法是光緒十年，甲午變法未曾發生，庚子新政在戊戌變法後，只有戊戌變法又稱百日維新。","w":"戊戌變法於1898年6月11日（光緒二十四年）開始，持續103天，是光緒帝在康有為、梁啟超等人協助下的資產階級改良運動，推行學習西方、改革政治教育制度，發展工商業等改革。","m":"戊戌百日維新—1898年—光緒帝夢碎。","v":1,"src":[{"t":"澎湃新聞：戊戌變法為何又稱百日維新？","u":"https://www.thepaper.cn/newsDetail_forward_15423424","d":"2026-09-20"}]},"9-144":{"o":["內閣","樞密院","尚書省"],"x":"內閣成立於明代，樞密院是宋代機構，尚書省是隋唐官制，都不是雍正設立的「大顧問班子」。","w":"軍機處成立於雍正七年（1729年），由滿漢親信大臣組成，如怡親王胤祥、張廷玉等，被西方人意譯為「大顧問班子」，是清代最重要的權力機構。","m":"軍機處雍正設—滿漢親信聚—皇帝乾綱獨斷。","v":1,"src":[{"t":"故宮博物院：帝國中樞——話說清代軍機處","u":"https://www.dpm.org.cn/court/system/236360.html","d":"2026-09-20"}]},"9-145":{"o":["龐涓","齊威王","田忌"],"x":"龐涓是魏國將領遭敗，齊威王是國君非出謀者，田忌是執行者，只有孫臏是戰術的提出者。","w":"孫臏向齊威王獻策，以圍攻魏都大梁之法迫使魏軍撤離對趙國都城邯鄲的圍困，再在桂陵設伏打敗魏軍，創造了避實擊虛、聲東擊西的「圍魏救趙」戰法。","m":"圍魏救趙孫臏出—聲東擊西古法寶。","v":1,"src":[{"t":"中國軍網：第二計：圍魏救趙","u":"http://www.81.cn/gfbmap/content/2018-01/11/content_196685.htm","d":"2026-09-20"}]},"9-146":{"o":["楚懷王","趙王","燕太子丹"],"x":"楚懷王和趙王都被荊軻計劃刺殺過但無此事蹟，燕太子丹雖出謀但被刺者是秦王，只有秦王嬴政是圖窮匕見的真正受害人。","w":"公元前227年，荊軻受燕太子丹指派，攜帶督亢地圖和樊於期人頭前往秦國刺殺秦王嬴政，發圖時匕首現露，荊軻行刺未遂身亡。","m":"圖窮匕見荊軻刺—秦王嬴政險喪命。","n":"歷史上荊軻行刺時嬴政尚為秦王，「始皇帝」是統一六國後才創定的尊號。","v":1,"src":[{"t":"臺灣教育部《國語辭典》成語典故：圖窮匕見","u":"https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=806&webMd=2&la=1","d":"2026-09-20"},{"t":"故事StoryStudio：重寫荊軻中國史上最著名的刺客","u":"https://storystudio.tw/article/gushi/story-of-jing-ke","d":"2026-09-20"}]},"9-147":{"o":["淮陰侯","大將軍","丞相"],"x":"淮陰侯是韓信的封號但題目問的是人物，大將軍和丞相都是官位不是人名，只有韓信是歷史人物。","w":"「成也蕭何，敗也蕭何」典故指韓信的成敗都與蕭何有關：蕭何舉薦韓信助劉邦成功，後又由蕭何設計將韓信誘入宮中被呂后處死。","m":"韓信成敗蕭何手—伯樂變阿諛終悲劇。","v":1,"src":[{"t":"汉典：成也萧何，败也萧何的解释","u":"http://zdic.net/hans/%E6%88%90%E4%B9%9F%E8%90%A7%E4%BD%95%EF%BC%8C%E8%B4%A5%E4%B9%9F%E8%90%A7%E4%BD%95","d":"2026-09-20"}]},"9-148":{"o":["司馬遷","賈誼","黃老學派"],"x":"司馬遷是歷史學家非哲學家，賈誼主張法家改革，黃老學派是思想流派非人物名。","w":"董仲舒於元光元年（公元前134年）獻策漢武帝，主張「罷黜百家，獨尊儒術」，將儒家列為統治思想，獲漢武帝採納，從而改變了中國思想界的格局。","m":"董仲舒勸漢武帝—獨尊儒術國策定。","v":1,"src":[{"t":"中國社會科學院：漢武帝時期的『儒學』與『儒術』","u":"https://www.cass.cn/xueshuchengguo/xscg_lsyjy/202203/t20220329_5401015.shtml","d":"2026-09-20"}]},"9-149":{"o":["班固","班勇","馬援"],"x":"班固是班超的哥哥為史學家，班勇是班超之子，馬援是同代將領，只有班超本人投筆從戎。","w":"班超原為書吏，因繁忙的筆墨工作感到厭倦，棄文從武，後隨軍遠赴西域，平定50多個國家，被封定遠侯，成為開拓絲綢之路的重要人物。","m":"班超投筆從戎西域行—古人棄文從武的典範。","v":1,"src":[{"t":"卓悅雲教資：班超投筆從戎","u":"https://market.cloud.edu.tw/resources/web/1658903","d":"2026-09-20"}]},"9-150":{"o":["周瑜","魯肅","龐統"],"x":"周瑜提出借箭難題，龐統是軍師，魯肅是借船人，都不是被借箭的將領，只有曹操是敵方統帥。","w":"《三國演義》第46回記述諸葛亮向曹操軍營「借箭」的故事：諸葛亮令人用草靶子佈置於船上，藉霧天逼近曹營，令曹操誤認為進攻而射出大量箭矢，箭皆射中草靶子。","m":"草船借箭諸葛妙計—向曹操借箭成經典。","n":"《三國志》正史中此事為孫權所為，發生於赤壁之戰後的濡須之戰，非赤壁之戰期間；《三國演義》以虛構藝術轉嫁予諸葛亮。","v":1,"src":[{"t":"三國文史三國演義電子辭典：『草船借箭』是借來的故事","u":"https://www.cne3online.com/culture/view/12726432/127500564015056.shtml","d":"2026-09-20"}]},"9-151":{"o":["劉琨","范滂","蘇武"],"x":"劉琨雖然是聞雞起舞故事中的另一主角，但題目明確要求『講述的是哪位歷史人物』，祖逖才是主要人物；范滂和蘇武是其他歷史人物，與此故事無關。","w":"祖逖與劉琨是志同道合的好友，同床共寢。聽到雞鳴後起身練武，準備建功立業、報效國家。祖逖後來成為東晉北伐將領，一度收復黃河以南大片土地。","m":"祖逖聞雞起舞，立志北伐建功業。","v":1,"src":[{"t":"祖逖 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E7%A5%96%E9%80%96","d":"2026-09-20"},{"t":"魏晉風雲之聞雞起舞 - TNL 關鍵評論網","u":"https://www.thenewslens.com/article/169593","d":"2026-09-20"}]},"9-152":{"o":["長江流域","黃河支流","華南地區"],"x":"五代是指後梁、後唐、後晉、後漢、後周，都位於黃河流域的中原地區；長江流域、華南等地是十國的範圍，而非五代。","w":"五代十國時期，『五代』是指唐末到北宋期間依次更替統治中原地區的五個政權，全部位於黃河流域的華北和中原地區。而『十國』則分佈在長江流域等其他地區。","m":"五代在黃河，十國在四方。","v":1,"src":[{"t":"中國時報：揭密「五代十國」到底是哪五代與十國","u":"https://www.chinatimes.com/hottopic/20160624002249-260812","d":"2016-06-24"},{"t":"五代十國 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E4%BA%94%E4%BB%A3%E5%8D%81%E5%9B%BD","d":"2026-09-20"},{"t":"英文維基百科：Five Dynasties and Ten Kingdoms period（百科輔助）","u":"https://en.wikipedia.org/wiki/Five_Dynasties_and_Ten_Kingdoms_period","d":"2026-09-20"}]},"9-153":{"o":["西夏","吐蕃","女真"],"x":"澶淵之盟是宋朝與遼（契丹）簽訂的；西夏、吐蕃、女真都是其他民族政權，與澶淵之盟無關。","w":"澶淵之盟簽訂於宋真宗景德元年（1004年），是北宋與遼（契丹建立的政權）達成的和平協議。雙方約定以白溝河為邊界，宋每年向遼送銀二十萬兩、絹二十萬匹作為歲幣。","m":"澶淵之盟宋遼約，歲幣換和平百年久。","v":1,"src":[{"t":"澀谷的日本網誌：澶淵の盟","u":"https://www.y-history.net/appendix/wh0303-015.html","d":"2026-09-20"},{"t":"論文數據庫：澶渊之盟对宋辽的影响探析","u":"https://www.hanspub.org/journal/paperinformation?paperid=69618","d":"2026-09-20"},{"t":"澶淵の盟 - 高等学校世界史B/契丹と宋と周辺地域（百科輔助）","u":"https://ja.wikibooks.org/wiki/%E9%AB%98%E7%AD%89%E5%AD%A6%E6%A0%A1%E4%B8%96%E7%95%8C%E5%8F%B2B/%E5%A5%91%E4%B8%B9%E3%81%A8%E5%AE%8B%E3%81%A8%E5%91%A8%E8%BE%BA%E5%9C%B0%E5%9F%9F","d":"2026-09-20"}]},"9-154":{"o":["王安石變法","張居正改革","熙寧變法"],"x":"王安石變法和熙寧變法是北宋後期的改革；張居正改革是明朝的改革；都不是范仲淹推行的慶曆新政。","w":"範仲淹於宋仁宗慶曆三年（1043年）推行慶曆新政，提出十項改革措施，包括明確升遷晉升制度、打擊營私舞弊、淨化科舉制度、選拔能幹地方官員等，以解決北宋『積貧積弱』的問題。","m":"慶曆新政范仲淹，十項舉措改積弱。","v":1,"src":[{"t":"中國社會科學院：范仲淹的吏治改革思想","u":"https://www.cssn.cn/mkszy/mkszy_zdtj/202405/t20240507_5749579.shtml","d":"2024-05-07"},{"t":"澎湃新聞：公元1043年：庆历新政为何失败","u":"https://www.thepaper.cn/newsDetail_forward_29732230","d":"2026-09-20"},{"t":"慶曆新政 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/wiki/%E6%85%B6%E6%9B%86%E6%96%B0%E6%94%BF","d":"2026-09-20"}]},"9-155":{"o":["推算歲差變化","計算星辰亮度","測量地球自轉"],"x":"歲差變化是天體測量學課題；星辰亮度需要其他方法測量；地球自轉與二十八宿無關。二十八宿是用作觀測日月五星的座標系統。","w":"古代天文學中，二十八宿是中國古代天文學家為觀測日、月及金木水火土五星（五大行星）運行軌跡而劃分的二十八個星區。每顆恆星作為距星，月亮大約每天移動一宿，形成了用來記錄和觀測天體位置的座標系統。","m":"二十八宿是天文座標，用來看月五星的軌跡。","v":1,"src":[{"t":"中國科學院天文學數據庫：二十八宿的形成与演变","u":"https://www.lamost.org/~yzhao/history/xiu28.html","d":"2026-09-20"},{"t":"新華社科技：季秋「大火」隱 重陽節來觀賞古代「時令之星」","u":"http://www.news.cn/tech/2023-10/21/c_1129929244.htm","d":"2023-10-21"},{"t":"二十八宿 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E4%BA%8C%E5%8D%81%E5%85%AB%E5%AE%BF","d":"2026-09-20"}]},"9-156":{"o":["地球自轉一圈的時間","月球公轉週期","星辰周年視差"],"x":"地球自轉是指一天的時間，非歲實；月球公轉週期約29.5天；周年視差是用來測距的方法。歲實指的是地球繞太陽一圈的時間。","w":"古人通過測量冬至日正午的影長並取平均值，得出回歸年的日數，即『歲實』。這就是地球繞太陽公轉一週所需的時間，古代測得約為365.25日，與現代精確值365.2422日相差只有11分鐘。","m":"歲實就是公轉週期，一年繞太陽一圈。","v":1,"src":[{"t":"臺南市南瀛天文館 - 歲實與朔策之干支紀年法","u":"https://taea.tn.edu.tw/astro_news/book_detail/dc10307c-41c4-11eb-8a52-704bd17d4d1f","d":"2026-09-20"}]},"9-157":{"o":["每月十五日，月球滿圓","每月初八，月球半圓","每月晦日，月球消失"],"x":"十五日是望月（滿月）；初八是上弦月；晦日（月底）時月球完全看不見但定義不同於朔。朔特指初一，月球運行到太陽和地球之間。","w":"古代曆法中，『朔』是指每月初一，此時月球運行到太陽和地球之間，月球背日的一面正對地球，地球上肉眼看不到月光的月相。朔日作為每月之始，是傳統農曆月份的第一天。","m":"朔是初一，月球在太陽和地球之間，看不見。","v":1,"src":[{"t":"人民網：為何未來5年都沒「年三十」？天文專家這樣解釋","u":"http://sh.people.com.cn/BIG5/n2/2024/0111/c350122-40710819.html","d":"2024-01-11"},{"t":"正朔 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E6%AD%A3%E6%9C%94","d":"2026-09-20"},{"t":"維基百科：新月（朔）（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E6%96%B0%E6%9C%88","d":"2026-09-20"}]},"9-158":{"o":["12年","120年","360年"],"x":"12年是十二支的週期；120年是干支組合的最大公倍數（十干10×十二支12的乘積），但實際可用組合只有60種；360年無天文依據。","w":"干支由十干（甲乙丙丁戊己庚辛壬癸）和十二支（子丑寅卯辰巳午未申酉戌亥）組成。十干共10個，十二支共12個，兩者的最小公倍數是60，所以干支紀年的循環週期為60年。60歲時稱為『還暦』。","m":"十干十二支最小公倍，六十年為一循環。","v":1,"src":[{"t":"干支について知っておきたい豆知識 - パプリ by ASKUL","u":"https://spc.askul.co.jp/naire/calendar/column/2","d":"2026-09-20"}]},"9-159":{"o":["孟子","莊子","老子"],"x":"孟子主張『仁政』；莊子倡導『逍遙』；老子講『無為』。都不是『兼愛』思想的提出者。","w":"墨子是先秦墨家學派的創始人，『兼愛』是他思想的核心。兼愛指無差別地愛所有人，即人人相愛、相互利利，認為這樣才能實現天下太平。與儒家以血緣親疏為基礎的『仁愛』不同。","m":"墨子兼愛，人人相愛天下平。","v":1,"src":[{"t":"中國哲學書電子化計劃：墨子 卷四 兼愛上","u":"https://ctext.org/mozi/universal-love-i/zh","d":"2026-09-20"},{"t":"兼愛 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%85%BC%E7%88%B1","d":"2026-09-20"},{"t":"維基百科：兼愛（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%85%BC%E7%88%B1","d":"2026-09-20"}]},"9-160":{"o":["李白","杜牧","白居易"],"x":"『海上生明月，天涯共此時』出自張九齡的『望月懷遠』；李白、杜牧、白居易都各有名詩但不是此詩作者。","w":"唐代詩人張九齡創作了『望月懷遠』一詩，開頭兩句為『海上生明月，天涯共此時』，後兩句為『情人怨遙夜，竟夕起相思』。詩人以月作為牽掛，表達對遠方親友的思念之情。","m":"張九齡望月懷遠，明月寄託思鄉願。","v":1,"src":[{"t":"望月懷遠 - 古詩文寶庫","u":"https://www.treasurebowl.ches.tp.edu.tw/100plan/ches-poetry/poem416.html","d":"2026-09-20"}]},"9-161":{"o":["杜甫","蘇軾","辛棄疾"],"x":"『天生我材必有用，千金散盡還復來』出自李白的『將進酒』；杜甫以寫實著稱；蘇軾和辛棄疾是宋代詩人，都不是此詩作者。","w":"唐代大詩人李白創作『將進酒』，其中名句『天生我材必有用，千金散盡還復來』寄寓了每個人都有才能、必有用處的人生哲理。李白在失意時依然保持樂觀，深信自己滿腹才華，終能重用。","m":"李白將進酒，天生我材必有用。","v":1,"src":[{"t":"\"天生我材必有用，千金散盡還復來。\"全詩賞析 - 讀古詩詞網","u":"https://fanti.dugushici.com/mingju/13096","d":"2026-09-20"}]},"9-162":{"o":["天柱山","衡山","泰山"],"x":"『採菊東籬下，悠然見南山』中的南山最有可能是廬山。天柱山、衡山、泰山雖然也被稱為南山，但根據陶淵明的居住地和歷史記載，廬山最為合理。","w":"陶淵明是潯陽柴桑人（今江西九江），歸隱時住在故里。潯陽城南有一座著名的廬山，當地人稱城南之山為『南山』。陶淵明的詩『去去欲何之，南山有舊宅』明寫南山就是家宅所在，因此『南山』應指廬山。","m":"陶淵明南山廬山，潯陽城南古今傳。","v":1,"src":[{"t":"河山行│陶淵明筆下「悠然見南山」之秘景 - 點讀","u":"https://www.readformore.com/%E7%94%9F%E6%B4%BB%EF%BC%8E%E6%97%A5%E5%B8%B8/%E6%B2%B3%E5%B1%B1%E8%A1%8C%EF%BD%9C%E4%B8%80%E8%B5%B7%E6%8E%A2%E7%B4%A2%E9%99%B6%E6%B7%B5%E6%98%8E%E7%AD%86%E4%B8%8B%E3%80%8C%E5%BF%89%E9%80%A2%E6%A1%83%E8%8A%B1%E6%9E%97%E3%80%8D%E3%80%81%E3%80%8C%E6%82%A0%E7%84%B6%E8%A6%8B%E5%8D%97%E5%B1%B1%E3%80%8D%E4%B9%8B%E7%A7%98%E6%99%AF-7109","d":"2026-09-20"}]},"9-163":{"o":["舞蹈名稱","詩詞名稱","繪畫類型"],"x":"後庭花是南朝陳後主創作的樂曲（歌曲），不是舞蹈、詩詞或繪畫。","w":"『後庭花』出自杜牧『泊秦淮』詩中的名句『商女不知亡國恨，隔江猶唱後庭花』。『後庭花』原是南朝陳後主陳叔寶作的樂曲『玉樹後庭花』，因陳朝滅亡時此曲流行宮廷，後世將其視為『亡國之音』的象徵。","m":"後庭花是南朝陳歌曲，亡國之音代稱，杜牧詩諷刺。","v":1,"src":[{"t":"後庭花 - 漢典","u":"https://zdic.net/hant/%E5%BE%8C%E5%BA%AD%E8%8A%B1","d":"2026-09-20"}]},"9-164":{"o":["行軍中","班師回朝","駐紮營地"],"x":"涼州詞描寫的是出征前的餞宴場面；行軍中通常沒有這樣的盛宴；班師回朝是戰爭結束；駐紮營地沒有這樣的盛大酒筵。","w":"王翰的『涼州詞』開篇『葡萄美酒夜光杯，欲飲琵琶馬上催』描寫出征前的痛飲場景。美酒和夜光杯準備好，正要舉杯時，琵琶聲催促出發。這是出征前的餞別宴會，表現戰士們義無反顧、視死如歸的精神。","m":"涼州詞出征前，美酒琵琶催上馬。","n":"部分文獻提及此詩也可指『軍中宴飲』場景，但『琵琶馬上催』更直接暗示『出征前』的騎馬出發情景。","v":1,"src":[{"t":"涼州詞二首·其一 - 讀古詩詞網","u":"https://fanti.dugushici.com/ancient_proses/70235","d":"2026-09-20"}]},"9-165":{"o":["冬季","春季","夏季"],"x":"『月落烏啼霜滿天』中『霜』字明確指向冬季或深秋；春季通常無霜；夏季更不可能出現霜。","w":"張繼的『楓橋夜泊』第一句『月落烏啼霜滿天』明確描寫秋季夜晚景象。詩中『江楓』『漁火』『霜滿天』都是秋天特有的景物。深秋的夜晚，月亮已落、烏鴉啼鳴、白霜鋪滿天地，營造出寂涼蒼涼的秋夜氛圍。","m":"楓橋秋夜霜滿天，江楓漁火對愁眠。","v":1,"src":[{"t":"人民網：月落烏啼是何時？張繼《楓橋夜泊》理惑","u":"http://yn.people.com.cn/BIG5/n2/2022/0905/c372453-40110792.html","d":"2022-09-05"},{"t":"古詩文網：「月落烏啼霜滿天，江楓漁火對愁眠」全詩賞析","u":"https://fanti.dugushici.com/ancient_proses/12042","d":"2026-09-20"},{"t":"楓橋夜泊 - 維基百科（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E6%A5%93%E6%A9%8B%E5%A4%9C%E6%B3%8A","d":"2026-09-20"}]},"9-166":{"o":["五台山","普陀山","峨眉山"],"x":"五台山、普陀山、峨眉山都是中國著名的佛教名山，各為菩薩道場；武當山則是道教聖地，為四大道教名山之首，不屬佛教名山。","w":"中國四大佛教名山為五台山（文殊菩薩道場）、普陀山（觀音菩薩道場）、峨眉山（普賢菩薩道場）、九華山（地藏菩薩道場）。武當山是道教聖地，不在其列。","m":"武當山是道教第一名山，記得它供奉真武大帝就不會混淆。","v":1,"src":[{"t":"中國文化研究院：何謂中國佛教四大名山","u":"https://chiculture.org.hk/tc/china-five-thousand-years/724","d":"2026-09-20"},{"t":"維基百科：四大佛教名山（百科輔助）","u":"https://zh.wikipedia.org/wiki/%E5%9B%9B%E5%A4%A7%E4%BD%9B%E6%95%99%E5%90%8D%E5%B1%B1","d":"2026-09-20"},{"t":"維基百科：武當山（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E6%AD%A6%E5%BD%93%E5%B1%B1","d":"2026-09-20"}]},"9-167":{"o":["洛陽","河北","山西"],"x":"洛陽雖是龍門石窟所在的城市，但不是省份；河北、山西是其他省份，龍門石窟不在此。","w":"龍門石窟位於河南省洛陽市南郊12公里處的伊水兩岸龍門山和香山崖壁上，與敦煌莫高窟、大同雲岡石窟並稱中國三大石窟。","m":"龍門在河南洛陽，是三大石窟之一，開鑿於北魏孝文帝遷都時期。","v":1,"src":[{"t":"TravelKing旅遊王：龍門石窟","u":"https://www.travelking.com.tw/tourguide/scenery100825.html","d":"2026-09-20"},{"t":"當代中國：河南旅遊遊洛陽千年龍門石窟","u":"https://www.ourchinastory.com/zh/2749","d":"2026-09-20"}]},"9-168":{"o":["廬山石壁","洛陽博物館","北京故宮"],"x":"廬山有西林寺但題西林壁刻的位置具體在西林寺；洛陽和北京沒有原刻石。","w":"蘇軾《題西林壁》是在1084年遊廬山西林寺時題寫在西林寺牆壁上，寺廟位於廬山西北側，現今石刻仍保留在西林寺的碑廊裡供遊人鑑賞。","m":"題西林壁就刻在西林寺，西林寺是廬山東晉建立的古寺。","n":"西林寺位於廬山西北麓，為東晉時期建造。","v":1,"src":[{"t":"新華網：蘇軾題西林壁","u":"https://www.chinanews.com.cn/hwjy/news/2010/06-08/2330989.shtml","d":"2026-09-20"},{"t":"攜程旅遊：廬山西林寺題西林壁","u":"https://you.ctrip.com/travels/jiujiang877/4176807.html","d":"2026-09-20"}]},"9-169":{"o":["韓世忠","吳玠","劉光世"],"x":"韓世忠、吳玠、劉光世都是南宋名將，但只有岳飛有背刺傳說記載。","w":"岳飛是南宋著名抗金名將，民間傳說其母親岳母在其背上刺字，象徵教子忠國。岳飛後來因「莫須有」罪名被害，成為民族英雄象徵。","m":"岳母刺字勵子，岳飛精忠報國成民族英雄。","n":"史實上岳飛背刺為「盡忠報國」而非「精忠報國」（《宋史》記載），「精忠」是後人演義加工；刺字者也非岳母而是軍中刺客。","v":1,"src":[{"t":"中國時報：岳飛背上不是刺「精忠報國」","u":"https://www.chinatimes.com/hottopic/20250210001683-260812","d":"2026-09-20"}]},"9-170":{"o":["孔子周公旦","關羽劉備","孔子孟子"],"x":"孔子周公旦不符合「武聖」定義；關羽劉備中劉備是政治人物非「文聖」；孔子孟子都屬文聖，無武聖。","w":"「文武二聖」指孔子和關羽。孔子為「文聖」，是中華文化的奠基人，大成至聖；關羽為「武聖」，是義勇正直的象徵，被尊為戰神。","m":"孔子文，關羽武，是中華傳統文化中最崇仰的兩位聖人。","v":1,"src":[{"t":"中國文化研究院：關公崇拜","u":"https://chiculture.org.hk/tc/china-five-thousand-years/2887","d":"2026-09-20"},{"t":"維基百科：武聖（百科輔助）","u":"https://zh.wikipedia.org/zh-hant/%E6%AD%A6%E8%81%96","d":"2026-09-20"}]},"9-171":{"o":["《牡丹亭》","《紫釵記》","《南柯記》"],"x":"《牡丹亭》《紫釵記》《南柯記》都是湯顯祖的臨川四夢，是傳奇戲曲；《金瓶梅》是明代文人創作的白話長篇小說，非湯顯祖作品亦非臨川四夢。","w":"臨川四夢是明代劇作家湯顯祖的四部傳奇戲曲，包括《牡丹亭》《紫釵記》《邯鄲記》《南柯記》，因故事均涉夢境且作者為臨川人而得名。《金瓶梅》是另一部明代文學作品，不在其列。","m":"臨川四夢＝湯顯祖四部戲曲，《金瓶梅》是小說不是。","v":1,"src":[{"t":"新華網：真實的湯顯祖不只寫過臨川四夢","u":"https://www.chinanews.com.cn/m/cul/2017/07-15/8278359.shtml","d":"2026-09-20"},{"t":"中國文藝評論網：湯顯祖臨川四夢的傳播","u":"https://www.zgwypl.com/content/details10_60418.html","d":"2026-09-20"}]},"9-172":{"o":["射","御","樂"],"x":"射（弓箭）、御（駕車）、樂（音樂）都屬於六藝；「武」指武術搏擊，不在先秦六藝範圍內。","w":"先秦六藝指禮、樂、射、御、書、數，始於西周貴族教育制度。其中禮為道德修養，樂為音樂藝術，射為射箭技能，御為駕車本領，書為文字書寫，數為數學計算。「武」非六藝之一。","m":"六藝記得：禮樂射御書數，武術不在裡面。","v":1,"src":[{"t":"維基百科：六藝（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E5%85%AD%E8%89%BA","d":"2026-09-20"},{"t":"臺北孔廟儒學文化網：六藝教育","u":"https://www.tctcc.taipei/zh-tw/C/ideology/ideology/1%7C22/45.htm","d":"2026-09-20"}]},"9-173":{"o":["狀元","解元","會元"],"x":"狀元是殿試第一名；解元是鄉試第一名；會元是會試第一名。這些都是特定排名，不是殿試錄取者的統稱。","w":"科舉制度中，殿試錄取者統稱「進士」，分為一甲（進士及第，包括狀元、榜眼、探花）、二甲（進士出身）、三甲（同進士出身）三等。凡通過殿試者皆稱天子門生。","m":"鄉試中舉人，會試中進士，殿試後全稱進士。","n":"題目說「會試錄取者稱為貢生」，實則正稱為「貢士」（非「貢生」）。但官方答案已定，進士為殿試錄取者的正確稱號。","v":1,"src":[{"t":"中研院歷史語言研究所：清代科舉考試有多重要","u":"https://museum.sinica.edu.tw/knowledge-base/item/235/","d":"2026-09-20"},{"t":"維基百科：中國科舉制度（百科輔助）","u":"https://zh.wikipedia.org/zh-tw/%E4%B8%AD%E5%9B%BD%E7%A7%91%E4%B8%BE%E5%88%B6%E5%BA%A6","d":"2026-09-20"}]},"9-174":{"o":["唐太宗","漢光武帝","北魏孝文帝"],"x":"唐太宗統治於隋朝之後，不是結束南北朝分裂的；漢光武帝結束東漢分裂時間早於南北朝；北魏孝文帝雖為南北朝時期君主但未實現全國統一。","w":"隋文帝楊堅於公元581年即位，589年攻破陳都建康，俘虜南陳後主，終結了自西晉末年起長達二百七十多年的南北分裂局面，實現中國南北重新統一。","m":"隋文帝581年稱帝，589年滅陳統一，結束魏晉南北朝長期分裂。","v":1,"src":[{"t":"維基百科：隋文帝（百科輔助）","u":"https://zh.wikipedia.org/zh-hant/%E9%9A%8B%E6%96%87%E5%B8%9D","d":"2026-09-20"},{"t":"香港歷史課程講義：隋朝統一","u":"https://chistory.kanhan.com/sites/default/files/course_pdf/f1/f1p4/F1P4T1CH1%E9%9A%8B%E6%9C%9D%E7%9A%84%E7%B5%B1%E4%B8%80.pdf","d":"2026-09-20"}]},"9-175":{"o":["陸路驛站","海上貿易路線","山地棧道"],"x":"驛站適合通信而非大量糧食運輸；海路未能有效控制南北貿易；棧道載運量小不適合大宗物資。","w":"隋朝平定南陳後急需將江南豐富的糧食物資運往關中政治中心。隋文帝命開鑿廣通渠等運河，隋煬帝更大規模開通隋唐大運河，以溝通南北，解決中央糧食供應問題。","m":"隋朝開運河是為了運江南糧食到關中，供養帝都。","v":1,"src":[{"t":"香港教育局：隋唐大運河課材","u":"https://www.edb.gov.hk/attachment/tc/curriculum-development/kla/pshe/references-and-resources/chinese-history/ancient_artifacts/Chapter7.pdf","d":"2026-09-20"},{"t":"維基百科：隋唐大運河（百科輔助）","u":"https://zh.wikipedia.org/zh-hant/%E9%9A%8B%E5%94%90%E5%A4%A7%E8%BF%90%E6%B2%B3","d":"2026-09-20"}]},"9-176":{"o":["通濟渠","永濟渠","江南河"],"x":"通濟渠、永濟渠、江南河都是隋煬帝時期開鑿的隋唐大運河的主要幹道，非隋文帝時期所修。","w":"廣通渠於隋開皇四年（584年）由隋文帝命宇文愷開鑿，自長安北引渭水，東至潼關入黃河，全長三百餘里，是為解決關中糧食供應問題的重要工程。","m":"廣通渠開皇四年（584年）隋文帝時期開通，名字有「通」字。","v":1,"src":[{"t":"百科知識中文網：廣通渠（宇文凱主持開鑿）","u":"https://www.jendow.com.tw/wiki/%E5%BB%A3%E9%80%9A%E6%B8%A0","d":"2026-09-20"},{"t":"維基百科：廣通渠（百科輔助）","u":"https://zh.wikipedia.org/wiki/%E5%B9%BF%E9%80%9A%E6%B8%A0","d":"2026-09-20"},{"t":"維基百科：廣通渠（百科輔助）","u":"https://zh.wikipedia.org/wiki/%E5%B9%BF%E9%80%9A%E6%B8%A0","d":"2026-09-20"}]},"9-177":{"o":["廣通倉","永安倉","興洛倉"],"x":"廣通倉、永安倉、興洛倉都是隋唐時期重要糧倉，但只有含嘉倉獲得「天下第一糧倉」美譽，唐玄宗年間儲糧達583萬石。","w":"含嘉倉始建於隋煬帝大業元年（605年），位於隋朝都城洛陽，佔地42萬平方米。到唐代成為全國最大糧倉，唐玄宗天寶八年時儲糧達583萬石，佔全國儲糧總數近一半，遂享「天下第一糧倉」美譽。","m":"含嘉倉隋開鑿洛陽，唐代儲粧最多，故稱第一。","v":1,"src":[{"t":"央視網新聞頻道CCTV：【千問千尋大運河】含嘉倉：中國古代最大粮倉","u":"https://news.cctv.com/2021/12/30/ARTI9nlt419QpONeBSBeHecy211230.shtml","d":"2021-12-30"},{"t":"揚州中國大運河博物館：最「大」的儲糧庫在哪兒","u":"https://www.canalmuseum.net/meiriyunbo/466.html","d":"2026-09-20"}]},"9-178":{"o":["中國","印度","吐蕃"],"x":"中國古代稱馬球為「擊鞠」發明於漢代但非最早起源；印度有馬球運動但無證據為發源地；吐蕃後傳入馬球但非起源地。","w":"馬球起源於公元前525年的波斯（今伊朗），後傳入中國。唐代得到皇帝推崇，成為帝王貴族健身強體的運動，風行一時。","m":"馬球起源波斯，唐代風靡成時尚運動，皇帝貴族都愛玩。","n":"馬球起源有波斯說與中國本土說兩種學術觀點，但國際學界多認為波斯起源說較為可信，最遲在公元6世紀左右傳入中國。","v":1,"src":[{"t":"澎湃新聞：球場上的中國與伊朗由此上溯一千三百年","u":"https://www.thepaper.cn/newsDetail_forward_1450420","d":"2026-09-20"},{"t":"光明網：風靡唐代的馬球","u":"https://news.gmw.cn/2025-05/16/content_38028279.htm","d":"2026-09-20"},{"t":"維基百科：馬球（百科輔助）","u":"https://zh.wikipedia.org/zh-hans/%E9%A9%AC%E7%90%83","d":"2026-09-20"}]},"9-179":{"o":["日常生活用品","皇帝賞賜品","宗教祭祀品"],"x":"唐三彩因釉料有毒、胎質鬆脆、防水性差，不適合日常用品；皇帝賞賜品通常用青瓷白瓷等高級陶瓷；祭祀品通常用禮器而非三彩。","w":"唐三彩是唐代明器（陪葬品），用於墓葬埋藏。因胎質鬆脆、釉料含鉛有毒、防水性差等原因，不適合生活使用。唐代官府規定根據身份等級配置相應數量的三彩明器作為陪葬。","m":"唐三彩色彩繽紛主要是陪葬品，不能日常用，有毒又易碎。","v":1,"src":[{"t":"中國非物質文化遺產網數字博物館：穿越千年的釉彩之光—洛陽唐三彩的前世今生","u":"https://www.ihchina.cn/art/detail/id/10111.html","d":"2026-09-20"},{"t":"數位典藏與數位學習國家型科技計畫成果：唐三彩作品、紋飾及藝術特徵","u":"https://digitalarchives.tw/Exhibition/2063/2.html","d":"2026-09-20"}]},"9-180":{"o":["新羅","越南","吐蕃"],"x":"新羅、越南、吐蕃都受唐朝影響，但日本是主動派遣遣唐使學習唐律，並在平城京（奈良）仿照長安格局營建都城的國家。","w":"日本於大寶元年（701年）主動制定實施《大寶律令》，派遣遣唐使前往長安學習。日本在營建平城京（現奈良）時，仿照長安城佈局，包括朱雀大路、棋盤街道、宮殿位置等；後來營建平安京（京都）時更是以長安和洛陽為範本，分東西兩京。","m":"日本遣唐使學唐律，平城京奈良仿長安格局，是對唐朝最系統的借鑒。","v":1,"src":[{"t":"Nippon.com：平城京與長安城","u":"https://www.nippon.com/hk/japan-topics/g01157/","d":"2026-09-20"}]}}</script>

function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1){s.set=Object.assign(blank().set,s.set||{});s.q=s.q||{};s.days=s.days||{};s.rep=s.rep||[];return s}}catch(e){}return blank()}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(db){clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,3000)}if(gh&&gh.token&&gh.id){clearTimeout(ghTimer);ghTimer=setTimeout(ghSync,6000)}}
function pushCloud(){if(!db)return;db.doc('progress/main').set({json:JSON.stringify(S),t:S.t}).then(function(){cloud='cloud'}).catch(function(){cloud='local';if(V.name==='home'||V.name==='parent')render()})}
function merge(o){if(!o||o.v!==1)return;Object.keys(o.q||{}).forEach(function(id){var a=S.q[id],b=o.q[id];if(!a||(b.t||0)>(a.t||0))S.q[id]=b});Object.keys(o.days||{}).forEach(function(d){var a=S.days[d],b=o.days[d];if(!a||(b.n||0)>(a.n||0))S.days[d]=b});var seen={};S.rep.forEach(function(r){seen[r.t]=1});(o.rep||[]).forEach(function(r){if(!seen[r.t])S.rep.push(r)});if((o.t||0)>(S.t||0)&&o.set)S.set=Object.assign(blank().set,o.set)}
function cloudOff(){if(cloud==='wait'){cloud='local';if(V.name==='home'||V.name==='parent')render()}}
function initCloud(){try{if(!window.claude||!window.claude.use){cloudOff();return}setTimeout(cloudOff,11000);window.claude.use('db').then(function(d){if(!d){cloudOff();return}db=d;return d.doc('progress/main').get().then(function(snap){if(snap&&snap.exists){var body=snap.data();try{merge(JSON.parse(body.json))}catch(e){}}cloud='cloud';save();render()})}).catch(function(){cloudOff()})}catch(e){cloudOff()}}


function loadGh(){try{return JSON.parse(localStorage.getItem('zjb-gh')||'null')}catch(e){return null}}
function saveGh(){try{if(gh)localStorage.setItem(GHKEY,JSON.stringify(gh));else localStorage.removeItem(GHKEY)}catch(e){}}
function ghApi(path,method,body){return fetch('https://api.github.com'+path,{method:method||'GET',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+gh.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){if(r.status===401||r.status===403)throw new Error('auth');if(!r.ok)throw new Error('http'+r.status);return r.json()})}
function ghFind(){return ghApi('/gists?per_page=100').then(function(list){var g=(list||[]).filter(function(x){return x.files&&x.files[GHFILE]})[0];if(g)return g.id;return ghApi('/gists','POST',{description:'紫荊杯刷題進度（由刷題頁面自動建立）',public:false,files:(function(){var f={};f[GHFILE]={content:JSON.stringify(S)};return f})()}).then(function(n){return n.id})})}
function ghSync(){if(!gh||!gh.token)return Promise.resolve();var p=gh.id?Promise.resolve(gh.id):ghFind();return p.then(function(id){gh.id=id;saveGh();return ghApi('/gists/'+id)}).then(function(g){var f=g.files&&g.files[GHFILE];if(f&&f.content&&!f.truncated){try{merge(JSON.parse(f.content))}catch(e){}}S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}var files={};files[GHFILE]={content:JSON.stringify(S)};return ghApi('/gists/'+gh.id,'PATCH',{files:files})}).then(function(){gh.last=Date.now();saveGh();ghMsg='';cloud='gh';if(V.name==='home'||V.name==='parent')render()}).catch(function(e){ghMsg=e&&e.message==='auth'?'Token 無效、過期或沒有 gist 權限，請重新設定。':'暫時連不上 GitHub，進度先存在這台裝置，稍後會再試。';if(cloud==='gh')cloud='local';if(V.name==='parent')render()})}
function cloudLabel(){return cloud==='gh'?'進度已同步 GitHub':cloud==='cloud'?'進度已同步雲端':cloud==='wait'?'正在連接雲端…':'進度存在這台裝置'}
function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000)}
function dayLabel(n){var d=new Date(n*86400000);return (d.getUTCMonth()+1)+'/'+d.getUTCDate()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function status(r){if(!r||(r.c+r.w===0&&!r.k))return'new';if(r.s>=3)return'mastered';if(r.w>0)return r.s===0?'wrong':'firming';return'learning'}
function seen(r){return r&&(r.c+r.w>0)}
function pool(k,cat){return BANK.filter(function(x){return x.refs[k]!==undefined&&(!cat||x.cat===cat)}).sort(function(a,b){return a.ord[k]-b.ord[k]})}
function cats(k){var o=[];pool(k).forEach(function(x){if(o.indexOf(x.cat)<0)o.push(x.cat)});return o}
function refLabel(x){var ks=Object.keys(x.refs).sort().reverse();var k=x.refs[S.set.bank]!==undefined?S.set.bank:ks[0];return BNAME[k]+' '+x.refs[k]}
function hot(x){return Object.keys(x.refs).length>1}
function hotLabel(x){return '高頻：'+Object.keys(x.refs).sort().reverse().map(function(k){return BNAME[k]}).join('、')+'都出現'}

function grade(id,ok){var T=today(),r=S.q[id]||(S.q[id]={s:0,c:0,w:0,d:0,lc:-1,lw:-1,k:0,t:0}),first=(r.c+r.w===0);
 if(ok){r.c++;if(r.s>=3){r.d=T+14}else if(r.lc!==T){r.s=Math.min(3,r.s+1);r.lc=T;r.d=T+[1,1,3,7][r.s]}}
 else{r.w++;r.s=0;r.lw=T;r.lc=-1;r.d=T+1}
 r.t=Date.now();var d=S.days[T]||(S.days[T]={n:0,c:0,nw:0});d.n++;if(ok)d.c++;if(first)d.nw++;save()}

function plan(){var T=today(),wrong=[],review=[];Object.keys(S.q).forEach(function(id){var r=S.q[id],x=BYID[id];if(!x||!seen(r)||r.d>T)return;var st=status(r);if(st==='wrong'||st==='firming')wrong.push(id);else review.push(id)});
 var left=Math.max(0,S.set.nw-((S.days[T]||{}).nw||0));var fresh=pool(S.set.bank,S.set.cat).filter(function(x){return !seen(S.q[x.id])}).slice(0,left).map(function(x){return x.id});
 return{wrong:wrong,review:review,fresh:fresh}}
function wrongLists(){var o={wrong:[],firming:[],mastered:[]};Object.keys(S.q).forEach(function(id){var r=S.q[id];if(!BYID[id]||!r.w)return;var st=status(r);if(o[st])o[st].push(id)});['wrong','firming','mastered'].forEach(function(k){o[k].sort(function(a,b){return (S.q[b].w-S.q[a].w)||((S.q[b].lw||0)-(S.q[a].lw||0))})});return o}

function start(mode,ids,extra){if(!ids.length){toast('目前沒有符合條件的題目');return}sess=Object.assign({mode:mode,ids:ids,i:0,res:{},phase:'q',picked:null,t0:Date.now(),again:{}},extra||{});prep();V={name:mode==='learn'?'learn':'quiz'};if(tick){clearInterval(tick);tick=null}if(sess.limit){tick=setInterval(function(){var el=document.getElementById('clock');if(!sess||V.name!=='quiz'){clearInterval(tick);tick=null;return}var left=sess.limit*60-Math.floor((Date.now()-sess.t0)/1000);if(left<=0){finish();return}if(el)el.textContent=fmt(left)},1000)}render()}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function prep(){var x=BYID[sess.ids[sess.i]],e=EXPL[x.id];sess.phase='q';sess.picked=null;sess.reveal=false;sess.report=false;
 if(e&&e.o&&e.o.length){sess.opts=e.o.length===1?[x.a,e.o[0]].sort(function(a,b){return a==='正確'?-1:b==='正確'?1:0}):shuffle([x.a].concat(e.o))}else sess.opts=null}
function answer(ok,picked){var id=sess.ids[sess.i];sess.res[id]=ok;sess.picked=picked;if(sess.mode==='mock'){next();return}grade(id,ok);sess.phase='a';render();window.scrollTo(0,0)}
function next(){if(sess.i+1>=sess.ids.length){finish();return}sess.i++;prep();render();window.scrollTo(0,0)}
function finish(){if(tick){clearInterval(tick);tick=null}if(sess.mode==='mock'){sess.ids.forEach(function(id){if(sess.res[id]!==undefined)grade(id,sess.res[id])})}sess.secs=Math.floor((Date.now()-sess.t0)/1000);V={name:'result'};render();window.scrollTo(0,0)}

function dots(r){var n=r?r.s:0,h='';for(var i=0;i<3;i++)h+='<i'+(i<n?' class="f"':'')+'></i>';return '<span class="dots" aria-label="掌握度 '+n+' / 3">'+h+'</span>'}
function explain(x){var e=EXPL[x.id],h='';
 if(!e||!e.w||(!e.v&&!S.set.ai)){return '<div class="note small muted">這題的解析正在核對出處，核對完成後會顯示。先記住官方答案。</div>'}
 if(!e.v)h+='<div class="note xs muted">以下解析由 AI 撰寫，尚未核對出處，只供參考。</div>';
 h+='<div class="sec"><h3>為甚麼</h3><p>'+esc(e.w)+'</p></div>';
 if(e.m)h+='<div class="sec tip"><h3>記憶竅門</h3><p>'+esc(e.m)+'</p></div>';
 if(e.x&&S.set.ai)h+='<div class="sec"><h3>其他選項為甚麼不對（AI 撰寫，未核對）</h3><p>'+esc(e.x)+'</p></div>';
 if(e.n)h+='<div class="sec note"><h3>留意</h3><p>'+esc(e.n)+'</p></div>';
 if(e.v&&e.src&&e.src.length)h+='<div class="sec"><h3>出處</h3>'+e.src.map(function(r){return '<p class="small">'+(r.u?'<a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+esc(r.t)+'</a>':esc(r.t))+(r.d?'（'+esc(r.d)+'）':'')+'</p>'}).join('')+'</div>';
 return h}
function chips(x){return '<div class="row" style="flex-wrap:wrap"><span class="chip">'+esc(refLabel(x))+'</span><span class="chip">'+esc(x.cat)+'</span>'+(hot(x)?'<span class="chip gold">'+esc(hotLabel(x))+'</span>':'')+'</div>'}
function head(title,right){return '<div class="top"><button class="back" data-act="home" aria-label="返回首頁"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><b>'+esc(title)+'</b><span class="muted" style="min-width:44px;text-align:right">'+right+'</span></div>'}
function tabbar(on){function b(k,t){return '<button data-act="'+k+'"'+(on===k?' class="on" aria-current="page"':'')+'>'+t+'</button>'}return '<nav class="tabbar" aria-label="主選單">'+b('home','首頁')+b('wrongbook','錯題本')+b('parent','家長看板')+'</nav>'}

var VIEW={
home:function(){var p=plan(),wl=wrongLists(),h='<div class="top"><h1 class="serif">紫荊杯刷題</h1><span class="chip">'+cloudLabel()+'</span></div>';
 var total=p.wrong.length+p.review.length+p.fresh.length;
 h+='<section class="today"><div class="row between"><b>今日任務</b><span class="small">約 '+Math.max(1,Math.round(total*0.6))+' 分鐘</span></div><div class="nums"><div><div class="num serif">'+p.fresh.length+'</div><div class="small">新題</div></div><div><div class="num serif">'+p.review.length+'</div><div class="small">到期複習</div></div><div><div class="num serif">'+p.wrong.length+'</div><div class="small">錯題重練</div></div></div>'+(total?'<button class="btn inv" data-act="today">開始今日練習</button>':'<div class="small">今天的任務已完成。想多練，可以用下面的模式。</div>')+'</section>';
 h+='<h2 class="serif">選擇題庫</h2><div class="stack">';
 BANKS.forEach(function(b){var ps=pool(b.k),m=ps.filter(function(x){return status(S.q[x.id])==='mastered'}).length;h+='<button class="bank'+(S.set.bank===b.k?' on':'')+'" data-act="bank" data-k="'+b.k+'" aria-pressed="'+(S.set.bank===b.k)+'"><span class="row between"><b>'+esc(b.name)+'</b>'+(b.tag?'<span class="chip red">'+b.tag+'</span>':'')+'</span><span class="xs muted">'+ps.length+' 題，已掌握 '+m+'</span><div class="bar"><i style="width:'+(ps.length?m/ps.length*100:0)+'%"></i></div></button>'});
 h+='</div><h2 class="serif">主題</h2><label class="xs muted" for="cat">只練某個主題（學習卡、隨機刷題、今日新題都適用）</label><select id="cat" data-change="cat"><option value="">全部主題</option>'+cats(S.set.bank).map(function(c){return '<option'+(S.set.cat===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>';
 h+='<h2 class="serif">練習模式</h2><div class="grid2"><button class="mode" data-act="learn"><b>學習卡</b><span class="xs muted">先看答案和解析，再測驗</span></button><button class="mode" data-act="random"><b>隨機刷題</b><span class="xs muted">每輪 '+S.set.round+' 題</span></button><button class="mode" data-act="redo"><b>錯題重練'+(wl.wrong.length?' <span class="chip red">'+wl.wrong.length+'</span>':'')+'</b><span class="xs muted">在不同日子連續答對 3 次才移出</span></button><button class="mode" data-act="mockset"><b>模擬比賽</b><span class="xs muted">限時作答，完成後才看解析</span></button></div>';
 return h+tabbar('home')},

learn:function(){var x=BYID[sess.ids[sess.i]],h=head('學習卡',(sess.i+1)+' / '+sess.ids.length)+'<div class="prog"><i style="width:'+((sess.i)/sess.ids.length*100)+'%"></i></div><div class="card stack">'+chips(x)+'<div class="qtext serif" style="margin:0">'+esc(x.q)+'</div>';
 if(!sess.reveal)return h+'<button class="btn" data-act="reveal">顯示答案</button></div>';
 h+='<hr style="border:0;border-top:1px solid var(--line);width:100%;margin:0"><div><div class="small muted">答案</div><div class="ans serif">'+esc(x.a)+'</div></div>'+explain(x)+'</div><div class="grid2" style="margin-top:14px"><button class="btn" data-act="notyet">還不熟</button><button class="btn pri" data-act="gotit">記住了</button></div>';return h},

quiz:function(){var x=BYID[sess.ids[sess.i]],r=S.q[x.id],mock=sess.mode==='mock',title={today:'今日練習',random:'隨機刷題',redo:'錯題重練',mock:'模擬比賽',quiz:'小測'}[sess.mode]||'練習';
 var h=head(title,(sess.i+1)+' / '+sess.ids.length)+'<div class="prog"><i style="width:'+(sess.i/sess.ids.length*100)+'%"></i></div>'+(sess.limit?'<div class="row between small muted" style="margin-bottom:8px"><span>剩餘時間</span><b id="clock">'+fmt(Math.max(0,sess.limit*60-Math.floor((Date.now()-sess.t0)/1000)))+'</b></div>':'')+chips(x)+'<div class="qtext serif">'+esc(x.q)+'</div>';
 if(sess.phase==='q'){
  if(sess.opts){h+='<div class="stack">'+sess.opts.map(function(o,i){return '<button class="opt" data-act="pick" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>'+(mock?'':'<button class="btn ghost" data-act="unsure">不確定，先看答案（會放進錯題本）</button>')}
  else if(!sess.reveal){h+='<div class="note small muted">這題暫時沒有選項。先在心裏或紙上作答，再按下面的按鈕對答案。</div><div class="stack" style="margin-top:12px"><button class="btn pri" data-act="reveal">顯示答案</button></div>'}
  else{h+='<div class="card stack"><div><div class="small muted">官方答案</div><div class="ans serif">'+esc(x.a)+'</div></div></div><div class="grid2" style="margin-top:14px"><button class="btn" data-act="selfno">我答錯了</button><button class="btn pri" data-act="selfok">我答對了</button></div>'}
  return h}
 var ok=sess.res[x.id];h='';h+=head(title,(sess.i+1)+' / '+sess.ids.length)+'<div class="banner '+(ok?'ok':'no')+'">'+(ok?'答對了':'答錯了，沒關係。這題已放進錯題本，之後會再考你')+'</div><div class="qtext serif" style="font-size:17px">'+esc(x.q)+'</div>';
 if(sess.opts){h+='<div class="stack">'+sess.opts.map(function(o,i){var c=o===x.a?' ok':(o===sess.picked?' no':'');return '<div class="opt'+c+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o)+'</span>'+(o===x.a?'<span class="tag" style="color:var(--ok-ink)">正確答案</span>':(o===sess.picked?'<span class="tag" style="color:var(--accent-ink)">你的選擇</span>':''))+'</div>'}).join('')+'</div>'}
 else h+='<div><div class="small muted">官方答案</div><div class="ans serif">'+esc(x.a)+'</div></div>';
 h+='<div class="card stack" style="margin-top:14px">'+explain(x)+'</div><div class="row between small" style="margin:14px 4px"><span><b>掌握度</b> '+dots(S.q[x.id])+'</span><span class="muted">'+((S.q[x.id]||{}).s>=3?'已掌握':'在不同日子連續答對 3 次就掌握')+'</span></div><button class="btn pri" data-act="next">'+(sess.i+1>=sess.ids.length?'看本輪總結':'下一題')+'</button>';
 h+=sess.report?'<div class="stack" style="margin-top:12px"><label class="small muted" for="rep">哪裏看不明白，或覺得哪裏不對？</label><textarea id="rep"></textarea><button class="btn" data-act="sendrep">送出給爸爸媽媽</button></div>':'<button class="btn ghost" data-act="report">覺得解析有問題？告訴爸爸媽媽</button>';return h},

result:function(){var ids=sess.ids.filter(function(id){return sess.res[id]!==undefined}),okN=ids.filter(function(id){return sess.res[id]}).length,bad=ids.filter(function(id){return !sess.res[id]}),h=head('本輪完成','');
 if(sess.mode==='learn'){return h+'<div class="card stack" style="text-align:center"><div class="big serif">'+sess.ids.length+'</div><div class="muted">張學習卡已看完</div></div><div class="stack" style="margin-top:16px"><button class="btn pri" data-act="quizthese">馬上小測這些題</button><button class="btn" data-act="home">回首頁</button></div>'}
 h+='<div class="card" style="text-align:center"><span class="big serif">'+okN+'</span> <span class="serif muted" style="font-size:26px;font-weight:700">/ '+ids.length+'</span><div class="small muted">正確率 '+(ids.length?Math.round(okN/ids.length*100):0)+'%，用時 '+Math.floor(sess.secs/60)+' 分 '+(sess.secs%60)+' 秒'+(sess.ids.length>ids.length?'，未作答 '+(sess.ids.length-ids.length)+' 題':'')+'</div></div><h2 class="serif">這一輪的主題</h2>';
